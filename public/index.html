// How far above the sign the marker floats. Generous: the line is what
// keeps it attached, so the marker is free to sit clear of the shopfront
// instead of on top of its own artwork.
// Lowered from 5.0. The markers floated near the top of the frame, which
// is the part of a phone a thumb cannot reach; the leader line is what
// keeps them attached to the shopfront, so they can sit much closer to it
// and still read as belonging to it.
/**
 * Sets a house's name to fit inside a marker.
 *
 * Seven of the fifteen have no artwork file, and they were showing the
 * first two letters — "SU", "BA", "OF" — which is a puzzle, not a sign.
 * They carry the whole name now, and it has to fit a box 80 by 48 without
 * ever being measured in the document, because the markers are hidden
 * until they are on screen and a hidden element measures zero.
 *
 * So it is measured on a canvas instead, in the page's own face: try it on
 * one line, shrinking; failing that, break at the space and size to the
 * longer half. The same trick the shopfront signs use.
 */
function fitWordmark(name) {
  const c = document.createElement("canvas").getContext("2d");
  const face = getComputedStyle(document.body).fontFamily;
  const txt = name.toUpperCase();
  // The tag's own content box at this breakpoint, less a hair. Measuring
  // against the desktop figures on a phone is how SUPREME, BALENCIAGA,
  // GODSPEED and CASABLANCA came out four pixels wide of their tags.
  const narrow = innerWidth <= 720;
  const maxW = (narrow ? 92 - 20 : 104 - 24) - 4;
  const maxH = (narrow ? 58 - 16 : 66 - 18) - 4;

  // Letter-spacing is not in measureText, so it is added by hand: .03em a gap.
  const width = (str, size) => {
    c.font = `800 ${size}px ${face}`;
    return c.measureText(str).width + str.length * size * 0.03;
  };

  for (let size = 15; size >= 9.5; size -= 0.5) {
    if (width(txt, size) <= maxW) return { size, text: txt };
  }

  const sp = txt.lastIndexOf(" ");
  if (sp > 0) {
    const a = txt.slice(0, sp), b = txt.slice(sp + 1);
    for (let size = 14; size >= 8.5; size -= 0.5) {
      if (Math.max(width(a, size), width(b, size)) <= maxW && size * 2.1 <= maxH) {
        return { size, text: `${a}\n${b}` };
      }
    }
  }
  return { size: 9, text: txt };
}

const PIN_LIFT = 1.7;

// Matches the width in the stylesheet at each breakpoint. Read from a
// constant rather than the element, because asking fifteen buttons for
// their offsetWidth every frame is fifteen forced reflows every frame.
let PIN_W = innerWidth <= 720 ? 92 : 104;
addEventListener("resize", () => { PIN_W = innerWidth <= 720 ? 92 : 104; });

const pins = monoliths.map((m, i) => {
  const b = m.brand;
  const el = document.createElement("button");
  el.type = "button";
  el.className = "pin";
  el.style.setProperty("--pin-bg", b.bg[0]);
  el.style.setProperty("--pin-ink", b.ink);
  el.setAttribute("aria-label", `Go to ${b.name}`);
  const art = logoFor(b.slug);
  if (art) {
    const im = document.createElement("img");
    im.src = art;
    im.alt = "";
    el.appendChild(im);
  } else {
    const tag = document.createElement("b");
    const fit = fitWordmark(b.name);
    tag.style.fontSize = `${fit.size}px`;
    tag.textContent = fit.text;
    el.appendChild(tag);
  }
  el.addEventListener("click", () => {
    sound.click();
    // Stop in front of the shop, not level with it: LEAD is the same offset
    // the card uses to decide which district you are looking at.
    travelTo(TRAVEL(m.z + LEAD));
  });
  // Painted before the button so the line passes under the marker.
  const stem = document.createElement("i");
  stem.className = "stem";
  stem.style.setProperty("--pin-bg", b.bg[0]);
  const tack = document.createElement("i");
  tack.className = "tack";
  tack.style.setProperty("--pin-bg", b.bg[0]);

  pinsEl.appendChild(stem);
  pinsEl.appendChild(tack);
  pinsEl.appendChild(el);
  return { el, stem, tack, m, shown: false };
});

/**
 * Scrolls to a point on the journey in a fixed length of time.
 *
 * Not `behavior: "smooth"`. The document is thirteen screens tall, and the
 * native easing is distance-proportional — a jump from the first house to the
 * last would crawl for several seconds and read as a hang. A waypoint should
 * feel like a waypoint, so this takes the same 700ms whether the shop is next
 * door or at the far end.
 *
 * Any real scroll input cancels it, so grabbing the wheel mid-flight hands
 * control straight back instead of fighting.
 */
let travelling = 0;
let travelStarted = 0;
function travelTo(target) {
  travelStarted = performance.now();
  const max = document.documentElement.scrollHeight - innerHeight;
  const from = window.scrollY;
  const to = clamp(target, 0, 1) * max;
  if (QUALITY.still || Math.abs(to - from) < 2) { scrollTo(0, to); return; }

  const id = ++travelling;
  const t0 = performance.now();
  const DUR = 700;
  let last = from;

  const tick = (now) => {
    if (id !== travelling) return;
    // If the page moved for any reason other than this tween, the visitor did
    // it — stand down.
    if (Math.abs(window.scrollY - last) > 2) return;
    const k = Math.min((now - t0) / DUR, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    last = from + (to - from) * e;
    scrollTo(0, last);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

/**
 * Coming to rest on a house rather than between two.
 *
 * Fifteen houses share about nine screens of scroll, so one is roughly
 * half a screen — and a flick on a phone carries a good deal further than
 * that. You would aim for Rhude, let go, and the momentum would put you
 * past it with the card already naming the next one. Nothing was broken;
 * there was simply no reason for the page to stop anywhere in particular.
 *
 * So once the scrolling actually stops, it settles onto the nearest
 * shopfront. Only inside the street — the dome at one end and the closing
 * shot at the other are places you are meant to be able to sit anywhere in
 * — and only when it is worth moving, and never while a tap-to-travel is
 * already in flight or a shop is open. Any real input cancels it, because
 * `travelTo` stands down the moment the page moves under it.
 */
const SETTLE_AFTER = 190;          // ms of stillness that counts as stopped
let settleTimer = 0;

function settle() {
  if (storeMode && (storeMode.active || storeMode.busy)) return;
  if (travelling && performance.now() - travelStarted < 900) return;

  const p = scrollTarget;
  if (p < BEATS.brands[0] || p > BEATS.brands[1]) return;

  let best = -1, bestD = Infinity;
  for (let i = 0; i < monoliths.length; i++) {
    const d = Math.abs(TRAVEL(monoliths[i].z + LEAD) - p);
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best < 0) return;

  const target = TRAVEL(monoliths[best].z + LEAD);
  // A hair's difference is not worth a tween, and if the nearest house is
  // somehow a third of the journey away this is not the tool for it.
  if (bestD < 0.004 || bestD > 0.12) return;
  travelTo(target);
}

addEventListener("scroll", () => {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(settle, SETTLE_AFTER);
}, { passive: true });

const pinPos = new THREE.Vector3();
const pinFoot = new THREE.Vector3();

/** Places every marker over its shopfront, and hides the ones out of frame. */
function placePins(active, visible) {
  for (let i = 0; i < pins.length; i++) {
    const { el, stem, tack, m } = pins[i];
    if (!visible) {
      if (pins[i].shown) {
        el.style.display = stem.style.display = tack.style.display = "none";
        pins[i].shown = false;
      }
      continue;
    }

    // Two points, not one: where the marker floats, and the spot on the
    // shopfront it belongs to. Both are projected, because a vertical line
    // in the world is only a vertical line on screen when the camera is
    // level, and this one is not.
    m.face.getWorldPosition(pinFoot);
    pinPos.copy(pinFoot);
    pinPos.y += PIN_LIFT;
    const dist = pinPos.distanceTo(camera.position);
    pinPos.project(camera);
    pinFoot.project(camera);

    // Fewer at once, now that each is three times the size: past sixty
    // metres they were a row of overlapping tags down the vanishing point.
    //
    // The bounds are tighter than the frame on three sides. 1.15 let a
    // marker hang half off the edge with its logo cut in two, and the top
    // of the screen belongs to the header and the sound toggle — a marker
    // up there is one that cannot be tapped.
    const onScreen = pinPos.z > -1 && pinPos.z < 1
      && Math.abs(pinPos.x) < 1.06
      && pinPos.y < 0.72 && pinPos.y > -1.0
      && dist < 58;

    if (!onScreen) {
      if (pins[i].shown) {
        el.style.display = stem.style.display = tack.style.display = "none";
        pins[i].shown = false;
      }
      continue;
    }

    // Held inside the frame rather than allowed to hang off it. A marker
    // is 104 wide and anchored on its own centre, so one belonging to a
    // shopfront near the edge of the view lost half its logo to the bezel.
    // Nudging it in costs nothing, because the leader line is still drawn
    // to the real spot on the building — which is the whole reason the
    // line is there.
    const half = PIN_W / 2 + 4;
    const x = clamp((pinPos.x * 0.5 + 0.5) * viewW, half, viewW - half);
    const y = (-pinPos.y * 0.5 + 0.5) * viewH;
    const fx = (pinFoot.x * 0.5 + 0.5) * viewW;
    const fy = (-pinFoot.y * 0.5 + 0.5) * viewH;
    // Near markers are full size, far ones shrink away rather than crowding.
    const k = clamp(1.2 - dist / 78, 0.52, 1);
    const o = clamp(1.4 - dist / 54, 0.25, 1);

    el.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0) translate(-50%, -100%) scale(${k.toFixed(2)})`;
    el.style.opacity = o.toFixed(2);
    el.dataset.live = i === active ? "1" : "0";

    // The line runs foot to marker. Length as a scale on a one-pixel bar,
    // angle as a rotation, both folded into the one transform.
    const dx = x - fx, dy = y - fy;
    const len = Math.max(0, Math.hypot(dx, dy) - 5);
    stem.style.transform =
      `translate3d(${fx.toFixed(1)}px, ${fy.toFixed(1)}px, 0) rotate(${Math.atan2(dy, dx).toFixed(3)}rad) scaleX(${len.toFixed(1)})`;
    stem.style.opacity = (o * 0.9).toFixed(2);

    tack.style.transform =
      `translate3d(${fx.toFixed(1)}px, ${fy.toFixed(1)}px, 0) translate(-50%, -50%) scale(${k.toFixed(2)})`;
    tack.style.opacity = o.toFixed(2);

    if (!pins[i].shown) {
      el.style.display = "grid";
      stem.style.display = tack.style.display = "block";
      pins[i].shown = true;
    }
  }
}
pins.forEach((p) => {
  p.el.style.display = p.stem.style.display = p.tack.style.display = "none";
});

let shownBrand = -1;
function showBrand(i) {
  if (i === shownBrand) return;
  shownBrand = i;
  const b = BRANDS[i];
  card.swatch.style.background = `linear-gradient(90deg, ${b.bg[0]}, ${b.bg[1]})`;

  // The tag: artwork where we have it, the name in type where we do not.
  card.maker.style.background = `linear-gradient(135deg, ${b.bg[0]}, ${b.bg[1]})`;
  card.maker.style.color = b.ink;
  const art = logoFor(b.slug);
  card.maker.innerHTML = art
    ? `<img src="${art}" alt="${b.name}" />`
    : `<span>${b.name}</span>`;
  card.eyebrow.textContent = `District ${String(i + 1).padStart(2, "0")} of ${BRANDS.length}`;
  card.name.textContent = b.name;
  card.note.textContent = b.note;
  // The pill used to leave the page. It opens the door now; the storefront
  // is one tap further in, on whichever piece you pick up.
  card.link.href = `${SITE}/brands/${b.slug}`;
  card.link.textContent = `Step inside ${b.name}`;
  card.link.dataset.house = String(i);
  indexItems.forEach((el, k) => { el.dataset.live = k === i ? "1" : "0"; });
}

// ## 22  FRAME LOOP

const clock = new THREE.Clock();
let running = true;

/**
 * The interior mode, once it exists.
 *
 * Declared here rather than where it is built because `step` below reads it
 * and the startup render runs before section 27 has been evaluated. A `const`
 * further down the file would be in its dead zone at exactly that moment,
 * which is a mistake this file has already made three times.
 */
let storeMode = null;

const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
const shadowFocus = new THREE.Vector3();

/**
 * One frame's worth of work, for a given elapsed time and scroll position.
 *
 * Split out of the rAF loop so it can be driven directly — `DD.step(0.4)`
 * from the console places the whole scene at 40% of the journey and renders
 * it. That is the only way to inspect anything when the tab is not painting,
 * since requestAnimationFrame does not run in a backgrounded tab and the
 * scene simply freezes wherever it was.
 */
function step(dt, t, p) {
  // --- camera -------------------------------------------------------------
  const inside = !!(storeMode && storeMode.active);

  if (inside) {
    storeMode.aim(dt, camPos, camLook);
  } else {
    PATH.getPointAt(p, camPos);
    LOOK.getPointAt(p, camLook);
  }

  if (!QUALITY.still) {
    pointer.x += (pointer.tx - pointer.x) * Math.min(1, dt * 2.2);
    pointer.y += (pointer.ty - pointer.y) * Math.min(1, dt * 2.2);
    // Indoors the room is four metres away, not forty, so the same parallax
    // would swing the walls about. A quarter of it reads as standing still
    // and shifting your weight, which is what it is for.
    const sway = inside ? 0.3 : 1;
    camPos.x += pointer.x * 1.15 * sway;
    camPos.y += (-pointer.y * 0.55 + Math.sin(t * 0.42) * 0.09) * sway;
  }

  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // --- shadow frustum follows the camera ---------------------------------
  shadowFocus.lerpVectors(camPos, camLook, 0.35);
  sun.position.copy(C.sun).multiplyScalar(90).add(shadowFocus);
  sun.target.position.copy(shadowFocus);
  sun.target.updateMatrixWorld();

  // --- animation ----------------------------------------------------------
  windUniforms.uTime.value = t;
  skyUniforms.uTime.value = t;
  waterUniforms.uTime.value = t;
  waterUniforms.uCam.value.copy(camera.position);
  motes.uniforms.uTime.value = t;
  if (leaves) leaves.update(dt, t);
  fountain.update(dt, t);
  // Before the main pass, so the water samples this frame's dome and not
  // the last one's.
  mirror.render(renderer, scene, camera);

  // --- overlay ------------------------------------------------------------
  // A plain range test. This was a feathered curve once, and at the very top
  // of the page it evaluated to exactly 0.5 — so the hero panel failed its own
  // "> 0.5" check and the first thing a visitor saw was a wordless scene.
  if (inside) {
    // The journey's own furniture has nothing to say in here.
    panels.hero.dataset.on = "0";
    panels.end.dataset.on = "0";
    panels.brands.dataset.on = "0";
    indexEl.dataset.on = "0";
    hintEl.style.opacity = "0";
    placePins(shownBrand, false);
  } else {
    const within = ([a, b]) => (p >= a && p <= b ? "1" : "0");
    panels.hero.dataset.on  = within(BEATS.hero);
    panels.end.dataset.on   = within(BEATS.end);

    const inStreet = p >= BEATS.brands[0] && p <= BEATS.brands[1];
    panels.brands.dataset.on = inStreet ? "1" : "0";
    indexEl.dataset.on = inStreet ? "1" : "0";
    hintEl.style.opacity = p < 0.02 ? "0.75" : "0";

    if (inStreet) showBrand(readableBrand());
    placePins(shownBrand, inStreet);
  }
  sound.update(camera);

  composer.render();
}

function frame() {
  if (!running) return;
  requestAnimationFrame(frame);

  const dt = Math.min(clock.getDelta(), 0.05);
  // Scroll easing: the camera always trails the scrollbar slightly, which is
  // what makes it feel like a dolly rather than a scrubbed video.
  scrollEased += (scrollTarget - scrollEased) * Math.min(1, dt * 3.4);
  step(dt, clock.elapsedTime, clamp(scrollEased, 0, 1));
}

// ## 23  RESIZE + VISIBILITY

/**
 * Vertical FOV is the wrong thing to hold fixed.
 *
 * Three derives the horizontal field from the vertical one and the aspect, so
 * a fixed 46 degrees gives a laptop a wide view and a portrait phone a letter
 * slot — the dome shrinks and the slabs either side of the street fall out of
 * frame entirely. This holds the *horizontal* field instead, widening the
 * vertical one as the viewport narrows, and clamps it well short of the
 * fisheye the raw maths asks for at phone aspect ratios.
 */
const BASE_FOV = 46, BASE_ASPECT = 1.6;
const H_HALF = Math.atan(Math.tan((BASE_FOV / 2) * Math.PI / 180) * BASE_ASPECT);

function resize() {
  const w = canvasEl.clientWidth || innerWidth;
  const h = canvasEl.clientHeight || innerHeight;
  viewW = w; viewH = h;
  camera.aspect = w / h;
  camera.fov = clamp(
    2 * Math.atan(Math.tan(H_HALF) / camera.aspect) * 180 / Math.PI,
    BASE_FOV, 68
  );
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, QUALITY.dpr));
  // `false`: do not write width/height back onto the canvas as inline pixels.
  // The stylesheet owns the box, and it owns it in `lvh` for a reason.
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  if (bloomPass) bloomPass.setSize(w, h);
  readScroll();
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 250));
// `resize` on the window does not fire for every address-bar move on every
// phone, and the scroll listener is where the stale size actually shows.
if (window.visualViewport) {
  visualViewport.addEventListener("resize", resize);
}

// Stop burning a GPU on a tab nobody is looking at.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    running = false;
  } else if (!running) {
    running = true;
    clock.getDelta();       // drop the gap so nothing jumps
    frame();
  }
});

/**
 * Sound follows the page, not the render loop.
 *
 * It used to be folded into the handler above, gated behind the same
 * `running` flag — so a visibility change that did not happen to flip that
 * flag left the music playing to nobody, and claiming the playback audio
 * session for iOS made exactly that case audible in a pocket. It is its
 * own listener now, and it listens for more than one thing: `pagehide`
 * fires on iOS where `visibilitychange` sometimes does not, and covers
 * navigating away and the back/forward cache on every browser.
 */
{
  const hush = () => sound.suspend();
  const wake = () => { if (sound.on) sound.resume(); };

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) hush(); else wake();
  });
  addEventListener("pagehide", hush);
  addEventListener("pageshow", wake);
  addEventListener("freeze", hush);
  addEventListener("resume", wake);
}

// ## 24  STARTUP

readScroll();
scrollEased = scrollTarget;
resize();

// One warm-up render so the first visible frame is not a stutter while every
// shader in the scene compiles at once.
renderer.compile(scene, camera);
composer.render();

requestAnimationFrame(() => {
  document.getElementById("boot").dataset.done = "1";
  frame();
});

// ## 25  SOUND — ambience, and a beat coming from somewhere
//
// Every sound on this page is synthesised here. Nothing is fetched, which
// keeps the file self-contained and sidesteps the question of whose record
// is playing: the loop below is a few oscillators and a noise buffer.
//
// Two layers, and the difference between them is the whole point.
//
// The ambience — palms, water, a city somewhere behind the buildings, the
// occasional bird — is fixed to the listener. It is the sound of being
// outdoors and it does not come from anywhere in particular.
//
// The beat is a *source in the world*. It sits at one spot down the street,
// on a panner, and it is heavily low-passed at a distance. You hear it as a
// muffled thud from the plaza, it opens up and moves across the stereo field
// as you walk past it, and it closes again behind you. That is the trick
// games use for a court speaker, and it is entirely a matter of filtering by
// distance rather than only attenuating by it: loudness alone reads as a
// quiet song, not a distant one.

const sound = (() => {
  const SPEAKER = new THREE.Vector3(STREET.half - 2.5, 3.4, STREET.from + 8 * STREET.step);
  let ctx = null, master = null, panner = null, ready = false, on = false;
  // The system: a sub path, the mids that leak out around it, and the
  // rattle the sub shakes out of whatever it is bolted to.
  let boxLP = null, boxGain = null, subGain = null, rattleGain = null;
  let sysOut = null;

  const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /** One bar of noise, reused by every percussive voice. */
  function noiseBuffer(ac, seconds = 1) {
    const b = ac.createBuffer(1, Math.ceil(ac.sampleRate * seconds), ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  /**
   * Renders the loop offline, once, into a buffer.
   *
   * Offline because a loop assembled live can never be seamless — the
   * scheduler has to decide where "the end" is while the clock is running.
   * Rendered as a fixed number of bars it simply repeats, and it costs one
   * burst of work at start-up instead of a permanent scheduling overhead.
   */
  /** Soft clip, so the 808 has edge instead of just being loud. */
  /**
   * A hard clip, as opposed to `satCurve`'s soft one.
   *
   * Used on a copy of the bass to make the rattle: squaring off a sine
   * generates a stack of odd harmonics that follows the bass note exactly,
   * and a narrow band of those a couple of octaves up is what a boot lid
   * and a number plate actually sound like when something is hitting them.
   * No envelope follower needed — the harmonics are only there when there
   * is something loud enough to clip.
   */
  function clipCurve(hardness) {
    const n = 1024, c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.max(-1, Math.min(1, x * hardness));
    }
    return c;
  }

  function satCurve(amount) {
    const n = 1024, c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.tanh(x * amount) / Math.tanh(amount);
    }
    return c;

   * ═══ WHY THIS IS PLAYED RATHER THAN RENDERED ═══

   * The brief was five to seven hours of music that never repeats. Rendered
   * into buffers the way the last version worked, that is 3.2 GB of RAM at
   * five hours — even twenty three-minute tracks comes to 659 MB. There is
   * no arrangement of pre-rendered audio that reaches those numbers in a
   * browser tab.
   *
   * So nothing is rendered. The music is *performed*: a scheduler looks a
   * second and a half ahead of the audio clock and builds the next bar out
   * of oscillators, bar by bar, for as long as the page is open. That costs
   * one small noise buffer and a few dozen short-lived nodes per bar, and it
   * runs indefinitely — five hours, fifty, it makes no difference.
   *
   * It is also the only way to get "different every time" honestly. The
   * seed comes from the clock, so the fills, the hat rolls, the hook notes
   * and the running order are all new on every visit. Eighteen arrangements
   * below set the tempo, key, feel and harmony; everything inside a bar is

     */
    { n: "Brick City",   bpm: 138, root: 29, feel: "jersey", sc: MINOR,    prog: [0, 0, 5, 4], hats: 0.7, swing: 0 },
    { n: "Ironbound",    bpm: 140, root: 26, feel: "jersey", sc: PHRYGIAN, prog: [0, 5, 3, 0], hats: 0.75, swing: 0 },
    { n: "Halsey",       bpm: 136, root: 31, feel: "jersey", sc: MINOR,    prog: [0, 3, 4, 2], hats: 0.68, swing: 0 },
    { n: "Turnpike",     bpm: 139, root: 24, feel: "jersey", sc: DORIAN,   prog: [0, 4, 5, 3], hats: 0.72, swing: 0 },

    /* Detroit measured 95.7, not the 158 to 170 that was here. The genre is
     * notated up near 190 and played at half of it, and half of it is what
     * you hear — the Flint records this was taken from sit just under a
     * hundred with the kick stuttering in fours underneath. */
    { n: "Seven Mile",   bpm: 96, root: 25, feel: "detroit", sc: PHRYGIAN, prog: [0, 0, 4, 5], hats: 0.55, swing: 0 },
    { n: "Gratiot",      bpm: 93, root: 28, feel: "detroit", sc: MINOR,    prog: [0, 5, 3, 4], hats: 0.5, swing: 0 },
    { n: "Eastside",     bpm: 99, root: 23, feel: "detroit", sc: PHRYGIAN, prog: [0, 3, 0, 5], hats: 0.6, swing: 0 },
    { n: "Woodward",     bpm: 95, root: 30, feel: "detroit", sc: MINOR,    prog: [0, 4, 2, 5], hats: 0.52, swing: 0 },

    /* Florida measured 83.3, not 138 to 150. The reference is the slow,
     * dark, melodic end of it rather than jook — two kicks in a bar and a
     * snare that hits twice each time it comes round. */
    { n: "Duval",        bpm: 84, root: 27, feel: "florida", sc: MINOR,    prog: [0, 0, 5, 3], hats: 0.62, swing: 0 },
    { n: "Ybor",         bpm: 81, root: 31, feel: "florida", sc: DORIAN,   prog: [0, 4, 0, 5], hats: 0.58, swing: 0 },
    { n: "Overtown",     bpm: 86, root: 24, feel: "florida", sc: MINOR,    prog: [0, 5, 4, 2], hats: 0.66, swing: 0 },
    { n: "Ocean Drive",  bpm: 83, root: 33, feel: "florida", sc: PHRYGIAN, prog: [0, 2, 5, 0], hats: 0.6, swing: 0 },
  ];

  /**
   * The voices, built once against the live context.
   *
   * Five shared filter buses rather than one filter per hit: a hi-hat's
   * timbre is identical every time and only its envelope differs, and
   * filters are far and away the expensive node to create. Two nodes per
   * drum hit is what makes generating this live affordable at all.
   */
  function buildVoices(dest) {
    const nb = noiseBuffer(ctx, 0.4);

    const fb = (type, freq, q) => {
      const f = ctx.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      f.connect(dest);
      return f;
    };
    const HAT = fb("highpass", 9000, 1.0);
    const OPEN = fb("highpass", 7200, 1.0);
    const CLAP = fb("bandpass", 1700, 0.9);
    const AIR = fb("highpass", 2600, 0.7);
    const THUMP = fb("lowpass", 90, 0.7);
    const SNR = fb("highpass", 1500, 0.7);
    const DUST = fb("bandpass", 2600, 1.4);
    const SQK = fb("bandpass", 950, 6);

    const sat = ctx.createWaveShaper();
    sat.curve = satCurve(2.2); sat.oversample = "2x";
    const subBus = ctx.createGain(); subBus.gain.value = 0.85;
    subBus.connect(sat); sat.connect(dest);

    const hit = (busNode, t, len, gain) => {
      const src = ctx.createBufferSource(); src.buffer = nb;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      src.connect(g); g.connect(busNode);
      src.start(t); src.stop(t + len + 0.03);
    };

    return {
      hat:  (t, gain, open) => hit(open ? OPEN : HAT, t, open ? 0.19 : 0.034, gain),
      dust: (t) => hit(DUST, t, 0.006, 0.03),

      clap: (t, gain = 1) => {
        for (const d of [0, 0.011, 0.023]) hit(CLAP, t + d, 0.09, 0.3 * gain);
        hit(AIR, t, 0.16, 0.16 * gain);
      },

      /**
       * `tone` is here for Detroit, which tunes its snare up rather than
       * using the one everybody else has — a bright crack sitting above
       * the sample loop instead of inside it.
       */
      snare: (t, gain = 1, tone = 190) => {
        hit(SNR, t, 0.17, 0.34 * gain);
        const o = ctx.createOscillator(); o.type = "triangle";
        o.frequency.setValueAtTime(tone, t);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.28 * gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
        o.connect(g); g.connect(dest);
        o.start(t); o.stop(t + 0.14);
      },

      kick: (t, gain = 0.95) => {
        const o = ctx.createOscillator(); o.type = "sine";
        o.frequency.setValueAtTime(135, t);
        o.frequency.exponentialRampToValueAtTime(43, t + 0.10);
        const g = ctx.createGain();
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
        o.connect(g); g.connect(dest);
        o.start(t); o.stop(t + 0.36);
      },

      thump: (t) => hit(THUMP, t, 0.012, 0.5),

      /**
       * The bed squeak.
       *
       * Jersey club's other signature after the kick pattern, and it is a
       * real object: a squeaking studio chair caught on the intro of a 2004
       * Trillville record, lifted ever since as a percussion one-shot. A
       * sawtooth falling an octave and a half through a narrow bandpass is
       * close enough to read as one, and costs two nodes.
       */
      squeak: (t, gain = 1) => {
        const o = ctx.createOscillator(); o.type = "sawtooth";
        o.frequency.setValueAtTime(1250, t);
        o.frequency.exponentialRampToValueAtTime(430, t + 0.09);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.11 * gain, t + 0.007);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.105);
        o.connect(g); g.connect(SQK);
        o.start(t); o.stop(t + 0.12);
      },

      /** The 808: glides in from the note before, rings, and bites. */
      sub: (t, note, len, from) => {
        const o = ctx.createOscillator(); o.type = "sine";
        if (from != null) {
          o.frequency.setValueAtTime(midi(from), t);
          o.frequency.exponentialRampToValueAtTime(midi(note), t + 0.075);
        } else {
          o.frequency.setValueAtTime(midi(note) * 2.2, t);
          o.frequency.exponentialRampToValueAtTime(midi(note), t + 0.035);
        }
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.8, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g); g.connect(subBus);
        o.start(t); o.stop(t + len + 0.02);
      },

      bass: (t, note, len, gain = 0.34) => {
        const o = ctx.createOscillator(); o.type = "sine";
        o.frequency.value = midi(note);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g); g.connect(dest);
        o.start(t); o.stop(t + len + 0.02);
      },

      keys: (t, note, len, gain, detune) => {
        const o = ctx.createOscillator();
        o.type = "triangle"; o.frequency.value = midi(note); o.detune.value = detune;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.04);
        g.gain.setValueAtTime(gain, t + len * 0.6);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g); g.connect(dest);
        o.start(t); o.stop(t + len + 0.02);
      },

      lead: (t, note, len, gain) => {
        const o = ctx.createOscillator(); o.type = "sawtooth";
        o.frequency.value = midi(note);
        const f = ctx.createBiquadFilter();
        f.type = "lowpass"; f.Q.value = 6;
        f.frequency.setValueAtTime(2600, t);
        f.frequency.exponentialRampToValueAtTime(700, t + len);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(f); f.connect(g); g.connect(dest);
        o.start(t); o.stop(t + len + 0.02);
      },
    };
  }

  // ── the performance ───────────────────────────────────────────────────
  let V = null;                       // the voices
  let song = null, songIdx = -1, barsLeft = 0, barNo = 0;
  let nextBarAt = 0, schedTimer = 0;
  let mrand = rng((Date.now() ^ 0x5f3759df) >>> 0);   // new on every visit

  const LOOKAHEAD = 1.6;              // seconds of music kept queued
  const TICK = 250;                   // ms between scheduler passes

  function pickSong() {
    let i = songIdx;
    while (i === songIdx) i = Math.floor(mrand() * SONGS.length);
    songIdx = i;
    song = SONGS[i];
    // Two to three minutes each, on the bar.
    barsLeft = Math.round((110 + mrand() * 65) / (4 * 60 / song.bpm));
    barNo = 0;
    stats.song = song.n;
    stats.songBpm = song.bpm;
  }

  /** Builds one bar. Everything inside it is decided here, now. */
  function scheduleBar(t) {
    const { bpm, root, feel, sc, prog, hats, swing } = song;
    const beat = 60 / bpm, bar = 4 * beat, s16 = beat / 4;
    const deg = prog[barNo % prog.length];
    const note = root + sc[deg % sc.length] + (deg >= sc.length ? 12 : 0);
    const prevDeg = prog[(barNo - 1 + prog.length) % prog.length];
    const prev = root + sc[prevDeg % sc.length];
    const fill = barNo % 8 === 7;
    const half = barNo % 8 < 4;        // first half of the phrase is sparser

    if (feel === "trap") {
      V.thump(t);
      V.sub(t, note, bar * 0.78, barNo > 0 && mrand() > 0.45 ? prev : null);
      if (mrand() > 0.4) V.sub(t + beat * 2.5, note + 12, beat * 0.55);
      V.clap(t + beat * 2);
      if (fill) V.clap(t + beat * 3.5, 0.7);

      let e = 0;
      while (e < 16) {
        const at = t + e * s16, r = mrand();
        if (r > 0.94 && e < 15) { for (let k = 0; k < 4; k++) V.hat(at + k * (s16 / 2), 0.05 + k * 0.012); e += 2; continue; }
        if (r > 1 - hats * 0.2) { for (let k = 0; k < 3; k++) V.hat(at + k * (s16 / 3), 0.055); e += 1; continue; }
        V.hat(at, e % 4 === 0 ? 0.1 : 0.055, e % 8 === 6 && mrand() > 0.7);
        e += 1;
      }
      if (!half) for (let i = 0; i < 4; i++) {
        V.lead(t + i * beat, root + 24 + sc[Math.floor(mrand() * sc.length)], beat * 0.72, 0.075);
      }

    } else if (feel === "club") {
      for (let q = 0; q < 4; q++) V.kick(t + q * beat, q === 0 ? 0.95 : 0.8);
      V.clap(t + beat); V.clap(t + beat * 3);
      for (let e = 0; e < 8; e++) {
        const at = t + e * (beat / 2);
        V.hat(at, e % 2 ? 0.085 : 0.045, e % 2 === 1 && mrand() < hats * 0.5);
      }
      for (let e = 0; e < 8; e++) {
        if (e % 2 === 0) continue;
        V.bass(t + e * (beat / 2), note - 12, beat * 0.42, 0.3);
      }
      if (fill) for (let k = 0; k < 6; k++) V.snare(t + beat * 3 + k * (beat / 6), 0.25 + k * 0.1);

    } else if (feel === "jersey") {
      /**
       * The five-kick pattern, which is the genre.
       *
       * Two quarter notes, two dotted eighths, an eighth — sixteenths 0, 4,
       * 8, 11 and 14, adding to the bar exactly. Everything else hangs off
       * it: the squeaks answer the syncopated half, the chopped vocal
       * stutters land on the kicks, and the claps stay on two and four so
       * there is something square to hear it against.
       */
      const K = [0, 4, 8, 11, 14];
      for (const e of K) V.kick(t + e * s16, e === 0 ? 1 : 0.85);
      V.sub(t, note - 12, beat * 1.6);
      V.sub(t + 8 * s16, note - 12, beat * 0.9);

      for (const e of [8, 11, 14]) V.squeak(t + e * s16, e === 8 ? 1 : 0.8);
      if (fill) V.squeak(t + 15 * s16, 0.6);

      V.clap(t + beat); V.clap(t + beat * 3);
      // The open hat on the downbeat is the "Ha" crash the genre is built on.
      V.hat(t, 0.1, true);

      // Hats on the kick, not on the grid. The reference put its hat energy
      // on 0, 4, 8, 11 and 12 — the kick pattern plus one — and straight
      // sixteenths underneath that pattern flattens the whole thing out.
      for (const e of K) V.hat(t + e * s16, e === 0 ? 0.1 : 0.07);
      V.hat(t + 12 * s16, 0.065);
      for (let e = 0; e < 16; e += 2) if (mrand() < hats * 0.4) V.hat(t + e * s16, 0.035);

      // Chopped vocal. The reference's mid band is busy almost everywhere —
      // 0, 3, 4, 6, 7, 9, 10, 11, 12, 15 — because the sample is sliced and
      // retriggered rather than played. Pitched up where it lands, so it
      // sits in the 400 to 1200 band the mix was missing.
      const CHOP = half ? [0, 4, 7, 10, 12] : [0, 3, 4, 6, 7, 9, 10, 11, 12, 15];
      CHOP.forEach((e, i) => {
        V.lead(t + e * s16, root + 45 + sc[(deg + i) % sc.length], s16 * 1.3, 0.075);
      });

    } else if (feel === "detroit") {
      /**
       * Sliding 808s and a snare tuned up over the top.
       *
       * The 808 carries the melody here rather than the keys do, so `sub`
       * is given somewhere to glide from on most of its hits — that pitch
       * slide is the sound. Hats run in bursts rather than straight, which
       * is what makes a beat this fast bounce instead of gallop.
       */
      /* The stutter. Four kicks in a row off the downbeat, then 7, 10 and
       * 14 — straight off the reference, and it is the thing that makes a
       * beat sat under a hundred BPM feel like it is running. */
      V.thump(t);
      for (const e of [0, 1, 2, 3]) V.kick(t + e * s16, e === 0 ? 1 : 0.62);
      for (const e of [7, 10, 14]) V.kick(t + e * s16, 0.75);

      V.sub(t, note - 12, beat * 1.35);
      V.sub(t + 7 * s16, note - 12, beat * 0.7, prev - 12);
      if (mrand() > 0.4) V.sub(t + 14 * s16, note - 5, beat * 0.5, note - 12);

      /* Backbeat tuned up, with the ghosts the reference had around it —
       * and louder than a synthesised snare wants to be, because the hats
       * here are high-passed at 9k and contribute nothing between 1.2 and
       * 4k. On the reference, sampled drums fill that band; here the snare
       * is the only thing in it, so it has to carry the presence alone. */
      V.snare(t + 4 * s16, 1.35, 265);
      V.snare(t + 12 * s16, 1.35, 265);
      for (const e of [6, 9, 14]) if (mrand() > 0.45) V.snare(t + e * s16, 0.45, 265);
      if (fill) for (let k = 0; k < 5; k++) V.snare(t + 13 * s16 + k * (s16 / 2), 0.3 + k * 0.12, 265);

      // Sparse and syncopated, not a run: 4, 5, 7, 13, 15 is what came back.
      for (const e of [4, 5, 7, 13, 15]) V.hat(t + e * s16, e === 4 ? 0.125 : 0.075);
      for (let e = 0; e < 16; e += 2) if (mrand() < hats * 0.35) V.hat(t + e * s16, 0.055);
      if (mrand() > 0.7) for (let k = 0; k < 4; k++) V.hat(t + 11 * s16 + k * (s16 / 4), 0.05 + k * 0.014);

      /* The piano, two octaves up from where it was.
       * At root + 12 its fundamentals sat around 70Hz, underneath the 808
       * rather than over it, and the 400 to 1200 band — where these records
       * keep most of their body — was 20dB emptier than the references. */
      const fig = [0, 3, 0, 4, 2, 4];
      fig.forEach((step, i) => {
        if (i % 2 && mrand() > 0.55) return;
        V.keys(t + i * (bar / fig.length), root + 43 + sc[(deg + step) % sc.length],
               bar / fig.length * 0.9, 0.085, i % 2 ? 6 : -6);
      });
      V.keys(t, root + 31 + sc[deg % sc.length], bar * 0.95, 0.045, -8);

    } else if (feel === "florida") {
      /**
       * Slow, dark and mostly empty, which is the point.
       *
       * The reference has two kicks in a bar — the downbeat and the and of
       * three — and a snare that hits twice every time it comes round, the
       * second landing a sixteenth behind the first. Everything else is
       * space and one long 808.
       */
      V.sub(t, note - 12, beat * 2.4);
      V.sub(t + 10 * s16, note - 12, beat * 1.5, mrand() > 0.5 ? prev - 12 : null);

      V.kick(t, 1);
      V.kick(t + 10 * s16, 0.88);
      if (mrand() > 0.6) V.kick(t + 6 * s16, 0.5);

      // The doubled snare. One on the backbeat, one right behind it, and
      // both carrying the 1.2 to 4k presence on their own — the hats sit
      // above 9k and leave that band empty.
      for (const e of [4, 12]) {
        V.snare(t + e * s16, 1.3);
        V.snare(t + (e + 1) * s16, 0.7);
      }
      if (fill) for (let k = 0; k < 3; k++) V.snare(t + 13 * s16 + k * (s16 / 2), 0.35 + k * 0.15);

      for (const e of [0, 1, 4, 10, 11, 12, 13]) {
        V.hat(t + e * s16, e === 0 ? 0.11 : 0.068);
      }
      for (let e = 2; e < 16; e += 2) if (mrand() < hats * 0.45) V.hat(t + e * s16, 0.045);
      if (mrand() > 0.75) for (let k = 0; k < 3; k++) V.hat(t + 14 * s16 + k * (s16 / 3), 0.055);

      /* The melody, and it carries the record. Sparse, high enough to be
       * heard over the 808, and the same figure each bar so it reads as a
       * loop rather than as playing. */
      const mel = [0, 4, 7, 4];
      mel.forEach((step, i) => {
        V.keys(t + i * (bar / 4), root + 43 + sc[(deg + step) % sc.length],
               bar / 4 * 0.85, 0.095, i % 2 ? 5 : -5);
      });
      if (!half) V.lead(t + 6 * s16, root + 55 + sc[deg % sc.length], s16 * 2.2, 0.055);

    } else {   // lofi
      V.kick(t);
      V.kick(t + beat * 1.5, 0.7);
      if (mrand() > 0.5) V.kick(t + beat * 2.75, 0.6);
      V.snare(t + beat);
      if (!fill) V.snare(t + beat * 3);
      for (let e = 0; e < 8; e++) {
        const sw = e % 2 ? swing * beat : 0;
        V.hat(t + e * (beat / 2) + sw, e % 2 ? 0.05 : 0.095);
      }
      if (fill) for (let k = 0; k < 4; k++) V.snare(t + beat * 3 + k * (beat / 4), 0.35 + k * 0.15);
      V.bass(t, note - 12, beat * 1.4, 0.4);
      V.bass(t + beat * 3.5, note - 12, beat * 0.45, 0.3);
      for (let k = 0; k < 4; k++) V.dust(t + mrand() * bar);
    }

    // Chords, for the two feels that want a bed under them. Trap has its
    // hook, Detroit has its piano, and the two club styles are carried by
    // the kick — a sustained pad across any of them is mud.
    if (feel === "lofi" || feel === "club") {
      const chord = [0, 2, 4, 6].map((step) => root + 12 + sc[(deg + step) % sc.length] + (deg + step >= sc.length ? 12 : 0));
      chord.forEach((n, i) => {
        V.keys(t + 0.02 * i, n, bar * 0.9, 0.075, i % 2 ? 6 : -6);
      });
    }

    stats.bar = barNo;
    barNo++;
    if (--barsLeft <= 0) pickSong();
    return bar;
  }

  /**
   * Keeps roughly a second and a half of music queued ahead of the clock.
   *
   * Scheduling against ctx.currentTime rather than against setTimeout is
   * what keeps the timing exact: the timer only has to be roughly punctual,
   * because every note inside the bar is already pinned to an audio-clock
   * value before it is needed.
   */
  function tick() {
    schedTimer = setTimeout(tick, TICK);
    if (!ctx || ctx.state !== "running" || !V) return;
    if (nextBarAt < ctx.currentTime) nextBarAt = ctx.currentTime + 0.08;
    let guard = 0;
    while (nextBarAt < ctx.currentTime + LOOKAHEAD && guard++ < 8) {
      nextBarAt += scheduleBar(nextBarAt);
    }
  }

  function startMusic(dest) {
    V = buildVoices(dest);
    pickSong();
    nextBarAt = ctx.currentTime + 0.12;
    clearTimeout(schedTimer);
    tick();
  }

  /** Wind, water, city, birds — the layer that is simply everywhere. */
  function buildAmbience() {
    const amb = ctx.createGain();
    amb.gain.value = 0.0;
    amb.connect(master);

    const nb = noiseBuffer(ctx, 4);
    const loop = () => {
      const s = ctx.createBufferSource();
      s.buffer = nb; s.loop = true; s.start();
      return s;
    };

    // Palms: a band of noise, breathing.
    const leaves = ctx.createBiquadFilter();
    // Lower and narrower than before: most of what read as "wind" was hiss
    // up above 3k, which is exactly where noise is most obtrusive.
    leaves.type = "bandpass"; leaves.frequency.value = 1500; leaves.Q.value = 1.1;
    // Barely there. Twice now this has been the loudest thing in the mix
    // when it should be the quietest — broadband noise carries far more than
    // its gain suggests, because there is energy at every frequency the ear
    // is sensitive to rather than a few.
    const leavesGain = ctx.createGain(); leavesGain.gain.value = 0.0065;
    loop().connect(leaves); leaves.connect(leavesGain); leavesGain.connect(amb);

    const gust = ctx.createOscillator(); gust.frequency.value = 0.09;
    const gustAmt = ctx.createGain(); gustAmt.gain.value = 0.004;
    gust.connect(gustAmt); gustAmt.connect(leavesGain.gain); gust.start();

    const sweep = ctx.createOscillator(); sweep.frequency.value = 0.13;
    const sweepAmt = ctx.createGain(); sweepAmt.gain.value = 300;
    sweep.connect(sweepAmt); sweepAmt.connect(leaves.frequency); sweep.start();

    // Water against the coping.
    const water = ctx.createBiquadFilter();
    water.type = "lowpass"; water.frequency.value = 620; water.Q.value = 0.4;
    const waterGain = ctx.createGain(); waterGain.gain.value = 0.026;
    loop().connect(water); water.connect(waterGain); waterGain.connect(amb);
    const lap = ctx.createOscillator(); lap.frequency.value = 0.21;
    const lapAmt = ctx.createGain(); lapAmt.gain.value = 0.022;
    lap.connect(lapAmt); lapAmt.connect(waterGain.gain); lap.start();

    // A city, several blocks away.
    const city = ctx.createBiquadFilter();
    city.type = "lowpass"; city.frequency.value = 150;
    const cityGain = ctx.createGain(); cityGain.gain.value = 0.10;
    loop().connect(city); city.connect(cityGain); cityGain.connect(amb);

    /* Crickets.
     *
     * Not scheduled — a field of them is continuous, and a few hundred
     * timers a minute to fake that would be absurd. Noise through a very
     * narrow band becomes a whistle rather than a hiss, and chopping that
     * whistle with a square wave at a dozen hertz is a chirp. Two of them
     * at different pitches and rates, panned apart, is a hedge.
     *
     * The rate is not arbitrary either: crickets chirp faster when it is
     * warm, and this is Florida, so they are quick.
     */
    const crickets = ctx.createGain();
    crickets.gain.value = 0;
    crickets.connect(amb);

    /* Three patches of them, and each one stops.
     *
     * The first pass at this ran continuously: a slow swell that bottomed
     * out at a quarter of full rather than at zero, so there was never a
     * moment without crickets in it. Constant narrowband noise at 5kHz is
     * about the most fatiguing thing you can put in a mix, and it was.
     *
     * Each patch now has its own life — a few seconds of chirping, a fade,
     * and a gap of up to six seconds before it starts again. Three of them
     * on independent schedules overlap into something that ebbs, and every
     * so often all three are down at once and the street is just quiet.
     */
    /* High, because that is what a cricket is.
     *
     * I moved these down to 3.4kHz on the theory that 5k is where the ear
     * is most sensitive and therefore where the irritation was. Wrong
     * diagnosis: dropping the pitch lost the sound people actually
     * recognise as night, and what made the first version grating was that
     * it never stopped, which is fixed separately below. So they are back
     * at 4.6 and 5.4 where they belong, with a wider band than the first
     * attempt so they are a chorus rather than a test tone, and two
     * patches rather than three so there are real holes between them. */
    const cricketLives = [];
    for (const [hz, rate, pan, q] of [
      [4600, 10.5, -0.6, 10], [5400, 12.8, 0.5, 12],
    ]) {
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = hz; bp.Q.value = q;

      /* Triangle, not square. A square wave chopping a tone at a dozen
       * hertz is a buzzer; a triangle is a trill, which is what an insect
       * actually sounds like from across a plaza. */
      const puls = ctx.createGain(); puls.gain.value = 0.5;
      const chirp = ctx.createOscillator();
      chirp.type = "triangle"; chirp.frequency.value = rate;
      const chirpAmt = ctx.createGain(); chirpAmt.gain.value = 0.5;
      chirp.connect(chirpAmt); chirpAmt.connect(puls.gain); chirp.start();

      // The rate wanders, so it never settles into a pulse you can count.
      const drift = ctx.createOscillator();
      drift.type = "sine"; drift.frequency.value = 0.05 + Math.random() * 0.06;
      const driftAmt = ctx.createGain(); driftAmt.gain.value = 1.4;
      drift.connect(driftAmt); driftAmt.connect(chirp.frequency); drift.start();

      const life = ctx.createGain(); life.gain.value = 0;
      const pn = ctx.createStereoPanner(); pn.pan.value = pan;
      loop().connect(bp);
      bp.connect(puls); puls.connect(life); life.connect(pn); pn.connect(crickets);
      cricketLives.push(life);
    }

    /** One patch: chirp for a while, fade, wait, go again. */
    function cricketCycle(life) {
      const go = () => {
        if (!ctx || ctx.state !== "running" || nightLevel < 0.25) {
          setTimeout(go, 3000 + Math.random() * 3000);
          return;
        }
        const t = ctx.currentTime;
        const rise = 0.6 + Math.random() * 0.9;
        const hold = 1.6 + Math.random() * 3.0;
        const fall = 0.9 + Math.random() * 1.4;
        // Long enough that the street is properly silent a good part of
        // the time, which is the half of this that was missing.
        const gap = 2.6 + Math.random() * 7.5;
        life.gain.cancelScheduledValues(t);
        life.gain.setTargetAtTime(0.5 + Math.random() * 0.5, t, rise * 0.35);
        life.gain.setTargetAtTime(0, t + rise + hold, fall * 0.35);
        setTimeout(go, (rise + hold + fall + gap) * 1000);
      };
      setTimeout(go, Math.random() * 5000);
    }
    cricketLives.forEach(cricketCycle);

    /* The owl.
     *
     * There was one before and nobody heard it: a single sine at 0.042,
     * once every fifty seconds, under a field of crickets that never shut
     * up. It is twice as loud, twice as often, and built properly now — a
     * hollow tone is a strong fundamental with a weak second partial and
     * almost nothing else, and the little waver on the end of the call is
     * most of what makes it read as a bird rather than a test tone.
     */
    function owl(force) {
      if (force || (on && ctx && ctx.state === "running" && nightLevel > 0.4
          && Math.random() < 0.55 + nightLevel * 0.45)) {
        const t0 = ctx.currentTime + 0.1;
        const pn = ctx.createStereoPanner();
        pn.pan.value = Math.random() * 1.5 - 0.75;
        pn.connect(amb);

        stats.owls = (stats.owls || 0) + 1;
        // Two short, then a long one held: the shape of a tawny call.
        const shape = Math.random() > 0.45 ? [0.26, 0.24, 0.62] : [0.3, 0.55];
        let at = t0;
        // Up a little from 355. A tawny runs 300 to 600 and the top of
        // that range carries through a mix; the bottom of it was sitting
        // underneath the city hum and the music's low mids.
        const f = 430 + Math.random() * 95;
        shape.forEach((len, i) => {
          const last = i === shape.length - 1;
          for (const [mult, amp] of [[1, 1], [2, 0.22]]) {
            const o = ctx.createOscillator();
            o.type = "sine";
            o.frequency.setValueAtTime(f * mult * 1.05, at);
            o.frequency.exponentialRampToValueAtTime(f * mult, at + len * 0.45);
            if (last) {
              // the waver
              const vib = ctx.createOscillator();
              vib.type = "sine"; vib.frequency.value = 5.5;
              const vibAmt = ctx.createGain(); vibAmt.gain.value = f * mult * 0.012;
              vib.connect(vibAmt); vibAmt.connect(o.frequency);
              vib.start(at); vib.stop(at + len + 0.1);
            }
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.0001, at);
            g.gain.exponentialRampToValueAtTime(0.16 * amp * Math.max(nightLevel, force ? 1 : 0), at + len * 0.3);
            g.gain.exponentialRampToValueAtTime(0.0001, at + len);
            o.connect(g); g.connect(pn);
            o.start(at); o.stop(at + len + 0.05);
          }
          at += len + 0.1 + Math.random() * 0.06;
        });
      }
      // Every nine to thirty seconds. It was every fifty at half the
      // volume, which is indistinguishable from not being there.
      setTimeout(owl, 9000 + Math.random() * 21000);
    }
    stats.owls = 0;
    setTimeout(owl, 3000 + Math.random() * 6000);
    ambCalls = { owl };

    // Birds, occasionally, from somewhere off to one side — by day.
    function bird() {
      if (!on || !ctx || ctx.state !== "running") { schedule(); return; }
      // They thin out through dusk and are gone before it is properly dark.
      if (Math.random() < nightLevel * 1.15) { schedule(); return; }
      const t = ctx.currentTime + 0.05;
      const pan = ctx.createStereoPanner();
      pan.pan.value = Math.random() * 1.6 - 0.8;
      pan.connect(amb);
      const notes = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < notes; i++) {
        const at = t + i * (0.09 + Math.random() * 0.07);
        const o = ctx.createOscillator(); o.type = "sine";
        const f0 = 2300 + Math.random() * 1700;
        o.frequency.setValueAtTime(f0, at);
        o.frequency.exponentialRampToValueAtTime(f0 * (1.25 + Math.random() * 0.5), at + 0.05);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(0.05, at + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
        o.connect(g); g.connect(pan);
        o.start(at); o.stop(at + 0.1);
      }
      schedule();
    }
    function schedule() { setTimeout(bird, 5000 + Math.random() * 14000); }
    schedule();

    ambParts = { crickets, leaves: leavesGain, city: cityGain };
    applyNight();
    return amb;
  }

  /**
   * Moves the ambience to wherever the sun is.
   *
   * Crickets up, wind down — a plaza is genuinely stiller after dark, and
   * the palms were rustling at the same rate at three in the morning as at
   * noon — and the city a little further away, because it is.
   */
  function applyNight() {
    if (!ambParts || !ctx) return;
    const t = ctx.currentTime;
    const n = nightLevel;
    ambParts.crickets.gain.setTargetAtTime(0.034 * Math.pow(n, 1.4), t, 1.6);
    ambParts.leaves.gain.setTargetAtTime(0.0065 * (1 - 0.45 * n), t, 2.2);
    ambParts.city.gain.setTargetAtTime(0.10 * (1 - 0.28 * n), t, 2.2);
  }

  let ambGain = null, musicGain = null, uiGain = null;
  /**
   * How dark it is, 0 to 1, handed over by the clock in section 26.
   *
   * The scene has run on the visitor's own time for a while and the sound
   * had not noticed: birds sang at two in the morning. They are diurnal,
   * and a dawn chorus at midnight is the sort of thing that makes a place
   * feel synthetic without anyone being able to say why.
   */
  let nightLevel = 0;
  let ambParts = null;
  let ambCalls = null;
  const stats = { beatSeconds: 0, beatRMS: 0, beatPeak: 0 };

  /**
   * The sound a waypoint makes.
   *
   * Straight to the master, never through the panner: interface noises come
   * from the interface, not from somewhere in the plaza, and a click that
   * got quieter when you walked away from a speaker would be a bug. Two
   * notes rather than one, the second higher and softer, because a single
   * blip reads as an error and a rising pair reads as a confirmation.
   */
  function uiClick() {
    if (!ctx || !uiGain || ctx.state !== "running" || !on) return;
    const t0 = ctx.currentTime + 0.001;

    // The transient: a scrap of filtered noise, gone in 20ms.
    const src = ctx.createBufferSource();
    src.buffer = clickNoise;
    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 1.1;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t0);
    ng.gain.exponentialRampToValueAtTime(0.16, t0 + 0.002);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.022);
    src.connect(bp); bp.connect(ng); ng.connect(uiGain);
    src.start(t0); src.stop(t0 + 0.05);

    // Two pitched notes, a fifth apart.
    [[880, 0, 0.13], [1320, 0.055, 0.075]].forEach(([hz, delay, gain]) => {
      const t = t0 + delay;
      const o = ctx.createOscillator();
      o.type = "triangle";
      o.frequency.setValueAtTime(hz, t);
      o.frequency.exponentialRampToValueAtTime(hz * 0.72, t + 0.07);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);
      o.connect(g); g.connect(uiGain);
      o.start(t); o.stop(t + 0.1);
    });
  }

  /**
   * Apple, and the two reasons a working page is silent on an iPhone.
   *
   * The first is the audio session. iOS files Web Audio under the *ambient*
   * category by default, and ambient audio is killed by the hardware
   * ring/silent switch — the little slider on the side of the phone. Nothing
   * in the page is wrong, `ctx.state` says "running", the meters move, and
   * the handset plays nothing. Android has no such switch, which is exactly
   * why this reproduced on one and not the other. `navigator.audioSession`
   * moves us to the playback category, which ignores the switch; it landed
   * in Safari 16.4, and before that the only lever was to have an
   * HTMLMediaElement playing, which promotes the session as a side effect.
   *
   * The second is that Safari has a third context state nobody else has:
   * "interrupted", which it parks the context in after a call, a lock, or
   * another app taking the session. It never comes back by itself, and
   * every check in here tested for "suspended".
   */
  const APPLE = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

  /**
   * Whether the silence is ours.
   *
   * The interruption recovery below cannot tell "Safari took the session"
   * from "the visitor switched away and we stopped on purpose" — both
   * arrive as a state change away from running. Without this flag the
   * recovery raced the page-hidden handler and won: the context suspended
   * and resumed itself in the same breath, and the music kept playing to
   * an empty screen.
   */
  let parked = false;

  function claimPlayback() {
    try {
      if (navigator.audioSession) {
        navigator.audioSession.type = "playback";
        stats.session = "playback";
        return true;
      }
    } catch { /* read-only on some builds */ }
    stats.session = "ambient";
    return false;
  }

  /**
   * The pre-16.4 lever: half a second of actual silence, looping.
   *
   * Only built where it is needed and only ever started inside a gesture.
   * The samples are genuine silence, so the volume is beside the point —
   * but it is not zero, because a muted element does not count.
   */
  let keeper = null;
  function holdSession() {
    if (!APPLE || navigator.audioSession) return;
    if (!keeper) {
      const rate = 8000, n = rate / 2;
      const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
      const put = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
      put(0, "RIFF"); v.setUint32(4, 36 + n, true); put(8, "WAVEfmt ");
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, rate, true); v.setUint32(28, rate, true);
      v.setUint16(32, 1, true); v.setUint16(34, 8, true);
      put(36, "data"); v.setUint32(40, n, true);
      for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);   // 8-bit zero
      keeper = new Audio(URL.createObjectURL(new Blob([buf], { type: "audio/wav" })));
      keeper.loop = true;
      keeper.volume = 0.001;
      keeper.setAttribute("playsinline", "");
    }
    const q = keeper.play();
    if (q && q.catch) q.catch(() => {});
  }
  function dropSession() { if (keeper) { try { keeper.pause(); } catch {} } }

  let clickNoise = null;
  async function start() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    claimPlayback();
    ctx = new AC();

    // "interrupted" is Safari's, and it is terminal without this.
    ctx.onstatechange = () => {
      stats.state = ctx.state;
      if (on && !parked && ctx.state !== "running" && ctx.state !== "closed") {
        const q = ctx.resume();
        if (q && q.catch) q.catch(() => {});
      }
      if (typeof window.__paintSound === "function") window.__paintSound();
    };
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    ambGain = buildAmbience();

    uiGain = ctx.createGain();
    uiGain.gain.value = 0.9;
    uiGain.connect(master);
    clickNoise = noiseBuffer(ctx, 0.06);

    // The beat, out in the world.
    panner = ctx.createPanner();
    panner.panningModel = "HRTF";
    panner.distanceModel = "inverse";
    panner.refDistance = 12;
    panner.rolloffFactor = 0.9;
    panner.maxDistance = 220;
    panner.positionX ? (panner.positionX.value = SPEAKER.x,
                        panner.positionY.value = SPEAKER.y,
                        panner.positionZ.value = SPEAKER.z)
                     : panner.setPosition(SPEAKER.x, SPEAKER.y, SPEAKER.z);

    /* ── the system ────────────────────────────────────────────────────
     *
     * Not a speaker: a rig. Two fifteens in a boot, or a pair of tops on
     * stands outside a shop, and you are stood in the street listening to
     * it rather than sat in front of it.
     *
     * One lowpass could not do that. What you actually hear from outside a
     * car is two different signals that behave differently with distance —
     * a sub that is nearly all of it, and a thin, boxy leak of everything
     * above it that dies off much faster. So the music splits in two.
     *
     *   sub   lowpass 120 → a fat peak at the box tuning → driven into a
     *         soft clip, because nobody runs one of these quietly
     *   box   highpass 220 → a lowpass that closes with distance → a honk
     *         around 800 where a cabin resonates, at a level that falls
     *         away far faster than the sub does
     *
     * Walk off down the street and the box path fades out from under the
     * sub, which is why a system three blocks away is just bass. Walk up to
     * it and the mids come back.
     */
    musicGain = ctx.createGain();
    // Trimmed: the sub path below adds a peak, a drive and a compressor,
    // and the bus has to leave room for all three.
    musicGain.gain.value = 0.62;

    const system = ctx.createGain();
    system.gain.value = 1;

    // ── sub ──
    const subLP = ctx.createBiquadFilter();
    subLP.type = "lowpass"; subLP.frequency.value = 120; subLP.Q.value = 0.9;

    /* 5dB, not 9, and broad rather than pointed.
     * Nine decibels into a peak that narrow is not a big cabinet, it is
     * a resonance — one note in the bass line jumping out over everything
     * else. The box still has a bump, it just is not the loudest thing in
     * the street any more. */
    const subPeak = ctx.createBiquadFilter();
    subPeak.type = "peaking"; subPeak.frequency.value = 50;
    subPeak.Q.value = 0.9; subPeak.gain.value = 5;

    /* And barely driven. At 1.7 the soft clip was generating harmonics all
     * the way up from a signal that is meant to be almost a sine, and those
     * harmonics were a good part of the buzz. */
    const subDrive = ctx.createGain();
    subDrive.gain.value = 1.15;

    const subSat = ctx.createWaveShaper();
    subSat.curve = satCurve(1.8); subSat.oversample = "2x";

    /* The sub gets its own limiter, ahead of the bus.
     * This is what actually stops the bass running the place. With one
     * compressor on the sum, the kick was triggering it and everything else
     * was ducking underneath — the bass was both the loudest thing and the
     * reason nothing else could be heard. Held here, the bass stays even
     * and the mids are left alone. */
    const subComp = ctx.createDynamicsCompressor();
    subComp.threshold.value = -26;
    subComp.knee.value = 4;
    subComp.ratio.value = 9;
    subComp.attack.value = 0.004;
    subComp.release.value = 0.13;

    subGain = ctx.createGain();
    subGain.gain.value = 0.75;

    musicGain.connect(subLP);
    subLP.connect(subPeak); subPeak.connect(subDrive);
    subDrive.connect(subSat); subSat.connect(subComp);
    subComp.connect(subGain);
    subGain.connect(system);

    // ── rattle, shaken out of the sub itself ──
    /* Nine times into a six-times clipper made a square wave, and a square
     * wave through a wide band at 2.4k is not a rattle, it is a buzz — the
     * one you could hear. Three things pull it back: a third of the drive,
     * a band half the width, and it sits lower, at 1.6k, where a loose
     * panel actually lives rather than up where fizz does. */
    const rattleDrive = ctx.createGain();
    rattleDrive.gain.value = 3;

    const rattleClip = ctx.createWaveShaper();
    rattleClip.curve = clipCurve(4);

    const rattleBP = ctx.createBiquadFilter();
    rattleBP.type = "bandpass"; rattleBP.frequency.value = 1600; rattleBP.Q.value = 2.6;

    rattleGain = ctx.createGain();
    rattleGain.gain.value = 0.012;

    subSat.connect(rattleDrive);
    rattleDrive.connect(rattleClip); rattleClip.connect(rattleBP);
    rattleBP.connect(rattleGain); rattleGain.connect(system);

    // ── box ──
    const boxHP = ctx.createBiquadFilter();
    boxHP.type = "highpass"; boxHP.frequency.value = 220; boxHP.Q.value = 0.7;

    boxLP = ctx.createBiquadFilter();
    boxLP.type = "lowpass"; boxLP.frequency.value = 900; boxLP.Q.value = 0.4;

    const boxHonk = ctx.createBiquadFilter();
    boxHonk.type = "peaking"; boxHonk.frequency.value = 820;
    boxHonk.Q.value = 1.1; boxHonk.gain.value = 3.5;

    boxGain = ctx.createGain();
    boxGain.gain.value = 0.6;

    musicGain.connect(boxHP);
    boxHP.connect(boxLP); boxLP.connect(boxHonk);
    boxHonk.connect(boxGain); boxGain.connect(system);

    /* The amp, and it is being asked for more than it has.
     * A fast attack and a slowish release is what makes a system pump —
     * everything ducking under each kick and swelling back between them.
     * On a rig this size that pumping *is* the sound. */
    /* Gentler than it was, because the sub is held before it gets here.
     * At -19 and 6:1 on the sum, the bass was doing all the triggering and
     * the pumping read as ducking rather than as drive. */
    const amp = ctx.createDynamicsCompressor();
    amp.threshold.value = -13;
    amp.knee.value = 8;
    amp.ratio.value = 3.2;
    amp.attack.value = 0.009;
    amp.release.value = 0.22;

    sysOut = amp;
    system.connect(amp);
    amp.connect(panner);
    panner.connect(master);

    // The music is performed from here on, not played back. Starts on the
    // next bar boundary, which is immediately.
    startMusic(musicGain);
    stats.mode = "live";

    ready = true;
    return true;
  }

  const vTmp = new THREE.Vector3();

  function ramp() {
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(on ? 1 : 0, t, 0.4);
    if (ambGain) ambGain.gain.setTargetAtTime(on ? 1 : 0, t, 0.6);
  }

  return {
    get on() { return on; },
    // Not `=== "suspended"`. Safari's "interrupted" is neither running nor
    // suspended, so the old test called an inaudible context healthy: the
    // button painted "Sound on", nothing came out, and the recovery paths
    // that watch this flag never fired.
    get blocked() { return !!ctx && ctx.state !== "running"; },
    get apple() { return APPLE; },
    click: uiClick,

    /**
     * Builds the whole graph and tries to play straight away.
     *
     * Creating the context and rendering the loop needs no permission —
     * only *running* does — so all the expensive work happens at load and a
     * later gesture is instant rather than waiting on a render.
     *
     * Whether it actually sounds is not ours to decide. Chrome weighs how
     * often this origin has been visited, Safari wants a gesture almost
     * always, and a first-time visitor will usually get silence until they
     * touch something. That is the platform, not a bug, and the honest
     * response is to ask nicely and arrange the fallback.
     */
    async boot() {
      if (!ctx && !(await start())) return false;
      on = true;
      try { await ctx.resume(); } catch { /* refused; the gesture will do it */ }
      ramp();
      return ctx.state === "running";
    },

    async toggle() {
      if (!ctx) {
        const ok = await start();
        if (!ok) return false;
      }
      claimPlayback();
      parked = false;
      if (ctx.state !== "running") {
        holdSession();
        try { await ctx.resume(); } catch {}
      }
      on = !on;
      if (!on) dropSession();
      ramp();
      return on;
    },

    /**
     * Turns it on for whatever gesture arrives first.
     *
     * Deliberately not async at the point it matters: iOS treats a resume as
     * user-initiated only if it is called in the same synchronous run as the
     * gesture, and an await before it can lose that. The context was built at
     * load, so there is nothing to wait for anyway.
     */
    enable() {
      if (!ctx) { start().then(() => this.enable()); return false; }
      on = true;
      parked = false;
      // Both of these have to happen inside the gesture, before the resume.
      claimPlayback();
      holdSession();
      const r = ctx.resume();
      if (r && r.catch) r.catch(() => {});
      // An empty buffer through the graph, which is the oldest iOS unlock
      // there is and still the one that settles some builds.
      try {
        const src = ctx.createBufferSource();
        src.buffer = ctx.createBuffer(1, 1, 22050);
        src.connect(ctx.destination);
        src.start(0);
      } catch { /* nothing to lose */ }
      ramp();
      return ctx.state === "running";
    },

    /** Moves the listener, and opens the beat up as you get close to it. */
    update(camera) {
      if (!ready || !on) return;
      const L = ctx.listener;
      const p = camera.position;
      camera.getWorldDirection(vTmp);
      if (L.positionX) {
        L.positionX.value = p.x; L.positionY.value = p.y; L.positionZ.value = p.z;
        L.forwardX.value = vTmp.x; L.forwardY.value = vTmp.y; L.forwardZ.value = vTmp.z;
        L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
      } else {
        L.setPosition(p.x, p.y, p.z);
        L.setOrientation(vTmp.x, vTmp.y, vTmp.z, 0, 1, 0);
      }
      /* Distance does not only make a sound quieter, it makes it duller —
       * and the dullness is what the ear reads as distance.
       *
       * Three things move with it now rather than one. The box path closes
       * down and drops away, which is most of the effect: mids are what
       * distance eats. The sub is pushed the other way, up, to offset the
       * panner's rolloff — long wavelengths carry, which is why you hear
       * the bass from a car two streets before you hear the song. And the
       * rattle only shows up close, because panel buzz is a near-field
       * detail that never survives the walk.
       */
      const d = p.distanceTo(SPEAKER);
      const near = clamp(1 - d / 85, 0, 1);
      const now = ctx.currentTime;

      const hz = 500 + 3100 * Math.pow(near, 1.45);
      boxLP.frequency.setTargetAtTime(hz, now, 0.25);
      // Up from 0.035-0.55 to 0.09-0.95: you should be able to tell what is
      // playing, not just that something is.
      boxGain.gain.setTargetAtTime(0.09 + 0.86 * Math.pow(near, 1.45), now, 0.3);
      // And the sub no longer climbs past unity on the way out of town.
      subGain.gain.setTargetAtTime(0.72 + 0.36 * (1 - near), now, 0.3);
      rattleGain.gain.setTargetAtTime(0.003 + 0.016 * Math.pow(near, 2.1), now, 0.3);

      stats.distance = Math.round(d);
      stats.muffleHz = Math.round(hz);
      stats.box = +boxGain.gain.value.toFixed(3);
      stats.sub = +subGain.gain.value.toFixed(3);
      // Negative dB, and it is the proof the amp is working: the number is
      // how hard everything is being squashed under the kick at this instant.
      if (sysOut) stats.ampDb = +sysOut.reduction.toFixed(1);
    },

    /** For the console: is it running, is it audible, is it silent? */
    get debug() {
      return { state: ctx ? ctx.state : "not started", on, apple: APPLE, parked,
               session: stats.session || "unset",
               keeper: keeper ? (keeper.paused ? "paused" : "playing") : "none",
               masterGain: master ? +master.gain.value.toFixed(3) : 0,
               distance: stats.distance, muffleHz: stats.muffleHz, ...stats };
    },

    /**
     * Peak and RMS off the music bus, over a window.
     *
     * Six styles now generate their drums from different code, and "it did
     * not throw" is not the same as "it makes a sound" — a pattern can be
     * scheduled perfectly into a voice that never fires. This taps the bus
     * the beat goes through and reports what is actually on it.
     */
    /**
     * Energy per octave band off the system's output, as dB.
     *
     * The point of the system chain is a spectral tilt that changes with
     * distance, and a tilt is not something "it sounds right" can settle.
     * This reports what is actually coming out of it.
     */
    /**
     * Calls the owl now, whatever the time.
     *
     * Because "I cannot hear it" and "it is not firing" are different
     * problems and waiting thirty seconds in the dark to tell them apart
     * is no way to work. `DD.sound.owl()` from the console.
     */
    owl() {
      if (!ambCalls) return "no ambience yet";
      ambCalls.owl(true);
      return "called";
    },

    /** The clock's night value, 0 by day and 1 in the dark. */
    setNight(v) {
      nightLevel = clamp(v, 0, 1);
      applyNight();
      stats.night = +nightLevel.toFixed(2);
    },

    /** Sets or reads the rattle level, for tuning it against your own ears. */
    rattle(v) {
      if (!rattleGain) return null;
      if (v != null) rattleGain.gain.setTargetAtTime(v, ctx.currentTime, 0.05);
      return +rattleGain.gain.value.toFixed(4);
    },

    async spectrum(ms = 2500, where = "out") {
      const tap = where === "in" ? musicGain : (where === "amb" ? ambGain : sysOut);
      if (!ctx || !tap) return null;
      const an = ctx.createAnalyser();
      an.fftSize = 4096;
      an.smoothingTimeConstant = 0.6;
      tap.connect(an);
      const bins = new Float32Array(an.frequencyBinCount);
      const hzPer = ctx.sampleRate / an.fftSize;
      const BANDS = [[20, 120], [120, 400], [400, 1200], [1200, 4000], [4000, 14000]];
      const acc = BANDS.map(() => ({ sum: 0, n: 0 }));
      const until = performance.now() + ms;
      while (performance.now() < until) {
        an.getFloatFrequencyData(bins);
        for (let i = 1; i < bins.length; i++) {
          const hz = i * hzPer;
          const v = Math.pow(10, bins[i] / 20);
          for (let b = 0; b < BANDS.length; b++) {
            if (hz >= BANDS[b][0] && hz < BANDS[b][1]) { acc[b].sum += v * v; acc[b].n++; }
          }
        }
        await new Promise((r) => setTimeout(r, 40));
      }
      tap.disconnect(an);
      return BANDS.map((b, i) => ({
        band: `${b[0]}-${b[1]}`,
        db: +(20 * Math.log10(Math.sqrt(acc[i].sum / Math.max(acc[i].n, 1)) + 1e-12)).toFixed(1),
      }));
    },

    async meter(ms = 2500, where = "in") {
      const tap = where === "out" ? sysOut : musicGain;
      if (!ctx || !tap) return null;
      const an = ctx.createAnalyser();
      an.fftSize = 2048;
      tap.connect(an);
      const buf = new Float32Array(an.fftSize);
      let peak = 0, sum = 0, n = 0;
      const until = performance.now() + ms;
      while (performance.now() < until) {
        an.getFloatTimeDomainData(buf);
        for (let i = 0; i < buf.length; i++) {
          const v = Math.abs(buf[i]);
          if (v > peak) peak = v;
          sum += v * v; n++;
        }
        await new Promise((r) => setTimeout(r, 25));
      }
      tap.disconnect(an);
      return { peak: +peak.toFixed(4), rms: +Math.sqrt(sum / Math.max(n, 1)).toFixed(4) };
    },

    /**
     * Cues a specific record, by name or by index. For the console: there
     * are thirty of these now across six styles, and waiting for the
     * shuffle to reach the one you are working on is not a workflow.
     */
    play(which) {
      const i = typeof which === "number"
        ? which
        : SONGS.findIndex((x) => x.n.toLowerCase() === String(which).toLowerCase());
      if (i < 0 || i >= SONGS.length) return SONGS.map((x) => `${x.n} (${x.feel} ${x.bpm})`);
      songIdx = i;
      song = SONGS[i];
      barsLeft = Math.round(180 / (4 * 60 / song.bpm));
      barNo = 0;
      nextBarAt = ctx.currentTime + 0.08;
      stats.song = song.n;
      stats.songBpm = song.bpm;
      stats.feel = song.feel;
      return song.n;
    },

    suspend() {
      parked = true;
      if (ctx && ctx.state === "running") ctx.suspend();
      dropSession();
    },
    resume() {
      parked = false;
      if (!ctx || !on || ctx.state === "running") return;
      claimPlayback();
      holdSession();
      const q = ctx.resume();
      if (q && q.catch) q.catch(() => {});
    },
  };
})();

/**
 * Sound comes up with the page, and if the browser refuses, with the first
 * thing the visitor does instead.
 *
 * Autoplay is not something a page gets to decide. Chrome allows it once an
 * origin has earned enough engagement, Safari almost never does, and a
 * first-time visitor will usually get silence until they touch something.
 * So: ask on load, and if the context comes back suspended, arm the same
 * gesture listeners as before. Either way the graph is already built and
 * the loop already rendered, so whenever permission arrives it is instant.
 */
{
  const btn = document.getElementById("sound");
  let armed = false;

  /** Three states: asking to be used, on, or muted. */
  window.__paintSound = () => paint();

  function paint() {
    const playing = sound.on && !sound.blocked;
    const state = playing ? "on" : (sound.on ? "prompt" : "off");
    btn.dataset.state = state;
    btn.setAttribute("aria-pressed", playing ? "true" : "false");
    btn.setAttribute("aria-label", playing ? "Turn sound off" : "Turn sound on");
    btn.querySelector(".lbl").textContent =
      state === "prompt" ? "Tap for sound" : (playing ? "Sound on" : "Sound off");
  }

  // Every event the platforms count as an activation. pointerdown covers
  // most of it, but older iOS wants touchstart and some browsers only
  // credit the click or the keyup — and missing the first one means waiting
  // for a second interaction that may never come.
  const GESTURES = ["pointerdown", "pointerup", "touchstart", "touchend",
                    "click", "keydown", "keyup"];

  const begin = () => {
    if (!armed) return;
    armed = false;
    for (const ev of GESTURES) window.removeEventListener(ev, begin);
    sound.enable();
    setTimeout(paint, 60);
  };

  const arm = () => {
    if (armed) return;
    armed = true;
    for (const ev of GESTURES) window.addEventListener(ev, begin, { passive: true });
  };

  /**
   * The one failure the page has no way of seeing.
   *
   * With the playback session claimed the ring/silent switch should no
   * longer matter, but on an iPhone too old for `navigator.audioSession`
   * it still can, and there is no API that reports the position of a
   * physical slider. So if this is an Apple device and everything on our
   * side says it should be audible, say the only useful thing once.
   */
  let toldAboutSwitch = false;
  function switchHint() {
    if (toldAboutSwitch || !sound.apple) return;
    setTimeout(() => {
      if (!sound.on || sound.blocked) return;
      toldAboutSwitch = true;
      const lbl = btn.querySelector(".lbl");
      lbl.textContent = "Check the side switch";
      btn.dataset.state = "prompt";
      setTimeout(() => { paint(); }, 4200);
    }, 1100);
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
