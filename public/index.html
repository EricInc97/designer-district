<!doctype html>
<html lang="en">
<head>
<!--

  A scroll-driven WebGL homepage. Single file, no build step.

  ## SECTION INDEX   (search for the "## NN" marker to jump straight to one)

    ## 04  MARKUP

    ## 08  TEXTURES — procedural canvas makers
    ## 09  BOOT — renderer, scene, camera
    ## 10  SKY — gradient, sun, clouds, environment
    ## 11  LIGHTING
    ## 12  PLAZA — travertine ground and pool coping
    ## 13  WATER — reflecting pool
    ## 14  DOME — the Fly's Eye
    ## 15  PALMS — trunks, fronds, wind
    ## 16  LEAVES — falling leaflets
    ## 17  MOTES — airborne dust in the sun
    ## 18  JOURNEY — brand monoliths along the promenade
    ## 19  CAMERA — the scroll path
    ## 20  POST — bloom
    ## 21  PICKING — click a brand
    ## 22  FRAME LOOP
    ## 23  RESIZE + VISIBILITY
    ## 24  STARTUP

    ## 26  TIME OF DAY — the scene follows the visitor's clock
    ## 27  STORE INTERIORS — step inside a house
  ═══════════════════════════════════════════════════════════════════════════
-->

<!-- ## 01  DOCUMENT HEAD -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Designer District</title>
<meta name="description" content="Premium streetwear. Fifteen districts, one address." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="https://designer-district.vercel.app/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" />

<style>
/* ## 02  STYLES — tokens
   Lifted verbatim from the storefront's globals.css: same names, same values.
   `paper` is always the ground, `ink` is always what sits on it. Nothing here
   is invented, so this page and the store cannot drift apart. */
:root {
  --paper: #ffffff;
  --paper-raised: #f7f6f3;
  --paper-sunken: #ebe9e4;
  --ink: #0b0b0b;
  --ink-dim: #56554f;
  --ink-faint: #7c7b74;
  --rule: #e5e3dd;
  --rule-strong: #c6c3bb;

  /* The notch, the home indicator and the rounded corners.
     `viewport-fit=cover` has been set on this page since it was written,
     which tells the browser to lay out *under* all of them — and nothing
     read the insets back, so on any phone with a notch the header sat
     under it and the last row of the shelf sat under the home indicator.
     The fallbacks are what every other browser gets. */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);

  /* Both of these carry an inset, so everything measured off them clears
     the hardware without knowing that it is doing so. */
  --shell: max(clamp(20px, 5vw, 56px), var(--sal), var(--sar));
  --bar: calc(64px + var(--sat));

  /* How many viewport-heights the whole journey runs for. Raise it to slow
     the camera down. Every waypoint is a fraction of the total, so nothing
     else has to change. */
  --pages: 13;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  /* No pull-to-refresh and no rubber-band. The whole page is a camera on a
     scrollbar; a downward drag at the top of the street reloaded it and
     put the visitor back at the dome, and the bounce at either end moved
     the camera to a position the scene does not have. */
  overscroll-behavior-y: none;
  /* Safari inflates type in landscape unless told not to, which on a page
     whose layout is measured in pixels moves everything. */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: calc(var(--pages) * 100svh);
  overflow-x: hidden;
}

/* The house voice, exactly as the store defines it. */
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.22em;
  font-size: 0.6875rem;
  font-weight: 500;
  color: var(--ink-dim);
}
.display {
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: 0.9;
  font-weight: 600;
}
/* The ring has its own token rather than borrowing --ink.
   It borrowed it once, and redefining --ink for the shop's near-black top
   bar turned every product name in the shelf white on white paper, because
   the shelf is on the same element and reads --ink for its type. The ring
   is a different concern from the text and now says so. */
:root { --focus: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* The only dark ground inside the overlay. */
#shop .top { --focus: #ffffff; }
.vh {
  position: absolute; width: 1px; height: 1px; margin: -1px;
  padding: 0; border: 0; overflow: hidden; clip-path: inset(50%);
  white-space: nowrap;
}
/* Over the live scene there is no telling what is behind the ring, so these
   carry their own contrast the way the waypoint pins already do. */
.index .ix:focus-visible, .sound:focus-visible {
  outline: 2px solid #fff; outline-offset: 3px;
  box-shadow: 0 0 0 5px rgba(0,0,0,.55);
}
::selection { background: var(--ink); color: var(--paper); }

/* Copy that floats over the scene instead of sitting on paper takes the
   store's own answer to exactly this problem: white type with a dark halo
   stacked three deep, so it holds over the bright dome as well as the sky. */
.on-scene { color: #ffffff; }
.on-scene .eyebrow { color: rgba(255,255,255,.88); }
.halo {
  text-shadow:
    0 1px 2px rgba(0,0,0,1),
    0 2px 8px rgba(0,0,0,.95),
    0 0 30px rgba(0,0,0,.85);
}

/* ## 03  STYLES — chrome and the scroll overlay */

/*
 * Sized to the LARGE viewport, deliberately.
 *
 * On a phone the address bar slides in and out as you scroll, and the
 * viewport changes height under you. three's `setSize` writes the height it
 * was given straight onto the canvas as an inline style, so the moment the
 * bar retracts — or the `resize` that follows arrives a frame late, which on
 * scroll-driven UI it always does — the canvas is shorter than the window
 * and the white page shows through underneath it. That was the bar along the
 * bottom.
 *
 * `100lvh` is the height with the browser UI retracted, so the canvas is
 * never shorter than what is on screen. When the bar is showing, a sliver of
 * the render is hidden below the fold instead, which is the right way round:
 * something covered rather than something missing. `setSize(w, h, false)`
 * further down stops three from overwriting this with pixels again.
 */
#stage {
  position: fixed;
  top: 0; left: 0;
  z-index: 0;
  display: block;
  width: 100%;
  height: 100vh;
  height: 100lvh;
  touch-action: pan-y;
}

/* The store's header, unchanged: paper ground, hairline rule, ink wordmark. */
#bar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 4;
  height: var(--bar);
  /* `--bar` carries the top inset, so the box grows into the notch and the
     padding keeps the wordmark in the sixty-four pixels below it. */
  padding-top: var(--sat);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 clamp(16px, 4vw, 32px);
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
/* The wordmark is 15:1, so a fixed height overruns a narrow bar and
   collides with the link beside it. Scaled to the viewport instead. */
#bar img { height: clamp(13px, 3.2vw, 20px); width: auto; display: block; }
#bar .side { display: flex; align-items: center; }
#bar .side:last-child { justify-content: flex-end; }
#bar a.ghost {
  font-size: 0.6875rem; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-dim); text-decoration: none;
  transition: color .2s ease;
}
#bar a.ghost:hover { color: var(--ink); }
@media (max-width: 460px) { #bar a.ghost { display: none; } }

.layer { position: relative; z-index: 1; pointer-events: none; }

.panel {
  position: fixed;
  inset: var(--bar) 0 0 0;
  display: grid;
  padding: var(--shell);
  opacity: 0;
  visibility: hidden;
  transition: opacity .6s ease;
  will-change: opacity;
}
.panel[data-on="1"] { opacity: 1; visibility: visible; }
.panel a, .panel button { pointer-events: auto; }

/* The store's primary control: an ink pill, wide-tracked, uppercase. */
.pill {
  display: inline-flex; align-items: center; gap: .55rem;
  border-radius: 999px;
  background: var(--ink); color: var(--paper);
  padding: .8rem 1.6rem;
  font-size: .75rem; font-weight: 600;
  letter-spacing: .2em; text-transform: uppercase;
  text-decoration: none;
  transition: opacity .2s ease, transform .2s ease;
}
.pill:hover { opacity: .9; transform: translateY(-1px); }

/* Corner brackets, the same four L's the brand tiles wear. */
.bracket { position: relative; }
.bracket::before, .bracket::after,
.bracket > .br::before, .bracket > .br::after {
  content: ""; position: absolute; width: 14px; height: 14px;
  border: 0 solid var(--rule-strong); pointer-events: none;
}
.bracket::before { left: 10px;  top: 10px;    border-left-width: 1px;  border-top-width: 1px; }
.bracket::after  { right: 10px; top: 10px;    border-right-width: 1px; border-top-width: 1px; }
.bracket > .br::before { left: 10px;  bottom: 10px; border-left-width: 1px;  border-bottom-width: 1px; }
.bracket > .br::after  { right: 10px; bottom: 10px; border-right-width: 1px; border-bottom-width: 1px; }

/* --- hero: the lockup itself, unchanged from the storefront ------------- */
/* The bottom padding is what keeps the centred lockup and its line clear of
   the fixed "Scroll" cue, which they were landing on top of. */
#p-hero { place-items: center; text-align: center; padding-bottom: 4.5rem; }
/* The artwork ships on a transparent ground and sits on a clear glass halo —
   a backdrop blur with no tint, masked so it has no edge — exactly as it does
   on the store. The blur is what keeps white legible over the bright cells of
   the dome without hiding them. */
.lockup {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  /* Sized by height as well as width. It used to be width-only, so on a short
     window the square grew taller than the space it had, pushed the line of
     copy under it down the page, and landed it on top of the "Scroll" cue. */
  width: min(21rem, 78vw, 44svh);
}
@media (min-width: 640px) { .lockup { width: min(32rem, 62vw, 44svh); } }
.lockup .glass {
  position: absolute; inset: 0; border-radius: 999px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 42%, rgba(0,0,0,.55) 62%, transparent 78%);
  mask-image: radial-gradient(circle at 50% 50%, #000 42%, rgba(0,0,0,.55) 62%, transparent 78%);
}
.lockup img {
  position: relative;
  width: 76%;
  height: auto;
  filter:
    drop-shadow(0 0 1px rgba(0,0,0,.95))
    drop-shadow(0 1px 3px rgba(0,0,0,.95))
    drop-shadow(0 6px 26px rgba(0,0,0,.8));
}
.sub {
  margin: 1.5rem auto 0;
  max-width: 34ch;
  font-size: clamp(.9rem, 2vw, 1.05rem);
  font-weight: 500;
  line-height: 1.6;
}

.hint {
  position: fixed; left: 50%; bottom: calc(var(--shell) * .8);
  translate: -50% 0;
  font-size: .6875rem; font-weight: 500;
  letter-spacing: .22em; text-transform: uppercase;
  color: #fff; opacity: .8;
  transition: opacity .4s ease;
}
.hint::after {
  content: ""; display: block; width: 1px; height: 30px;
  margin: 10px auto 0; background: linear-gradient(currentColor, transparent);
  animation: drop 2.1s ease-in-out infinite;
}
@keyframes drop { 0%,100% { transform: scaleY(.35); transform-origin: top; opacity: .4 } 50% { transform: scaleY(1); opacity: 1 } }

h2.title { margin: .5rem 0 0; font-size: clamp(1.6rem, 4.6vw, 3.2rem); }

/* --- the promenade: a card on paper, the store's own surface ------------ */
#p-brands { align-content: end; }
.brandcard {
  pointer-events: auto;
  width: min(430px, 100%);
  background: var(--paper);
  border: 1px solid var(--rule);
  box-shadow: 0 30px 70px -34px rgba(0,0,0,.65);
  padding: 1.4rem 1.5rem 1.5rem;
}
.brandcard .swatch { height: 4px; width: 100%; margin-bottom: 1.1rem; }

/* The mark, on the house's ground — the tag that tells you whose shop this
   is before you have read a word of it. */
.maker {
  display: grid;
  place-items: center;
  height: 84px;
  margin-bottom: 1.1rem;
  padding: 0 1.2rem;
  border: 1px solid var(--rule);
  overflow: hidden;
}
.maker img { max-height: 54px; max-width: 100%; width: auto; height: auto; display: block; }
.maker span {
  font-size: 1.15rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  text-align: center; line-height: 1.1;
}
.brandcard h3 { margin: .5rem 0 0; font-size: clamp(1.6rem, 4.4vw, 2.2rem); }
.brandcard p.note { margin: .6rem 0 0; font-size: .85rem; line-height: 1.6; color: var(--ink-dim); }
.brandcard .pill { margin-top: 1.2rem; }

/* ---- waypoints ----------------------------------------------------------
   Markers that sit on the shopfronts themselves and travel with them. They
   are HTML rather than sprites so the artwork stays crisp at any distance and
   a tap target is a real button with a real focus ring. */
.pins { position: fixed; inset: 0; pointer-events: none; }

.pin {
  position: absolute;
  left: 0; top: 0;
  display: grid;
  place-items: center;
  /* A tag, not a badge.
     A circle letterboxes a wordmark — "GALLERY DEPT." had to shrink to its
     own height to fit across a 46px disc, and most of the houses read as a
     smudge. A wide rounded tag gives the artwork its own aspect and roughly
     three times the area, and it is a better tap target with it. */
  width: 104px; height: 66px;
  --pad-x: 12px; --pad-y: 9px;
  margin: 0; padding: var(--pad-y) var(--pad-x);
  border: 0;
  border-radius: 18px;
  background: var(--pin-bg, #fff);
  color: var(--pin-ink, #0b0b0b);
  box-shadow: 0 4px 18px rgba(0,0,0,.4), 0 0 0 2px rgba(255,255,255,.85);
  cursor: pointer;
  pointer-events: auto;
  will-change: transform, opacity;
  transition: box-shadow .2s ease;
}
.pin::after {                       /* the little tail, so it reads as a pin */
  content: "";
  position: absolute;
  bottom: -6px; left: 50%;
  width: 14px; height: 14px;
  translate: -50% 0;
  rotate: 45deg;
  background: inherit;
  box-shadow: 2px 2px 0 rgba(255,255,255,.85);
}
/* Absolutely placed, and `contain` rather than two max-percentages.
   `max-height: 100%` on a grid item never resolved — the row's height is
   indefinite while the grid is being sized, so the browser dropped it and
   applied the width constraint alone. Anything taller than it is wide then
   overflowed its own tag: Hellstar's mark is square and rendered 76 tall in
   a 61 tall marker, hanging out of the top and bottom of it. Pinning all
   four edges makes the box definite and `contain` does the fitting. */
.pin img {
  position: absolute;
  top: var(--pad-y); left: var(--pad-x);
  /* Sized, not inset. `width: auto` on an absolutely positioned *replaced*
     element means its intrinsic width — the offsets are simply ignored — so
     pinning all four edges rendered Hellstar's mark at its native 773px.
     A calc against the containing block is definite, and `contain` fits the
     bitmap inside whatever shape that box turns out to be. */
  width: calc(100% - var(--pad-x) * 2);
  height: calc(100% - var(--pad-y) * 2);
  object-fit: contain;
  object-position: center;
  display: block;
}
/* The houses with no artwork file wear their name in full, set to fit,
   rather than the first two letters of it. "SU" told you nothing. */
.pin b {
  font-weight: 800; letter-spacing: .03em; line-height: 1.05;
  text-align: center; text-transform: uppercase;
  white-space: pre-line;
  /* The fitting above is arithmetic on a canvas; this is the guard that
     makes a miss invisible rather than ragged. */
  max-width: 100%; max-height: 100%; overflow: hidden;
}
@media (max-width: 720px) {
  .pin { width: 92px; height: 58px; --pad-x: 10px; --pad-y: 8px; border-radius: 16px; }
}
.pin:hover, .pin:focus-visible {
  box-shadow: 0 8px 26px rgba(0,0,0,.5), 0 0 0 3px #fff;
}
.pin[data-live="1"] { box-shadow: 0 8px 26px rgba(0,0,0,.5), 0 0 0 3px var(--ink); }

/* The leader line, and the tack it lands on.
   A marker floating loose over the street reads as an overlay dropped on top
   of the picture. Tied down to the shopfront it labels, it reads as being
   *in* the scene — and once the marker can be lifted clear of the sign
   without losing what it points at, it can be lifted far enough to stop
   colliding with the sign artwork underneath it.

   The stem is one pixel wide and stretched with `scaleX`, so a frame costs a
   transform and nothing else. That is also why the dark edging runs top to
   bottom: a horizontal gradient stretches with the bar, a vertical one does
   not, so the hairline stays one pixel however long the line gets. */
.stem {
  position: absolute;
  left: 0; top: 0;
  width: 1px; height: 3px;
  transform-origin: 0 50%;
  background: linear-gradient(to bottom,
      rgba(0,0,0,.45) 0 1px,
      var(--pin-bg, #fff) 1px 2px,
      rgba(0,0,0,.45) 2px 3px);
  pointer-events: none;
  will-change: transform, opacity;
}
.tack {
  position: absolute;
  left: 0; top: 0;
  width: 10px; height: 10px;
  border-radius: 999px;
  background: var(--pin-bg, #fff);
  box-shadow: 0 0 0 2px rgba(0,0,0,.38), 0 2px 10px rgba(0,0,0,.5);
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .pin { animation: pinIn .35s cubic-bezier(.2,1.3,.4,1) both; }
}
@keyframes pinIn { from { scale: .4; opacity: 0 } to { scale: 1; opacity: 1 } }

/* ---- the shop, from the inside ------------------------------------------
   Chrome for the interior mode. It sits over the room rather than covering
   it: a bar across the top, a rail of stock across the bottom, and a card
   that opens for one piece. The room stays visible between them, because the
   whole point is to be standing in it. */
#shop {
  position: fixed; inset: 0; z-index: 6;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity .32s ease, visibility 0s linear .32s;
  --shop-ink: #ffffff;
  --shop-bg: #101010;
}
#shop[data-on="1"] {
  opacity: 1; visibility: visible;
  transition: opacity .32s ease .12s, visibility 0s;
}

#shop .top {
  position: absolute; left: 0; right: 0; top: var(--bar);
  display: flex; align-items: center; gap: .85rem;
  /* The sound toggle lives in this corner and stays reachable inside a
     shop, so the way out is set in from the edge to clear it. */
  padding: .8rem calc(clamp(14px, 4vw, 30px) + 60px) .8rem clamp(14px, 4vw, 30px);
  /* Deep enough to hold white type over a Supreme-red or Off-White-white
     wall, both of which sit directly behind this bar. */
  background: linear-gradient(180deg, rgba(0,0,0,.8), rgba(0,0,0,.46) 62%, rgba(0,0,0,0));
  pointer-events: auto;
}
#shop .mark {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  border-radius: 10px; overflow: hidden;
  background: var(--shop-bg);
  box-shadow: 0 0 0 1px rgba(255,255,255,.25);
}
#shop .mark img { max-width: 78%; max-height: 78%; display: block; }
#shop .mark span { font-weight: 800; font-size: .72rem; letter-spacing: .04em; color: var(--shop-ink); }
#shop .who { min-width: 0; }
#shop .who h3 {
  margin: 0; font-size: clamp(1rem, 3.6vw, 1.35rem); font-weight: 600;
  letter-spacing: -0.02em; text-transform: uppercase; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#shop .out {
  margin-left: auto; flex: none;
  display: inline-flex; align-items: center; gap: .4rem;
  border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.35);
  color: #fff; border-radius: 999px;
  padding: .52rem .95rem; font: inherit; font-size: .6875rem; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
#shop .out:hover { background: #fff; color: #0b0b0b; border-color: #fff; }
/* The way out said nothing but a cross, and on a phone the glyph did not
   even render — it came out as a stray "15" in the corner. It is a word
   now, shortened rather than dropped when the bar gets tight. */
#shop .out .arr { font-size: 13px; line-height: 1; }
#shop .out .lbl { line-height: 1; }



/* The shelf: a paper column against the room.
   Paper on purpose. The point of the change is that this reads as the
   storefront's own catalogue — a grid of cards you scroll down — and a
   dark glass panel reads as more HUD. It takes the right-hand third on a
   laptop and the bottom of the screen on a phone, and the camera is told
   where it ends so the stock on the wall is framed in what is left. */
#shop .shelf {
  position: absolute;
  right: 0; top: calc(var(--bar) + var(--topbar, 62px)); bottom: 0;
  width: min(360px, 34vw);
  display: flex; flex-direction: column;
  background: var(--paper);
  border-left: 1px solid var(--rule);
  pointer-events: auto;
}

#shop .cats {
  /* 0 0 auto, not the default 0 1 auto. The shelf is a flex column and the
     grid below is always taller than the space it has, so a shrinkable
     chip row was being crushed to half a line of type. */
  flex: 0 0 auto;
  /* Wrapping, not scrolling sideways. This was a horizontal scroller with
     its scrollbar hidden and no fade at the edge, so a house with four
     sections showed three and a half of them and nothing said the rest
     were there. Two lines of chips cost twenty pixels of shelf and hide
     nothing. */
  display: flex; align-items: center; flex-wrap: wrap;
  gap: .35rem; margin: 0;
  padding: .6rem .7rem;
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
}
#shop .cat {
  flex: none; border: 1px solid var(--rule-strong);
  background: var(--paper); color: var(--ink-dim);
  border-radius: 999px; padding: .34rem .68rem;
  font: inherit; font-size: .625rem; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  white-space: nowrap; cursor: pointer; line-height: 1.15;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
#shop .cat i { font-style: normal; opacity: .55; margin-left: .32rem; letter-spacing: 0; }
#shop .cat[data-live="1"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

#shop .grid {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: grid; grid-template-columns: 1fr 1fr;
  align-content: start;
}
#shop .card {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  min-width: 0;
}
#shop .card:nth-child(2n) { border-right: 0; }
#shop .hit {
  display: block; width: 100%; border: 0; background: none;
  padding: .55rem .55rem .65rem; text-align: left; cursor: pointer;
  font: inherit; color: var(--ink);
}
#shop .hit .pic {
  display: block; aspect-ratio: 1; overflow: hidden;
  background: var(--paper-sunken);
}
#shop .hit img { width: 100%; height: 100%; object-fit: cover; display: block; }
#shop .hit b {
  display: block; margin-top: .45rem; font-size: .75rem; font-weight: 500;
  line-height: 1.3; max-height: 2.6em; overflow: hidden;
}
#shop .hit i { display: block; font-style: normal; font-size: .75rem; color: var(--ink-dim); }

/* The three things a shelf can be doing other than showing stock: waiting on
   the catalogue, having none, and having failed to fetch it. One blank sheet
   of paper used to stand for all three and said nothing about any of them. */
#shop .skel {
  padding: .55rem .55rem .65rem;
  border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  animation: shelfWait 1.3s ease-in-out infinite;
}
#shop .skel:nth-child(2n) { border-right: 0; }
#shop .skel span { display: block; background: var(--paper-sunken); }
#shop .skel span.p { aspect-ratio: 1; }
#shop .skel span.t { height: .72rem; margin-top: .5rem; }
#shop .skel span.u { height: .72rem; margin-top: .3rem; width: 45%; }
@keyframes shelfWait { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
#shop .note { grid-column: 1 / -1; padding: 2.2rem 1.3rem; text-align: center; }
#shop .note p { margin: 0 0 1.1rem; font-size: .8rem; line-height: 1.6; color: var(--ink-dim); }
#shop .note .pill { display: inline-block; }

/* While the click is waiting on the network. The pointer says so, and the
   thing that was clicked stops looking clickable. */
body[data-busy="1"] { cursor: progress; }
body[data-busy="1"] .pill, body[data-busy="1"] .pin { opacity: .55; }
#shop .card[data-gone="1"] .hit img { filter: grayscale(1) brightness(.78); }
#shop .card[data-live="1"] { background: var(--paper-raised); }
#shop .card[data-live="1"] .hit .pic { outline: 2px solid var(--ink); outline-offset: -2px; }

#shop .more { display: none; padding: 0 .55rem .7rem; }
#shop .card[data-live="1"] .more { display: block; }
#shop .more .sizes { display: flex; flex-wrap: wrap; gap: .25rem; }
#shop .more .sizes span {
  border: 1px solid var(--rule-strong); padding: .12rem .38rem; font-size: .625rem;
  letter-spacing: .08em;
}
#shop .more .stock {
  margin: .45rem 0 0; font-size: .625rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-faint);
}
#shop .more .pill {
  margin-top: .55rem; width: 100%; justify-content: center;
  padding: .5rem .6rem; font-size: .625rem;
}


/* A phone is not a small laptop.
   The shelf goes to the bottom of the screen and takes a little under half
   of it, which leaves the room the part of the frame a phone is actually
   good at: the tall middle. */
@media (max-width: 720px) {
  #shop .shelf {
    left: 0; right: 0; top: auto; bottom: 0;
    width: auto;
    /* Plus the home indicator, and padded by it — otherwise the last row
       of cards sits behind a bar the visitor cannot move. */
    height: calc(min(46vh, 430px) + var(--sab));
    padding-bottom: var(--sab);
    border-left: 0; border-top: 1px solid var(--rule);
  }
  /* 375 wide, minus the gutter, the sound toggle, the mark and the way
     out, leaves 128 for the house's name — and "Chrome Hearts" is the
     longest one on the street at 124. Measured, not guessed. */
  #shop .top {
    padding-top: .55rem; padding-bottom: .55rem;
    padding-right: calc(clamp(14px, 4vw, 30px) + 50px);
  }
  #shop .who h3 { font-size: .95rem; }
  /* No auto margin here.
     It pins the button to the padding edge whatever its width, so trimming
     the button changed nothing and it kept touching the sound toggle. Let
     the row pack left instead: the name takes what it needs, the button
     follows it, and the slack collects on the right where the toggle is. */
  #shop .out { margin-left: 0; padding: .5rem .72rem; }
  #shop .mark { width: 38px; height: 38px; border-radius: 8px; }
  #shop .out .long { display: none; }
  #shop .cats { padding: .55rem .6rem; }
  #shop .hit b { font-size: .7rem; }
}
@media (min-width: 721px) {
  #shop .out .short { display: none; }
}


/* The running order down the street. */
.index {
  position: fixed; right: var(--shell); top: 56%; translate: 0 -50%;
  display: grid; gap: .38rem; justify-items: end;
  font-size: .6875rem; font-weight: 500;
  letter-spacing: .22em; text-transform: uppercase;
  color: #fff;
  /* `visibility` and `pointer-events`, not opacity on its own. Invisible is
     not the same as gone: this used to leave fifteen hittable, focusable
     items over the right of the screen whenever it was "off". */
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .5s ease, visibility 0s linear .5s;
}
.index[data-on="1"] {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity .5s ease, visibility 0s;
}
.index .ix {
  font: inherit; font-weight: 500; letter-spacing: inherit;
  text-transform: inherit; text-align: right;
  border: 0; background: none; padding: 0; cursor: pointer;
  color: #fff; opacity: .5;
  text-shadow: 0 1px 3px rgba(0,0,0,.95), 0 0 16px rgba(0,0,0,.7);
  transition: opacity .3s ease;
}
.index .ix[data-live="1"] { opacity: 1; }
.index .ix:hover { opacity: .85; }

/* ---- sound: an invitation that folds into a control ------------------- */
.sound {
  /* Top right, under the header. Bottom left put it straight on top of the
     card's Shop button on a phone, where the card is full width and bottom
     aligned — the two controls were literally overlapping. Nothing else
     lives up here. */
  position: fixed;
  right: var(--shell);
  top: calc(var(--bar) + 14px);
  /* Above the shop overlay, not level with it. Both were z-index 6 and the
     overlay comes later in the document, so inside a shop the sound button
     was drawn on top and then had its clicks taken by the bar behind it —
     a control you could see, and could not press. */
  z-index: 8;
  display: flex;
  flex-direction: row-reverse;      /* icon stays at the right edge */
  align-items: center;
  gap: 0;
  height: 44px;
  padding: 0 0 0 4px;
  border: 0;
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 6px 22px rgba(0,0,0,.4);
  cursor: pointer;
  pointer-events: auto;
  font: inherit;
  overflow: hidden;
  transition: gap .35s ease, padding .35s ease, background .25s ease, color .25s ease;
}
.sound .ico { display: grid; place-items: center; width: 44px; height: 44px; flex: none; }
.sound .lbl {
  display: block;
  max-width: 0;
  opacity: 0;
  white-space: nowrap;
  font-size: .6875rem; font-weight: 600;
  letter-spacing: .2em; text-transform: uppercase;
  transition: max-width .4s ease, opacity .3s ease, padding .4s ease;
  padding: 0;
}

/* Waiting to be used: the label is out and the ring pings. */
.sound[data-state="prompt"] .lbl { max-width: 12rem; opacity: 1; padding-left: 1.1rem; }
/* Except inside a shop, where "Tap for sound" runs straight into "Back to
   the street" — two controls in the same corner, one of them clipped. In
   there it is the icon and nothing else. */
body[data-shopping="1"] .sound[data-state="prompt"] .lbl {
  max-width: 0; opacity: 0; padding-left: 0;
}
body[data-shopping="1"] .sound[data-state="prompt"]::after { animation: none; opacity: .25; }
.sound[data-state="prompt"]::after {
  content: "";
  position: absolute;
  right: 22px; top: 50%;
  width: 34px; height: 34px;
  translate: 50% -50%;
  border-radius: 999px;
  border: 2px solid var(--ink);
  animation: ping 2.2s cubic-bezier(.2,.7,.4,1) infinite;
  pointer-events: none;
}
@keyframes ping {
  0%   { transform: scale(.55); opacity: .55 }
  70%  { transform: scale(1.5); opacity: 0 }
  100% { transform: scale(1.5); opacity: 0 }
}

.sound[data-state="on"] { background: var(--ink); color: var(--paper); }
.sound .wave { opacity: 0; transition: opacity .25s ease; }
.sound .cross { opacity: 1; transition: opacity .25s ease; }
.sound[data-state="on"] .wave { opacity: 1; }
.sound[data-state="on"] .cross { opacity: 0; }

.sound:hover { box-shadow: 0 10px 28px rgba(0,0,0,.5); }

@media (prefers-reduced-motion: reduce) {
  .sound::after { animation: none; opacity: .3 }
  .sound, .sound .lbl { transition: none }
}

/* --- finale --- */
/* The finale used to be a white card pasted over the view. It is projected
   onto the building that closes the street now: no ground of its own, white
   type, and the same layered halo the rest of the over-scene copy uses. */
#p-end { place-items: center; text-align: center; }
#p-end .card { padding: clamp(1rem, 4vw, 2rem); }
#p-end img {
  width: min(15rem, 52vw); height: auto; display: block; margin: 0 auto 1.6rem;
  filter:
    drop-shadow(0 0 1px rgba(0,0,0,.95))
    drop-shadow(0 2px 6px rgba(0,0,0,.9))
    drop-shadow(0 8px 30px rgba(0,0,0,.8));
}
#p-end .pill {
  background: transparent;
  color: #fff;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.85);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
#p-end .pill:hover { background: #fff; color: var(--ink); box-shadow: none; }

/* --- loader, on the store's paper ground --- */
#boot {
  position: fixed; inset: 0; z-index: 9;
  display: grid; place-items: center;
  background: var(--paper);
  transition: opacity .9s ease;
}
#boot[data-done="1"] { opacity: 0; pointer-events: none; }
#boot .bar { width: 160px; height: 1px; background: var(--rule); overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 40%; background: var(--ink); animation: sweep 1.15s ease-in-out infinite; }
@keyframes sweep { 0% { transform: translateX(-110%) } 100% { transform: translateX(340%) } }

#fallback {
  display: none; position: fixed; inset: 0; z-index: 10;
  place-items: center; padding: var(--shell); text-align: center;
  background: var(--paper); color: var(--ink);
}
#fallback[data-on="1"] { display: grid; }

/* Fingers are not cursors.
   Measured on a 375-wide phone before this: the filter chips were 24px
   tall and the way out was 31, against a 44px floor in every platform's
   own guidance. Those are the two controls a shop is actually operated
   with. Nothing here moves on a mouse, where a 24px chip is fine. */
@media (pointer: coarse) {
  /* A floor on the box rather than bigger type: padding alone got the chip
     to 36px and would have needed a full rem either side to reach 44,
     which is a chip the size of a button. */
  #shop .cat {
    min-height: 44px; display: inline-flex; align-items: center;
    padding: .4rem .82rem; font-size: .66rem;
  }
  #shop .cat i { margin-left: .4rem; }
  #shop .out { min-height: 44px; padding: .5rem .9rem; }
  #shop .hit { padding: .6rem .6rem .8rem; }
  .index .ix { padding: .3rem 0; }
}

@media (max-width: 860px) {
  .index { display: none; }
  #p-brands { justify-items: center; }
}

@media (prefers-reduced-motion: reduce) {
  .hint::after { animation: none; }
  .panel { transition: none; }
  #shop .skel { animation: none; opacity: .7; }
  #boot .bar i { animation: none; width: 100%; }
  #shop, .index, #shop .cat, .sound .lbl, .index b { transition: none; }
}
</style>
</head>

<body>
<!-- ## 04  MARKUP -->
<!-- Named, because otherwise the entire street and everything in it is an
     unlabelled rectangle. The label follows the state; the shelf beside it
     is the real, reachable copy of the same catalogue. -->
<canvas id="stage" role="img"
        aria-label="A street of fifteen shopfronts, seen in 3D"></canvas>

<div id="boot" role="status" aria-label="Loading the street"><div class="bar"><i></i></div></div>

<div id="fallback">
  <div>
    <p class="eyebrow">Designer District</p>
    <h2 class="display title" id="fallback-head">This page needs WebGL.</h2>
    <p style="margin:1.2rem 0 1.6rem;color:var(--ink-dim)" id="fallback-note">Your browser could not start a 3D context.</p>
    <a class="pill" href="https://designer-district.vercel.app">Continue to the store</a>
  </div>
</div>

<!--
  The one script on this page that is not a module, and that is the point.

  Everything else here — the scene, the fallback that raises itself when
  WebGL will not start, the loading bar's own dismissal — lives inside a
  `type="module"` that imports three from a CDN. Which means that if the CDN
  is slow, blocked by a network, or down, none of it ever runs: the module
  never executes, the bar at the top of the screen sweeps forever, and the
  fallback that exists to explain exactly this cannot raise itself, because
  it is inside the thing that did not load.

  So this one sits outside it and watches the clock.
-->
<script>
  (function () {
    setTimeout(function () {
      var boot = document.getElementById("boot");
      if (!boot || boot.dataset.done === "1") return;
      document.getElementById("fallback-head").textContent = "This is taking too long.";
      document.getElementById("fallback-note").textContent =
        "The 3D library could not be reached. A network or a blocker is in the way.";
      document.getElementById("fallback").dataset.on = "1";
      boot.dataset.done = "1";
    }, 12000);
  })();
</script>

<!-- The store's own header, kept as it is there: paper ground, hairline rule,
     and the wordmark cut straight from the logo rather than set in a face that
     approximates it. Swap these absolute URLs for /brand/... if the file is
     ever served from the same origin as the store. -->
<header id="bar">
  <div class="side"></div>
  <a href="https://designer-district.vercel.app" aria-label="Designer District, home">
    <img src="https://designer-district.vercel.app/brand/designer-district-wordmark.png"
         alt="Designer District" width="900" height="61" />
  </a>
  <div class="side"><a class="ghost" href="https://designer-district.vercel.app">Shop</a></div>
</header>

<div class="layer">
  <section class="panel on-scene" id="p-hero" data-on="1">
    <div>
      <div class="lockup">
        <div class="glass" aria-hidden="true"></div>
        <img src="https://designer-district.vercel.app/brand/designer-district-on-dark.png"
             alt="Designer District" width="800" height="618" fetchpriority="high" />
      </div>
      <p class="sub halo">Fifteen districts, one address.</p>
    </div>
  </section>

  <section class="panel" id="p-brands">
    <div class="brandcard bracket" id="card">
      <span class="br" aria-hidden="true"></span>
      <div class="swatch" id="card-swatch"></div>
      <!-- The house's own artwork, on its own colourway. Brands with no logo
           file fall back to their name set in the display face, which is what
           the storefront tiles do for the same seven houses. -->
      <div class="maker" id="card-maker"><span id="card-maker-text">&mdash;</span></div>
      <p class="eyebrow" id="card-eyebrow">The Collection</p>
      <h3 class="display" id="card-name">&mdash;</h3>
      <p class="note" id="card-note">&mdash;</p>
      <a class="pill" id="card-link" href="#">Shop the district</a>
    </div>
  </section>

  <section class="panel on-scene" id="p-end">
    <div class="card halo">
      <img src="https://designer-district.vercel.app/brand/designer-district-on-dark.png"
           alt="Designer District" width="800" height="618" loading="lazy" />
      <p class="eyebrow">All fifteen districts</p>
      <h2 class="display title">Everything, in one place.</h2>
      <a class="pill" id="enter" href="#" style="margin-top:1.8rem">Enter the store</a>
    </div>
  </section>

  <!-- Waypoints: one per house, pinned to its shopfront in screen space and
       clickable to travel there. Built in script because each needs the
       house's colourway and mark. -->
  <div class="pins" id="pins" aria-label="Jump to a district"></div>

  <nav class="index" id="index" aria-label="Districts on this street"></nav>
  <p class="hint halo" id="hint">Scroll</p>


</div>


<!--
  Outside `.layer`, deliberately.

  Starts as an invitation, not a switch. On a phone the audio cannot begin
  until something is tapped, and a bare speaker glyph in a corner does not
  read as "this page has sound you are currently missing". So it arrives as
  a pill that says so, pulses until it is used, and then folds down to an
  icon and stays out of the way.

  It used to live in `.layer` with the rest of the over-scene chrome, and
  `.layer` is `position: relative; z-index: 1` — a stacking context. So
  inside a shop this button was painted on top of the overlay and then had
  every click taken by the bar behind it, because no z-index of its own can
  escape a context its parent established. A control you could see and
  could not press. Out here its z-index means what it says.
-->
  <button class="sound" id="sound" type="button" data-state="prompt"
          aria-pressed="false" aria-label="Turn sound on">
    <span class="ico" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H3v6h3l5 4z" />
        <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7" />
        <path class="wave" d="M18.5 5.5a9 9 0 0 1 0 13" />
        <path class="cross" d="M17 9.5l5 5M22 9.5l-5 5" />
      </svg>
    </span>
    <span class="lbl">Tap for sound</span>
  </button>

<!-- Inside a shop. Hidden until the camera is actually in one. -->
<div id="shop" aria-hidden="true" role="dialog" aria-modal="true"
     aria-labelledby="shop-name">
  <div class="top">
    <div class="mark" id="shop-mark"></div>
    <div class="who">
      <h3 id="shop-name">&mdash;</h3>
    </div>
    <button class="out" id="shop-out" type="button">
      <span class="arr" aria-hidden="true">←</span>
      <span class="lbl long">Back to the street</span>
      <span class="lbl short">Street</span>
    </button>
  </div>

  <!-- The stock, as a catalogue rather than a filmstrip: a column of cards
       you scroll the way you scroll the storefront, and the room behind it
       follows along. -->
  <aside class="shelf" id="shop-shelf" aria-label="Stock">
    <div class="cats" id="shop-cats" role="group" aria-label="Filter by category"></div>
    <div class="grid" id="shop-grid" role="list"></div>
    <!-- Filtering replaces the whole list, so something has to say so. -->
    <p class="vh" id="shop-live" role="status" aria-live="polite"></p>
  </aside>
</div>


<!-- ## 05  IMPORT MAP -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// ## 06  CONFIG — tuning, palette, brand data
// Everything adjustable lives here. The scene below reads it and never
// hard-codes a number you would plausibly want to change.

const SITE = "https://designer-district.vercel.app";

/* Reduced motion is read live; the rest is not.
 *
 * Everything else in here decides how the scene is built — buffer sizes,
 * particle counts, whether glass is real glass — and none of it can change
 * without tearing the scene down, so it is sampled once and a reload is the
 * honest answer. `still` is different: it decides how things *move*, every
 * frame, and somebody who turns the setting on because a page is making them
 * ill should not have to reload that page to get relief from it. */
const STILL = matchMedia("(prefers-reduced-motion: reduce)");

const QUALITY = (() => {
  const coarse = matchMedia("(pointer: coarse)").matches;
  const small  = Math.min(innerWidth, innerHeight) < 700;
  const light  = coarse || small;
  return {
    light,
    get still() { return STILL.matches; },
    dpr:       light ? 1.2  : 2,
    shadowMap: light ? 1024 : 2048,
    leaves:    light ? 36  : 110,
    motes:     light ? 140 : 520,

    /**
     * Whether glass is allowed to be real glass.
     *
     * This is the single most expensive thing in the scene on a phone and it
     * does not look like it. A MeshPhysicalMaterial with any transmission at
     * all makes three render the entire opaque scene a second time, into a
     * transmission buffer, every frame — and there were five such materials:
     * the dome's panes, every shopfront, the fountain, the end block and the
     * bridge. One is enough to pay for the pass; five just share it. Turning
     * transmission off and leaning on plain opacity costs a little realism
     * in the refractions and halves the frame.
     */
    transmission: !light,

    // The shell is the single heaviest object in the opening shot, and
    // alpha-tested geometry is what tiled mobile GPUs like least.
    domeSeg:   light ? [96, 64] : [176, 120],
    lampsDome: light ? 2 : 4,
    lampsStreet: light ? 2 : 4,
    spray:     light ? 130 : 420,
    /* What a crown costs, measured rather than assumed.
     *
     * This used to say palms were the most expensive thing in the scene.
     * They were not: hiding the entire merged frond mesh — every frond on
     * every palm, alpha test, shadow pass and all — moved a desktop frame
     * by 0.09ms of 24. Ten fronds was a sparse crown paying a price it did
     * not owe, and sparse is most of why these read as ferns on a stick.
     *
     * Seventeen is not free, but it is close. Measured properly — this
     * build and the previous one served side by side, same tab, same
     * viewport, five runs each, medians — the whole of this pass costs
     * 0.67ms on a 22.25ms frame, for 39.7k extra triangles across the
     * crowns, the sky and the planting. Toggling a single mesh off and
     * timing one run says 2.5ms, and that number is noise; do not trust it.
     * The light tier still gets eleven and the cheaper sky, because none of
     * this was measured on a phone.
     *
     * The count of *trees* stays where it is. That is a composition decision
     * about a street with buildings down both sides, not a budget one. */
    palmsRow:  light ? 4   : 6,
    palmsRing: light ? 6   : 9,
    frondsPer: light ? 11  : 17,
    bloom:     !light,
    holeSeg:   light ? 16  : 26,   // radial segments on each dome rim
    texScale:  light ? 0.6 : 1,
  };
})();

const C = {
  sun:       new THREE.Vector3(-0.42, 0.62, 0.66).normalize(),
  zenith:    new THREE.Color("#0b4fbe"),
  horizon:   new THREE.Color("#a8d2ee"),
  underside: new THREE.Color("#9fb9c9"),
  fog:       new THREE.Color("#b7d6ea"),
  fogDensity: 0.0052,

  travertine: new THREE.Color("#e6d9bd"),
  poolDeep:   new THREE.Color("#0b5f80"),
  poolShallow:new THREE.Color("#35c2c9"),

  domeRadius: 6,
  // Measured off the reference rather than guessed. The real thing is close
  // to a full sphere with the bottom cut away, not a hemisphere: it bulges
  // out well past its own base and overhangs the plinth all the way round,
  // which is most of what makes it read as a sphere resting in water.
  domeSquash: 0.88,          // barely flattened
  domeCut:    0.80,          // × PI — 144 degrees of arc, well under the equator
  // Twenty-one openings, not forty-four. The real dome's cells are enormous
  // relative to the sphere — roughly a third of its diameter each — and at
  // forty-four the shell read as a golf ball instead.
  // Cell size taken off the reference: an opening is about a quarter of the
  // dome's width, which is an angular radius near 15 degrees. Twenty-one at
  // 17.5 degrees was too few and too large, and the webbing between them too
  // thin — the lips are the thickest part of the real shell.
  domeHoles:  27,
  holeAngle:  0.263,     // angular radius of one opening, radians
  rimTube:    0.30,      // thickness of the lip around it
  // Low. The reference is a broad circular step barely clear of the water
  // with the sphere overhanging it on every side, not a pedestal.
  plinthTop:  0.62,

  poolY:      -0.28,
  plazaY:     0,

  // Where the street runs. Monoliths alternate sides down this line.
  streetFrom: -34,
  streetStep: -9.2,
  // How far out from the centre line the slabs stand. A portrait phone sees a
  // much narrower horizontal wedge than a laptop does, and at 7.6 the first
  // house sat outside the frame for its whole approach — named on the card,
  // never actually on screen. The street closes up when the viewport is tall.
  streetX: innerWidth / innerHeight < 1 ? 4.9 : 7.6,
};

// Derived once: the dome's centre height so its cut edge lands on the plinth.
C.domeCenterY = C.plinthTop + Math.abs(Math.cos(C.domeCut * Math.PI)) * C.domeRadius * C.domeSquash;

/**
 * A building type per house.
 *
 * Fifteen identical boxes in fifteen tints is a colour-swatch, not a street.
 * Each house now gets a genuinely different piece of architecture, and the
 * order is arranged so no two neighbours share a type — and, because the
 * terraces interleave, so that no two units on the *same* side share one
 * either. Every type is distinct at index i, i+1 and i+2.
 *
 *   fluted    close-spaced vertical fins over a recessed wall
 *   monolith  solid mass with one deep punched opening
 *   stacked   three volumes, each stepping out over the last
 *   screen    a perforated sheet hung clear of the facade
 *   folded    a pleated wall of angled panels
 *   curtain   full glazing with horizontal spandrel bands
 *   louvre    deep horizontal sun blades
 *   arcade    a run of tall arched openings
 *   portal    a heavy frame around a recessed glass box
 *   baguette  a comb of slender vertical rods
 */
const STYLE = {
  "bape":          "stacked",

  "amiri":         "fluted",

/** How tall each type wants to be, before its own random variation. */

  curtain: 11.8, louvre: 10.2, arcade: 10.8, portal: 12.0, baguette: 11.2,

/**

 * palms are planted before any of it exists and need to know where not to

 */
const STREET = {
  half:  innerWidth / innerHeight < 1 ? 8.4 : 11.0,   // kerb to centre line
  from:  -38,
  step:  -7.6,
  // Wider than the 15.2 per-side pitch on purpose, so neighbours overlap by
  // 40cm instead of leaving a hairline crack between every pair.
  width: 15.6,
  depth: 14,
};

/**
 * Blocks penning the plaza in.
 *
 * Without them the opening shot was a dome, two lumps of concrete and then

 * in a field. The reference is nothing like that: it is a courtyard, closed
 * on every side, and you cannot see out of it at all.
 */
const PLAZA_BLOCKS = [
  { x0: -46, x1: -26, z0: -58, z1: -30, h: 15 },
  { x0: -44, x1: -26, z0: -28, z1:  -2, h: 12 },
  { x0: -46, x1: -27, z0:   0, z1:  24, h: 16 },
  { x0: -42, x1: -26, z0:  26, z1:  46, h: 11 },
  { x0:  26, x1:  46, z0: -58, z1: -30, h: 14 },
  { x0:  26, x1:  44, z0: -28, z1:  -2, h: 17 },
  { x0:  27, x1:  46, z0:   0, z1:  24, h: 12 },
  { x0:  26, x1:  42, z0:  26, z1:  46, h: 15 },
];

/** True where a building already stands, so nothing else is planted in one. */
function inBuilt(x, z) {
  const ax = Math.abs(x);
  // the two terraces, their fillers, and a little clearance
  if (ax > STREET.half - 1.4 && ax < STREET.half + STREET.depth + 1.4
      && z < -17 && z > -184) return true;
  // the block closing the far end
  if (z < -170 && z > -198 && ax < 31) return true;
  for (const b of PLAZA_BLOCKS) {
    if (x > b.x0 - 1.5 && x < b.x1 + 1.5 && z > b.z0 - 1.5 && z < b.z1 + 1.5) return true;
  }
  return false;
}

// Scroll choreography. Each panel owns a slice of the journey.
const BEATS = {
  // Shorter than it was. The route is a straight run now, so the same

  hero:   [0.000, 0.070],

// ## 07  UTILITIES — rng, easing, math

/** Deterministic PRNG, so the palm grove is the same grove on every load. */
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
const clamp  = (v, a, b) => Math.min(Math.max(v, a), b);
const lerp   = (a, b, t) => a + (b - a) * t;

// ## 08  TEXTURES — procedural canvas makers
// Nothing is fetched. Every surface in the scene is drawn here at boot, which
// keeps the page a single file and means there is no loading order to get
// wrong.

function canvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(2, Math.round(w * QUALITY.texScale));
  c.height = Math.max(2, Math.round(h * QUALITY.texScale));
  return c;
}

function asTexture(c, { srgb = true, repeat = null, aniso = 8 } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  t.anisotropy = aniso;
  return t;
}

/** Warm, veined travertine with the plaza's tile joints cut into it. */
function texTravertine() {
  const c = canvas(1024, 1024), x = c.getContext("2d"), S = c.width;
  x.fillStyle = "#ddcfb2"; x.fillRect(0, 0, S, S);

  // Mineral cloudiness.
  for (let i = 0; i < 2600; i++) {
    const r = 6 + Math.random() * 70;
    x.globalAlpha = 0.018 + Math.random() * 0.03;
    x.fillStyle = Math.random() > 0.45 ? "#fffaf0" : "#c8bda4";
    x.beginPath();
    x.ellipse(Math.random() * S, Math.random() * S, r, r * (0.4 + Math.random()), Math.random() * Math.PI, 0, 7);
    x.fill();
  }
  // Fine grain.
  x.globalAlpha = 1;
  const g = x.getImageData(0, 0, S, S), d = g.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 16;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(g, 0, 0);

  // Joints: four slabs across the tile, so the repeat reads as stonework.
  x.strokeStyle = "rgba(150,138,116,.55)";
  x.lineWidth = Math.max(1, S / 340);
  for (let i = 0; i <= 4; i++) {
    const p = (i / 4) * S;
    x.beginPath(); x.moveTo(p, 0); x.lineTo(p, S); x.stroke();
    x.beginPath(); x.moveTo(0, p); x.lineTo(S, p); x.stroke();
  }
  return c;
}

/** Palm bark: stacked leaf scars, vertical fibre, sun-bleached. */
function texBark() {
  const c = canvas(256, 1024), x = c.getContext("2d"), W = c.width, H = c.height;
  const base = x.createLinearGradient(0, 0, W, 0);
  base.addColorStop(0, "#8a7963"); base.addColorStop(0.38, "#c3b294");
  base.addColorStop(0.66, "#d6c6a6"); base.addColorStop(1, "#8d7c66");
  x.fillStyle = base; x.fillRect(0, 0, W, H);

  // Ring scars — the diamond pattern a palm leaves as fronds drop.
  const rings = 22;
  for (let i = 0; i < rings; i++) {
    const y = (i / rings) * H + (Math.random() - 0.5) * 3;
    const h = H / rings;
    // Scars are staggered and uneven; a clean stripe every N pixels reads as
    // a stack of coins rather than a tree.
    x.globalAlpha = 0.20 + Math.random() * 0.22;
    x.fillStyle = "rgba(96,80,58,1)";
    x.beginPath();
    x.moveTo(0, y + (Math.random() - 0.5) * 4);
    x.lineTo(W, y + (Math.random() - 0.5) * 4);
    x.lineTo(W, y + h * (0.16 + Math.random() * 0.12));
    x.lineTo(0, y + h * (0.16 + Math.random() * 0.12));
    x.closePath(); x.fill();
    x.globalAlpha = 0.14;
    x.fillStyle = "rgba(255,246,224,1)";
    x.fillRect(0, y + h * 0.3, W, h * 0.1);
  }
  // Vertical fibre.
  x.globalAlpha = 0.16;
  for (let i = 0; i < 220; i++) {
    x.strokeStyle = Math.random() > 0.5 ? "#4a3d2f" : "#d8c9a8";
    x.lineWidth = Math.random() * 1.8;
    const px = Math.random() * W;
    x.beginPath(); x.moveTo(px, 0); x.lineTo(px + (Math.random() - 0.5) * 10, H); x.stroke();
  }
  x.globalAlpha = 1;
  return c;
}

/**
 * One palm frond, drawn flat: a rachis along the middle with leaflets combed
 * off both edges. The canvas alpha is the leaf's silhouette, which is what
 * makes the dappled shadow underneath look like a palm rather than a blob.
 */
function texFrond() {
  const c = canvas(1024, 448), x = c.getContext("2d"), W = c.width, H = c.height, mid = H / 2;
  x.clearRect(0, 0, W, H);
  const ink = (r, g, b, k) =>
    `rgb(${Math.round(r * k)},${Math.round(g * k)},${Math.round(b * k)})`;

  /* Nearly twice as many leaflets, each half as wide.
   *
   * At 74 the comb was coarse enough to count, which is what made a crown
   * read as a fern. The thing that actually reads as a palm at any distance
   * is a *fine* comb with gaps in it, so the count goes up, the width comes
   * down, and one in twenty is dropped outright — a frond with a perfectly
   * even comb looks machined, and the missing ones are most of what makes
   * it look grown.
   */
  const leaflets = 132;
  for (let i = 0; i < leaflets; i++) {
    const t = i / (leaflets - 1);
    const px = 14 + t * (W - 30);
    if (t > 0.08 && t < 0.94 && Math.random() < 0.05) continue;

    // Short at the base, longest around a third of the way out, tapering to
    // a point at the tip.
    const env = Math.sin(Math.pow(t, 0.52) * Math.PI);
    const len = env * (H * 0.47) * (1 - 0.22 * t) + 5;
    const sweep = 0.40 + t * 0.62;           // they comb further back along the spine
    const wob = (Math.random() - 0.5) * 6;
    const wide = len * 0.055 * (0.75 + Math.random() * 0.5);

    for (const dir of [-1, 1]) {
      const L = len * (0.92 + Math.random() * 0.16);
      const tipX = px + L * sweep;
      const tipY = mid + dir * L + wob;
      const shade = 0.74 + 0.26 * Math.random();
      const g = x.createLinearGradient(px, mid, tipX, tipY);
      // Dark where it leaves the rachis, bleached at the tip, which is the
      // way round a leaf in full sun actually is.
      g.addColorStop(0,    ink(52, 84, 30, shade));
      g.addColorStop(0.45, ink(96, 142, 46, shade));
      g.addColorStop(0.85, ink(148, 190, 72, shade));
      g.addColorStop(1,    ink(186, 214, 104, shade));
      x.fillStyle = g;
      x.beginPath();
      x.moveTo(px - wide, mid);
      // Out along the leading edge, bowing away from the spine, and back
      // along the trailing edge, which sits closer in — so the leaflet is a
      // shallow crescent rather than a symmetrical spike.
      x.quadraticCurveTo(px + L * 0.30, mid + dir * L * 0.62, tipX, tipY);
      x.quadraticCurveTo(px + L * 0.18, mid + dir * L * 0.48, px + wide, mid);
      x.closePath();
      x.fill();
    }
  }
  // The rachis itself.
  const r = x.createLinearGradient(0, mid - 5, 0, mid + 5);
  r.addColorStop(0, "#5c7a2c"); r.addColorStop(0.5, "#9ab84e"); r.addColorStop(1, "#4d6626");
  x.fillStyle = r;
  x.beginPath();
  x.moveTo(8, mid - 5); x.lineTo(W - 12, mid - 1.2);
  x.lineTo(W - 12, mid + 1.2); x.lineTo(8, mid + 5);
  x.closePath(); x.fill();
  return c;
}

/** A single detached leaflet, for the ones in the air. */
function texLeaf() {
  const c = canvas(128, 64), x = c.getContext("2d"), W = c.width, H = c.height;
  x.clearRect(0, 0, W, H);
  const g = x.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#6f9235"); g.addColorStop(0.6, "#a9c95c"); g.addColorStop(1, "#d6e39a");
  x.fillStyle = g;
  x.beginPath();
  x.moveTo(2, H / 2);
  x.quadraticCurveTo(W * 0.4, 1, W - 3, H / 2);
  x.quadraticCurveTo(W * 0.4, H - 1, 2, H / 2);
  x.closePath(); x.fill();
  x.strokeStyle = "rgba(60,84,24,.5)"; x.lineWidth = 1;
  x.beginPath(); x.moveTo(3, H / 2); x.lineTo(W - 4, H / 2); x.stroke();
  return c;
}

/**
 * One broad leaf: an oval blade with a pale midrib and pale laterals combed
 * toward the tip.
 *
 * The planting in the street tubs was built out of spheres, and a sphere is
 * the one shape a plant never makes — it came out as a green lump with some
 * sticks in it. What a tub of planting actually reads as at ten metres is
 * two silhouettes side by side: something broad-leaved and something
 * feathery. The feathery half already exists as the palm frond, so this is
 * the other half.
 */
function texBroadLeaf() {
  const c = canvas(512, 384), x = c.getContext("2d"), W = c.width, H = c.height, mid = H / 2;
  x.clearRect(0, 0, W, H);
  const run = W - 14;
  // Widest at a third, drawn to a point at the tip.
  const halfAt = (t) => Math.sin(Math.pow(t, 0.62) * Math.PI) * (H * 0.46) * (1 - 0.12 * t) + 1;

  x.beginPath();
  x.moveTo(6, mid);
  for (let i = 0; i <= 44; i++) { const t = i / 44; x.lineTo(6 + t * run, mid - halfAt(t)); }
  for (let i = 44; i >= 0; i--) { const t = i / 44; x.lineTo(6 + t * run, mid + halfAt(t)); }
  x.closePath();
  const g = x.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#2d5122"); g.addColorStop(0.55, "#3f7a2e"); g.addColorStop(1, "#5d9d3e");
  x.fillStyle = g;
  x.fill();

  // The laterals, which are what stop it reading as a green petal.
  x.strokeStyle = "rgba(206,228,168,.5)";
  x.lineCap = "round";
  for (let i = 1; i < 13; i++) {
    const t = i / 13, h = halfAt(t);
    x.lineWidth = 2.4 - t * 1.4;
    for (const dir of [-1, 1]) {
      x.beginPath();
      x.moveTo(6 + t * run, mid);
      x.quadraticCurveTo(6 + (t + 0.05) * run, mid + dir * h * 0.5,
                         6 + (t + 0.11) * run, mid + dir * h * 0.88);
      x.stroke();
    }
  }
  x.strokeStyle = "rgba(224,240,190,.8)";
  x.lineWidth = 3.4;
  x.beginPath(); x.moveTo(8, mid); x.lineTo(W - 12, mid); x.stroke();
  return c;
}

/** Soft round falloff — used for dust motes and the sun's bloom seed. */
function texGlow() {
  const c = canvas(128, 128), x = c.getContext("2d"), S = c.width;
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.35, "rgba(255,252,240,.5)");
  g.addColorStop(1, "rgba(255,250,235,0)");
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  return c;
}

/**
 * A storefront's sign band: the house colourway, its name, its count, and the
 * same corner brackets the tiles on the store wear.
 */
function texSign(brand) {
  const c = canvas(1024, 256), x = c.getContext("2d"), W = c.width, H = c.height;
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, brand.bg[0]); g.addColorStop(1, brand.bg[1]);
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  if (brand.slug === "off-white") {
    x.save(); x.translate(W / 2, H / 2); x.rotate(-Math.PI / 4); x.translate(-W, -H);
    x.fillStyle = "#111";
    for (let i = 0; i < 60; i++) if (i % 2 === 0) x.fillRect(0, i * (H / 10), W * 2, H / 20);
    x.restore();
    x.fillStyle = "rgba(243,243,241,.85)";
    x.fillRect(0, H * 0.24, W, H * 0.52);
  }

  x.fillStyle = brand.ink;
  x.textAlign = "center";
  x.textBaseline = "middle";

  const face = getComputedStyle(document.body).fontFamily;
  const label = brand.name.toUpperCase();

  // Name in type first, so the sign is legible from the moment it is built.
  // A house with real artwork paints over this once the file arrives; doing it
  // the other way round would leave blank boards for a second on a slow line.
  let size = Math.round(H * 0.42);
  do { x.font = `700 ${size}px ${face}`; size -= 2; }
  while (x.measureText(label).width > W * 0.7 && size > 16);
  x.fillText(label, W / 2, H * 0.5);


  const m = H * 0.12, L = H * 0.16;
  x.strokeStyle = brand.ink; x.globalAlpha = 0.45; x.lineWidth = Math.max(2, H * 0.016);
  for (const [cx, cy, dx, dy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    x.beginPath();
    x.moveTo(cx, cy + dy * L); x.lineTo(cx, cy); x.lineTo(cx + dx * L, cy);
    x.stroke();
  }
  return c;
}

/**
 * Swaps a sign's typed name for the house's own artwork once it loads.
 *
 * Kept asynchronous and optional on purpose: the scene is built and running
 * before any of these arrive, and a house with no file, or a file that fails,
 * simply keeps the name it already has. The texture is only marked dirty on
 * success, so a broken load costs nothing but the request.
 */
function dressSign(canvasEl, texture, brand) {
  const src = logoFor(brand.slug);
  if (!src) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    const x = canvasEl.getContext("2d"), W = canvasEl.width, H = canvasEl.height;
    // Repaint the ground, then the artwork over it.
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, brand.bg[0]); g.addColorStop(1, brand.bg[1]);
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    const maxW = W * 0.66, maxH = H * 0.64;
    const k = Math.min(maxW / img.width, maxH / img.height);
    const w = img.width * k, h = img.height * k;
    x.drawImage(img, (W - w) / 2, H * 0.5 - h / 2, w, h);


    const m = H * 0.12, L = H * 0.16;
    x.strokeStyle = brand.ink; x.globalAlpha = 0.45; x.lineWidth = Math.max(2, H * 0.016);
    for (const [cx, cy, dx, dy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
      x.beginPath();
      x.moveTo(cx, cy + dy * L); x.lineTo(cx, cy); x.lineTo(cx + dx * L, cy);
      x.stroke();
    }
    texture.needsUpdate = true;
  };
  img.src = src;
}

/**
 * A perforated screen: the punched and woven metal that hangs in front of so
 * many facades in a district like this one. Two patterns, because one repeated
 * fifteen times is wallpaper.
 */
function texScreen(kind) {
  const c = canvas(512, 512), x = c.getContext("2d"), S = c.width;
  x.clearRect(0, 0, S, S);
  x.fillStyle = "#ffffff";
  x.fillRect(0, 0, S, S);
  x.globalCompositeOperation = "destination-out";

  if (kind === "dots") {
    const n = 11, step = S / n;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const off = (j % 2) * step * 0.5;
        x.beginPath();
        x.arc(i * step + step / 2 + off, j * step + step / 2, step * 0.34, 0, 7);
        x.fill();
      }
    }
  } else if (kind === "weave") {
    x.lineWidth = S * 0.055;
    x.lineCap = "butt";
    for (let i = -S; i < S * 2; i += S / 7) {
      x.beginPath(); x.moveTo(i, 0); x.lineTo(i + S, S); x.stroke();
      x.beginPath(); x.moveTo(i + S, 0); x.lineTo(i, S); x.stroke();
    }
  } else {   // fins: tall slots
    const n = 9, step = S / n;
    for (let i = 0; i < n; i++) x.fillRect(i * step + step * 0.28, 0, step * 0.44, S);
  }

  x.globalCompositeOperation = "source-over";
  return c;
}

/**
 * Architectural concrete, not stucco.
 *
 * The buildings were a warm cream washed toward each house's colour, which
 * read as painted render — closer to a seaside parade than to the poured
 * in-situ work the street is meant to be made of. Real fair-faced concrete is
 * a cool grey that drifts blue in shade and yellow in sun, and what sells it
 * is the evidence of how it was made: the horizontal seams where one lift of
 * formwork met the next, the grid of tie holes, fine aggregate speckle and
 * the streaks weather leaves down a facade.
 */
function texConcrete() {
  const c = canvas(768, 768), x = c.getContext("2d"), S = c.width;
  x.fillStyle = "#b9b7b0"; x.fillRect(0, 0, S, S);

  // Broad tonal drift, pour to pour.
  for (let i = 0; i < 700; i++) {
    x.globalAlpha = 0.018 + Math.random() * 0.03;
    x.fillStyle = Math.random() > 0.5 ? "#d5d3cc" : "#98968f";
    const r = 30 + Math.random() * 190;
    x.beginPath(); x.ellipse(Math.random() * S, Math.random() * S, r, r * 0.55, Math.random() * 3, 0, 7); x.fill();
  }

  // Board marks: the lift lines, every course.
  const lifts = 6;
  for (let i = 1; i < lifts; i++) {
    const y = (i / lifts) * S;
    x.globalAlpha = 0.3;
    x.fillStyle = "#8d8b84"; x.fillRect(0, y, S, 1.6);
    x.globalAlpha = 0.22;
    x.fillStyle = "#dedbd3"; x.fillRect(0, y + 1.6, S, 1.2);

    // Tie holes, plugged, two per lift.
    for (let k = 0; k < 6; k++) {
      const hx = (k + 0.5) * (S / 6) + (Math.random() - 0.5) * 12;
      const hy = y + S / lifts * 0.5;
      x.globalAlpha = 0.5;
      x.fillStyle = "#8a8880";
      x.beginPath(); x.arc(hx, hy, S * 0.006, 0, 7); x.fill();
      x.globalAlpha = 0.22;
      x.fillStyle = "#cfccc4";
      x.beginPath(); x.arc(hx - S * 0.002, hy - S * 0.002, S * 0.004, 0, 7); x.fill();
    }
  }

  // Weather streaks, top down.
  x.globalAlpha = 1;
  for (let i = 0; i < 90; i++) {
    const px = Math.random() * S;
    const g = x.createLinearGradient(0, 0, 0, S);
    g.addColorStop(0, "rgba(120,118,111,0.16)");
    g.addColorStop(0.5, "rgba(120,118,111,0.05)");
    g.addColorStop(1, "rgba(120,118,111,0)");
    x.fillStyle = g;
    x.fillRect(px, 0, 2 + Math.random() * 9, S);
  }

  // Aggregate.
  const img = x.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 22;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(img, 0, 0);
  return c;
}

/**
 * What you see through a shopfront: a warm lit room, rails and forms reduced
 * to soft blocks. It is always read behind tinted glass at a glancing angle,
 * so anything more literal is wasted.
 */
/**
 * The soft dark that collects where a floor meets a wall.
 *
 * Three point lights in an empty box give a room with no corners: every
 * surface is evenly lit and the floor and walls read as one folded sheet.
 * This is laid over the floor as a decal — clear in the middle, shaded at
 * the edges — and does more to seat the fixtures on the ground than another
 * light would. Greyscale, because `alphaMap` samples the green channel.
 */
function texRoomAO() {
  const c = canvas(256, 256), x = c.getContext("2d"), S = c.width;
  x.fillStyle = "#000"; x.fillRect(0, 0, S, S);
  const g = x.createRadialGradient(S / 2, S / 2, S * 0.10, S / 2, S / 2, S * 0.64);
  g.addColorStop(0, "#000");
  g.addColorStop(0.68, "#0d0d0d");
  g.addColorStop(1, "#8f8f8f");
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  return c;
}

function texInterior() {
  const c = canvas(512, 256), x = c.getContext("2d"), W = c.width, H = c.height;
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#fff6e4"); g.addColorStop(0.55, "#e8dcc6"); g.addColorStop(1, "#b9ac95");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // Rails and hanging stock.
  for (let i = 0; i < 26; i++) {
    const px = Math.random() * W, w = 6 + Math.random() * 16, h = H * (0.2 + Math.random() * 0.4);
    x.globalAlpha = 0.18 + Math.random() * 0.3;
    x.fillStyle = ["#6a6257", "#3c3831", "#8d7f6b", "#2b2925"][Math.floor(Math.random() * 4)];
    x.fillRect(px, H * 0.32, w, h);
  }
  // Ceiling spots.
  x.globalAlpha = 0.5;
  for (let i = 0; i < 7; i++) {
    const px = (i + 0.5) * (W / 7);
    const r = x.createRadialGradient(px, 0, 0, px, 0, H * 0.7);
    r.addColorStop(0, "rgba(255,246,222,.95)"); r.addColorStop(1, "rgba(255,246,222,0)");
    x.fillStyle = r; x.fillRect(px - H * 0.7, 0, H * 1.4, H);
  }
  x.globalAlpha = 1;
  return c;
}

// ## 09  BOOT — renderer, scene, camera

const canvasEl = document.getElementById("stage");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas: canvasEl,
    antialias: !QUALITY.light,
    powerPreference: "high-performance",
    stencil: false,
  });
} catch (err) {
  document.getElementById("fallback").dataset.on = "1";
  document.getElementById("boot").dataset.done = "1";
  throw err;
}

/**
 * The canvas box, which is not the window.
 *
 * Everything that turns a 3D point into a screen position — the projection
 * aspect, the waypoint markers, the pointer — has to measure against the
 * canvas, not `innerHeight`. They agreed while the canvas was sized in
 * pixels off the window; they stop agreeing the moment the canvas is sized
 * in `lvh` and the address bar is showing.
 */
let viewW = canvasEl.clientWidth || innerWidth;
let viewH = canvasEl.clientHeight || innerHeight;

renderer.setPixelRatio(Math.min(devicePixelRatio, QUALITY.dpr));
renderer.setSize(viewW, viewH, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(C.fog.getHex(), C.fogDensity);

const camera = new THREE.PerspectiveCamera(46, viewW / viewH, 0.25, 900);
camera.position.set(0, 3.2, 30);

// ## 10  SKY — gradient, sun, clouds, environment
// A shader on the inside of a very large sphere. The same function that paints
// it is duplicated in the water shader so the pool reflects a sky that
// genuinely matches the one overhead.

const SKY_GLSL = /* glsl */`
  /* The cloud deck is the one thing in this shader that costs real time:
   * measured on a desktop at 1009x768, the sky sphere went from lost in the
   * noise to 2.96ms a frame once it started taking a second and a third
   * sample. The second one earns it -- it is what gives a cloud a shaded
   * underside. The third, the high veil, is a flourish, so a phone does not
   * pay for it. Both this shader and the water's share the flag. */
  ${QUALITY.light ? "" : "#define SKY_HQ 1"}
  float hash31(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123); }
  float vnoise(vec3 x){
    vec3 i = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash31(i + vec3(0,0,0)), hash31(i + vec3(1,0,0)), f.x),
          mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
      mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x),
          mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
  float fbm(vec3 p){
    float a = 0.5, s = 0.0;
    for (int i = 0; i < 5; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
    return s;
  }
  /* Three octaves rather than five.
   *
   * The two extra samples the cloud deck now takes are asking a coarse
   * question — "is there more cloud over there than here" — and the detail
   * octaves cannot change that answer, only the cost of it. */
  float fbm3(vec3 p){
    float a = 0.5, s = 0.0;
    for (int i = 0; i < 3; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
    return s;
  }
  /** A sparse field of them, only in the cells the hash picks out. */
  float starField(vec3 d){
    vec3 p = d * 190.0;
    vec3 i = floor(p);
    float h = hash31(i);
    if (h < 0.9955) return 0.0;
    vec3 f = fract(p) - 0.5;
    return smoothstep(0.34, 0.0, length(f)) * (0.35 + fract(h * 91.7) * 0.65);
  }

  vec3 skyColor(vec3 d, vec3 sunDir, vec3 zenith, vec3 horizon, vec3 under, float t){
    d = normalize(d);
    float up = clamp(d.y, -1.0, 1.0);
    vec3 col = mix(horizon, zenith, pow(clamp(up, 0.0, 1.0), 0.34));
    col = mix(under, col, smoothstep(-0.20, 0.03, up));

    float sd = max(dot(d, sunDir), 0.0);
    col += vec3(1.0, 0.95, 0.84) * pow(sd, 1400.0) * 6.0;   // disc
    col += vec3(1.0, 0.88, 0.68) * pow(sd, 22.0) * 0.30;    // aureole
    col += vec3(1.0, 0.92, 0.80) * pow(sd, 3.0) * 0.06;     // wide haze

    if (up > 0.001) {
      /* Project onto a plane so the deck takes on perspective.
       *
       * The floor under that divide used to be 0.075, which let the
       * projection stretch to thirteen times its size at the skyline. Two
       * things went wrong with that. Overhead the whole hemisphere landed
       * inside one lobe of the noise, so the zenith was a single soft blob;
       * at the skyline the field was stretched so far that neighbouring
       * pixels sampled unrelated parts of it, which averages to grey mush.
       * All of the weather ended up in a smeared band and none of it had an
       * edge. Clamping the stretch and opening the field up by the same
       * factor puts cloud across the whole sky and keeps a puff a puff. */
      vec3 cp = d / max(up, 0.22);
      cp.xz += vec3(t * 0.0018, 0.0, t * 0.0010).xz;
      vec3 q = cp * 1.35;
      float f = fbm(q);

      /* Cumulus, not haze.
       *
       * This was one noise field faded from 0.46 to 0.82 and tinted between
       * two pale greys. A band that wide has no edge anywhere in it, so the
       * sky came out smeared rather than populated -- weather-as-a-gradient.
       * What makes a fair-weather cumulus legible is two things the old one
       * had neither of: it stops somewhere, and it is lit from above.
       *
       * The edge is a narrow band. The lighting is a second sample taken one
       * step toward the sun: where there is more cloud between this point and
       * the sun than there is here, this point is underneath something and
       * goes blue-grey. That single comparison is the whole difference
       * between a white blob and a cloud with a bottom to it.
       */
      float cover = smoothstep(0.50, 0.65, f) * smoothstep(0.0, 0.07, up);
      /* The 1.107 is not a taste knob.
       *
       * Five octaves sum to 0.969 of the noise and three sum to 0.875, so
       * subtracting one from the other leaves a constant bias of about
       * -0.047 whatever the sky is doing -- which tilted every pixel toward
       * "lit" and flattened the shading back out again. Scaling the short
       * sum onto the long one is what makes the difference mean what it
       * says: more cloud toward the sun than here, or less. */
      float depth = fbm3(q + sunDir * 0.7) * 1.107 - f;
      float shade = clamp(0.62 - depth * 2.6, 0.0, 1.0);

      /* Lit by the same sun as everything below them.
       *
       * The old pair of greys were fixed, so at six in the evening the sky
       * behind them went orange and the clouds stayed the white they are at
       * noon, which reads as a photograph of one sky pasted over another.
       * Both ends of the ramp now swing warm as the sun drops. */
      float low = 1.0 - smoothstep(0.02, 0.34, sunDir.y);
      vec3 lit  = mix(vec3(1.00, 0.99, 0.96), vec3(1.00, 0.78, 0.58), low * 0.88);
      vec3 base = mix(vec3(0.46, 0.52, 0.64), vec3(0.44, 0.35, 0.44), low * 0.75);
      vec3 cloud = mix(base, lit, shade);

      /* The bright rim on a cloud that has the sun behind it. Strongest
       * where the deck is thinning out, which is exactly where the cover is
       * midway between nothing and solid. */
      float edge = cover * (1.0 - cover) * 4.0;
      cloud += lit * pow(max(dot(d, sunDir), 0.0), 5.0) * edge * 0.55;

      // And after dark they are not white any more -- they are the darkest
      // thing in the sky, because they are what is blocking the stars.
      float day = smoothstep(-0.16, 0.08, sunDir.y);
      cloud = mix(cloud * vec3(0.10, 0.12, 0.19), cloud, day);

      col = mix(col, cloud, cover);

      #ifdef SKY_HQ
      /* A thinner, much higher layer, stretched along x so it comes out in
       * streaks instead of puffs. Cumulus alone gives a sky with exactly one
       * kind of weather in it; the wisps above the deck are what stops the
       * whole thing reading as a single repeating field. */
      float veil = smoothstep(0.54, 0.80, fbm3(vec3(cp.x * 0.42 + t * 0.0022, 11.0, cp.z * 1.60)))
                 * smoothstep(0.0, 0.24, up) * 0.34;
      col = mix(col, mix(lit * vec3(0.12, 0.14, 0.22), lit, day), veil * (1.0 - cover));
      #endif
    }
    return col;
  }

  /** The same sky, plus stars — only the dome draws these, not the water. */
  vec3 skyWithStars(vec3 d, vec3 sunDir, vec3 zenith, vec3 horizon, vec3 under, float t, float night){
    vec3 col = skyColor(d, sunDir, zenith, horizon, under, t);
    if (night > 0.01) {
      vec3 n = normalize(d);
      float up = smoothstep(-0.02, 0.22, n.y);
      col += vec3(0.85, 0.9, 1.0) * starField(n) * night * up;
    }
    return col;
  }
`;

const skyUniforms = {
  uSun:     { value: C.sun.clone() },
  uZenith:  { value: C.zenith.clone() },
  uHorizon: { value: C.horizon.clone() },
  uUnder:   { value: C.underside.clone() },
  uTime:    { value: 0 },
  uNight:   { value: 0 },
};

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: skyUniforms,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vDir;
      uniform vec3 uSun, uZenith, uHorizon, uUnder;
      uniform float uTime, uNight;
      ${SKY_GLSL}
      void main(){
        gl_FragColor = vec4(skyWithStars(vDir, uSun, uZenith, uHorizon, uUnder, uTime, uNight), 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  })
);
sky.renderOrder = -1;
scene.add(sky);

// Light the physical materials off that same sky rather than a studio probe.
// Kept, not disposed: the environment is regenerated whenever the time of
// day moves, and a clone of the sky shares its material, so the probe
// re-renders with whatever colours the clock has just set.
const pmrem = new THREE.PMREMGenerator(renderer);
const skyProbe = new THREE.Scene();
skyProbe.add(sky.clone());
function refreshEnvironment() {
  const old = scene.environment;
  scene.environment = pmrem.fromScene(skyProbe).texture;
  if (old) old.dispose();
}
refreshEnvironment();
