     * problems, and waiting a minute in the dark to tell them apart is no
     * way to work. `DD.sound.pass()` from the console.
     */
    pass() {
      if (!ambCalls) return "no ambience yet";
      ambCalls.passBy(true);
      return "on its way";
    },

    /** The clock's night value, 0 by day and 1 in the dark. */
    setNight(v) {
      nightLevel = clamp(v, 0, 1);
      applyNight();
      stats.night = +nightLevel.toFixed(2);
    },

    /** Sets or reads the rattle level, for tuning it against your own ears. */
    rattle(v) {
      if (!rattleGain) return null;
      if (v != null) rattleGain.gain.setTargetAtTime(v, ctx.currentTime, 0.05);
      return +rattleGain.gain.value.toFixed(4);
    },

    async spectrum(ms = 2500, where = "out") {
      const tap = where === "in" ? musicGain : (where === "amb" ? ambGain : sysOut);
      if (!ctx || !tap) return null;
      const an = ctx.createAnalyser();
      an.fftSize = 4096;
      an.smoothingTimeConstant = 0.6;
      tap.connect(an);
      const bins = new Float32Array(an.frequencyBinCount);
      const hzPer = ctx.sampleRate / an.fftSize;
      const BANDS = [[20, 120], [120, 400], [400, 1200], [1200, 4000], [4000, 14000]];
      const acc = BANDS.map(() => ({ sum: 0, n: 0 }));
      const until = performance.now() + ms;
      while (performance.now() < until) {
        an.getFloatFrequencyData(bins);
        for (let i = 1; i < bins.length; i++) {
          const hz = i * hzPer;
          const v = Math.pow(10, bins[i] / 20);
          for (let b = 0; b < BANDS.length; b++) {
            if (hz >= BANDS[b][0] && hz < BANDS[b][1]) { acc[b].sum += v * v; acc[b].n++; }
          }
        }
        await new Promise((r) => setTimeout(r, 40));
      }
      tap.disconnect(an);
      return BANDS.map((b, i) => ({
        band: `${b[0]}-${b[1]}`,
        db: +(20 * Math.log10(Math.sqrt(acc[i].sum / Math.max(acc[i].n, 1)) + 1e-12)).toFixed(1),
      }));
    },

    async meter(ms = 2500, where = "in") {
      const tap = where === "out" ? sysOut : musicGain;
      if (!ctx || !tap) return null;
      const an = ctx.createAnalyser();
      an.fftSize = 2048;
      tap.connect(an);
      const buf = new Float32Array(an.fftSize);
      let peak = 0, sum = 0, n = 0;
      const until = performance.now() + ms;
      while (performance.now() < until) {
        an.getFloatTimeDomainData(buf);
        for (let i = 0; i < buf.length; i++) {
          const v = Math.abs(buf[i]);
          if (v > peak) peak = v;
          sum += v * v; n++;
        }
        await new Promise((r) => setTimeout(r, 25));
      }
      tap.disconnect(an);
      return { peak: +peak.toFixed(4), rms: +Math.sqrt(sum / Math.max(n, 1)).toFixed(4) };
    },

    /**
     * Cues a specific record, by name or by index. For the console: there
     * are thirty of these now across six styles, and waiting for the
     * shuffle to reach the one you are working on is not a workflow.
     */
    play(which) {
      const i = typeof which === "number"
        ? which
        : SONGS.findIndex((x) => x.n.toLowerCase() === String(which).toLowerCase());
      if (i < 0 || i >= SONGS.length) return SONGS.map((x) => `${x.n} (${x.feel} ${x.bpm})`);
      songIdx = i;
      song = SONGS[i];
      barsLeft = Math.round(180 / (4 * 60 / song.bpm));
      barNo = 0;
      nextBarAt = ctx.currentTime + 0.08;
      stats.song = song.n;
      stats.songBpm = song.bpm;
      stats.feel = song.feel;
      return song.n;
    },

    suspend() {
      parked = true;
      if (ctx && ctx.state === "running") ctx.suspend();
      dropSession();
    },
    resume() {
      parked = false;
      if (!ctx || !on || ctx.state === "running") return;
      claimPlayback();
      holdSession();
      const q = ctx.resume();
      if (q && q.catch) q.catch(() => {});
    },
  };
})();

/**
 * Sound comes up with the page, and if the browser refuses, with the first
 * thing the visitor does instead.
 *
 * Autoplay is not something a page gets to decide. Chrome allows it once an
 * origin has earned enough engagement, Safari almost never does, and a
 * first-time visitor will usually get silence until they touch something.
 * So: ask on load, and if the context comes back suspended, arm the same
 * gesture listeners as before. Either way the graph is already built and
 * the loop already rendered, so whenever permission arrives it is instant.
 */
{
  const btn = document.getElementById("sound");
  let armed = false;

  /* Whether they wanted sound, remembered.
   *
   * Every visit started on "Tap for sound" regardless of what had been
   * chosen last time — including for somebody who had deliberately muted
   * it, who got asked again on every single page load.
   *
   * Only an explicit press is recorded. Autoplay being refused is not a
   * preference, and writing it down as one would mute the returning visitor
   * who had in fact asked for sound.
   */
  const PREF = "dd.sound";
  const wanted = () => { try { return localStorage.getItem(PREF); } catch { return null; } };
  const remember = (v) => { try { localStorage.setItem(PREF, v); } catch { /* private mode */ } };

  /** Three states: asking to be used, on, or muted. */
  window.__paintSound = () => paint();

  function paint() {
    const playing = sound.on && !sound.blocked;
    const state = playing ? "on" : (sound.on ? "prompt" : "off");
    btn.dataset.state = state;
    btn.setAttribute("aria-pressed", playing ? "true" : "false");
    // The visible words have to appear in the accessible name, or voice
    // control cannot act on what it can read: "click Sound on" matched
    // nothing at all when the name was "Turn sound off".
    btn.setAttribute("aria-label",
      state === "prompt" ? "Tap for sound"
      : playing ? "Sound on — press M to turn it off"
      : "Sound off — press M to turn it on");
    btn.querySelector(".lbl").textContent =
      state === "prompt" ? "Tap for sound" : (playing ? "Sound on" : "Sound off");
  }

  // Every event the platforms count as an activation. pointerdown covers
  // most of it, but older iOS wants touchstart and some browsers only
  // credit the click or the keyup — and missing the first one means waiting
  // for a second interaction that may never come.
  const GESTURES = ["pointerdown", "pointerup", "touchstart", "touchend",
                    "click", "keydown", "keyup"];

  const begin = () => {
    if (!armed) return;
    armed = false;
    for (const ev of GESTURES) window.removeEventListener(ev, begin);
    sound.enable();
    setTimeout(paint, 60);
  };

  const arm = () => {
    if (armed) return;
    armed = true;
    for (const ev of GESTURES) window.addEventListener(ev, begin, { passive: true });
  };

  /**
   * The one failure the page has no way of seeing.
   *
   * With the playback session claimed the ring/silent switch should no
   * longer matter, but on an iPhone too old for `navigator.audioSession`
   * it still can, and there is no API that reports the position of a
   * physical slider. So if this is an Apple device and everything on our
   * side says it should be audible, say the only useful thing once.
   */
  let toldAboutSwitch = false;
  function switchHint() {
    if (toldAboutSwitch || !sound.apple) return;
    setTimeout(() => {
      if (!sound.on || sound.blocked) return;
      toldAboutSwitch = true;
      const lbl = btn.querySelector(".lbl");
      lbl.textContent = "Check the side switch";
      btn.dataset.state = "prompt";
      setTimeout(() => { paint(); }, 4200);
    }, 1100);
  }

  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    // A press here is unambiguous consent, so it both starts a blocked
    // context and mutes a running one.
    if (sound.blocked || !sound.on) { sound.enable(); switchHint(); remember("on"); }
    else { sound.toggle(); remember("off"); }
    setTimeout(paint, 60);
  });

  // The catch is not defensive tidiness. `boot` is async and nothing was
// reading its rejection, so a single thrown line anywhere inside the graph
// builder — a stale variable name, in the case that prompted this — took
// the entire soundtrack out with no console entry and no visible symptom
// beyond a button that says it is on. Whatever else happens, it says so.
sound.boot()
  .then(async (playing) => {
    // Somebody who muted it last time is not asked again.
    if (wanted() === "off") { if (sound.on) await sound.toggle(); }
    else if (!playing) arm();
    paint();
  })
  .catch((e) => { console.error("sound failed to start", e); arm(); paint(); });

  // Coming back to the tab is another chance: a browser that refused on a
  // cold load will often allow it once the page has been foregrounded.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && sound.blocked) { sound.enable(); arm(); setTimeout(paint, 60); }
  });

  // Bare `m`, so it is guarded: not while a modifier is down (that is a
  // browser shortcut), not while the user is typing into something, and not
  // mid-composition.
  addEventListener("keydown", (e) => {
    if (e.key !== "m" && e.key !== "M") return;
    if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;

    if (t && t !== document.body && t.closest && t.closest("input, textarea, [contenteditable]")) return;

    remember(sound.on ? "on" : "off");
    setTimeout(paint, 60);
  });
}

// ## 26  TIME OF DAY — the scene follows the visitor's clock
//
// Opening this at eleven at night and getting a blazing noon is the single
// thing that most gives away a rendered scene as a rendered scene. So the
// plaza runs on the visitor's own clock: the sun rises and sets where and
// when it should, and everything that depends on it follows.
//
// Not just the sun's direction, and that is the point. Changing only the
// light angle gives you a daylit scene with long shadows, which reads as
// late afternoon whatever the hour. What actually makes night look like
// night is the whole chain moving together — sky gradient, fog colour and
// density, ambient fill, exposure, the environment probe the glass and
// concrete reflect, the shopfronts coming on from the inside, the signs
// lighting up, and stars appearing once the sun is properly down.
//
// The table below is keyframes on the hour hand. Everything between them is
// interpolated, so the transition through dawn and dusk is continuous
// rather than a set of four presets.

/* The `inn` column is half what it was after dark.
 *
 * Measured, because it was not obvious from looking at the street: eight
 * metres from a shopfront at half past ten, a 96-pixel patch at the centre
 * of the frame averaged 156 of 255. The same spot at one in the afternoon
 * averaged 22. Night was seven times brighter than noon.
 *
 * Turning the shopfront interiors off entirely took that 156 to 2.3, so
 * essentially every photon in the frame was coming from them; bloom was
 * responsible for a third of what was left. At 3.5 the emissive saturates
 * through the tone mapping and the picture desaturates with it — measured
 * mean saturation went from 0.33 at 3.54 to 0.44 at 1.8, which is the
 * milky cream wash over the whole street, the umbrellas, the paving and
 * the flowers.
 *
 * Halved, a lit shop at night still reads as the brightest thing in a dark
 * street, and everything around it keeps its colour.
 */
const TIMELINE = [
  // h    elev  sunCol    sunI  hemiSky   hemiGnd   hemiI  zenith    horizon   under     fog       fogD    exp   inner sign bloom night

// Declared above applyTimeOfDay, which writes to it and is called during
// module evaluation — a `let` below the call is in its temporal dead zone
// and throws. Third time this shape of bug has appeared in this file.
let currentHour = 12;

const _cA = new THREE.Color(), _cB = new THREE.Color();
const mixCol = (out, a, b, t) => out.copy(_cA.setHex(a)).lerp(_cB.setHex(b), t);
const mixNum = (a, b, t) => a + (b - a) * t;

/**
 * Places the scene at a given hour, 0 to 24.
 *
 * The azimuth runs east to west across the day so the shadows sweep the
 * right way round, and the elevation comes from the table rather than a
 * trigonometric model — a model would be accurate for a latitude we have
 * not been told, and what matters here is that it looks like the hour, not
 * that it is astronomically correct for Miami.
 */
function applyTimeOfDay(hour) {
  const h = ((hour % 24) + 24) % 24;
  let i = 0;
  while (i < TIMELINE.length - 2 && TIMELINE[i + 1].h <= h) i++;
  const a = TIMELINE[i], b = TIMELINE[i + 1];
  const t = clamp((h - a.h) / (b.h - a.h), 0, 1);
  const k = t * t * (3 - 2 * t);                    // ease, so dawn is not linear

  const el = mixNum(a.el, b.el, k) * Math.PI / 180;
  // Sunrise in the east, sunset in the west, tracking across the south.
  const az = ((h - 6) / 12) * Math.PI + Math.PI * 0.08;
  C.sun.set(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el)).normalize();

  mixCol(C.zenith, a.zen, b.zen, k);
  mixCol(C.horizon, a.hor, b.hor, k);
  mixCol(C.underside, a.und, b.und, k);
  mixCol(C.fog, a.fog, b.fog, k);
  C.fogDensity = mixNum(a.fd, b.fd, k);
  const night = mixNum(a.ni, b.ni, k);
  // The ambience runs on the same number the lighting does.
  sound.setNight(night);

  // --- sky and water read the same numbers -------------------------------
  skyUniforms.uSun.value.copy(C.sun);
  skyUniforms.uZenith.value.copy(C.zenith);
  skyUniforms.uHorizon.value.copy(C.horizon);
  skyUniforms.uUnder.value.copy(C.underside);
  skyUniforms.uNight.value = night;

  waterUniforms.uSun.value.copy(C.sun);
  waterUniforms.uZenith.value.copy(C.zenith);
  waterUniforms.uHorizon.value.copy(C.horizon);
  waterUniforms.uUnder.value.copy(C.underside);
  waterUniforms.uFogColor.value.copy(C.fog);
  waterUniforms.uFogDensity.value = C.fogDensity;
  // The pool goes black and reflective after dark rather than staying a
  // lit turquoise, which is what water actually does at night.
  waterUniforms.uDeep.value.copy(C.poolDeep).multiplyScalar(mixNum(1, 0.16, night));
  waterUniforms.uShallow.value.copy(C.poolShallow).multiplyScalar(mixNum(1, 0.22, night));

  // --- lights -------------------------------------------------------------
  sun.color.copy(mixCol(_cA.clone(), a.sc, b.sc, k));
  sun.intensity = mixNum(a.si, b.si, k);
  hemi.color.copy(mixCol(_cA.clone(), a.hs, b.hs, k));
  hemi.groundColor.copy(mixCol(_cA.clone(), a.hg, b.hg, k));
  hemi.intensity = mixNum(a.hi, b.hi, k);
  bounce.intensity = mixNum(0.45, 0.10, night);

  scene.fog.color.copy(C.fog);
  scene.fog.density = C.fogDensity;
  renderer.toneMappingExposure = mixNum(a.ex, b.ex, k);
  scene.environmentIntensity = mixNum(0.85, 0.35, night);

  // --- the street turns its own lights on ---------------------------------
  if (interiorMat) interiorMat.emissiveIntensity = mixNum(a.inn, b.inn, k);
  const signGlow = mixNum(a.sg, b.sg, k);
  for (const m of signMats) m.emissiveIntensity = signGlow;

  // The dome's own lighting. Uplighters come up as the sun goes down, and
  // the shell takes a faint emissive with them so it reads as lit from
  // within rather than merely illuminated.
  for (const l of fountain.lights) l.intensity = mixNum(0, 14, night);
  for (const l of streetLamps) l.intensity = mixNum(0, 16, night);
  // Well down from where this started. The strips were blowing out into
  // solid white bars — an emissive of 1.9 with bloom on top is far past what
  // a light fitting should read as, and it swamped the shopfronts they were
  // supposed to be lighting.
  if (canopyStripMat) canopyStripMat.emissiveIntensity = mixNum(0, 0.75, night);
  if (lampHeadMat) lampHeadMat.emissiveIntensity = mixNum(0, 1.5, night);
  if (endBandMat) endBandMat.emissiveIntensity = mixNum(0, 1.3, night);
  // The boards run their own ramp: they are never off, because an LED
  // hoarding is not off at two in the afternoon, it is merely losing.
  if (boards) boards.setNight(night);
  // Tinted glass swallows a lit interior. After dark it opens up, which is
  // also what a real shopfront does once the inside is brighter than the out.
  if (glassMat) {
    glassMat.opacity = mixNum(0.85, 0.42, night);
    if (QUALITY.transmission) glassMat.transmission = mixNum(0.55, 0.9, night);
  }
  if (domeShellMat) domeShellMat.emissiveIntensity = mixNum(0, 0.34, night);
  if (domeRimMat) domeRimMat.emissiveIntensity = mixNum(0, 0.26, night);

  if (bloomPass) bloomPass.strength = mixNum(a.bl, b.bl, k);

  // The probe has to be re-rendered or every reflective surface keeps the
  // sky it was built under.
  refreshEnvironment();

  currentHour = h;
}


/** The visitor's own local hour, fractional. */
const localHour = () => {
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60;
};

applyTimeOfDay(localHour());
// Re-read every few minutes, so a tab left open through dusk follows it.
setInterval(() => applyTimeOfDay(localHour()), 4 * 60 * 1000);

//

// camera cuts to a room behind that shopfront, the house's own stock is on

//
// One room, re-dressed.
//

// the geometry to carry down a street you can only ever be inside one of.
// There is a single room instead, moved onto whichever monolith you walked
// into and given that building's own transform — so it lands inside the
// footprint, facing the street, with no arithmetic about which kerb it is on.
//
// What changes per house is real, though, not a tint. Five kinds of room —
// gallery, vault, atelier, bodega, works — each with its own fixtures, and
// each house's own colours on the walls, floor, trim and light. A Chrome

  kit("vault", (g) => {
    const metal = [], glass = [], glow = [];
    for (const sx of [-1, 1]) {
      // Ten centimetres lower than they were, which is what it takes to
      // clear the side walls' row of stock at 1.72.
      metal.push(box(2.9, 0.82, 1.15, sx * 3.7, 0.35, -6.4));
      metal.push(box(3.0, 0.07, 1.25, sx * 3.7, 0.80, -6.4));
      glass.push(box(2.9, 0.85, 1.15, sx * 3.7, 1.22, -6.4));
      glow.push(box(2.5, 0.04, 0.9, sx * 3.7, 1.62, -6.4));
    }
    for (let i = 0; i < 17; i++) {
      const x = -ROOM.w / 2 + 0.8 + i * ((ROOM.w - 1.6) / 16);
      metal.push(box(0.16, ROOM.h - 0.5, 0.16, x, (ROOM.h - 0.5) / 2, ROOM_BACK + 0.2));
    }
    glow.push(box(ROOM.w - 1.2, 0.05, 0.16, 0, 0.16, ROOM_BACK + 0.45));
    g.add(add(metal, matTrim, true), add(glass, matCase, false), add(glow, matGlow, false));
  });

  // Warm timber, a rug and freestanding rails.
  kit("atelier", (g) => {
    const wood = [], steel = [], glow = [];
    for (let i = 0; i < 16; i++) {
      wood.push(box(ROOM.w - 1.0, 0.13, 0.12, 0, 0.55 + i * ((ROOM.h - 1.2) / 15), ROOM_BACK + 0.2));
    }
    wood.push(box(ROOM.w * 0.56, 0.05, 4.4, 0, 0.04, midZ + 0.6));
    for (const sx of [-1, 1]) {
      // Two metres of hanging rail in the middle of the room is two metres
      // of hanging rail in front of both side walls. It stands by the door
      // instead, which is where a shop puts its new season anyway.
      const x = sx * 3.9, rz = -4.3;
      steel.push(tube(0.045, 2.05, x - 1.6, 1.02, rz, "y"));
      steel.push(tube(0.045, 2.05, x + 1.6, 1.02, rz, "y"));
      steel.push(tube(0.035, 3.2, x, 2.0, rz, "x"));
      for (let k = 0; k < 7; k++) {
        wood.push(box(0.5, 1.1, 0.13, x - 1.35 + k * 0.45, 1.35, rz));
      }
    }
    glow.push(box(ROOM.w - 2.4, 0.07, 0.3, 0, ROOM.h - 0.34, ROOM.front - 1.3));
    glow.push(box(ROOM.w - 2.4, 0.07, 0.3, 0, ROOM.h - 0.34, ROOM_BACK + 1.3));
    g.add(add(wood, matTrim, true), add(steel, matTrim, true), add(glow, matGlow, false));
  });

  // Colour-block walls, gridwall panels, a counter and strip light.
  kit("bodega", (g) => {
    const bars = [], glow = [], body = [];
    for (const sx of [-1, 1]) {
      for (let i = 0; i < 9; i++) {
        bars.push(box(0.1, 3.0, 0.07, sx * (ROOM.w / 2 - 0.16), 2.0, ROOM.front - 1.4 - i * 0.92));
      }
      for (let k = 0; k < 5; k++) {
        bars.push(box(0.07, 0.07, ROOM.d - 2.4, sx * (ROOM.w / 2 - 0.16), 0.9 + k * 0.55, midZ));
      }
    }
    // The counter used to stand at the door, three metres to one side of
    // where the camera comes in — which is to say off the edge of the
    // frame, leaving these three houses with a bare floor. It stands
    // further in, and a run of display tables goes down the middle, so
    // there is a shop between you and the wall rather than an empty bay.
    body.push(box(3.2, 1.0, 0.85, 4.1, 0.5, ROOM_BACK + 2.4));
    body.push(box(3.4, 0.09, 1.0, 4.1, 1.05, ROOM_BACK + 2.4));
    for (let i = 0; i < 2; i++) {
      const z = -6.6 - i * 2.9;
      body.push(box(2.3, 0.62, 1.25, -2.4 + i * 4.8, 0.31, z));
      bars.push(box(2.45, 0.07, 1.4, -2.4 + i * 4.8, 0.66, z));
      // Folded stock on top, in two stacks.
      for (const sx of [-0.55, 0.55]) {
        body.push(box(0.85, 0.26, 0.7, -2.4 + i * 4.8 + sx, 0.82, z));
      }
    }
    for (let i = 0; i < 3; i++) {
      glow.push(box(0.34, 0.09, ROOM.d - 2.0, -4.2 + i * 4.2, ROOM.h - 0.3, midZ));
    }
    g.add(add(bars, matTrim, true), add(body, matWall2, true), add(glow, matGlow, false));
  });

  // Raw: scaffold rails, painted floor markings, clamp lamps.
  kit("works", (g) => {
    const pipe = [], paint = [], glow = [];
    /* This kit was the one that broke the side bays.
     *
     * Two full-height uprights at z -5.6 and -10.6, two rails at eye
     * height running the whole length between them, and six boards at 1.6
     * — all of it standing in the middle of the room, which is exactly
     * where you have to look through to see a side wall. Godspeed's
     * trousers had a pipe down the middle of them.
     *
     * The uprights are by the door now, behind where the camera stands for
     * the back wall and in front of where it stands for the sides. The
     * rails run up at the ceiling where scaffold rails belong anyway. And
     * the boards sit low, under the 1.7 that the side rows start at.
     */
    for (const sx of [-1, 1]) {
      const x = sx * 4.3;
      pipe.push(tube(0.06, ROOM.h, x, ROOM.h / 2, -4.2, "y"));
      pipe.push(tube(0.06, ROOM.h, x, ROOM.h / 2, -3.4, "y"));
      pipe.push(tube(0.055, 8.4, x, 5.05, -8.1, "z"));
      pipe.push(tube(0.055, 8.4, x, 5.30, -8.1, "z"));
      for (let k = 0; k < 6; k++) {
        paint.push(box(0.46, 1.05, 0.12, x - sx * 0.3, 0.85, -6.2 - k * 0.8));
      }
      pipe.push(tube(0.05, 0.5, x, 4.5, -4.2, "y"));
      glow.push(box(0.3, 0.16, 0.3, x, 4.2, -4.2));
    }
    for (let i = 0; i < 4; i++) {
      paint.push(box(ROOM.w - 2.2, 0.02, 0.16, 0, 0.02, -4.6 - i * 2.4));
    }
    g.add(add(pipe, matTrim, true), add(paint, matWall2, true), add(glow, matGlow, false));
  });

  // ── the brand's mark, on the back wall ─────────────────────────────────
  // Not through `canvas()`.
  //
  // That helper multiplies every texture by the quality budget's texScale,
  // which on a phone is 0.6 — so the one piece of artwork rendered at three
  // metres across was being drawn into a 614-pixel canvas and then blown up.
  // It is a single texture for the whole street; it can afford to be sharp.
  const markCanvas = document.createElement("canvas");
  markCanvas.width = 1536; markCanvas.height = 384;
  const markTex = new THREE.CanvasTexture(markCanvas);
  markTex.colorSpace = THREE.SRGBColorSpace;
  markTex.anisotropy = 8;

  /**
   * Paints the house's sign onto the back wall.
   *
   * There is one canvas and fifteen shops, and the artwork arrives over the
   * network — so walking from one shop into another had the first house's
   * logo landing on the second house's wall a moment later, on top of the
   * name already painted there. Two marks, overlapping.
   *
   * A generation counter settles it: a load that finishes after the visitor
   * has moved on is dropped rather than drawn. The typed name goes down
   * first so the wall is never blank while the file is in flight, which is
   * the same order the shopfronts outside use.
   */
  let markGen = 0;
  function paintMark(b) {
    const gen = ++markGen;
    const x = markCanvas.getContext("2d");
    const W = markCanvas.width, H = markCanvas.height;

    const ground = () => {
      const g = x.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, b.bg[0]); g.addColorStop(1, b.bg[1]);
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    };

    x.clearRect(0, 0, W, H);
    x.drawImage(texSign(b), 0, 0, W, H);
    markTex.needsUpdate = true;

    const src = logoFor(b.slug);
    if (!src) return;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      if (gen !== markGen) return;        // another shop is open now
      ground();
      const k = Math.min(W * 0.62 / img.width, H * 0.66 / img.height);
      const w = img.width * k, h = img.height * k;
      x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      markTex.needsUpdate = true;
    };
    img.src = src;
  }
  const markMesh = new THREE.Mesh(
    // Narrower in portrait, where the room is seen through a 34-degree
    // wedge and a five-metre sign runs off both jambs.
    new THREE.PlaneGeometry(ROOM_PORTRAIT ? 3.9 : 5.2, ROOM_PORTRAIT ? 0.66 : 0.82),
    new THREE.MeshStandardMaterial({ map: markTex, roughness: 0.6 })
  );
  // Clear above the top row, and low enough to stay under the page header.
  // It sat across the stock, and every shop opened on its own name half
  // hidden behind a T-shirt — and then again above the section sign, which
  // it was hiding entirely, being a tenth of a metre in front of it.
  markMesh.position.set(0, 5.04, ROOM_BACK + 0.40);
  group.add(markMesh);

  // ── the stock on the walls ─────────────────────────────────────────────
  //
  // Sections, not a slideshow.
  //
  // Everything the house stocked used to hang on the back wall twelve at a
  // time, and scrolling the rail underneath turned them over — so reading
  // down a listing of fifty-two changed the artwork in the room four
  // times. Nobody would describe that as a feature.
  //
  // It is laid out like a shop now. Five bays: the back wall, which is
  // what you face walking in and carries the biggest category, and two on
  // each side. A category gets a bay, a sign with its own drawn icon and a
  // lit band on the floor in front of it, and keeps all three for as long
  // as you are in the shop. Scrolling changes nothing. Choosing a section
  // walks you to it.
  /* Recomputed, not fixed.
   *
   * All of this used to be decided once, at load. Rotate a phone and the
   * room kept the grid it was built with: three columns squeezed into a
   * thirty-four degree wedge, or two columns rattling around a landscape
   * wall. The camera adapted — `frameBay` has always run off a fresh
   * measurement — and the thing it was framing did not.
   */
  let PANEL = { w: 1.9, h: 1.8 };

  // Standing proud of the wall by 0.4, not flush with it.
  //
  // Every wall treatment here has depth — the vault's fluting reaches 0.28
  // off the plaster, the atelier's battens 0.26 — and a picture hung flush
  // is a picture behind them. Casablanca opened with its entire stock
  // filed away between timber slats. Hung forward they read as hung, and
  // it fixes all five rooms without special-casing any of them.
  const OFF = 0.40;
  const WALL_X = ROOM.w / 2 - 0.42;
  // Dropped twice now. The back wall has to carry two rows of stock, a
  // section sign and the house's own mark between the floor and a cove at
  // 5.41, and the sign is the piece that arrived last.
  let ROWS = [2.92, 1.20];
  // The shelf takes a third of a landscape window, so the back wall no
  // longer has the width for four across unless the window is genuinely
  // wide.
  let BACK_COLS = [-2.4, 2.4];
  /* One row on the side walls, at eye height, and one bay per wall.
   *
   * Both of those are the same lesson. A side bay is looked at from right
   * across the room — there is no other way to get far enough back from
   * four metres of wall — so anything standing in the middle of the room
   * is between you and the stock. Godspeed's scaffold pipes went straight
   * through its trousers.
   *
   * A single row starting at 1.7 clears every counter, plinth, vitrine and
   * table in all five kits, which is most of what was in the way. And one
   * bay per wall rather than two leaves a band of floor the fixtures can
   * stand in without crossing anybody's view of anything. What was left
   * after that was four pipes and a rack, and those moved.
   */
  const SIDE_ROWS = [2.62];
  let SIDE_COLS_V = [-1.06, 1.06];
  const SIDE_AT = -8.4;
  const SIGN_Y = 4.30;

  /**
   * The grid, for the viewport as it is now.
   *
   * Returns true when anything changed, so a window being dragged costs a
   * comparison and nothing else — only crossing a breakpoint rebuilds.
   */
  function metrics() {
    const narrow = roomNarrow();
    const wide = innerWidth >= 1240;
    const was = [PANEL.w, BACK_COLS.length, SIDE_COLS_V.length, BACK_COLS[0]].join();

    ROOM_PORTRAIT = narrow;
    PANEL = narrow ? { w: 1.86, h: 1.76 } : { w: 1.9, h: 1.8 };
    // The shelf takes a third of a landscape window, so the back wall has
    // the width for three across only when the window is genuinely wide.
    BACK_COLS = narrow ? [-2.05, 2.05] : wide ? [-3.5, 0, 3.5] : [-2.4, 2.4];
    SIDE_COLS_V = narrow ? [-1.06, 1.06] : [-2.12, 0, 2.12];

    return was !== [PANEL.w, BACK_COLS.length, SIDE_COLS_V.length, BACK_COLS[0]].join();
  }
  metrics();

  /* The icons.
   *
   * Drawn rather than typed. An emoji is a different typeface on every
   * platform and a font glyph is a licence, and neither of them is a
   * garment — these are eight shapes anyone reads at a glance from four
   * metres away, which is the whole job. The coordinates are in units of
   * half the icon box, so one set of numbers serves every size.
   */
  const ICON = {
    shirts(c, s) {
      c.beginPath();
      c.moveTo(-0.34*s, -0.70*s); c.lineTo(-0.92*s, -0.34*s);
      c.lineTo(-0.62*s,  0.08*s); c.lineTo(-0.50*s,  0.00*s);
      c.lineTo(-0.50*s,  0.86*s); c.lineTo( 0.50*s,  0.86*s);
      c.lineTo( 0.50*s,  0.00*s); c.lineTo( 0.62*s,  0.08*s);
      c.lineTo( 0.92*s, -0.34*s); c.lineTo( 0.34*s, -0.70*s);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-0.34*s, -0.70*s);
      c.quadraticCurveTo(0, -0.36*s, 0.34*s, -0.70*s);
      c.stroke();
    },
    hoodies(c, s) {
      ICON.shirts(c, s);
      c.beginPath();                                  // the hood
      c.moveTo(-0.34*s, -0.68*s);
      c.quadraticCurveTo(0, -1.12*s, 0.34*s, -0.68*s);
      c.stroke();
      c.beginPath();                                  // the pocket
      c.moveTo(-0.32*s, 0.40*s); c.lineTo(0.32*s, 0.40*s);
      c.lineTo(0.32*s, 0.70*s); c.lineTo(-0.32*s, 0.70*s);
      c.closePath(); c.stroke();
    },
    outerwear(c, s) {
      ICON.shirts(c, s);
      c.beginPath();                                  // the zip
      c.moveTo(0, -0.50*s); c.lineTo(0, 0.86*s); c.stroke();
      c.beginPath();                                  // lapels
      c.moveTo(-0.34*s, -0.66*s); c.lineTo(-0.06*s, -0.20*s);
      c.moveTo( 0.34*s, -0.66*s); c.lineTo( 0.06*s, -0.20*s);
      c.stroke();
    },
    bottoms(c, s) {
      c.beginPath();
      c.moveTo(-0.46*s, -0.86*s); c.lineTo(0.46*s, -0.86*s);
      c.lineTo(0.46*s, -0.60*s); c.lineTo(-0.46*s, -0.60*s);
      c.closePath(); c.stroke();
      c.beginPath();
      c.moveTo(-0.46*s, -0.60*s); c.lineTo(-0.40*s, 0.88*s);
      c.lineTo(-0.06*s, 0.88*s);  c.lineTo(-0.02*s, -0.04*s);
      c.lineTo( 0.02*s, -0.04*s); c.lineTo( 0.06*s, 0.88*s);
      c.lineTo( 0.40*s, 0.88*s);  c.lineTo( 0.46*s, -0.60*s);
      c.stroke();
    },
    denim(c, s) {
      ICON.bottoms(c, s);
      c.beginPath();                                  // a back pocket
      c.moveTo(-0.38*s, -0.46*s);
      c.quadraticCurveTo(-0.24*s, -0.24*s, -0.10*s, -0.46*s);
      c.stroke();
      c.beginPath();                                  // and a rivet
      c.arc(0.28*s, -0.44*s, 0.06*s, 0, Math.PI * 2); c.stroke();
    },
    accessories(c, s) {                               // a cap
      c.beginPath();
      c.moveTo(-0.62*s, 0.30*s);
      c.quadraticCurveTo(-0.62*s, -0.62*s, 0.14*s, -0.62*s);
      c.quadraticCurveTo(0.62*s, -0.62*s, 0.62*s, 0.30*s);
      c.closePath(); c.stroke();
      c.beginPath();                                  // the peak
      c.moveTo(0.62*s, 0.30*s);
      c.quadraticCurveTo(1.02*s, 0.36*s, 0.96*s, 0.62*s);
      c.lineTo(0.46*s, 0.62*s); c.stroke();
    },
    other(c, s) {                                     // a swing ticket
      c.beginPath();
      c.moveTo(-0.16*s, -0.74*s); c.lineTo(0.74*s, -0.74*s);
      c.lineTo(0.74*s, 0.16*s);   c.lineTo(-0.16*s, 0.16*s);
      c.lineTo(-0.80*s, -0.29*s); c.closePath(); c.stroke();
      c.beginPath();
      c.arc(-0.02*s, -0.29*s, 0.11*s, 0, Math.PI * 2); c.stroke();
    },
    all(c, s) {
      for (const [x, y] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
        c.beginPath();
        c.rect(x * 0.72*s - 0.30*s, y * 0.72*s - 0.30*s, 0.60*s, 0.60*s);
        c.stroke();
      }
    },
  };

  /**
   * Uppercase, spaced out, centred between two edges and shrunk to fit.
   *
   * Canvas has no tracking, so the letters go down one at a time — and no
   * wrapping either, so a long word runs off the end of its plate and out
   * of the world. "ACCESSORIES" did exactly that, straight through its own
   * icon and off the left edge of the sign.
   */
  function tracked(c, text, x0, x1, y, px, maxPx) {
    const chars = [...text.toUpperCase()];
    const room = x1 - x0;
    let size = maxPx, w = 0;
    for (;;) {
      c.font = `600 ${size}px "Helvetica Neue", Helvetica, Arial, sans-serif`;
      const sp = px * (size / maxPx);
      w = 0;
      for (const ch of chars) w += c.measureText(ch).width + sp;
      w -= sp;
      if (w <= room || size <= 18) { px = sp; break; }
      size -= 2;
    }
    let at = x0 + (room - w) / 2;
    for (const ch of chars) {
      c.fillText(ch, at, y);
      at += c.measureText(ch).width + px;
    }
  }

  /* The lit surface itself. Deliberately not tinted with the house: these
   * are photographs on white, and a white case is what makes them sit on
   * the wall instead of in a frame. */
  let signInk = "#111111", signPaper = "#ffffff";

  const caseMat = new THREE.MeshStandardMaterial({
    color: 0xf7f6f3, emissive: 0xffffff, emissiveIntensity: 0.30, roughness: 0.86,
  });

  const SIGN_W = 512, SIGN_H = 128;

  /**
   * One bay: a run of wall, a sign over it and a light on the floor.
   *
   * `at`, `normal` and `tangent` are the bay in room space — where its
   * wall is, which way it faces and which way it runs — and between them
   * the camera can be put in front of any bay without knowing which wall
   * it happens to be on.
   */
  function makeBay(kind, sx, zc) {
    const back = kind === "back";

    const canvas = document.createElement("canvas");
    canvas.width = SIGN_W; canvas.height = SIGN_H;
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8;
    const signMat = new THREE.MeshStandardMaterial({
      // Half lit, not fully. Three emissive surfaces within two metres of
      // the lens — the sign, the ring and the label — and the bloom took
      // the whole frame with them.
      map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.45,
      transparent: true, side: THREE.DoubleSide, roughness: 0.6,
    });
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 0.55), signMat);
    /* Flat on the wall, over its own section.
     *
     * These were blades first — standing off the wall facing the door, so
     * that walking in you read every section at once. Which they did, and
     * then the moment you were standing at one you were beside it rather
     * than in front of it, reading its back: mirrored, skewed and useless
     * exactly where it was needed. A sign belongs on the wall it is
     * naming. The lit band on the floor is what carries a section across
     * the room.
     */
    // Placed by `layBay`; only the facing is fixed for the life of the bay.
    if (!back) sign.rotation.y = sx > 0 ? -Math.PI / 2 : Math.PI / 2;
    group.add(sign);

    /* A light in a housing, not a stripe of paint.
     *
     * One emissive box on its own does not work in both directions: take
     * the house's colour and it vanishes into a wall of the same colour,
     * push it toward white and it vanishes into Off-White's floor. Sunk
     * into a dark surround it reads either way, because the surround is
     * what gives it an edge.
     */
    const glowMat = new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.5, roughness: 0.5,
    });
    return {
      kind, sx, zc, sign, signMat, glowMat, canvas, tex,
      disp: null, glow: null, slots: [], panels: [],
      half: 1, maxBack: back ? ROOM.d - 1.6 : ROOM.w - 2.6,
      at: new THREE.Vector3(),
      normal: new THREE.Vector3(),
      tangent: new THREE.Vector3(),
      cat: null, base: null,
    };
  }

  /** Takes a group out of the room and gives its geometry back. */
  function dropGroup(g) {
    if (!g) return;
    g.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    group.remove(g);
  }

  /**
   * Builds — or rebuilds — one bay's case, its light and its slots.
   *
   * Split out of `makeBay` so it can run again when the viewport changes.
   * The canvas, the texture and the two materials survive that; only boxes
   * are thrown away here, nothing that took a paint or a fetch.
   */
  function layBay(bay) {
    const back = bay.kind === "back";
    const sx = bay.sx, zc = bay.zc;
    const cols = back ? BACK_COLS : SIDE_COLS_V;
    const rows = back ? ROWS : SIDE_ROWS;

    bay.slots = [];
    for (const y of rows) {
      for (const c of cols) {
        if (back) bay.slots.push({ x: c, y, z: ROOM_BACK + OFF, ry: 0 });
        else bay.slots.push({ x: sx * WALL_X, y, z: zc + c, ry: sx > 0 ? -Math.PI / 2 : Math.PI / 2 });
      }
    }

    /* One lit case per section, not a row of separate screens.
     *
     * Each piece used to hang in its own framed box, which made a wall of
     * television sets: twelve hard rectangles with a garment cropped to
     * fill each one. A shop does the opposite — one lit surface with the
     * stock spaced out on it — and it happens that these photographs are
     * shot on white, so laid whole on a white lightbox they read as
     * garments on a wall rather than as pictures of garments.
     *
     * Which is also why the art is scaled to its own picture instead of
     * being cropped to a fixed box. Nothing is cut off and nothing has an
     * edge.
     */
    const spanX = (cols[cols.length - 1] - cols[0]) + PANEL.w;
    const spanY = (rows[0] - rows[rows.length - 1]) + PANEL.h;
    const midY = (rows[0] + rows[rows.length - 1]) / 2;
    const PAD = 0.20;
    const caseW = spanX + PAD * 2, caseH = spanY + PAD * 2;

    const surround = new THREE.Mesh(
      back ? new THREE.BoxGeometry(caseW + 0.26, caseH + 0.26, 0.16)
           : new THREE.BoxGeometry(0.16, caseH + 0.26, caseW + 0.26), matTrim);
    const lit = new THREE.Mesh(
      back ? new THREE.BoxGeometry(caseW, caseH, 0.06)
           : new THREE.BoxGeometry(0.06, caseH, caseW), caseMat);

    // The dividers, one between each pair, so the run still reads as slots.
    const splits = [];
    for (let i = 1; i < cols.length; i++) {
      const at = (cols[i] + cols[i - 1]) / 2;
      const d = new THREE.Mesh(
        back ? new THREE.BoxGeometry(0.05, caseH - 0.1, 0.07)
             : new THREE.BoxGeometry(0.07, caseH - 0.1, 0.05), matTrim);
      if (back) d.position.set(at, midY, ROOM_BACK + OFF - 0.02);
      else d.position.set(sx * (WALL_X + 0.02), midY, zc + at);
      splits.push(d);
    }

    if (back) {
      surround.position.set(0, midY, ROOM_BACK + OFF - 0.14);
      lit.position.set(0, midY, ROOM_BACK + OFF - 0.05);
    } else {
      surround.position.set(sx * (WALL_X + 0.14), midY, zc);
      lit.position.set(sx * (WALL_X + 0.05), midY, zc);
    }
    const disp = new THREE.Group();
    disp.add(surround, lit, ...splits);

    /* And the section light, on the plinth under it.
     *
     * A lit band laid on the floor in front of each bay is the obvious
     * place for it and it cannot be seen: the room has a shading plane
     * across its whole floor, and a strip fifteen millimetres above the
     * slab disappears into it whatever its brightness — six times the
     * emissive made no difference at all. Under the stock it reads
     * immediately, and it is where a shop would put it anyway.
     */
    const glow = new THREE.Group();
    const runL = caseW + 0.26;
    const housing = new THREE.Mesh(
      back ? new THREE.BoxGeometry(runL, 0.15, 0.13)
           : new THREE.BoxGeometry(0.13, 0.15, runL), matTrim);
    const strip = new THREE.Mesh(
      back ? new THREE.BoxGeometry(runL - 0.22, 0.09, 0.10)
           : new THREE.BoxGeometry(0.10, 0.09, runL - 0.22), bay.glowMat);
    if (back) strip.position.z = 0.07;
    else strip.position.x = -sx * 0.07;
    glow.add(housing, strip);
    glow.position.set(back ? 0 : sx * (ROOM.w / 2 - 0.09),
                      midY - caseH / 2 - 0.22,
                      back ? ROOM_BACK + 0.09 : zc);

    const wasLive = bay.disp ? bay.disp.visible : false;
    dropGroup(bay.disp);
    dropGroup(bay.glow);
    bay.disp = disp;
    bay.glow = glow;
    disp.visible = glow.visible = wasLive;
    group.add(disp, glow);

    bay.half = caseW / 2;
    bay.at.set(back ? 0 : sx * WALL_X, midY + 0.05, back ? ROOM_BACK : zc);
    bay.normal.set(back ? 0 : -sx, 0, back ? 1 : 0);
    bay.tangent.set(back ? 1 : 0, 0, back ? 0 : (sx > 0 ? 1 : -1));

    // The sign belongs to the case, so it moves when the case does.
    if (back) bay.sign.position.set(0, SIGN_Y, ROOM_BACK + OFF + 0.03);
    else bay.sign.position.set(sx * (WALL_X - 0.04), SIGN_Y - 0.26, zc);
  }

  const bays = [
    makeBay("back", 0, 0),
    makeBay("side", -1, SIDE_AT),
    makeBay("side",  1, SIDE_AT),
  ];
  for (const bay of bays) layBay(bay);

  /** Paints a bay's sign: icon, section name, and how many are in it. */
  function paintSign(bay, label, key, n, ink, paper) {
    const c = bay.canvas.getContext("2d");
    c.clearRect(0, 0, SIGN_W, SIGN_H);
    c.fillStyle = paper;
    c.fillRect(0, 0, SIGN_W, SIGN_H);
    c.strokeStyle = ink; c.fillStyle = ink;
    c.lineWidth = 3;
    c.strokeRect(6, 6, SIGN_W - 12, SIGN_H - 12);

    const draw = ICON[key] || ICON.other;
    c.save();
    c.translate(76, SIGN_H / 2);
    c.lineWidth = 7; c.lineJoin = "round"; c.lineCap = "round";
    draw(c, 42);
    c.restore();

    c.textBaseline = "middle";
    tracked(c, label, 136, SIGN_W - 62, SIGN_H / 2 - 2, 7, 46);

    c.font = '500 24px "Helvetica Neue", Helvetica, Arial, sans-serif';
    c.globalAlpha = 0.6;
    c.textAlign = "right";
    c.fillText(String(n), SIGN_W - 24, SIGN_H / 2 + 1);
    c.textAlign = "left";
    c.globalAlpha = 1;

    bay.tex.needsUpdate = true;
  }

  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin("anonymous");

  /**
   * Pictures, kept.
   *
   * The wall showed five grey rectangles at a time while the listing was
   * being scrolled, and that was the flicker: every page turn disposed all
   * twelve textures and re-fetched them, including the ones it was about to
   * put straight back. Scrolling a fifty-two piece house turned the whole
   * shop on and off.
   *
   * Textures are held by product id and reused, and the panel keeps the
   * picture it is showing until the next one has decoded — so a change is
   * a swap, never a gap. The cap is there because fifteen houses at two
   * hundred and thirty-six pieces is more than a phone should hold.
   */
  const texCache = new Map();
  const CACHE_MAX = QUALITY.light ? 48 : 96;

  /* Keyed by the picture, not by the product.
   *
   * This cached on `it.id`, which is the one thing about a product that
   * does not change when somebody replaces its photograph. Upload a new
   * image and the row gets a new `image_url` — the uploader names every
   * file with a fresh UUID — but the id is the same, so the cache answered
   * with the old texture and the wall kept showing last week's shirt
   * however many times the catalogue was refetched.
   */
  function texFor(it, cb) {
    const key = it.image;
    if (!key) { cb(null); return; }
    const hit = texCache.get(key);
    if (hit) { cb(hit); return; }
    loader.load(key, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      if (texCache.size >= CACHE_MAX) {
        const oldest = texCache.keys().next().value;
        texCache.get(oldest).dispose();
        texCache.delete(oldest);
      }
      texCache.set(key, tex);
      cb(tex);
    }, undefined, () => cb(null));
  }

  /** Forgets one picture, so the next ask goes back to the network. */
  function forgetTex(url) {
    const t = texCache.get(url);
    if (!t) return;
    t.dispose();
    texCache.delete(url);
  }

  // The ring that says a piece is under the pointer or open. One material
  // shared by every panel, recoloured with the house; the mesh behind each
  // frame is what gets shown and hidden.
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.55, side: THREE.DoubleSide,
  });

  const panels = [];

  /**
   * Builds the panel meshes for whatever slots the bays have right now.
   *
   * The array is emptied in place rather than replaced, because the room's
   * public `panels` is that same array and half the shop holds a reference
   * to it.
   */
  function layPanels() {
    for (const pn of panels) {
      pn.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      pn.mat.dispose();          // its map came from the cache; that stays
      group.remove(pn.group);
    }
    panels.length = 0;

    for (const bay of bays) {
      bay.panels.length = 0;
      for (const slot of bay.slots) {
      const g = new THREE.Group();
      g.position.set(slot.x, slot.y, slot.z);
      g.rotation.y = slot.ry;

      const ring = new THREE.Mesh(
        new THREE.PlaneGeometry(PANEL.w + 0.34, PANEL.h + 0.34), ringMat);
      ring.position.z = -0.075;
      ring.visible = false;
      g.add(ring);

      // Lit mostly by itself.
      //
      // A photograph of a garment hanging in a room lit by a warm gold lamp
      // comes out warm and gold, and every shop looked like it had a filter
      // over it. Feeding the same picture into the emissive channel makes
      // the panel a lightbox: the colours are the garment's own, with just
      // enough of the room's light left on it to keep it in the room.
      const mat = new THREE.MeshStandardMaterial({
        color: 0x5e5e5e, roughness: 0.9, metalness: 0,
        emissive: 0xffffff, emissiveIntensity: 0.82,
        // Explicit, because the sweep that turns fog off for the room runs
        // once at build and these can be made again later.
        fog: false,
      });
      const art = new THREE.Mesh(new THREE.PlaneGeometry(PANEL.w, PANEL.h), mat);
      art.position.z = 0.03;
      g.add(art);

      group.add(g);
      // Its own normal and its own resting place. Pushing a panel forward
      // has to be an absolute position rather than a nudge off wherever it
      // happens to be, or a hundred hovers walk it off the wall.
      const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(
        new THREE.Vector3(0, 1, 0), slot.ry);
      const pn = { group: g, art, mat, ring, product: null, slot, bay,
                   base: g.position.clone(), dir, lift: 0, at: 0 };
      bay.panels.push(pn);
      panels.push(pn);
      }
    }
  }
  layPanels();

  /**
   * Sizes a panel to its own picture, the way `object-fit: contain` would.
   *
   * The texture is left alone — it is shared between panels and cropping it
   * there would crop it everywhere. The mesh is scaled instead, so the
   * picture is shown whole at its own proportions and there is no letterbox
   * around it to give the thing an edge.
   */
  function fitArt(pn, tex) {
    const im = tex && tex.image;
    if (!im || !im.width) { pn.art.scale.set(1, 1, 1); return; }
    const ia = im.width / im.height, pa = PANEL.w / PANEL.h;
    if (ia > pa) pn.art.scale.set(1, pa / ia, 1);
    else pn.art.scale.set(ia / pa, 1, 1);
  }

  /* The label on the open piece.
   *
   * One plate, moved to whichever panel is showing. Having it in the room
   * rather than only in the rail is most of what makes this feel like
   * somewhere you are standing: the price is on the wall next to the
   * garment, where a price is.
   */
  const labelCanvas = document.createElement("canvas");
  labelCanvas.width = 640; labelCanvas.height = 200;
  const labelTex = new THREE.CanvasTexture(labelCanvas);
  labelTex.colorSpace = THREE.SRGBColorSpace;
  labelTex.anisotropy = 8;
  const labelMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1.92, 0.6),
    new THREE.MeshStandardMaterial({
      map: labelTex, emissive: 0xffffff, emissiveMap: labelTex,
      emissiveIntensity: 0.45, transparent: true, side: THREE.DoubleSide,
      roughness: 0.6,
    }));
  labelMesh.visible = false;
  group.add(labelMesh);

  function paintLabel(it, ink, paper, money) {
    const c = labelCanvas.getContext("2d");
    const W = labelCanvas.width, H = labelCanvas.height;
    c.clearRect(0, 0, W, H);
    c.fillStyle = paper; c.fillRect(0, 0, W, H);
    c.strokeStyle = ink; c.lineWidth = 3; c.strokeRect(5, 5, W - 10, H - 10);

    c.fillStyle = ink; c.textBaseline = "middle";
    c.font = '600 34px "Helvetica Neue", Helvetica, Arial, sans-serif';
    let name = it.name;
    while (c.measureText(name).width > W - 60 && name.length > 4) {
      name = name.slice(0, -2);
    }
    if (name !== it.name) name += "…";
    c.fillText(name, 30, 56);

    c.font = '700 46px "Helvetica Neue", Helvetica, Arial, sans-serif';
    c.fillText(money, 30, 116);

    c.font = '500 24px "Helvetica Neue", Helvetica, Arial, sans-serif';
    c.globalAlpha = 0.62;
    const sizes = (it.sizes || []).join("  ");
    c.fillText(it.stock > 0 ? (sizes || `${it.stock} in stock`) : "Sold out", 30, 164);
    c.globalAlpha = 1;
    labelTex.needsUpdate = true;
  }

  /* No fog indoors.
   *
   * The room sits in the same scene as the street and was picking up the
   * street's fog with it, so a shop was being rendered through however
   * many metres of daylight haze the plaza needs. Chrome Hearts has walls
   * at #16171c and opened as a white box with its stock ghosted into it;
   * every dark room in the street had the same thing done to it. Fog is
   * for distance outdoors. In here the far wall is four metres away.
   *
   * Done by walking the room rather than at each material, because there
   * are five sets of fixtures and a dozen materials between them and the
   * one that gets missed is the one that shows.
   */
  group.traverse((o) => {
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    for (const m of mats) {
      if (m.fog !== false) { m.fog = false; m.needsUpdate = true; }
    }
  });

  return {
    group, panels, bays, fixtures, PANEL,
    mark: markMesh,
    markTop: () => markMesh.position.y + markMesh.geometry.parameters.height / 2,
    // A getter, not a snapshot: the panel meshes are rebuilt when the
    // viewport changes and a list captured at build would raycast against
    // meshes that are no longer in the room.
    get arts() { return panels.map((pn) => pn.art); },

    /** Puts the room behind a monolith and paints it in that house's colours. */
    dress(m) {
      const b = m.brand;
      const conf = INTERIOR[b.slug] || INTERIOR["off-white"];

      group.position.copy(m.group.position);
      group.rotation.copy(m.group.rotation);
      group.updateMatrixWorld(true);

      matWall.color.set(conf.wall);
      matWall2.color.set(conf.wall2);
      matFloor.color.set(conf.floor);
      matCeil.color.set(conf.wall).lerp(new THREE.Color(0xffffff), 0.55);
      matTrim.color.set(conf.trim);
      matGlow.color.set(conf.lamp).lerp(new THREE.Color(0xffffff), 0.5);
      matGlow.emissive.copy(matGlow.color);

      // The section lights and the ring take the house's own accent, so a
      // Supreme shop is signposted in red and a Godspeed one in gold.
      ringMat.color.set(b.bg[0]).lerp(new THREE.Color(0xffffff), 0.25);
      for (const bay of bays) {
        bay.glowMat.color.set(b.bg[0]);
        // Well toward white. A red strip on a red wall is not a marker.
        bay.glowMat.emissive.set(b.bg[0]).lerp(new THREE.Color(0xffffff), 0.6);
      }

      for (const k in fixtures) fixtures[k].visible = (k === conf.kind);

      paintMark(b);
      return conf;
    },

    /**
     * Lays the house out: one section per bay, biggest on the back wall.
     *
     * `sections` is [{ key, label, items }] in the order they should read.
     * A bay holds what it holds — four or six — and the sign says how many
     * the section has in total, so a wall that is showing six of
     * twenty-three says so rather than pretending.
     */
    layout(sections, brand) {
      signInk = brand.ink || "#111111";
      signPaper = brand.bg[1] || "#ffffff";
      bays.forEach((bay, i) => {
        bay.base = sections[i] || null;
        dressBay(bay, bay.base);
      });
    },

    /**
     * Points a bay at a section it is only standing in for.
     *
     * With three bays and four sections one of them holds the tail, and
     * asking for Hoodies used to walk you to a case marked "More" with
     * hoodies and trousers mixed on it. It takes the name and the icon of
     * whatever you asked for while you are there, and goes back to being
     * "More" when you step away.
     */
    borrow(bay, sec) { dressBay(bay, sec || bay.base); },

    /** Puts a bay's current page on its wall. */
    show(bay, page) {
      bay.page = clamp(page, 0, Math.max(0, Math.ceil(bay.total / bay.panels.length) - 1));
      hangBay(bay);
    },

    /** The bay a category lives in, or null when it has no wall of its own. */
    bayFor(key) { return bays.find((b) => b.cat === key) || null; },

    /** Where an item is hanging right now, if it is. */
    panelFor(it) { return panels.find((pn) => pn.product === it) || null; },

    /** The ring, and the little push forward, on one panel at a time. */
    highlight(pn, on) {
      if (!pn) return;
      pn.ring.visible = on;
      pn.lift = on ? 0.16 : 0;
    },

    /** Hangs the label beside an open piece, or takes it away. */
    label(pn, it, money) {
      if (!pn || !it) { labelMesh.visible = false; return; }
      paintLabel(it, "#101010", "#e9e5dd", money);
      labelMesh.position.copy(pn.group.position);
      labelMesh.rotation.copy(pn.group.rotation);
      // Under the piece on the back wall, under it on the sides too — but
      // the lower row has a floor in the way, so that one goes above.
      const below = pn.slot.y > 2.2;
      labelMesh.position.y += (below ? -1 : 1) * (PANEL.h / 2 + 0.44);
      labelMesh.translateZ(0.06);
      labelMesh.visible = true;
    },

    /** One frame of the small movements: the push forward on a marked panel. */
    settle(dt) {
      const k = Math.min(1, dt * 9);
      for (const pn of panels) {
        if (Math.abs(pn.lift - pn.at) < 0.0005) continue;
        pn.at += (pn.lift - pn.at) * k;
        pn.group.position.copy(pn.base).addScaledVector(pn.dir, pn.at);
      }
    },

    /**
     * Rebuilds the grid for the viewport as it is now.
     *
     * Returns false and does nothing when the numbers have not moved, so a
     * window being dragged across the screen costs one string comparison.
     * Only the boxes are rebuilt — the shell, the fixtures, the signs'
     * canvases and every loaded texture are left alone.
     */
    relayout() {
      if (!metrics()) return false;
      for (const bay of bays) layBay(bay);
      layPanels();
      // The slots are new, so whatever was hanging has to be hung again.
      for (const bay of bays) dressBay(bay, bay.base);
      return true;
    },

    /** Drops a picture from the cache, so the next ask goes to the network. */
    forget: forgetTex,

    /** Resolves once a set of pictures is in hand, or gives up trying. */
    preload(items) {
      return Promise.all(items.filter(Boolean).map(
        (it) => new Promise((res) => texFor(it, () => res()))));
    },
  };

  /** Sets a bay to a section: its sign, its light and its stock. */
  function dressBay(bay, sec) {
    bay.cat = sec ? sec.key : null;
    bay.spare = sec ? sec.spare : null;
    bay.items = sec ? sec.items : [];
    bay.total = sec ? sec.items.length : 0;
    bay.page = 0;
    bay.sign.visible = !!sec;
    bay.glow.visible = !!sec;
    bay.disp.visible = !!sec;
    if (sec) paintSign(bay, sec.label, sec.key, sec.items.length, signInk, signPaper);
    hangBay(bay);
  }

  /** Hangs one bay's page, keeping each panel's picture until the next decodes. */
  function hangBay(bay) {
    const n = bay.panels.length;
    const from = (bay.page || 0) * n;
    bay.panels.forEach((pn, i) => {
      const it = (bay.items || [])[from + i];
      pn.product = it || null;
      pn.group.visible = !!it;
      if (!it) { pn.ring.visible = false; return; }
      texFor(it, (tex) => {
        if (pn.product !== it) return;   // the wall moved on mid-flight
        if (!tex) {
          pn.mat.map = pn.mat.emissiveMap = null;
          pn.mat.color.set(0x8f8f8f);
          pn.mat.emissiveIntensity = 0;
          pn.art.scale.set(1, 1, 1);
        } else {
          pn.mat.map = tex;
          pn.mat.emissiveMap = tex;
          pn.mat.color.set(0x5e5e5e);
          pn.mat.emissiveIntensity = 0.82;
          fitArt(pn, tex);
        }
        pn.mat.needsUpdate = true;
      });
    });
  }
})();
scene.add(storeRoom.group);


// ── the mode ────────────────────────────────────────────────────────────
//
// Entering is a walk, and so is leaving.
//
// It was a cut both ways once, hidden under a 300ms wash of the house's
// colour, on the reasoning that flying a camera through a shopfront looks
// like a camera going through a wall. Which it did — until the shopfront
// got a door that opens and the room behind it got built to be seen
// through that door. Now the camera squares up, the doors swing, and it
// walks in; and on the way out it backs through them onto the pavement
// while they close. There is no wipe left in the file.

storeMode = (() => {
  const shopEl   = document.getElementById("shop");
  const markEl   = document.getElementById("shop-mark");
  const nameEl   = document.getElementById("shop-name");
  const gridEl   = document.getElementById("shop-grid");
  const shelfEl  = document.getElementById("shop-shelf");

  const money = new Intl.NumberFormat("en-US", {
    style: "currency", currency: "USD", minimumFractionDigits: 2,
  });

  /** The most any one section's wall can hold at once. */
  const BAY_MAX = Math.max(...storeRoom.bays.map((b) => b.panels.length));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const catsEl = document.getElementById("shop-cats");
  const topEl = document.querySelector("#shop .top");

  // Canonical running order, so every shop's filters read the same way
  // round whatever it happens to stock. A house only shows the ones it has.
  const CAT_ORDER = ["shirts", "hoodies", "outerwear", "bottoms", "denim",
                     "accessories", "other"];

  let active = false, busy = false;
  // `stock` is everything the house has; `items` is what the chips are
  // currently showing, and is what the rail, the wall and the picker all
  // read. Filtering is a view, never a refetch.
  let stock = [], items = [], cat = "all";
  let picked = -1, house = -1;
  // Which bay the camera is at, and which panel is under the pointer. The
  // room has sections now, so "where you are" is a thing to keep track of.
  let hereBay = null, hover = null;
  // What was activated to get in here, so it can be given focus back.
  let cameFrom = null;

  /* The shop you are in is in the address bar.
   *
   * Three things fall out of that and all three were missing. A shop can be
   * sent to somebody. Reloading puts you back in it rather than at the top
   * of the street. And Back leaves the shop instead of leaving the site —
   * which on a phone, where Back is the system gesture, was the difference
   * between stepping outside and losing the whole visit.
   *
   * `pushed` tracks whether the history entry underneath us is one we put
   * there, because `leave()` should only walk back over its own entry. A
   * hash somebody pasted in is not ours to pop.
   */
  let pushed = false;

  function urlEnter(slug) {
    try {
      history.pushState({ dd: slug }, "", "#" + slug);
      pushed = true;
    } catch { /* file://, sandboxes, and other places history is refused */ }
  }

  function urlLeave() {
    try {
      if (pushed) { pushed = false; history.back(); }
      else if (location.hash) {
        history.replaceState(null, "", location.pathname + location.search);
      }
    } catch { /* as above */ }
  }

  /* The page behind the overlay, switched off while the overlay is up.
   *
   * Without this, Tab walks straight out of the shop into the header, the
   * waypoint pins and the district index — all of which are behind a
   * full-screen overlay and none of which can be seen. `inert` does the
   * whole job in one attribute; the aria-hidden is for Safari before 16.4,
   * where it at least takes them out of the accessibility tree. */
  const OUTSIDE = () => [
    document.getElementById("bar"),
    document.getElementById("pins"),
    document.getElementById("index"),
    document.getElementById("hint"),
    // Not the sound button: it is drawn above the overlay, it is visible
    // while you are in a shop, and it is the one street control that is
    // still worth having in there. Making it inert would have left a
    // control you can see and cannot press.
    ...document.querySelectorAll(".panel"),
  ].filter(Boolean);

  function outsideInert(on) {
    for (const el of OUTSIDE()) {
      if (on) { el.inert = true; el.setAttribute("aria-hidden", "true"); }
      else { el.inert = false; el.removeAttribute("aria-hidden"); }
    }
    if (on) document.body.dataset.shopping = "1";
    else delete document.body.dataset.shopping;
  }

  /** Says out loud what the shelf is now showing. */
  function announce(text) {
    const el = document.getElementById("shop-live");
    if (el) el.textContent = text;
  }
  let savedScroll = 0;
  let cards = [];

  // ── the catalogue ─────────────────────────────────────────────────────
  //
  // One request for the whole street, kept for the session. Fifteen shops
  // browsed in one visit is fifteen round trips otherwise, and the payload
  // is small precisely so it can be fetched whole.
  /**
   * The catalogue, and whether it actually arrived.
   *
   * This used to turn every failure into `{}` and then memoise it, which had
   * two consequences and both of them were silent. A house with no stock and
   * a house whose fetch had failed rendered identically — a lit, dressed,
   * empty room — and once one fetch had failed, the cached empty object meant
   * every other shop in the street was empty too, for the rest of the visit,
   * with no way back short of a reload.
   *
   * So the outcome is carried rather than flattened, and only a success is
   * kept. A failure leaves nothing behind, so the next door opened tries
   * again.
   */
  let catalogue = null, catalogueP = null, catalogueState = "idle", catalogueAt = 0;
  function loadCatalogue(opts = {}) {
    if (catalogueP && !opts.fresh) return catalogueP;
    // A refresh must not blank the shelf into skeletons. Only the first
    // fetch of a visit has nothing to show while it waits.
    if (!catalogue) catalogueState = "loading";
    // The edge holds this for thirty seconds. That is right for a poll and
    // wrong for the moment somebody comes back from the tab they were
    // editing in, which is the one time they are certain something changed.
    const url = opts.bust ? `/api/storefront?v=${Date.now()}` : "/api/storefront";
    catalogueP = fetch(url, { cache: "no-store", headers: { accept: "application/json" } })
      .then((r) => r.json().then((j) => ({ ok: r.ok && j.ok !== false, j })))
      .then(({ ok, j }) => {
        if (!ok) throw new Error(j && j.error ? j.error : "catalogue unavailable");
        catalogue = j.brands || {};
        catalogueAt = Date.now();
        catalogueState = j.configured === false ? "unconfigured" : "ready";
        return catalogue;
      })
      .catch((e) => {
        catalogueState = "failed";
        catalogueP = null;            // so the next shop retries
        throw e;
      });
    return catalogueP;
  }

  /** Swallows the rejection for callers that only want to wait. */
  const catalogueSettled = () => loadCatalogue().catch(() => null);
  // Warm it once the street is up, so the first door opens on a hit.
  setTimeout(catalogueSettled, 2500);

  // ── camera ────────────────────────────────────────────────────────────
  const WHITE = new THREE.Color(0xffffff);
  const curPos = new THREE.Vector3(), curLook = new THREE.Vector3();

  /**
   * The walk in.
   *
   * Cutting straight to the inside of a shop skips the one moment that
   * makes the street a place you are standing in rather than a picture of
   * one. So the camera squares up on the shopfront, the doors swing back,
   * and it walks through them into the room — one shot, no cut, no wipe:
   * the shop is dressed and lit behind its own doorway before the camera
   * has moved a metre, so there is nothing left to hide.
   *
   * Seconds from the click. The phases overlap on purpose: the doors start
   * moving before the camera has finished turning, and the camera starts
   * walking before they have finished opening, because a scene where each
   * thing waits its turn reads as a cutscene.
   */
  const SEQ = {
    turn: [0.00, 0.80],     // swing round and square up on the door
    doors: [0.55, 1.40],    // the leaves go back
    walk: [1.05, 2.35],     // through it, and on into the room
    end: 2.35,
  };

  /* And out again.
   *
   * Leaving used to be a 330ms wash of the house's colour and a cut — which
   * was the honest thing to do while there was nothing behind the door, and
   * stopped being honest the moment the room was built to be walked into.
   * You arrive on foot and left by teleport.
   *
   * Quicker than going in, and deliberately: an arrival is worth two and a
   * third seconds because there is something to look at on the way, and a
   * departure is a thing you have already decided on.
   */
  const SEQ_OUT = {
    back: [0.00, 0.95],     // out of the room to the threshold
    street: [0.75, 1.95],   // through the doorway and onto the pavement
    doors: [1.10, 1.85],    // the leaves swing shut behind
    end: 1.95,
  };
  let seq = null;

  /**
   * Starts the walk-in for house `i`. Resolves once it is inside.
   *
   * Under reduced motion the whole thing happens on the first frame rather
   * than over two and a third seconds. Note that it *happens* — the clock is
   * wound past the end instead of the sequence being skipped, because every
   * ramp in `stepSeq` is read off that clock: the doors, the camera, and the
   * fade that takes the street's sun off the room. Returning early would
   * leave `indoor` at zero and open the shop lit by the sun outside, which is
   * the exact bug the light fade was written to fix.
   */
  function walkIn(i, instant) {
    const m = monoliths[i];
    m.group.updateMatrixWorld(true);
    const at = (x, y, z) => new THREE.Vector3(x, y, z).applyMatrix4(m.group.matrixWorld);
    return new Promise((resolve) => {
      seq = {
        // Wall clock, not accumulated frame deltas. The loop clamps dt to
        // 0.05 so that a dropped frame cannot teleport the camera down the
        // street — sound reasoning for a scroll path, wrong for this, where
        // anything under twenty frames a second would stretch a two-second
        // move into four and leave somebody staring at a door.
        house: i, resolve, creaked: false, landed: false,
        start: performance.now() - (instant || QUALITY.still ? SEQ.end * 1000 : 0),
        // Wherever the camera actually is, including this frame's parallax,
        // so the move starts from the picture rather than near it.
        from: camera.position.clone(),
        fromLook: camLook.clone(),
        // Far enough out to hold the whole shopfront, then the threshold,
        // which is the façade plane — a pace short of the open leaves.
        stand: at(0, 1.95, 8.4),
        // Straight down the middle and out the other side of the doorway,
        // finishing roughly where the shop wants the camera anyway — the
        // move has to stay on x = 0 until it is through, which is why this
        // is a line to a point inside rather than a line to the final one.
        into: at(0, 1.95, -4.6),
        door: at(0, 2.05, -1.2),
        deep: at(0, 2.25, ROOM_BACK),
      };
    });
  }

  /**
   * Starts the walk out of house `i`. Resolves back on the pavement.
   *
   * The target is not "outside the door" but the exact point the scroll
   * path will put the camera at once it takes over again — otherwise the
   * last frame of the walk and the first frame of the street are two
   * different places and the handover is a jump.
   */
  function walkOut(i, instant) {
    const m = monoliths[i];
    m.group.updateMatrixWorld(true);
    const at = (x, y, z) => new THREE.Vector3(x, y, z).applyMatrix4(m.group.matrixWorld);

    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? clamp(savedScroll / max, 0, 1) : 0;
    const street = new THREE.Vector3(), streetLook = new THREE.Vector3();
    PATH.getPointAt(p, street);
    LOOK.getPointAt(p, streetLook);

    return new Promise((resolve) => {
      seq = {
        out: true, house: i, resolve, creaked: false, landed: false,
        start: performance.now() - (instant || QUALITY.still ? SEQ_OUT.end * 1000 : 0),
        from: camera.position.clone(),
        fromLook: camLook.clone(),
        thresh: at(0, 1.9, -0.45),
        // Ahead and out, so the turn happens while still moving rather
        // than as a pivot on the pavement.
        door: at(0, 2.05, 6.0),
        street, streetLook,
      };
    });
  }

  /** One frame of it. True while the walk still owns the camera. */
  function stepSeq(dt, outPos, outLook) {
    if (!seq) return false;
    const T = (performance.now() - seq.start) / 1000;
    const ramp = (a, b) => {
      const x = clamp((T - a) / (b - a), 0, 1);
      return x * x * (3 - 2 * x);
    };

    if (seq.out) {
      if (T < SEQ_OUT.street[0]) {
        outPos.lerpVectors(seq.from, seq.thresh, ramp(SEQ_OUT.back[0], SEQ_OUT.back[1]));
      } else {
        outPos.lerpVectors(seq.thresh, seq.street, ramp(SEQ_OUT.street[0], SEQ_OUT.street[1]));
      }
      outLook.lerpVectors(seq.fromLook, seq.door, ramp(SEQ_OUT.back[0], SEQ_OUT.back[1]));
      outLook.lerp(seq.streetLook, ramp(SEQ_OUT.street[0], SEQ_OUT.street[1]));

      doors.set(seq.house, 1 - ramp(SEQ_OUT.doors[0], SEQ_OUT.doors[1]));
      // And the street's own light comes back up as the room's falls away.
      indoor = 1 - ramp(SEQ_OUT.back[1] - 0.3, SEQ_OUT.street[1] - 0.15);
      if (!seq.creaked && T >= SEQ_OUT.doors[0]) {
        seq.creaked = true;
        sound.door();
      }

      curPos.copy(outPos);
      curLook.copy(outLook);
      if (T >= SEQ_OUT.end && !seq.landed) { seq.landed = true; seq.resolve(); }
      return true;
    }

    if (T < SEQ.walk[0]) outPos.lerpVectors(seq.from, seq.stand, ramp(SEQ.turn[0], SEQ.turn[1]));
    else outPos.lerpVectors(seq.stand, seq.into, ramp(SEQ.walk[0], SEQ.walk[1]));
    // The turn finishes a beat after the move does, so the camera settles
    // onto the door rather than arriving already pointed at it — and then
    // the aim carries on past it to the back wall, which is what stops the
    // last second being a doorframe filling the screen.
    outLook.lerpVectors(seq.fromLook, seq.door, ramp(SEQ.turn[0], SEQ.turn[1] + 0.12));
    outLook.lerp(seq.deep, ramp(SEQ.walk[0], SEQ.walk[1]));

    doors.set(seq.house, ramp(SEQ.doors[0], SEQ.doors[1]));
    // The street's light fades out across the threshold, not at it.
    indoor = ramp(SEQ.walk[0] + 0.45, SEQ.end);
    if (!seq.creaked && T >= SEQ.doors[0]) {
      seq.creaked = true;
      sound.door();
    }

    // Where the room picks the camera up. `seq` is not cleared here but at
    // the moment that happens, because the two are a handover and a single
    // frame in between is the scroll path snapping the camera back out into
    // the middle of the street.
    curPos.copy(outPos);
    curLook.copy(outLook);

    if (T >= SEQ.end && !seq.landed) {
      seq.landed = true;
      seq.resolve();
    }
    return true;
  }
  const tgtPos = new THREE.Vector3(), tgtLook = new THREE.Vector3();
  const v3 = new THREE.Vector3(), q4 = new THREE.Quaternion();

  /**
   * The part of the screen the room actually gets.
   *
   * The chrome is not a strip along one edge any more: the header runs
   * across the top and the shelf takes the right-hand third, or the bottom
   * half on a phone. Everything about framing — how far back to stand, how
   * far to shift, where to aim — comes out of this rectangle, measured off
   * the real elements rather than assumed, so it keeps working when the
   * category chips add a row or the viewport turns.
   */
  function safeRect() {
    const t = (topEl ? topEl.getBoundingClientRect().bottom : 120) / innerHeight;
    const r = shelfEl.getBoundingClientRect();
    const side = innerWidth > 720;
    return {
      left: 0,
      right: side ? clamp(r.left / innerWidth, 0.35, 1) : 1,
      top: clamp(t, 0, 0.4),
      bottom: side ? 1 : clamp(r.top / innerHeight, 0.35, 1),
    };
  }

  const rv = new THREE.Vector3();

  /**
   * Stands in front of a bay, whichever wall it is on.
   *
   * This was `standBack`, and it knew one wall: it put the camera some
   * distance down the room's z axis and looked at z = ROOM_BACK. With
   * sections on three walls that arithmetic has to work off the bay
   * instead — where its wall is, which way it faces, which way it runs —
   * which is what `at`, `normal` and `tangent` are for.
   */
  function frameBay(bay) {
    if (!bay) return;
    const sr = safeRect();
    const availW = Math.max(0.3, sr.right - sr.left);
    const cx = (sr.left + sr.right) / 2;
    const cy = (sr.top + sr.bottom) / 2;

    const vHalf = camera.fov * Math.PI / 360;
    const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
    // `half` is the case, surround and all, and the margin is what keeps
    // its outer edge off the edge of the gap the shelf leaves. On a narrow
    // landscape window there is not enough room to hold all of it, and
    // what gives is the surround rather than the stock.
    const want = (bay.half + 0.6) / (Math.tan(hHalf) * availW);
    const dist = clamp(want, 4.2, bay.maxBack);

    const visibleW = 2 * dist * Math.tan(hHalf);
    const visibleH = 2 * dist * Math.tan(vHalf);
    // Slide sideways rather than swing: moving the camera and what it is
    // looking at by the same amount keeps the wall square on, and puts its
    // middle in the middle of the gap the shelf leaves.
    const slide = visibleW * (0.5 - cx);
    const camY = 2.0;
    const lookY = 2.25 - visibleH * (0.5 - cy);

    v3.copy(bay.at).addScaledVector(bay.normal, dist).addScaledVector(bay.tangent, slide);
    // Inside the room, whatever the lens asked for. A wide window on a side
    // bay wants to stand further back than there is room for.
    v3.x = clamp(v3.x, -(ROOM.w / 2 - 1.5), ROOM.w / 2 - 1.5);
    v3.z = clamp(v3.z, ROOM_BACK + 1.4, ROOM.front - 1.0);
    v3.y = camY;
    tgtPos.copy(v3.applyMatrix4(storeRoom.group.matrixWorld));

    rv.copy(bay.at).addScaledVector(bay.tangent, slide);
    rv.y = lookY;
    tgtLook.copy(rv.applyMatrix4(storeRoom.group.matrixWorld));

    // The house's sign only earns its place if it clears the header, and
    // only the back wall has one. On a short window the wall is not tall
    // enough for two rows of stock and a metre of signage, and the stock
    // wins — the bar at the top is already carrying the name in type.
    const rel = Math.atan((storeRoom.markTop() - camY) / dist)
              - Math.atan((lookY - camY) / dist);
    const markF = 0.5 - 0.5 * Math.tan(rel) / Math.tan(vHalf);
    storeRoom.mark.visible = bay.kind === "back" && markF > sr.top + 0.008;
  }

  /** The wide shot of wherever you are standing. */
  function standBack() { frameBay(hereBay || storeRoom.bays[0]); }

  /** Step up to one piece, square on and close enough to read the label. */
  function standAt(pn) {
    pn.art.getWorldPosition(tgtLook);
    pn.group.getWorldQuaternion(q4);

    // How close is a question about the lens again, not a number. Three
    // metres off a two-metre panel is a comfortable look on a laptop and a
    // garment filling the entire screen on a phone, where the horizontal
    // field is half as wide.
    const hHalf = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
    // Against the gap the shelf leaves, not the whole window: a piece framed
    // for a full-width screen fills the third of it that is still the room.
    const sr0 = safeRect();
    const availW0 = Math.max(0.3, sr0.right - sr0.left);
    const availH0 = Math.max(0.3, sr0.bottom - sr0.top);
    const fit = Math.min(Math.tan(hHalf) * availW0,
                         Math.tan(camera.fov * Math.PI / 360) * availH0 * 1.25);
    const back = clamp((storeRoom.PANEL.w / 2 + 0.5) / fit, 2.9, 8.5);

    v3.set(0, 0, 1).applyQuaternion(q4);
    tgtPos.copy(tgtLook).addScaledVector(v3, back);

    // Then slid so the piece lands in the middle of the gap the shelf
    // leaves, by the same arithmetic the wide shot uses.
    const sr = safeRect();
    const vHalf = camera.fov * Math.PI / 360;
    const hHalf2 = Math.atan(Math.tan(vHalf) * camera.aspect);
    const slide = 2 * back * Math.tan(hHalf2) * (0.5 - (sr.left + sr.right) / 2);
    const lift = 2 * back * Math.tan(vHalf) * (0.5 - (sr.top + sr.bottom) / 2);

    v3.set(1, 0, 0).applyQuaternion(q4);
    tgtPos.addScaledVector(v3, slide);
    tgtLook.addScaledVector(v3, slide);
    tgtPos.y = Math.max(1.4, tgtLook.y - 0.25);
    tgtLook.y -= lift;
  }

  // ── light ─────────────────────────────────────────────────────────────
  //
  // Borrowed, not added. Three point lights appearing in the scene changes
  // the light count every material is compiled against, and every material
  // in the street would be rebuilt on the way in and again on the way out.
  // The street lamps are already counted, already there, and cannot be seen
  // from inside a shop — so they come indoors and go back afterwards.
  const borrowed = [];
  // Candela, and a small room. The first pass at this used 36, 22, 22 —
  // numbers carried over from street lamps twenty metres up — and every
  // interior opened blown to white with the stock invisible in it. Four
  // metres from a wall, single figures is a shop.
  const LAMPS = [
    [0, ROOM.h - 0.8, ROOM.front - 4.6, 7.5],
    [-4.7, 3.2, ROOM_BACK + 2.4, 4.5],
    [4.7, 3.2, ROOM_BACK + 2.4, 4.5],
  ];

  /* And the sun goes off.
   *
   * Taking the fog out of the shops helped and did not fix them, because
