  // Plain masses, read only as a backdrop and never approached, so they are
  // massing and glazing and nothing else.
  {
    const rp = rng(4242);
    for (const b of PLAZA_BLOCKS) {
      const w = b.x1 - b.x0, d = b.z1 - b.z0;
      const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
      const grey = BASE_GREY.clone().offsetHSL(0, 0, (rp() - 0.5) * 0.06);

      const body = new THREE.BoxGeometry(w, b.h, d);
      body.translate(cx, b.h / 2, cz);
      concrete.push(paint(body, grey));

      const cap = new THREE.BoxGeometry(w + 0.6, 0.6, d + 0.6);
      cap.translate(cx, b.h + 0.25, cz);
      concrete.push(paint(cap, grey));

      // Glazing on the face that looks at the plaza.
      const facing = cx < 0 ? 1 : -1;
      const fx = (cx < 0 ? b.x1 : b.x0) + facing * 0.06;
      const floors = Math.max(2, Math.floor(b.h / 3.4));
      for (let f = 0; f < floors; f++) {
        const strip = new THREE.PlaneGeometry(d - 3, 1.9);
        strip.rotateY(facing * Math.PI / 2);
        strip.translate(fx, 2.6 + f * 3.4, cz);
        glass.push(strip);
      }
    }
  }

  const concreteTex = asTexture(texConcrete(), { repeat: [1, 1] });

  const shellMesh = new THREE.Mesh(
    mergeGeometries(concrete),
    // One draw call for every wall on the street. The map carries the board
    // marks and aggregate; the vertex colour carries each pour's own tone.
    new THREE.MeshStandardMaterial({
      map: concreteTex, vertexColors: true, roughness: 0.94, metalness: 0,
      envMapIntensity: 0.7,
    })
  );
  shellMesh.castShadow = true; shellMesh.receiveShadow = true;
  scene.add(shellMesh);

  const accentMesh = new THREE.Mesh(
    mergeGeometries(accent),
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.72, metalness: 0.04 })
  );
  accentMesh.castShadow = true; accentMesh.receiveShadow = true;
  scene.add(accentMesh);

  const metalMesh2 = new THREE.Mesh(
    mergeGeometries(metal),
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.34, metalness: 0.75 })
  );
  metalMesh2.castShadow = true;
  scene.add(metalMesh2);

  for (const kind of Object.keys(screenBins)) {
    const geos = screenBins[kind];
    if (!geos.length) continue;
    const m = new THREE.Mesh(
      mergeGeometries(geos),
      new THREE.MeshStandardMaterial({
        map: asTexture(texScreen(kind)), alphaTest: 0.5, side: THREE.DoubleSide,
        color: 0xd8d5cd, roughness: 0.5, metalness: 0.25, envMapIntensity: 0.9,
      })
    );
    m.castShadow = true;
    scene.add(m);
  }

  interiorMat = new THREE.MeshStandardMaterial({
    map: asTexture(texInterior()),
    emissiveMap: asTexture(texInterior()),
    emissive: 0xffe9c4,
    emissiveIntensity: 0.55,
    roughness: 0.9,
    side: THREE.DoubleSide,
  });
  const interiorMesh = new THREE.Mesh(mergeGeometries(interiors), interiorMat);
  scene.add(interiorMesh);

  glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x22323a,
    roughness: 0.05,
    metalness: 0.1,
    transmission: QUALITY.transmission ? 0.55 : 0,
    thickness: 0.2,
    ior: 1.5,
    transparent: true,
    opacity: 0.85,
    envMapIntensity: 1.6,
    side: THREE.DoubleSide,
  });
  const glassMesh = new THREE.Mesh(mergeGeometries(glass), glassMat);
  scene.add(glassMesh);

  // ── lighting the street ───────────────────────────────────────────────
  //
  // At night the alley was a black corridor. Shop windows are small and sit
  // behind tinted glass, so they cannot light a street on their own however
  // hot their emissive is — the photograph of it was almost entirely under
  // 12/255. Three things fix it, and all three are needed.
  //
  // A strip under every canopy, which is what the real street uses and what
  // puts light on the shopfront itself. Lamp standards down the kerb, whose
  // point lights are the only thing here that actually puts light on the
  // paving — emissive geometry glows but illuminates nothing, there being no
  // global illumination to carry it. And the shop glazing lightens after
  // dark, so the lit interiors read through it instead of being swallowed.
  {
    const strips = [], poles = [], heads = [];

    for (const m of monoliths) {
      m.group.updateMatrixWorld(true);
      const strip = new THREE.BoxGeometry(STREET.width - 2.4, 0.13, 0.5);
      strip.translate(0, 5.05, 1.9);
      strip.applyMatrix4(m.group.matrixWorld);
      strips.push(strip);
    }

    canopyStripMat = new THREE.MeshStandardMaterial({
      color: 0xfff1d6, emissive: 0xffdca8, emissiveIntensity: 0, roughness: 0.6,
    });
    const stripMesh = new THREE.Mesh(mergeGeometries(strips), canopyStripMat);
    scene.add(stripMesh);

    const LAMPS = QUALITY.lampsStreet;
    const span = Math.abs(BRANDS.length * STREET.step);
    for (let i = 0; i < LAMPS; i++) {
      const z = STREET.from - 8 - (i + 0.5) * (span / LAMPS);
      const x = (i % 2 === 0 ? -1 : 1) * (STREET.half - 1.4);

      const pole = new THREE.CylinderGeometry(0.075, 0.1, 5.0, 6);
      pole.translate(x, 2.5, z);
      poles.push(pole);
      const arm = new THREE.BoxGeometry(0.9, 0.1, 0.1);
      arm.translate(x - Math.sign(x) * 0.45, 4.95, z);
      poles.push(arm);

      const head = new THREE.SphereGeometry(0.22, 8, 6);
      head.translate(x - Math.sign(x) * 0.9, 4.88, z);
      heads.push(head);

      const l = new THREE.PointLight(0xffd8a4, 0, 30, 1.6);
      l.position.set(x - Math.sign(x) * 0.9, 4.88, z);
      scene.add(l);
      streetLamps.push(l);
    }

    const poleMesh = new THREE.Mesh(
      mergeGeometries(poles),
      new THREE.MeshStandardMaterial({ color: 0x3a3d40, roughness: 0.42, metalness: 0.6 })
    );
    poleMesh.castShadow = true;
    scene.add(poleMesh);

    lampHeadMat = new THREE.MeshStandardMaterial({
      color: 0xfff4e2, emissive: 0xffd9a2, emissiveIntensity: 0, roughness: 0.4,
    });
    scene.add(new THREE.Mesh(mergeGeometries(heads), lampHeadMat));
  }

  const kerbMesh = new THREE.Mesh(
    mergeGeometries(kerbs),
    new THREE.MeshStandardMaterial({ color: 0xded3bd, roughness: 0.9 })
  );
  kerbMesh.receiveShadow = true;
  scene.add(kerbMesh);

  // --- the far end -------------------------------------------------------
  // A street has to stop somewhere. Without this the two terraces ran to a
  // vanishing point on bare horizon, which undid the enclosure the buildings
  // were there to create in the first place: you could see straight out of
  // the world at the one spot the eye is drawn to. A block across the end
  // closes it, and a taller one so the skyline steps up rather than simply
  // ending.
  {
    // Set well back from the last shopfront. At -12 the camera's final rise
    // ended up inside this block and the last second of the journey was a
    // clipping plane sawing through a wall.
    const endZ = STREET.from + BRANDS.length * STREET.step - 26;
    const caps = [], capGlass = [], bayDots = [], bayWeave = [];

    const block = new THREE.BoxGeometry(56, 17, 16);
    block.translate(0, 8.5, endZ - 8);
    caps.push(block);

    const brow = new THREE.BoxGeometry(57, 0.7, 17);
    brow.translate(0, 17.2, endZ - 8);
    caps.push(brow);

    // --- five bays, five different hands ---------------------------------
    // The block you look at down the whole length of the street was a blank
    // wall. It is now the one deliberate landmark: five bays that plainly did
    // not agree with each other, which is exactly how the car park this
    // borrows from was commissioned — five architects, none shown the others'
    // work. Punched screen, a jam of metal, a woven lattice, coloured fins,
    // and a stack of offset slabs.
    const jam = [], finGeo = [], slabGeo = [];
    const rb = rng(8081);
    const bayW = 56 / 5;

    for (let b = 0; b < 5; b++) {
      const bx = -28 + bayW * (b + 0.5);

      if (b === 0 || b === 2) {
        const panel = new THREE.PlaneGeometry(bayW - 0.5, 15.4);
        panel.translate(bx, 8.6, endZ + 0.45);
        (b === 0 ? bayDots : bayWeave).push(panel);

      } else if (b === 1) {
        // The jam: bodies caught mid-air, gold and silver.
        for (let k = 0; k < 11; k++) {
          const box = new THREE.BoxGeometry(3.4, 1.15, 1.5);
          box.rotateZ((rb() - 0.5) * 1.5);
          box.rotateY((rb() - 0.5) * 0.8);
          box.translate(bx + (rb() - 0.5) * (bayW - 4), 2.2 + k * 1.32, endZ + 0.9 + rb() * 0.8);
          const c = new THREE.Color(rb() > 0.5 ? 0xd8b25e : 0xc9ccd2);
          const n = box.attributes.position.count;
          const arr = new Float32Array(n * 3);
          for (let v = 0; v < n; v++) { arr[v*3]=c.r; arr[v*3+1]=c.g; arr[v*3+2]=c.b; }
          box.setAttribute("color", new THREE.BufferAttribute(arr, 3));
          jam.push(box);
        }

      } else if (b === 3) {
        // Coloured fins, picked off the houses on this street.
        for (let k = 0; k < 9; k++) {
          const fin = new THREE.BoxGeometry(0.34, 15.2, 1.25);
          fin.translate(bx - bayW / 2 + 0.8 + k * ((bayW - 1.6) / 8), 8.6, endZ + 0.85);
          const c = new THREE.Color(BRANDS[(k * 3 + 2) % BRANDS.length].bg[0]);
          const n = fin.attributes.position.count;
          const arr = new Float32Array(n * 3);
          for (let v = 0; v < n; v++) { arr[v*3]=c.r; arr[v*3+1]=c.g; arr[v*3+2]=c.b; }
          fin.setAttribute("color", new THREE.BufferAttribute(arr, 3));
          finGeo.push(fin);
        }

      } else {
        // Barricades: heavy slabs, each shoved a little off the last.
        for (let k = 0; k < 7; k++) {
          const sl = new THREE.BoxGeometry(bayW - 1.2, 1.5, 1.1);
          sl.translate(bx + (rb() - 0.5) * 2.2, 2.0 + k * 2.15, endZ + 0.7);
          slabGeo.push(sl);
        }
      }
    }

    if (jam.length) {
      const m = new THREE.Mesh(mergeGeometries(jam),
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.28, metalness: 0.85, envMapIntensity: 1.3 }));
      m.castShadow = true; scene.add(m);
    }
    if (finGeo.length) {
      const m = new THREE.Mesh(mergeGeometries(finGeo),
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5 }));
      m.castShadow = true; scene.add(m);
    }
    if (slabGeo.length) {
      const m = new THREE.Mesh(mergeGeometries(slabGeo),
        new THREE.MeshStandardMaterial({ color: 0xe6ddc9, roughness: 0.9 }));
      m.castShadow = true; m.receiveShadow = true; scene.add(m);
    }

    // A glazed ground floor, so it belongs to the same street.
    for (let k = -2; k <= 2; k++) {
      const pane = new THREE.PlaneGeometry(8.4, 6.2);
      pane.translate(k * 9.4, 3.4, endZ + 0.05);
      capGlass.push(pane);

      const mull = new THREE.BoxGeometry(0.16, 6.2, 0.25);
      mull.translate(k * 9.4 + 4.7, 3.4, endZ + 0.1);
      caps.push(mull);
    }

    const endMesh = new THREE.Mesh(
      mergeGeometries(caps),
      new THREE.MeshStandardMaterial({ map: concreteTex, color: 0xdedbd3, roughness: 0.9 })
    );
    endMesh.castShadow = true; endMesh.receiveShadow = true;
    scene.add(endMesh);

    for (const [geos, kind] of [[bayDots, "dots"], [bayWeave, "weave"]]) {
      if (!geos.length) continue;
      const m = new THREE.Mesh(
        mergeGeometries(geos),
        new THREE.MeshStandardMaterial({
          map: asTexture(texScreen(kind)),
          alphaTest: 0.5, side: THREE.DoubleSide,
          color: 0xfffdf6, roughness: 0.5, metalness: 0.2, envMapIntensity: 1.0,
        })
      );
      m.castShadow = true;
      scene.add(m);
    }

    // The end of the street was a black wall after dark. It gets a lit band
    // across its ground floor and a pair of washers on the facade, so the
    // view down the alley lands on something rather than nothing.
    {
      const bands = [];
      for (let k = -2; k <= 2; k++) {
        const g = new THREE.BoxGeometry(8.6, 0.2, 0.4);
        g.translate(k * 9.4, 6.9, endZ + 0.35);
        bands.push(g);
      }
      endBandMat = new THREE.MeshStandardMaterial({
        color: 0xfff0d8, emissive: 0xffd9a6, emissiveIntensity: 0, roughness: 0.55,
      });
      scene.add(new THREE.Mesh(mergeGeometries(bands), endBandMat));

      for (const dx of [-13, 13]) {
        const l = new THREE.PointLight(0xffd2a0, 0, 44, 1.5);
        l.position.set(dx, 7.5, endZ + 5);
        scene.add(l);
        streetLamps.push(l);
      }
    }

    const endGlass = new THREE.Mesh(
      mergeGeometries(capGlass),
      new THREE.MeshPhysicalMaterial({
        color: 0x223038, roughness: 0.06, metalness: 0.1,
        transmission: QUALITY.transmission ? 0.5 : 0, thickness: 0.2, ior: 1.5,
        transparent: true, opacity: 0.86, envMapIntensity: 1.6,
        side: THREE.DoubleSide,
      })
    );
    scene.add(endGlass);
  }

  // --- a bridge over the street -----------------------------------------
  // Upper-level links between blocks are everywhere in a district like this,
  // and one crossing overhead does more for the sense of being *inside*
  // somewhere than another twenty metres of shopfront would.
  {
    const bz = STREET.from + 6.5 * STREET.step;
    const deck = [], rails = [];

    const slab = new THREE.BoxGeometry(STREET.half * 2 + 2, 0.55, 4.2);
    slab.translate(0, 9.2, bz);
    deck.push(slab);

    const soffit = new THREE.BoxGeometry(STREET.half * 2 + 2, 0.3, 3.0);
    soffit.translate(0, 8.9, bz);
    deck.push(soffit);

    for (const dz of [-2.1, 2.1]) {
      const g = new THREE.PlaneGeometry(STREET.half * 2 + 2, 1.9);
      g.rotateY(dz > 0 ? 0 : Math.PI);
      g.translate(0, 10.45, bz + dz);
      rails.push(g);
    }

    const deckMesh = new THREE.Mesh(
      mergeGeometries(deck),
      new THREE.MeshStandardMaterial({ color: 0xf1e9d9, roughness: 0.85 })
    );
    deckMesh.castShadow = true; deckMesh.receiveShadow = true;
    scene.add(deckMesh);

    const railMesh = new THREE.Mesh(
      mergeGeometries(rails),
      new THREE.MeshPhysicalMaterial({
        color: 0x2a3a42, roughness: 0.05, metalness: 0.1,
        transmission: QUALITY.transmission ? 0.6 : 0, thickness: 0.15, ior: 1.5,
        transparent: true, opacity: 0.8, side: THREE.DoubleSide, envMapIntensity: 1.5,
      })
    );
    scene.add(railMesh);
  }

  // --- somewhere to sit outside ------------------------------------------
  // Parasols and cafe tables spilling onto the paving. Colour at head height,
  // and the clearest signal that the street is used rather than modelled.
  {
    const posts = [], tops = [], tables = [];
    const ru = rng(60607);
    for (let i = 0; i < 6; i++) {
      const z = STREET.from - 10 - i * 19 - ru() * 6;
      const sx = (i % 2 === 0 ? -1 : 1) * (STREET.half - 3.4);

      const pole = new THREE.CylinderGeometry(0.07, 0.07, 2.7, 6);
      pole.translate(sx, 1.35, z);
      posts.push(pole);

      const shade = new THREE.ConeGeometry(2.25, 0.85, 8, 1, true);
      shade.translate(sx, 3.0, z);
      const c = new THREE.Color(BRANDS[(i * 4 + 1) % BRANDS.length].bg[0]);
      const n = shade.attributes.position.count;
      const arr = new Float32Array(n * 3);
      for (let v = 0; v < n; v++) { arr[v*3]=c.r; arr[v*3+1]=c.g; arr[v*3+2]=c.b; }
      shade.setAttribute("color", new THREE.BufferAttribute(arr, 3));
      tops.push(shade);

      const top = new THREE.CylinderGeometry(0.62, 0.62, 0.08, 12);
      top.translate(sx, 0.74, z);
      tables.push(top);
      const stem = new THREE.CylinderGeometry(0.06, 0.09, 0.74, 6);
      stem.translate(sx, 0.37, z);
      tables.push(stem);

      for (const a of [0.7, 2.6, 4.2]) {
        const seat = new THREE.CylinderGeometry(0.28, 0.28, 0.07, 8);
        seat.translate(sx + Math.cos(a) * 1.15, 0.46, z + Math.sin(a) * 1.15);
        tables.push(seat);
        const leg = new THREE.CylinderGeometry(0.05, 0.05, 0.46, 5);
        leg.translate(sx + Math.cos(a) * 1.15, 0.23, z + Math.sin(a) * 1.15);
        tables.push(leg);
      }
    }

    const shadeMesh = new THREE.Mesh(
      mergeGeometries(tops),
      new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, side: THREE.DoubleSide })
    );
    shadeMesh.castShadow = true;
    scene.add(shadeMesh);

    const metalMesh = new THREE.Mesh(
      mergeGeometries(posts.concat(tables)),
      new THREE.MeshStandardMaterial({ color: 0x3c3f42, roughness: 0.42, metalness: 0.5 })
    );
    metalMesh.castShadow = true;
    scene.add(metalMesh);
  }

  // --- street furniture --------------------------------------------------
  // Planters and benches down the kerb line. Cheap, merged, and the thing
  // that stops the alley floor reading as an empty corridor: they give the
  // eye something at knee height between the shopfronts and the palms.
  {
    const stone = [], soil = [], broadLeaf = [], feather = [], bushAt = [];
    const r = rng(5150);
    const kerbX = STREET.half - 2.0;

    // One per unit, alternating kerbs, so they read as part of the street
    // rather than scattered along it.
    for (let i = 0; i < BRANDS.length + 2; i++) {
      const z = STREET.from - 2 - i * 7.6 - r() * 1.6;
      const sx = (i % 2 === 0 ? -1 : 1) * (kerbX + (r() - 0.5) * 0.6);

      const tub = new THREE.BoxGeometry(1.7, 0.92, 1.7);
      tub.translate(sx, 0.46, z);
      stone.push(tub);

      const lip = new THREE.BoxGeometry(1.95, 0.16, 1.95);
      lip.translate(sx, 0.95, z);
      stone.push(lip);

      /* Planting, rather than green lumps with sticks in them.
       *
       * This was a clump of squashed spheres and a fan of tapered cylinders.
       * Spheres are the one shape a plant never makes, and at street level
       * the whole tub read as a mossy boulder. What it is now is what is
       * actually in a tub: a low mound of soil, a few broad leaves on
       * stalks, and a feathery thing behind them — two silhouettes rather
       * than one mass, which is the entire difference at a glance.
       *
       * Both kinds of leaf are the same geometry the palms use, at a tenth
       * of the size and with a different picture on it. That is worth more
       * than the saving: a leaf built this way already arches, already
       * folds along its spine, and already takes the wind, so the planting
       * moves in the same breeze as the crowns overhead instead of standing
       * dead still underneath them.
       */
      const mound = new THREE.SphereGeometry(0.74, 12, 5);
      {
        const q = mound.attributes.position;
        for (let v = 0; v < q.count; v++) q.setXYZ(v, q.getX(v), q.getY(v) * 0.26, q.getZ(v));
        mound.computeVertexNormals();
      }
      mound.translate(sx, 0.97, z);
      soil.push(mound);
      bushAt.push([sx, 1.44, z]);

      const stand = (geo, len, base, az, pitch, roll, phase, sway) => {
        stampSway(geo, (vx) => Math.pow(clamp(vx / len, 0, 1), 1.5) * sway);
        stamp(geo, "aPhase", phase);
        geo.applyMatrix4(new THREE.Matrix4()
          .makeTranslation(base[0], base[1], base[2])
          .multiply(new THREE.Matrix4().makeRotationY(az))
          .multiply(new THREE.Matrix4().makeRotationZ(pitch))
          .multiply(new THREE.Matrix4().makeRotationX(roll)));
      };

      // The broad leaves: fewer, bigger, held out almost flat.
      const broad = 5 + Math.floor(r() * 3);
      for (let k = 0; k < broad; k++) {
        const len = 0.95 + r() * 0.5;
        const g = frondGeometry(len, 0.34 + r() * 0.12, 6);
        stand(g, len,
              [sx + (r() - 0.5) * 0.7, 1.06 + r() * 0.22, z + (r() - 0.5) * 0.7],
              (k / broad) * Math.PI * 2 + r() * 0.6,
              0.45 + r() * 0.65, (r() - 0.5) * 0.9,
              i * 1.7 + k * 0.4, 0.30);
        broadLeaf.push(g);
      }

      // The feathery one: more of them, narrower, standing up behind.
      const feathers = 7 + Math.floor(r() * 4);
      for (let k = 0; k < feathers; k++) {
        const len = 0.9 + r() * 0.62;
        const g = frondGeometry(len, 0.15 + r() * 0.08, 8);
        stand(g, len,
              [sx + (r() - 0.5) * 0.5, 1.16 + r() * 0.2, z + (r() - 0.5) * 0.5],
              (k / feathers) * Math.PI * 2 + r() * 0.5,
              0.55 + r() * 0.75, (r() - 0.5) * 1.1,
              i * 1.7 + k * 0.23 + 0.9, 0.34);
        feather.push(g);
      }

      // A bench every third planter.
      if (i % 3 === 1) {
        const seat = new THREE.BoxGeometry(0.62, 0.16, 3.1);
        seat.translate(sx - Math.sign(sx) * 1.6, 0.52, z + 3.6);
        stone.push(seat);
        for (const t of [-1.2, 1.2]) {
          const leg = new THREE.BoxGeometry(0.5, 0.44, 0.24);
          leg.translate(sx - Math.sign(sx) * 1.6, 0.22, z + 3.6 + t);
          stone.push(leg);
        }
      }
    }

    const stoneMesh = new THREE.Mesh(
      mergeGeometries(stone),
      new THREE.MeshStandardMaterial({ color: 0xe4dac4, roughness: 0.88 })
    );
    stoneMesh.castShadow = true; stoneMesh.receiveShadow = true;
    scene.add(stoneMesh);

    const soilMesh = new THREE.Mesh(
      mergeGeometries(soil),
      new THREE.MeshStandardMaterial({ color: 0x6b5941, roughness: 1, flatShading: true })
    );
    soilMesh.receiveShadow = true;
    scene.add(soilMesh);

    /* Two meshes, two textures, and the same wind the palms are on.
     *
     * alphaTest rather than transparency, for the same reason the crowns
     * use it: sorted transparency on a few hundred overlapping leaves is
     * both slower and wrong, and a cut-out leaf takes a shadow properly. */
    const leafOf = (geos, tex) => {
      const m = new THREE.Mesh(
        mergeGeometries(geos),
        applyWind(new THREE.MeshStandardMaterial({
          map: tex, alphaTest: 0.3, side: THREE.DoubleSide,
          roughness: 0.78, metalness: 0,
        }))
      );
      m.castShadow = true; m.receiveShadow = true;
      const depth = new THREE.MeshDepthMaterial({
        depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.4,
      });
      applyWind(depth);
      m.customDepthMaterial = depth;
      scene.add(m);
      return m;
    };
    leafOf(broadLeaf, asTexture(texBroadLeaf()));
    leafOf(feather, frondTex);

    // Bougainvillea. Three or four hot clusters down a bleached street do
    // more for the colour of the place than raising the saturation on
    // everything would, and the tropics plant the stuff everywhere.
    const petals = [];
    // Off the tubs now rather than off individual leaves: the clusters used
    // to hang wherever the third sphere in the clump happened to sit, and
    // the spheres are gone.
    for (const [bx, by, bz] of bushAt) {
      if (r() > 0.5) continue;
      const hue = [0xd6356f, 0xe8604a, 0xc23a86, 0xef8f3c][Math.floor(r() * 4)];
      /* Four times smaller and twice as many.
       *
       * These were sized against the clump of spheres they used to be
       * scattered through, and next to actual leaves the same radius came
       * out as five magenta beach balls sitting on a shrub — one of them
       * hanging in mid-air, because the old anchors went up to where the
       * top of the clump had been. A bract is a small thing that there is a
       * lot of, so the spread comes in to the width of the foliage and the
       * count goes up to match. */
      for (let k = 0; k < 14; k++) {
        const b = new THREE.SphereGeometry(0.05 + r() * 0.045, 6, 4);
        b.translate(bx + (r() - 0.5) * 1.0, by + (r() - 0.5) * 0.42, bz + (r() - 0.5) * 1.0);
        const c = new THREE.Color(hue);
        const n = b.attributes.position.count;
        const arr = new Float32Array(n * 3);
        for (let v = 0; v < n; v++) { arr[v * 3] = c.r; arr[v * 3 + 1] = c.g; arr[v * 3 + 2] = c.b; }
        b.setAttribute("color", new THREE.BufferAttribute(arr, 3));
        petals.push(b);
      }
    }
    if (petals.length) {
      const bloomMesh = new THREE.Mesh(
        mergeGeometries(petals),
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 })
      );
      bloomMesh.castShadow = true;
      scene.add(bloomMesh);
    }
  }
}

// ## 18B  DOORS — one pair on every shopfront
//
// Thirty leaves in a single draw call.
//
// They cannot be merged into the street the way everything else here is,
// because each one needs a transform that changes; and thirty separate
// meshes would be thirty extra draw calls for something that is shut and
// motionless almost all of the time. An InstancedMesh is both: one
// geometry, one material, one call, and a matrix per leaf to write when a
// door has to move.
//
// The geometry's origin is its hinge rather than its centre, so opening a
// leaf is a rotation and nothing else. Both swing inward, which is what a
// shop door does and which keeps them clear of the planters outside.

const doors = (() => {
  const DOOR_W = 3.0, DOOR_H = 4.3, LEAF = DOOR_W / 2;
  const geo = new THREE.BoxGeometry(LEAF, DOOR_H, 0.085);
  geo.translate(LEAF / 2, 0, 0);

  const mesh = new THREE.InstancedMesh(
    geo,
    new THREE.MeshPhysicalMaterial({
      color: 0x14181d, roughness: 0.13, metalness: 0.34,
      transparent: true, opacity: 0.78, side: THREE.DoubleSide,
      envMapIntensity: 1.35,
    }),
    monoliths.length * 2
  );
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  mesh.castShadow = true;
  scene.add(mesh);

  const dummy = new THREE.Object3D();
  const open = new Float32Array(monoliths.length);

  function write(i) {
    const m = monoliths[i];
    m.group.updateMatrixWorld(true);
    // Eighty-two degrees, not ninety: a leaf held square to the wall is
    // edge-on to anyone walking at it and disappears at the moment it is
    // supposed to be the whole point. Eight degrees short and it still
    // catches the sky.
    const a = open[i] * Math.PI * 0.455;
    for (let k = 0; k < 2; k++) {
      // Left leaf hinges on the left, right leaf is its mirror — a half
      // turn on the base and the opposite sign on the swing. Both open
      // toward the street: inward would put the tips through the shop's
      // back wall, and out is how a door is held for someone anyway.
      const side = k === 0 ? 1 : -1;
      dummy.position.set(-side * (DOOR_W / 2), 2.15, -0.62);
      dummy.rotation.set(0, (k === 0 ? 0 : Math.PI) - side * a, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      dummy.matrix.premultiply(m.group.matrixWorld);
      mesh.setMatrixAt(i * 2 + k, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }

  for (let i = 0; i < monoliths.length; i++) write(i);

  return {
    mesh,
    /** 0 shut, 1 flat against the inside wall. */
    set(i, v) {
      if (i < 0 || i >= monoliths.length) return;
      const n = clamp(v, 0, 1);
      if (Math.abs(n - open[i]) < 0.002) return;
      open[i] = n;
      write(i);
    },
    get(i) { return open[i]; },
  };
})();

/**
 * The lit panel at the back of each doorway.
 *
 * It is what a shop looks like from the street — a warm depth behind the
 * glass rather than a hole — and it is also exactly what stands between the
 * camera and the real interior during the walk in. So it is pulled out of
 * the merged shopfronts and instanced: one draw call for all fifteen, and
 * taking one away is a matrix with a zero scale rather than a rebuild of
 * the street.
 */
const doorBacks = (() => {
  const geo = new THREE.BoxGeometry(3.0, 4.3, 0.12);
  const mesh = new THREE.InstancedMesh(geo, interiorMat, monoliths.length);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const dummy = new THREE.Object3D();
  function write(i, on) {
    const m = monoliths[i];
    m.group.updateMatrixWorld(true);
    dummy.position.set(0, 2.15, -1.6);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(on ? 1 : 0);
    dummy.updateMatrix();
    dummy.matrix.premultiply(m.group.matrixWorld);
    mesh.setMatrixAt(i, dummy.matrix);
    mesh.instanceMatrix.needsUpdate = true;
  }
  for (let i = 0; i < monoliths.length; i++) write(i, true);

  return {
    mesh,
    show(i) { if (i >= 0) write(i, true); },
    hide(i) { if (i >= 0) write(i, false); },
  };
})();

// ## 18C  BOARDS — the screens over the street
//
// A shopping street with signage and no advertising is a strange thing: what
// makes somewhere like this read as a place rather than as a render is the
// light coming off the hoardings, not the architecture behind them. So the
// street gets LED boards — bolted to the facades, standing on the roofs, and
// one across the end of it — and after dark they are the brightest thing in
// the scene and throw their own colour onto the pavement.
//
// Every board is showing a house's logo today. Almost none of the machinery
// below knows that. A board holds a *creative*, which is a thing to paint,
// and the only code that knows a creative happens to be a logo is REEL and
// `paintCreative`. Putting product artwork up later means adding entries to
// the one and a branch to the other; placement, cycling, the LED look, the
// clock and the light spill all stay as they are.

const boards = (() => {
  const FACE_Z = 0.75;        // how far a facade board stands off its wall
  const ROOF_Z = -1.2;        // and how far back a roof sign sits from the parapet

  /* What a board is allowed to show.
   *
   * Not one playlist: a playlist *per board*, because a board on a house's
   * own building may only ever show that house. Cycling every brand across
   * every facade meant a Balenciaga logo three metres above the Godspeed
   * shopfront, and the street stopped telling you whose door you were
   * standing at -- which is the one job the street has.
   *
   * So there are three kinds of reel, and the placement decides which a
   * board gets:
   *
   *   ownReel(brand)  a house's own building. One entry today. This is where
   *                   that house's product artwork goes later, and it can
   *                   cycle then without ever being confusing, because
   *                   everything in it belongs to the shop underneath.
   *   SITE_REEL       the district's own mark. Used on the crown at the end
   *                   of the street and on the tickers, neither of which
   *                   belongs to any one house.
   *   BRAND_REEL      every house in turn. Only on the two boards flanking
   *                   the crown, which stand on the block that closes the
   *                   street rather than on anybody's shopfront, so a name
   *                   up there reads as an advertisement and not as a sign.
   */
  const ownReel = (brand) => [{ kind: "brand", brand, key: brand.slug }];
  const BRAND_REEL = BRANDS.map((brand) => ({ kind: "brand", brand, key: brand.slug }));
  const SITE_REEL = [{ kind: "site", key: "site" }];

  /* Artwork, fetched once and shared by every board.
   *
   * The signs each load their own copy because they are built before this
   * exists and never change what they show. A board cycles through all
   * fifteen houses, so fifteen boards loading fifteen logos each would be
   * two hundred requests for fifteen files. */
  const art = new Map();
  const asked = new Set();
  const waiting = [];

  /** What piece of artwork a creative wants. Also its cache key. */
  const keyOf = (c) => c.kind === "product" ? `p:${c.product.id}`
                     : c.kind === "site"    ? "site"
                     : c.brand.slug;

  /**
   * Fetches a picture once and tells anyone showing it.
   *
   * Always anonymous, and it is not optional. Dropping the attribute makes a
   * cross-origin image paint onto the canvas without a CORS header, which
   * taints it -- and a tainted canvas cannot be uploaded as a texture at
   * all. It is not merely unreadable: three calls texSubImage2D on it every
   * time the board changes and the whole upload throws SecurityError, so the
   * board freezes on whatever it last managed to show. Requesting CORS means
   * a bucket that does not send the header fails the load instead, which
   * costs the photograph and nothing else.
   */
  function fetchArt(key, src, fallback) {
    if (!src || asked.has(key)) return;
    asked.add(key);
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => { art.set(key, img); for (const f of waiting) f(key); };
    img.onerror = () => {
      asked.delete(key);
      // The resized copy is an optimisation, never a dependency.
      if (fallback && fallback !== src) fetchArt(key, fallback);
    };
    img.src = src;
  }

  /**
   * A product photograph at the size a board is going to draw it, not the
   * size it was uploaded at.
   *
   * This is the single thing that made the boards expensive on a phone.
   * Standing on the street on the light tier pulled forty-one catalogue
   * shots averaging 322KB, one of them a 1.1MB PNG -- to be drawn into a
   * tile a hundred and forty pixels wide, because a light-tier board canvas
   * is 158 by 230. Supabase will resize on the way out, and since a browser
   * asks for WebP the same 1.1MB PNG comes back as 1KB at 256 across.
   *
   * If the transform is ever switched off the request errors and `fetchArt`
   * falls back to the original url, so this can cost bytes and never the
   * picture.
   */
  const THUMB = QUALITY.light ? 256 : 512;
  function thumbFor(url) {
    const MARK = "/storage/v1/object/public/";
    if (!url || !url.includes(MARK)) return url;
    const base = url.replace(MARK, "/storage/v1/render/image/public/");
    return `${base}${base.includes("?") ? "&" : "?"}width=${THUMB}&resize=contain&quality=72`;
  }

  /** Shrinks a label until it fits, and returns the size it settled on. */
  function fitText(x, label, maxW, start, weight, face) {
    let size = Math.max(6, Math.round(start));
    do { x.font = `${weight} ${size}px ${face}`; size -= 1; }
    while (x.measureText(label).width > maxW && size > 7);
    return size;
  }

  /**
   * Breaks a label into at most `maxLines` lines that fit, cutting the tail.
   *
   * Shrinking until it fits is what `fitText` does and it is wrong for a
   * product name: "BAPE A Bathing Ape Crew Socks -White/Black Classic Logo"
   * came out on a portrait board at a size the price underneath dwarfed,
   * which puts the two things on the sign in the wrong order -- the piece is
   * what is being advertised, not the number. Wrapping holds the size and
   * spends height instead, and whatever still does not fit is cut.
   */
  function wrapAt(x, label, maxW, size, weight, face, maxLines) {
    x.font = `${weight} ${Math.round(size)}px ${face}`;
    const words = String(label).split(/\s+/).filter(Boolean);
    const lines = [];
    let line = "", cut = false;
    for (const w of words) {
      const test = line ? `${line} ${w}` : w;
      if (!line || x.measureText(test).width <= maxW) { line = test; continue; }
      lines.push(line);
      line = w;
      if (lines.length === maxLines) { cut = true; break; }
    }
    if (!cut && line && lines.length < maxLines) lines.push(line);
    else if (!cut && line) cut = true;
    if (cut && lines.length) {
      let last = lines[lines.length - 1];
      while (last.length > 1 && x.measureText(`${last}\u2026`).width > maxW) last = last.slice(0, -1);
      lines[lines.length - 1] = `${last}\u2026`;
    }
    return lines;
  }

  /** A rounded rectangle path, with a square fallback on old engines. */
  function panelPath(x, px, py, w, h, r) {
    x.beginPath();
    if (x.roundRect) x.roundRect(px, py, w, h, r);
    else x.rect(px, py, w, h);
  }
  for (const b of BRANDS) fetchArt(b.slug, logoFor(b.slug));
  // The on-dark cuts, because a board is a black panel. The wordmark for
  // anything wider than it is tall and the square mark for the towers, which
  // is the whole reason both files exist.
  fetchArt("site-wide", `${SITE}/brand/designer-district-wordmark-on-dark.png`);
  fetchArt("site-tall", `${SITE}/brand/designer-district-mark-on-dark.png`);

  /**
   * The grid of lamps.
   *
   * Without this a board is a poster, and the difference between a poster and
   * a screen at night is almost entirely that you can see the pitch. Drawn
   * into the canvas rather than as a second map so that mipmapping disposes
   * of it by itself: close up you see the lamps, far down the street you see
   * a clean panel, which is what happens in life.
   */
  function ledOverlay(x, W, H) {
    const pitch = Math.max(3, Math.round(Math.min(W, H) / 78));
    x.save();
    // 0.22 cost a fifth of every board's output for a texture you cannot
    // resolve past about fifteen metres. The pitch is the point, not the
    // shadow between the lamps.
    x.globalAlpha = 0.12;
    x.fillStyle = "#000";
    for (let px = 0; px < W; px += pitch) x.fillRect(px, 0, 1, H);
    for (let py = 0; py < H; py += pitch) x.fillRect(0, py, W, 1);
    x.restore();
  }

  /**
   * How bright the brightest part of what we just painted came out, 0 to 1.
   *
   * Necessary because the houses do not agree about colour: run a cream
   * Amiri field and a near-black Balenciaga one through the same emissive
   * and one of them blows out. But the statistic has to be the right one.
   *
   * This started as the mean, and the mean is exactly wrong here. A black
   * board with white type on it has a low average, so the correction read it
   * as too dim and drove it to the top of its clamp — the district's own
   * crown at the end of the street came out at an emissive of 4.29, which is
   * not a black sign lit up, it is a grey rectangle. What wants holding
   * steady is the bright part, the type and the logo, not the field behind
   * them. So: a coarse histogram, and the eighty-fifth percentile.
   *
   * Sampled every sixteenth pixel. This runs when a board changes, a couple
   * of times a second across the whole street at most.
   */
  function peakLuma(cv) {
    const x = cv.getContext("2d");
    let d;
    try {
      d = x.getImageData(0, 0, cv.width, cv.height).data;
    } catch {
      return 0.8;      // tainted by artwork served without CORS: leave it be
    }
    const bins = new Uint32Array(32);
    let n = 0;
    for (let i = 0; i < d.length; i += 4 * 16) {
      const l = (d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722) / 255;
      bins[Math.min(31, (l * 32) | 0)]++;
      n++;
    }
    if (!n) return 0.8;
    let seen = 0;
    const want = n * 0.85;
    for (let i = 0; i < 32; i++) {
      seen += bins[i];
      if (seen >= want) return (i + 0.5) / 32;
    }
    return 1;
  }

  /** Paints one creative onto one board's canvas. The only logo-aware code. */
  function paintCreative(cv, creative) {
    const x = cv.getContext("2d"), W = cv.width, H = cv.height;

    if (creative.kind === "site") {
      const g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#17171d");
      g.addColorStop(1, "#08080b");
      x.fillStyle = g;
      x.fillRect(0, 0, W, H);

      const wide = W / H >= 1.5;
      const img = art.get(wide ? "site-wide" : "site-tall");
      if (img) {
        const k = Math.min(W * 0.78 / img.width, H * (wide ? 0.46 : 0.6) / img.height);
        const w = img.width * k, h = img.height * k;
        x.drawImage(img, (W - w) / 2, H * 0.44 - h / 2, w, h);
      } else {
        const face = getComputedStyle(document.body).fontFamily;
        x.fillStyle = "#f4f4f6";
        x.textAlign = "center";
        x.textBaseline = "middle";
        let size = Math.round(Math.min(H * 0.26, W * 0.13));
        do { x.font = `700 ${size}px ${face}`; size -= 2; }
        while (x.measureText("DESIGNER DISTRICT").width > W * 0.84 && size > 10);
        x.fillText("DESIGNER DISTRICT", W / 2, H * 0.44);
      }

      const face2 = getComputedStyle(document.body).fontFamily;
      x.fillStyle = "rgba(244,244,246,.62)";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.font = `600 ${Math.round(H * 0.072)}px ${face2}`;
      x.fillText("FIFTEEN DISTRICTS, ONE ADDRESS", W / 2, H * 0.82);

      ledOverlay(x, W, H);
      return;
    }

    const b = creative.brand;

    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, b.bg[0]);
    g.addColorStop(1, b.bg[1]);
    x.fillStyle = g;
    x.fillRect(0, 0, W, H);

    if (creative.kind === "product") {
      /* An advertisement, which is a different object from a logo.
       *
       * Three things have to be on it and in this order of size: the thing
       * itself, whose shop it is, and what it costs. The photographs are
       * shot on white, so they go in a light tile rather than straight onto
       * the house's colour -- a cut-out on a dark field reads as a mistake,
       * and every one of these is a catalogue shot with a white background
       * baked into it.
       */
      const pr = creative.product;
      const face = getComputedStyle(document.body).fontFamily;
      const wide = W / H >= 1.4;
      const pad = Math.round(Math.min(W, H) * 0.07);

      // Knock the ground back so the tile is the brightest thing on the board.
      x.fillStyle = "rgba(0,0,0,.24)";
      x.fillRect(0, 0, W, H);

      const tile = wide
        ? { x: pad, y: pad, w: Math.round(W * 0.40), h: H - pad * 2 }
        : { x: pad, y: Math.round(H * 0.17), w: W - pad * 2, h: Math.round(H * 0.43) };
      const r = Math.min(tile.w, tile.h) * 0.06;
      panelPath(x, tile.x, tile.y, tile.w, tile.h, r);
      // Not white. A near-white tile is the brightest thing on the street
      // once the emissive is on it, and it blooms into a slab; this is the
      // paper the rest of the site is set on anyway.
      x.fillStyle = "#e9e7e1";
      x.fill();

      const img = art.get(keyOf(creative));
      if (img) {
        const k = Math.min(tile.w * 0.9 / img.width, tile.h * 0.9 / img.height);
        const iw = img.width * k, ih = img.height * k;
        x.save();
        panelPath(x, tile.x, tile.y, tile.w, tile.h, r);
        x.clip();
        x.drawImage(img, tile.x + (tile.w - iw) / 2, tile.y + (tile.h - ih) / 2, iw, ih);
        // A wash over the tile and the photograph together. These are studio
        // shots on white, and white on an emissive panel clips — which
        // takes the product with it, because the product is the darker thing
        // inside the white. Knocking the whole tile back keeps the contrast
        // that is already in the picture instead of flattening the top of it.
        x.fillStyle = "rgba(0,0,0,.13)";
        x.fillRect(tile.x, tile.y, tile.w, tile.h);
        x.restore();
      } else {
        fetchArt(keyOf(creative), thumbFor(pr.image), pr.image);
      }

      // Whose shop, in the house's own artwork where we have it.
      const logo = art.get(b.slug);
      const cx = wide ? tile.x + tile.w + pad : pad;
      const cw = wide ? W - cx - pad : W - pad * 2;
      const logoH = wide ? H * 0.18 : H * 0.12;
      const logoY = wide ? pad : Math.round(H * 0.045);
      if (logo) {
        const k = Math.min(cw * 0.72 / logo.width, logoH / logo.height);
        x.drawImage(logo, cx, logoY, logo.width * k, logo.height * k);
      } else {
        x.fillStyle = b.ink;
        x.textAlign = "left";
        x.textBaseline = "top";
        fitText(x, b.name.toUpperCase(), cw * 0.9, logoH * 0.7, 700, face);
        x.fillText(b.name.toUpperCase(), cx, logoY);
      }

      /* The piece, then what it costs.
       *
       * A wide board is a strip two or three metres tall seen from a hundred
       * metres away, so it gets one line and no small print. A portrait
       * board has the height for two lines and the sizes underneath, which
       * is the detail that makes this an advertisement for something in a
       * shop rather than a picture of a shirt.
       */
      x.textAlign = "left";
      x.textBaseline = "alphabetic";
      x.fillStyle = b.ink;

      /* Bigger type and less of it on a small screen.
       *
       * The portrait layout gives the name two lines at six per cent of the
       * board's height, which is fine on a desktop where that board is two
       * hundred pixels tall and unreadable on a phone where it is sixty. On
       * the light tier the name gets one line at eight and a half per cent,
       * the price grows with it, and the size run is dropped: at that scale
       * it was four grey pixels pretending to be information.
       */
      const small = QUALITY.light;
      const nameSize = wide ? H * (small ? 0.17 : 0.15) : H * (small ? 0.085 : 0.062);
      const lines = wrapAt(x, pr.name, cw, nameSize, 700, face, (wide || small) ? 1 : 2);
      let ty = wide ? H * 0.62 : H * (small ? 0.72 : 0.70);
      for (const ln of lines) { x.fillText(ln, cx, ty); ty += nameSize * 1.14; }

      const price = `$${Number(pr.price).toFixed(2)}`;
      x.globalAlpha = 0.92;
      x.font = `700 ${Math.round(wide ? H * 0.16 : H * (small ? 0.10 : 0.075))}px ${face}`;
      const priceY = wide ? H * 0.92 : ty + H * 0.035;
      x.fillText(price, cx, priceY);
      x.globalAlpha = 1;

      if (!wide && !small && pr.sizes && pr.sizes.length) {
        const sz = pr.sizes.join("   ");
        x.globalAlpha = 0.58;
        fitText(x, sz, cw, H * 0.045, 600, face);
        x.fillText(sz, cx, priceY + H * 0.058);
        x.globalAlpha = 1;
      }

      ledOverlay(x, W, H);
      return;
    }

    const img = art.get(b.slug);
    if (img) {
      const k = Math.min(W * 0.74 / img.width, H * 0.62 / img.height);
      const w = img.width * k, h = img.height * k;
      x.drawImage(img, (W - w) / 2, H * 0.46 - h / 2, w, h);
    } else {
      // The same fallback the signs use: type now, artwork when it lands.
      const face = getComputedStyle(document.body).fontFamily;
      const label = b.name.toUpperCase();
      x.fillStyle = b.ink;
      x.textAlign = "center";
      x.textBaseline = "middle";
      let size = Math.round(Math.min(H * 0.30, W * 0.22));
      do { x.font = `700 ${size}px ${face}`; size -= 2; }
      while (x.measureText(label).width > W * 0.82 && size > 10);
      x.fillText(label, W / 2, H * 0.46);
    }

    // A strapline, because a board with one word on it reads as a logo test.
    const face = getComputedStyle(document.body).fontFamily;
    x.fillStyle = b.ink;
    x.globalAlpha = 0.6;
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.font = `600 ${Math.round(H * 0.075)}px ${face}`;
    x.fillText(b.note.toUpperCase(), W / 2, H * 0.84);
    x.globalAlpha = 1;

    ledOverlay(x, W, H);
  }

  /**
   * The ticker strip.
   *
   * Laid out once, then squeezed so a whole cycle of the houses lands exactly
   * on the canvas edge. That is the difference between a band that scrolls
   * forever and one that visibly jumps every time it wraps.
   */
  function tickerStrip() {
    const cv = canvas(2048, 96), x = cv.getContext("2d"), W = cv.width, H = cv.height;
    x.fillStyle = "#0b0b0e";
    x.fillRect(0, 0, W, H);
    const face = getComputedStyle(document.body).fontFamily;
    const font = `700 ${Math.round(H * 0.5)}px ${face}`;
    x.font = font;

    /* The district's own words, not a roll-call of the houses.
     *
     * This ran every brand name past every shopfront, which put fourteen
     * other names on the front of whichever shop you happened to be standing
     * at. A ticker is the building's own voice; it says where you are. */
    const WORDS = [
      "DESIGNER DISTRICT", "FIFTEEN DISTRICTS, ONE ADDRESS",
      "DESIGNER DISTRICT", "OPEN LATE",
    ];
    const gap = H * 1.1;
    let total = 0;
    for (const w of WORDS) total += x.measureText(w).width + gap;

    x.setTransform(W / total, 0, 0, 1, 0, 0);
    x.font = font;
    x.textBaseline = "middle";
    let px = 0;
    for (const w of WORDS) {
      x.fillStyle = "#ffc247";
      x.fillText(w, px, H * 0.5);
      px += x.measureText(w).width + gap * 0.5;
      x.fillStyle = "#4a4a52";
      x.beginPath();
      x.arc(px, H * 0.5, H * 0.075, 0, 7);
      x.fill();
      px += gap * 0.5;
    }
    x.setTransform(1, 0, 0, 1, 0, 0);
    ledOverlay(x, W, H);
    return cv;
  }

  const panels = [];          // every board, for the cycle and the clock
  const tickers = [];         // the scrolling bands, which cycle differently
  const frames = [];          // bezels and trusses, merged into one mesh
  const spill = [];           // the few lights that throw board colour about

  /**
   * A dark box behind a panel, so it reads as mounted rather than painted on.
   *
   * Built at the origin and swung round before it is moved into place, so it
   * turns about the board's own centre rather than about the building's.
   */
  function bezel(spec, depth = 0.34) {
    const g = new THREE.BoxGeometry(spec.w + 0.28, spec.h + 0.28, depth);
    g.translate(0, 0, -depth / 2 - 0.02);
    if (spec.tilt) g.rotateY(spec.tilt);
    g.translate(spec.x, spec.y, spec.z);
    return g;
  }

  /** A leg from `foot` up to the underside of a board, following its tilt. */
  function strut(spec, lx, thick, back) {
    const h = spec.y - spec.h / 2 - spec.foot + 0.3;
    const g = new THREE.BoxGeometry(thick, h, thick);
    g.translate(lx, (spec.foot + spec.y - spec.h / 2) / 2 + 0.15 - spec.y, -back);
    if (spec.tilt) g.rotateY(spec.tilt);
    g.translate(spec.x, spec.y, spec.z);
    return g;
  }

  /** Builds one board and hangs it in `parent`'s local space. */
  function makeBoard(parent, spec, reel) {
    const aspect = spec.w / spec.h;
    // Enough pixels to read, sized to the board rather than to a fixed square.
    // Sized to the board rather than to a constant: a twenty-nine metre
    // crown and a five metre tower given the same 512 means one of them is
    // seventeen pixels to the metre and the other is a hundred.
    const long = spec.ticker ? 2048
      : clamp(Math.round(Math.max(spec.w, spec.h) * 42), 384, 1024);
    const cvW = aspect >= 1 ? long : Math.round(long * aspect);
    const cvH = aspect >= 1 ? Math.round(long / aspect) : long;

    let tex, cv = null;
    if (spec.ticker) {
      tex = asTexture(tickerStrip());
      tex.wrapS = THREE.RepeatWrapping;
      tex.repeat.x = Math.max(1, Math.round(spec.w / 7));
    } else {
      cv = canvas(cvW, cvH);
      tex = asTexture(cv);
    }

    const mat = new THREE.MeshStandardMaterial({
      map: tex,
      emissiveMap: tex,
      emissive: 0xffffff,
      emissiveIntensity: 0.35,
      color: 0x0c0c0e,          // the panel itself is black; the light is emissive
      roughness: 0.42,
      metalness: 0,
      toneMapped: true,
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(spec.w, spec.h), mat);
    mesh.position.set(spec.x, spec.y, spec.z);
    if (spec.tilt) mesh.rotation.y = spec.tilt;
    parent.add(mesh);

    const b = {
      mesh, mat, tex, cv,
      reel: reel || SITE_REEL,
      ticker: !!spec.ticker,
      gain: 1,
      norm: 1,
      idx: 0,
      next: Infinity,
      creative: null,
    };
    if (!spec.ticker) panels.push(b);
    else tickers.push(b);
    return b;
  }

  /** Puts creative `i` on board `b` now. */
  function show(b, i) {
    const n = b.reel.length;
    b.idx = ((i % n) + n) % n;
    b.creative = b.reel[b.idx];
    paintCreative(b.cv, b.creative);
    b.tex.needsUpdate = true;
    /* Aimed at putting the bright part of a board near the top of the
     * range rather than past it.
     *
     * The first pass targeted 0.82 with a floor of 0.78, which was set by
     * eye against logo cards and fell apart the moment the boards started
     * carrying photographs: a product tile is a near-white rectangle, so it
     * came out at an emissive of 1.69 and 9.7% of the frame was pinned at
     * pure white with the socks in the picture invisible inside it. Aiming
     * the same statistic at 0.52 lands a white tile just under 1.0, where it
     * is still the brightest thing on the street but has not thrown away the
     * photograph to get there. The ceiling is what lets a black board with
     * white type on it glow. */
    b.norm = clamp(0.52 / Math.max(peakLuma(b.cv), 0.22), 0.42, 1.30);
    if (b.light) b.light.color.set(b.creative.brand.bg[0]);
  }

  // Repaint anything that is currently showing a house whose artwork has just
  // arrived, rather than making it wait for its next turn in the cycle.
  waiting.push((key) => {
    for (const b of panels) {
      const c = b.creative;
      if (!c) continue;
      // A product card carries the house's logo as well as the photograph,
      // so either arriving is a reason to paint it again.
      const mine = c.kind === "site" ? key.startsWith("site-")
                 : key === keyOf(c) || key === c.brand.slug;
      if (mine) {
        paintCreative(b.cv, b.creative);
        b.tex.needsUpdate = true;
      }
    }
  });

  /* ── where they go ────────────────────────────────────────────────────
   *
   * Assigned from a written-out plan rather than by dice. Times Square is
   * not uniform and it is not random either: it is clusters, with gaps you
   * can see the sky through, and the same treatment twice in a row reads as
   * wallpaper. Facade boards sit above the sign band; roof signs stand on
   * scaffolds over the parapet, which is both what that kind of sign
   * actually does and the only way to get a tall portrait board onto an
   * eleven-metre building.
   */
  /* Weighted toward the roof.
   *
   * A roof sign is the only kind that can be turned to face you without
   * leaning over the street: it sits back on the parapet, so even swung
   * forty-seven degrees it stays outside the line the palms are planted on.
   * Since turning them is what made these legible at all, most of the
   * street gets one. */
  const PLAN = [
    "roofTower",  "roofBanner", "ticker", "roofTower",  "twin",
    "roofBanner", "roofTower",  "ticker", "roofTower",  "roofBanner",
    "twin",       "roofBanner", "roofTower", "ticker",  "banner",
  ];

  /* Turned to face the way you are walking, which is the whole difference
   * between a screen and a stripe.
   *
   * These were flat on the facades, and the facades run *parallel* to the
   * street: measured along the camera path, the average board was presenting
   * about twenty degrees of itself to the viewer -- a face-on score of 0.35
   * where 1.0 is square. You saw an edge for the whole approach, then a
   * moment of board as you drew level with it, by which point it was at the
   * side of the frame. The one screen that read properly was the crown at
   * the end of the street, and the only thing different about it is that it
   * faces you.
   *
   * So every board on a building is swung round toward the approach. The
   * exact angle is a trade: at nought degrees you only ever see it from
   * beside, at ninety only from the far end of the street, and the sum of
   * the two is best somewhere near forty-five. Roof signs get more of it
   * because there is nothing up there to swing into; facade boards get less
   * and have to stand further off the wall, because half of the panel would
   * otherwise be inside the building.
   *
   * `side` is -1 on the left terrace and +1 on the right, and the sign of
   * the rotation follows it: both walls turn to look back up the street.
   */
  function layout(kind, H, side) {
    const lo = 7.9, hi = H - 0.45;         // the clear band on the facade
    const band = hi - lo;
    // Far enough off the wall that the swung panel clears the building.
    const clear = (w, tilt) => FACE_Z + Math.abs(Math.sin(tilt)) * w / 2 + 0.25;
    switch (kind) {
      case "banner": {
        /* Flat, and it stays flat.
         *
         * Turning a wide panel means standing it off the wall by half its
         * width times the sine of the angle, and there is nowhere near that
         * much room. On a portrait viewport the street is only 16.8 metres
         * across; a 10.4 metre banner at thirty degrees reached to within
         * 2.4 metres of the centre line, which is two metres past where the
         * alley palms stand and straight through their crowns. A wide board
         * on a narrow street can be flat or it can be small. The angled
         * visibility comes from the roof signs instead, which stand back on
         * the parapet and cost the street nothing. */
        const h = clamp(band * 0.8, 1.5, 3.0);
        return [{ w: 12.4, h, x: 0, y: lo + band / 2, z: FACE_Z }];
      }
      case "twin": {
        // Narrow enough to turn a little without reaching into the street.
        const h = clamp(band * 0.86, 1.6, 4.0);
        const w = 5.7, tilt = side * 0.32, z = clear(w, tilt);
        return [
          { w, h, x: -3.3, y: lo + h / 2 + 0.1, z, tilt },
          { w, h, x:  3.3, y: lo + h / 2 + 0.1, z, tilt },
        ];
      }
      case "ticker":
        // Left flat on purpose. A thirteen-metre strip turned at an angle
        // stops being a band running along the building and becomes a plank.
        return [{ w: 13.2, h: 0.95, x: 0, y: lo + 0.62, z: FACE_Z, ticker: true }];
      case "roofTower":
        return [{ w: 5.2, h: 7.6, x: -2.4, y: H + 4.2, z: ROOF_Z, foot: H, tilt: side * 0.82 }];
      case "roofBanner":
        return [{ w: 11.4, h: 3.6, x: 0, y: H + 2.5, z: ROOF_Z, foot: H, tilt: side * 0.62 }];
      default:
        return [];
    }
  }

  monoliths.forEach((m, i) => {
    // -1 on the left terrace, +1 on the right. Which way a board turns to
    // look back up the street depends on which wall it is bolted to.
    const side = Math.sign(m.x) || 1;
    for (const spec of layout(PLAN[i % PLAN.length], m.height, side)) {
      // The house's own board, or the district's on the tickers.
      const bd = makeBoard(m.group, spec, spec.ticker ? SITE_REEL : ownReel(m.brand));
      if (!spec.ticker) bd.house = m.brand;
      // Bezels and legs are built in the same local space and then baked to
      // world, so all of them together are one draw call rather than sixty.
      const bz = bezel(spec);
      bz.applyMatrix4(m.group.matrixWorld);
      frames.push(bz);
      if (spec.foot !== undefined) {
        // Two legs down to the roof, so the sign is standing on something.
        for (const lx of [-spec.w * 0.34, spec.w * 0.34]) {
          const leg = strut(spec, lx, 0.22, 0.2);
          leg.applyMatrix4(m.group.matrixWorld);
          frames.push(leg);
        }
      }
    }
  });

  /* ── the one at the end of the street ─────────────────────────────────
   *
   * The end block is what you look at down the whole length of the alley, so
   * it gets the board that has to carry the view: a wide crown standing over
   * the parapet with a portrait board either side of it. The five bays below
   * are left exactly as they were. They are the landmark; this is the light
   * above it.
   */
  const endZ = STREET.from + BRANDS.length * STREET.step - 26;
  const crownGroup = new THREE.Group();
  crownGroup.position.set(0, 0, endZ);
  crownGroup.updateMatrixWorld(true);
  scene.add(crownGroup);

  /* Inside the width of the alley, not the width of the block.
   *
   * These started at x plus and minus twenty-one, which is centred on a
   * fifty-six metre facade and completely wrong: the terraces either side
   * only leave about fourteen metres of that facade visible from the street,
   * so both flankers spent their lives behind a building. They now sit just
   * inside the kerb lines, where they frame the crown from every point on
   * the walk down. */
  const CROWN = [
    { w: 22.0, h: 8.0,  x: 0,     y: 22.2, z: 1.0, foot: 17.2 },
    // Outboard of the crown's edge, and set back behind it. At plus and
    // minus 11.6 with the crown 24 wide these overlapped it by three metres
    // and stood proud, so the two of them ate the ends of the wordmark: the
    // sign at the end of the street read "ESIGNER DISTRIC". The gap keeps
    // them clear, and the setback means any overlap that does happen loses
    // to the crown rather than covering it.
    // Toed in a little, so the pair lean into the view down the street
    // instead of standing parallel to the crown between them.
    { w: 5.6, h: 11.6, x: -13.2, y: 23.0, z: 0.6, foot: 17.2, tilt:  0.30 },
    { w: 5.6, h: 11.6, x:  13.2, y: 23.0, z: 0.6, foot: 17.2, tilt: -0.30 },
  ];
  CROWN.forEach((spec, i) => {
    // The crown carries the district; the two flankers are the advertising.
    makeBoard(crownGroup, spec, i === 0 ? SITE_REEL : BRAND_REEL);
    const bz = bezel(spec, 0.5);
    bz.applyMatrix4(crownGroup.matrixWorld);
    frames.push(bz);
    for (const lx of [-spec.w * 0.36, spec.w * 0.36]) {
      const leg = strut(spec, lx, 0.3, 0.35);
      leg.applyMatrix4(crownGroup.matrixWorld);
      frames.push(leg);
    }
  });

  if (frames.length) {
    const fm = new THREE.Mesh(
      mergeGeometries(frames),
      new THREE.MeshStandardMaterial({ color: 0x1a1b1f, roughness: 0.55, metalness: 0.5 })
    );
    fm.castShadow = true;
    scene.add(fm);
  }

  /* ── the colour they throw ────────────────────────────────────────────
   *
   * The half of this that is not the boards themselves. A lit hoarding puts
   * its own colour on the wall opposite and on the pavement underneath, and
   * without that the boards read as stickers on a dark street. Three of
   * them, not fifteen: every point light is paid for by every lit fragment
   * in the scene, and three spaced down a hundred and fifty metres is
   * enough to carry it. */
  if (!QUALITY.light) {
    const n = panels.length;
    const picks = [...new Set([2, Math.floor(n / 3), Math.floor((2 * n) / 3)])];
    for (const b of picks.map((i) => panels[i])) {
      if (!b) continue;
      const w = b.mesh.getWorldPosition(new THREE.Vector3());
      const l = new THREE.PointLight(0xffffff, 0, 34, 1.7);
      l.position.set(w.x, w.y, w.z);
      scene.add(l);
      b.light = l;
      spill.push(l);
    }
  }

  // Stagger the openers so the street is not fifteen boards all showing the
  // same house, and so they do not all change on the same frame afterwards.
  panels.forEach((b, i) => {
    show(b, i * 3 + (i % 2) * 7);
    // A board with one thing to show never changes, and must not take a
    // black frame every eight seconds pretending that it did.
    b.next = b.reel.length > 1 ? 5 + (i % 7) * 1.35 : Infinity;
  });

  let night = 0;
  let lastT = 0;

  /**
   * Hands the boards the catalogue, which turns every house's board from a
   * standing logo into a short campaign for that house's own stock.
   *
   * Called once when the street first has the catalogue and again on every
   * refresh, so a photograph replaced in the admin reaches the hoardings on
   * the same poll that reaches the shelf inside the shop.
   *
   * Still per house: a board only ever gets products belonging to the shop
   * it is bolted to. Two boards on the same building are given different
   * slices of that shop's stock, so a twin does not show the same jacket
   * twice side by side.
   */
  function setCatalogue(brands) {
    if (!brands) return;
    const seen = new Map();
    for (const b of panels) {
      if (!b.house) continue;
      const slug = b.house.slug;
      const nth = seen.get(slug) || 0;
      seen.set(slug, nth + 1);

      const all = (brands[slug] || []).filter((q) => q.image);
      const inStock = all.filter((q) => (q.stock ?? 0) > 0);
      const pool = inStock.length ? inStock : all;
      const reel = [{ kind: "brand", brand: b.house, key: slug }];
      // Two rather than three on the light tier. The bytes are small now,
      // but each one is still a request, and a phone on a cellular link
      // pays for the round trip more than for the payload.
      const want = QUALITY.light ? 2 : 3;
      for (let i = 0; i < Math.min(want, pool.length); i++) {
        const pr = pool[(i + nth * 3) % pool.length];
        reel.push({ kind: "product", brand: b.house, product: pr, key: pr.id });
      }

      // Nothing to advertise: leave the board showing the logo it already is.
      if (reel.length === 1) { b.reel = reel; b.next = Infinity; continue; }

      b.reel = reel;
      if (b.idx >= reel.length) show(b, 0);
      // Staggered, so the street does not turn over all at once the moment
      // the catalogue lands.
      b.next = lastT + 2.5 + (panels.indexOf(b) % 6) * 1.1;
    }
  }

  return {
    panels, tickers, setCatalogue,

    /** Advances the reel and scrolls the tickers. */
    update(dt, t) {
      lastT = t;
      for (const b of panels) {
        if (t > b.next) {
          show(b, b.idx + 1);
          b.next = t + 7.5 + (b.idx % 5) * 1.1;
          b.gain = 0;                       // a beat of black, as a panel changes
        }
        if (b.gain < 1) b.gain = Math.min(1, b.gain + dt * 5);
      }
      if (!QUALITY.still) {
        for (const b of tickers) b.tex.offset.x = (b.tex.offset.x - dt * 0.055) % 1;
      }
      // Not mixNum: that is declared with the clock, a couple of thousand
      // lines below this, and reaching down for a two-term lerp is a
      // temporal dead zone waiting to happen the first time this runs early.
      // Daylight needs more than it looks like it should. Exposure is lower
      // at noon than at midnight, so the same emissive reads as a grey panel
      // in the sun and as a lamp after dark. Both ends are set by eye at the
      // hour they apply to, not derived from one another.
      const lit = 1.15 + (2.0 - 1.15) * night;
      for (const b of panels) b.mat.emissiveIntensity = lit * b.gain * (b.norm || 1);
      for (const b of tickers) b.mat.emissiveIntensity = lit * 1.15;
      for (const l of spill) l.intensity = night * 9;
    },

    /** The clock hands the night level down; everything above reads it. */
    setNight(n) { night = n; },
  };
})();

// ## 19  CAMERA — the scroll path
// Two curves: one the camera rides, one it looks at. Keeping them separate is
// what lets it hold the dome in frame on the approach, then walk in under it
// and away down the street without a snap.
//
// Straight down the axis, and through the dome rather than around it.
//
// The old route swung out to x 13 and came back — a good look at the shell
// from outside, but it treated the dome as an object to be orbited, and it
// arrived at the street sideways. The shell has doors at both ends now, so
// the walk is the obvious one: down the causeway, in under the dome, out the
// back, and into the street on the same line. It also makes the whole
// journey one move instead of two, which is what a visitor's thumb is doing.
//
// x stays at exactly 0 from the near causeway to the far one. The doorway is
// 4.2 wide and the pointer parallax adds up to 1.15 either side, so there is
// nearly a metre of daylight at the jambs — but only because nothing else is
// spending that budget.

const PATH = new THREE.CatmullRomCurve3([
  // Opens close in on the dome, the way the reference frames it, rather than
  // from across an empty apron.
  new THREE.Vector3(0, 3.05, 22),
  new THREE.Vector3(0, 3.05, 16),
  new THREE.Vector3(0, 3.00, 10),
  new THREE.Vector3(0, 2.95, 4),        // the near arch
  new THREE.Vector3(0, 2.90, -1),       // under the shell
  new THREE.Vector3(0, 2.95, -7),       // the far arch
  new THREE.Vector3(0, 3.00, -13),
  new THREE.Vector3(0, 2.95, -21),
  new THREE.Vector3(0, 2.90, -30),
  new THREE.Vector3(0, 2.90, -42),
  new THREE.Vector3(0, 2.90, -68),
  new THREE.Vector3(0, 2.90, -96),
  new THREE.Vector3(0, 3.10, -124),
  new THREE.Vector3(0, 4.40, -150),
  // Stops in the open ground between the last shopfront and the block that
  // closes the street, rather than travelling on through it.
  new THREE.Vector3(0, 6.50, -162),
], false, "catmullrom", 0.4);

// Held on the dome at the top of the page, then let go forward so that by
// the time the camera is at the arch it is already looking through it.
const LOOK = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 5.2, 0),
  new THREE.Vector3(0, 5.0, -3),
  new THREE.Vector3(0, 4.4, -9),
  new THREE.Vector3(0, 3.7, -17),
  new THREE.Vector3(0, 3.2, -27),
  new THREE.Vector3(0, 3.0, -40),
  new THREE.Vector3(0, 3.0, -56),
  new THREE.Vector3(0, 3.0, -84),
  new THREE.Vector3(0, 3.0, -112),
  new THREE.Vector3(0, 3.0, -140),
  new THREE.Vector3(0, 3.4, -172),
  new THREE.Vector3(0, 3.6, -184),
], false, "catmullrom", 0.4);

let scrollTarget = 0;    // 0..1, straight off the scrollbar
let scrollEased = 0;     // what the camera actually follows
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };

function readScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  scrollTarget = max > 0 ? clamp(scrollY / max, 0, 1) : 0;
}
addEventListener("scroll", readScroll, { passive: true });

addEventListener("pointermove", (e) => {
  pointer.tx = (e.clientX / viewW) * 2 - 1;
  pointer.ty = (e.clientY / viewH) * 2 - 1;
}, { passive: true });

// ## 20  POST — bloom
// Only the sun, its glitter on the water and the dome's hot rim should blow
// out, so the threshold sits high and the strength low.

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
let bloomPass = null;
if (QUALITY.bloom) {
  bloomPass = new UnrealBloomPass(new THREE.Vector2(viewW, viewH), 0.42, 0.72, 0.86);
  composer.addPass(bloomPass);
}
composer.addPass(new OutputPass());

// ## 21  PICKING — click a brand
// The overlay is pointer-transparent, so clicks land here. A tap on a monolith
// opens that house.

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const faces = monoliths.map((m) => m.face);

function aimRay(e) {
  ndc.x = (e.clientX / viewW) * 2 - 1;
  ndc.y = -(e.clientY / viewH) * 2 + 1;
  ray.setFromCamera(ndc, camera);
}

/** What is under the pointer: a garment if we are inside, a house if not. */
function under() {
  if (storeMode && storeMode.active) {
    return ray.intersectObjects(storeMode.arts(), false)[0] || null;
  }
  return ray.intersectObjects(faces, false)[0] || null;
}

function pick(e) {
  aimRay(e);
  const hit = under();
  if (!hit) return;
  if (storeMode && storeMode.active) storeMode.pickPanel(hit.object);
  else storeMode.enterBySlug(hit.object.userData.brand.slug);
}
canvasEl.addEventListener("click", pick);

canvasEl.addEventListener("pointermove", (e) => {
  aimRay(e);
  const hit = under();
  // Inside a shop the pointer is over stock, not over a house, and a piece
  // under it lifts off the wall and rings. That is the one bit of the room
  // that answers back before you have committed to anything.
  if (storeMode && storeMode.active) {
    canvasEl.style.cursor = storeMode.hoverPanel(hit && hit.object) ? "pointer" : "";
  } else {
    canvasEl.style.cursor = hit ? "pointer" : "";
  }
}, { passive: true });

// ---- overlay wiring -------------------------------------------------------

const panels = {
  hero:  document.getElementById("p-hero"),
  brands:document.getElementById("p-brands"),
  end:   document.getElementById("p-end"),
};
const card = {
  swatch:  document.getElementById("card-swatch"),
  maker:   document.getElementById("card-maker"),
  eyebrow: document.getElementById("card-eyebrow"),
  name:    document.getElementById("card-name"),
  note:    document.getElementById("card-note"),
  link:    document.getElementById("card-link"),
};
const indexEl = document.getElementById("index");
const pinsEl = document.getElementById("pins");
const hintEl = document.getElementById("hint");
document.getElementById("enter").href = SITE;

/* Buttons, not bold text.
 *
 * This was fifteen `<b>` elements with click handlers hung on them, inside a
 * `<nav aria-label="Districts on this street">` — a navigation region where
 * nothing could be reached by keyboard, nothing announced itself as a
 * control, and nothing said which district you were currently at. */
BRANDS.forEach((b) => {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "ix";
  el.textContent = b.name;
  indexEl.appendChild(el);
});
const indexItems = [...indexEl.children];

/**
 * Which house the card names.
 *
 * This projected every plaque into clip space and picked the nearest one
 * inside the frame. That was the right tool when the houses were free-standing
 * slabs scattered down an open plaza and most of them were off to the side.
 * They are a continuous terrace on a regular pitch now, and position along the
 * street simply *is* what you are looking at, so the answer is arithmetic.
 *
 * The projection version also never settled at the far end. Vale and Hellstar
 * stand on opposite kerbs a few metres apart, and as the camera lifted away at
 * the end of the street both slid in and out of frame, flipping the card
 * between them — forwards and backwards. Two goes at tuning the thresholds
 * moved the flip without removing it; the measure was just too twitchy for the
 * job. This cannot oscillate, because it is monotonic in camera z by
 * construction.
 *
 * LEAD is what keeps the card naming the shop you are walking toward rather
 * than the one already level with your shoulder.
 */
const LEAD = 6;
function readableBrand() {
  const zAhead = camera.position.z - LEAD;               // forward is -z
  const i = Math.round((zAhead - STREET.from) / STREET.step);
  return clamp(i, 0, BRANDS.length - 1);
}

/**
 * A marker per house, pinned to its shopfront and clickable to travel there.
 *
 * The lookup below is what makes "travel there" possible at all. The camera
 * rides a Catmull-Rom curve, so there is no closed form for "which scroll
 * position puts me outside shop seven" — the curve is sampled once at build
 * time into a z-to-progress table, and a click binary-searches it. Sampling
 * beats solving here: the curve is fixed, 400 samples cost nothing, and the
 * answer only has to be good to about a metre.
 */
const TRAVEL = (() => {
  const N = 400, zs = new Float32Array(N + 1), v = new THREE.Vector3();
  for (let i = 0; i <= N; i++) { PATH.getPointAt(i / N, v); zs[i] = v.z; }
  return (targetZ) => {
    // z falls monotonically along the street, so a plain scan is enough and
    // is immune to the wobble at the ends where the path turns.
    let best = 0, bestD = Infinity;
    for (let i = 0; i <= N; i++) {
      const d = Math.abs(zs[i] - targetZ);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best / N;
  };
})();

// How far above the sign the marker floats. Generous: the line is what
// keeps it attached, so the marker is free to sit clear of the shopfront
// instead of on top of its own artwork.
// Lowered from 5.0. The markers floated near the top of the frame, which
// is the part of a phone a thumb cannot reach; the leader line is what
// keeps them attached to the shopfront, so they can sit much closer to it
// and still read as belonging to it.
/**
 * Sets a house's name to fit inside a marker.
 *
 * Seven of the fifteen have no artwork file, and they were showing the
 * first two letters — "SU", "BA", "OF" — which is a puzzle, not a sign.
 * They carry the whole name now, and it has to fit a box 80 by 48 without
 * ever being measured in the document, because the markers are hidden
 * until they are on screen and a hidden element measures zero.
 *
 * So it is measured on a canvas instead, in the page's own face: try it on
 * one line, shrinking; failing that, break at the space and size to the
 * longer half. The same trick the shopfront signs use.
 */
function fitWordmark(name) {
  const c = document.createElement("canvas").getContext("2d");
  const face = getComputedStyle(document.body).fontFamily;
  const txt = name.toUpperCase();
  // The tag's own content box at this breakpoint, less a hair. Measuring
  // against the desktop figures on a phone is how SUPREME, BALENCIAGA,
  // GODSPEED and CASABLANCA came out four pixels wide of their tags.
  const narrow = innerWidth <= 720;
  const maxW = (narrow ? 92 - 20 : 104 - 24) - 4;
  const maxH = (narrow ? 58 - 16 : 66 - 18) - 4;

  // Letter-spacing is not in measureText, so it is added by hand: .03em a gap.
  const width = (str, size) => {
    c.font = `800 ${size}px ${face}`;
    return c.measureText(str).width + str.length * size * 0.03;
  };

  for (let size = 15; size >= 9.5; size -= 0.5) {
    if (width(txt, size) <= maxW) return { size, text: txt };
  }

  const sp = txt.lastIndexOf(" ");
  if (sp > 0) {
    const a = txt.slice(0, sp), b = txt.slice(sp + 1);
    for (let size = 14; size >= 8.5; size -= 0.5) {
      if (Math.max(width(a, size), width(b, size)) <= maxW && size * 2.1 <= maxH) {
        return { size, text: `${a}\n${b}` };
      }
    }
  }
  return { size: 9, text: txt };
}

const PIN_LIFT = 1.7;

// Matches the width in the stylesheet at each breakpoint. Read from a
// constant rather than the element, because asking fifteen buttons for
// their offsetWidth every frame is fifteen forced reflows every frame.
let PIN_W = innerWidth <= 720 ? 92 : 104;
const refits = [];
addEventListener("resize", () => {
  const was = PIN_W;
  PIN_W = innerWidth <= 720 ? 92 : 104;
  if (was !== PIN_W) for (const f of refits) f();
});

const pins = monoliths.map((m, i) => {
  const b = m.brand;
  const el = document.createElement("button");
  el.type = "button";
  el.className = "pin";
  el.style.setProperty("--pin-bg", b.bg[0]);
  el.style.setProperty("--pin-ink", b.ink);
  el.setAttribute("aria-label", `Go to ${b.name}`);
  const art = logoFor(b.slug);
  if (art) {
    const im = document.createElement("img");
    im.src = art;
    im.alt = "";
    el.appendChild(im);
  } else {
    const tag = document.createElement("b");
    const refit = () => {
      const fit = fitWordmark(b.name);
      tag.style.fontSize = `${fit.size}px`;
      tag.textContent = fit.text;
    };
    refit();
    // `fitWordmark` measures against a budget that depends on the pin's
    // width, and the pin narrows at 720. This ran once at build, so crossing
    // that line left every label fitted to the other size — saved from
    // looking broken only by the pill's `overflow: hidden`.
    refits.push(refit);
    el.appendChild(tag);
  }
  el.addEventListener("click", () => {
    sound.click();
    // Stop in front of the shop, not level with it: LEAD is the same offset
    // the card uses to decide which district you are looking at.
    travelTo(TRAVEL(m.z + LEAD));
  });
  // Painted before the button so the line passes under the marker.
  const stem = document.createElement("i");
  stem.className = "stem";
  stem.style.setProperty("--pin-bg", b.bg[0]);
  const tack = document.createElement("i");
  tack.className = "tack";
  tack.style.setProperty("--pin-bg", b.bg[0]);

  pinsEl.appendChild(stem);
  pinsEl.appendChild(tack);
  pinsEl.appendChild(el);
  return { el, stem, tack, m, shown: false };
});

/**
 * Scrolls to a point on the journey in a fixed length of time.
 *
 * Not `behavior: "smooth"`. The document is thirteen screens tall, and the
 * native easing is distance-proportional — a jump from the first house to the
 * last would crawl for several seconds and read as a hang. A waypoint should
 * feel like a waypoint, so this takes the same 700ms whether the shop is next
 * door or at the far end.
 *
 * Any real scroll input cancels it, so grabbing the wheel mid-flight hands
 * control straight back instead of fighting.
 */
let travelling = 0;
let travelStarted = 0;
function travelTo(target) {
  travelStarted = performance.now();
  const max = document.documentElement.scrollHeight - innerHeight;
  const from = window.scrollY;
  const to = clamp(target, 0, 1) * max;
  if (QUALITY.still || Math.abs(to - from) < 2) { scrollTo(0, to); return; }

  const id = ++travelling;
  const t0 = performance.now();
  const DUR = 700;
  let last = from;

  const tick = (now) => {
    if (id !== travelling) return;
    // If the page moved for any reason other than this tween, the visitor did
    // it — stand down.
    if (Math.abs(window.scrollY - last) > 2) return;
    const k = Math.min((now - t0) / DUR, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    last = from + (to - from) * e;
    scrollTo(0, last);
