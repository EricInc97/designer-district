   * the fog was only half of it: the room is in the same scene as the
   * street and the street's sun, sky and bounce were falling on it too.
   * Chrome Hearts has walls at #16171c and was opening as a pale grey box.
   * A shop four metres wide lit by a 2.6 directional and a 0.96 hemisphere
   * has no contrast left for three lamps to work with.
   *
   * These are held rather than set once, for the same reason the borrowed
   * lamps are: the clock rewrites all of them every few minutes.
   *
   * `indoor` runs 0 to 1 so the change arrives while the camera is walking
   * through the doorway. Snapped, it is a light switch going off in the
   * street behind you.
   */
  let indoor = 0;
  const outdoors = { sun: 0, hemi: 0, bounce: 0 };

  function holdLights() {
    if (!borrowed.length) return;
    for (const b of borrowed) b.l.intensity = b.power;
    const k = indoor;
    sun.intensity = outdoors.sun * (1 - 0.90 * k);
    hemi.intensity = outdoors.hemi * (1 - 0.86 * k);
    bounce.intensity = outdoors.bounce * (1 - 0.86 * k);
  }

  function lightsOn(conf) {
    outdoors.sun = sun.intensity;
    outdoors.hemi = hemi.intensity;
    outdoors.bounce = bounce.intensity;
    for (let i = 0; i < LAMPS.length && i < streetLamps.length; i++) {
      const l = streetLamps[i];
      borrowed.push({
        l, power: LAMPS[i][3],
        pos: l.position.clone(), col: l.color.clone(),
        intensity: l.intensity, distance: l.distance, decay: l.decay,
      });
      v3.set(LAMPS[i][0], LAMPS[i][1], LAMPS[i][2]).applyMatrix4(storeRoom.group.matrixWorld);
      l.position.copy(v3);
      // Halfway to white. A saturated bulb plus saturated walls is a room
      // seen through a gel, which is what the tint was.
      l.color.set(conf.lamp).lerp(WHITE, 0.45);
      l.distance = 22;
      l.decay = 1.7;
      l.intensity = LAMPS[i][3];
    }
  }

  function lightsOff() {
    indoor = 0;
    // Straight back to whatever the clock says, rather than to whatever it
    // said when this shop was opened.
    applyTimeOfDay(currentHour);
    for (const b of borrowed) {
      b.l.position.copy(b.pos);
      b.l.color.copy(b.col);
      b.l.intensity = b.intensity;
      b.l.distance = b.distance;
      b.l.decay = b.decay;
    }
    borrowed.length = 0;
  }

  // ── the listing ───────────────────────────────────────────────────────

  /**
   * Cuts the house into sections and gives each one a bay.
   *
   * Shirts on the back wall wherever a house has them, because that is
   * what you are facing when you walk in and it is what people came for.
   * Chrome Hearts has thirty-two accessories against twenty shirts, so
   * ranking by count opened it on a wall of socks. Without shirts the
   * biggest section takes the wall instead.
   *
   * After the hero they run in the canonical order, so every shop reads
   * the same way round. There are three bays; a house with more sections
   * than that folds the tail into one marked "More", which is one house in
   * fifteen and is still better than a section with nowhere to be.
   */
  function sectionsOf() {
    const counts = new Map();
    for (const it of stock) counts.set(it.cat, (counts.get(it.cat) || 0) + 1);
    const present = CAT_ORDER.filter((c) => counts.has(c));
    if (!present.length) return [];

    const BAYS = storeRoom.bays.length;
    const label = (c) => (stock.find((it) => it.cat === c) || {}).catName || c;
    const of = (c) => stock.filter((it) => it.cat === c);

    const ranked = present.slice().sort((a, b) => counts.get(b) - counts.get(a));
    const hero = present.includes("shirts") ? "shirts" : ranked[0];

    if (present.length <= BAYS) {
      const rest = CAT_ORDER.filter((c) => present.includes(c) && c !== hero);
      return [hero, ...rest].map((c) => ({ key: c, label: label(c), items: of(c) }));
    }

    const keep = [hero, ...ranked.filter((c) => c !== hero)].slice(0, BAYS - 1);
    const spare = present.filter((c) => !keep.includes(c));
    const ordered = CAT_ORDER.filter((c) => keep.includes(c) && c !== hero);
    return [
      { key: hero, label: label(hero), items: of(hero) },
      ...ordered.map((c) => ({ key: c, label: label(c), items: of(c) })),
      { key: "other", label: "More", items: stock.filter((it) => spare.includes(it.cat)), spare },
    ];
  }

  /** Walks the camera round to a section, or back to where it was looking. */
  function goToBay(bay) {
    if (!bay) return;
    hereBay = bay;
    clearFocus();
    frameBay(bay);
  }

  function buildCats() {
    const counts = new Map();
    for (const it of stock) counts.set(it.cat, (counts.get(it.cat) || 0) + 1);
    const present = CAT_ORDER.filter((c) => counts.has(c));

    catsEl.textContent = "";
    // One category is not a filter, it is a label — and a row of chips that
    // cannot change anything is just something else covering the room.
    catsEl.style.display = present.length > 1 ? "flex" : "none";
    if (present.length < 2) return;

    const chip = (key, label, n) => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "cat";
      el.dataset.key = key;
      el.dataset.live = key === cat ? "1" : "0";
      el.setAttribute("aria-pressed", key === cat ? "true" : "false");
      el.textContent = label;
      const num = document.createElement("i");
      num.textContent = String(n);
      el.appendChild(num);
      el.addEventListener("click", () => setCat(key));
      catsEl.appendChild(el);
    };

    chip("all", "All", stock.length);
    for (const c of present) {
      chip(c, stock.find((it) => it.cat === c).catName, counts.get(c));
    }
  }

  /** Keeps the shelf clear of the shop bar, whose height varies with type. */
  function measureChrome() {
    requestAnimationFrame(() => {
      const h = topEl ? topEl.getBoundingClientRect().height : 62;
      shopEl.style.setProperty("--topbar", `${Math.round(h)}px`);
      if (picked < 0) standBack();
    });
  }
  addEventListener("resize", () => { if (active) measureChrome(); });

  function setCat(key) {
    if (key === cat) return;
    cat = key;
    for (const el of catsEl.children) {
      const on = el.dataset.key === key;
      el.dataset.live = on ? "1" : "0";
      el.setAttribute("aria-pressed", on ? "true" : "false");
    }
    sound.click();
    applyFilter();
  }

  /**
   * Re-cuts the listing and walks to the section it belongs to.
   *
   * The wall is not re-hung. That is the whole change: a bay is a place in
   * the shop with one section's stock on it, and it keeps that stock until
   * you leave. Filtering moves you; it does not rearrange the room around
   * you.
   */
  function applyFilter() {
    items = cat === "all" ? stock.slice() : stock.filter((it) => it.cat === cat);
    buildGrid();
    picked = -1;
    clearFocus();
    gridEl.scrollTop = 0;

    // `buildGrid` throws the whole list away and builds a new one, which is
    // silent — so this is the only thing that says the filter did anything.
    const named = cat === "all"
      ? "All sections"
      : ((stock.find((it) => it.cat === cat) || {}).catName || cat);
    announce(`${named}. ${items.length} ${items.length === 1 ? "piece" : "pieces"}.`);

    if (cat === "all") {
      // Every bay back to the section it was given at the door.
      for (const b of storeRoom.bays) storeRoom.borrow(b, null);
      goToBay(storeRoom.bays[0]);
      return;
    }

    let bay = storeRoom.bayFor(cat);
    if (!bay) {
      const stand = storeRoom.bays.find(
        (b) => (b.base && b.base.spare && b.base.spare.includes(cat)));
      if (stand) {
        const label = (stock.find((it) => it.cat === cat) || {}).catName || cat;
        storeRoom.borrow(stand, { key: cat, label, items: items.slice() });
        bay = stand;
      }
    }
    goToBay(bay || storeRoom.bays[0]);
  }

  /**
   * The catalogue.
   *
   * Two columns of cards scrolled vertically, hairline-ruled, which is how
   * the storefront lists a house — a horizontal filmstrip made you drag
   * sideways through fifty-two pieces to find one. Tapping a card opens its
   * sizes and its way through to the product page inside the card itself,
   * so there is no second floating panel over the room.
   */
  /**
   * What the shelf is showing, which is not always stock.
   *
   * Order matters: a failed fetch beats an empty house, because an empty
   * house is a fact about the house and a failed fetch is a fact about the
   * network, and confusing the two is exactly what this is here to stop.
   */
  function shelfKind() {
    if (catalogueState === "failed") return "failed";
    if (catalogueState === "loading" && !stock.length) return "loading";
    if (!items.length) return "empty";
    return "stock";
  }

  /** Six grey cards, or a sentence explaining why there are none. */
  function shelfNote(kind) {
    if (kind === "loading") {
      for (let k = 0; k < 6; k++) {
        const el = document.createElement("div");
        el.className = "skel";
        el.setAttribute("aria-hidden", "true");
        el.innerHTML = '<span class="p"></span><span class="t"></span><span class="u"></span>';
        gridEl.appendChild(el);
      }
      gridEl.setAttribute("aria-busy", "true");
      return;
    }

    gridEl.removeAttribute("aria-busy");
    const note = document.createElement("div");
    note.className = "note";
    const line = document.createElement("p");

    if (kind === "failed") {
      line.textContent = "The catalogue could not be loaded. This is a connection problem, not an empty shop.";
      const again = document.createElement("button");
      again.type = "button";
      again.className = "pill";
      again.textContent = "Try again";
      again.addEventListener("click", () => {
        const b = monoliths[house] && monoliths[house].brand;
        if (!b) return;
        // The fetch goes first, because it is what moves the state off
        // "failed" — rebuilding before it would render the same error back
        // and the button would look like it had done nothing.
        const back = catalogueSettled();
        buildGrid();                       // now: the skeleton
        back.then(() => {
          if (house < 0 || monoliths[house].brand !== b) return;
          fill(b);
          measureChrome();
          if (active) standBack();
        });
      });
      note.append(line, again);
    } else {
      line.textContent = cat === "all"
        ? "Nothing on the shelves here yet."
        : "Nothing in this section.";
      const out = document.createElement("a");
      out.className = "pill";
      out.href = SITE;
      out.textContent = "Browse the whole store";
      note.append(line, out);
    }
    gridEl.appendChild(note);
  }

  function buildGrid() {
    gridEl.textContent = "";
    cards = [];
    const kind = shelfKind();
    if (kind !== "stock") { shelfNote(kind); gridEl.scrollTop = 0; return; }
    gridEl.removeAttribute("aria-busy");
    cards = items.map((it, i) => {
      const card = document.createElement("article");
      card.className = "card";
      card.setAttribute("role", "listitem");
      card.dataset.gone = it.stock > 0 ? "0" : "1";
      card.dataset.live = "0";

      const hit = document.createElement("button");
      hit.type = "button";
      hit.className = "hit";
      // Sold out belongs in the name. It was in the body text inside
      // `.more`, which is `display: none` until the card is opened — so a
      // sold-out piece read as available right up until you chose it. And
      // the button reveals that panel, which is what aria-expanded is for.
      hit.setAttribute("aria-label",
        `${it.name}, ${money.format(it.price)}${it.stock > 0 ? "" : ", sold out"}`);
      hit.setAttribute("aria-expanded", "false");

      const pic = document.createElement("span");
      pic.className = "pic";
      const img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = "";
      img.src = it.image;
      pic.appendChild(img);

      const nm = document.createElement("b");
      nm.textContent = it.name;
      const pr = document.createElement("i");
      pr.textContent = money.format(it.price);
      hit.append(pic, nm, pr);
      hit.addEventListener("click", () => choose(i, false));

      const more = document.createElement("div");
      more.className = "more";
      const sizes = document.createElement("div");
      sizes.className = "sizes";
      for (const sz of it.sizes || []) {
        const el = document.createElement("span");
        el.textContent = sz;
        sizes.appendChild(el);
      }
      const stockLine = document.createElement("p");
      stockLine.className = "stock";
      stockLine.textContent = it.stock > 0 ? `${it.stock} in stock` : "Sold out";
      const link = document.createElement("a");
      link.className = "pill";
      link.href = `${SITE}/products/${it.id}`;
      link.textContent = "View on the store";
      more.append(sizes, stockLine, link);

      card.append(hit, more);
      gridEl.appendChild(card);
      return card;
    });
    gridEl.scrollTop = 0;
  }

  // The one panel currently pushed forward with a ring round it, whether
  // that came from the pointer or from the rail.
  let focused = null;

  function clearFocus() {
    if (focused) storeRoom.highlight(focused, false);
    focused = null;
    storeRoom.label(null);
  }

  /** Pushes a panel forward, rings it and hangs its price beside it. */
  function focus(pn) {
    if (focused && focused !== pn) storeRoom.highlight(focused, false);
    focused = pn;
    storeRoom.highlight(pn, true);
    storeRoom.label(pn, pn.product, money.format(pn.product.price));
  }

  /**
   * Selects one piece: the card opens, the camera steps up to it.
   *
   * If the piece is on a wall it goes to it. If its section's bay is
   * showing a different page of itself, the bay turns to the page it is on
   * first — which is a deliberate act now rather than something the
   * scrollbar does behind you.
   */
  function choose(i, scrollTo) {
    if (i < 0 || i >= items.length) return;
    const again = picked === i;
    picked = again ? -1 : i;

    cards.forEach((c, k) => {
      const on = k === picked;
      c.dataset.live = on ? "1" : "0";
      const h = c.querySelector(".hit");
      if (h) h.setAttribute("aria-expanded", on ? "true" : "false");
    });
    if (picked < 0) { clearFocus(); standBack(); return; }

    const it = items[picked];
    if (scrollTo && cards[picked]) {
      cards[picked].scrollIntoView({
        behavior: QUALITY.still ? "auto" : "smooth", block: "nearest",
      });
    }

    let pn = storeRoom.panelFor(it);
    if (!pn) {
      const bay = storeRoom.bays.find((b) => (b.items || []).includes(it));
      if (bay) {
        const k = bay.items.indexOf(it);
        storeRoom.show(bay, Math.floor(k / bay.panels.length));
        hereBay = bay;
        pn = storeRoom.panelFor(it);
      }
    }
    if (pn) { focus(pn); hereBay = pn.bay; standAt(pn); }
    else standBack();
  }

  function clearPick() {
    picked = -1;
    cards.forEach((c) => {
      c.dataset.live = "0";
      const h = c.querySelector(".hit");
      if (h) h.setAttribute("aria-expanded", "false");
    });
    clearFocus();
    standBack();
  }

  /* Scrolling points, it does not rearrange.
   *
   * This used to turn the wall over: the card nearest the middle of the
   * rail decided which twelve pieces were hanging, so reading down a house
   * of fifty-two changed the artwork in the room four times. The complaint
   * was that the images kept changing, and they did — with the room full
   * of moving pictures there was no way to tell what you were looking at
   * from one second to the next.
   *
   * Now the walls hold still and the room points at what you are reading
   * instead. If the piece under the middle of the rail happens to be
   * hanging, it rings and steps forward; if it is not, nothing moves.
   */
  let gridTick = 0;
  gridEl.addEventListener("scroll", () => {
    if (!active || gridTick || picked >= 0) return;
    gridTick = requestAnimationFrame(() => {
      gridTick = 0;
      if (!cards.length) return;
      const mid = gridEl.scrollTop + gridEl.clientHeight / 2;
      let idx = 0, best = Infinity;
      for (let k = 0; k < cards.length; k++) {
        const c = cards[k];
        const d = Math.abs(c.offsetTop + c.offsetHeight / 2 - mid);
        if (d < best) { best = d; idx = k; }
      }
      const pn = storeRoom.panelFor(items[idx]);
      if (pn) focus(pn); else clearFocus();
    });
  }, { passive: true });

  // ── doors ─────────────────────────────────────────────────────────────
  function lockScroll(on) {
    document.documentElement.style.overflow = on ? "hidden" : "";
    document.body.style.overflow = on ? "hidden" : "";
  }

  /* Keeping up with the shop floor.
   *
   * A catalogue fetched once and kept for the session is right for a page
   * nobody is editing behind. It is wrong here: photographs get replaced
   * and products get added while somebody is standing in the shop looking
   * at the wall, and until now the only way to see any of it was a reload.
   *
   * So it is asked again — on a timer while the tab is visible, faster
   * with a shop open than on the street, and immediately on coming back to
   * the tab, which is the one moment the visitor is certain something has
   * changed because they are the one who changed it. A refetch that finds
   * nothing new costs one string comparison and touches no DOM at all.
   */
  const POLL = 20000;
  let pollTimer = 0;

  /** Everything about a house's stock that the room can show. */
  function signature(list) {
    return (list || []).map((it) =>
      `${it.id}\u0001${it.image}\u0001${it.price}\u0001${it.stock}\u0001${it.name}\u0001${it.cat}`
    ).join("\u0002");
  }

  /**
   * Refetches, and if this house changed, puts the change on the wall.
   *
   * Everything the visitor is in the middle of is picked up and put back:
   * which section they are filtered to, which piece is open, where the rail
   * is scrolled, and which bay the camera is standing at. Done naively this
   * is a full rebuild, and a full rebuild in front of somebody reading a
   * price is worse than the stale picture it was fixing.
   */
  async function refresh(opts = {}) {
    if (busy) return false;
    const b = house >= 0 ? monoliths[house].brand : null;
    const before = b ? signature(stock) : null;
    const wasUrls = new Set((stock || []).map((it) => it.image));

    try {
      await loadCatalogue({ fresh: true, bust: opts.bust });
      // Whatever just changed, the boards outside are advertising it too.
      boards.setCatalogue(catalogue);
    } catch {
      return false;                       // the shelf already says so
    }
    if (!b || house < 0 || !active) return true;

    const now = (catalogue && catalogue[b.slug]) || [];
    if (signature(now) === before) return true;   // nothing moved

    // Where they were, before any of it is pulled apart.
    const wasCat = cat;
    const wasPicked = picked >= 0 && items[picked] ? items[picked].id : null;
    const wasScroll = gridEl.scrollTop;
    const wasBay = hereBay ? hereBay.cat : null;

    fill(b);

    // Pictures that are no longer anywhere in this house go back to the
    // network if they ever return, rather than sitting on the GPU.
    for (const url of wasUrls) {
      if (!stock.some((it) => it.image === url)) storeRoom.forget(url);
    }

    // The filter, if that section still exists.
    if (wasCat !== "all" && stock.some((it) => it.cat === wasCat)) {
      cat = wasCat;
      for (const el of catsEl.children) {
        const on = el.dataset.key === wasCat;
        el.dataset.live = on ? "1" : "0";
        el.setAttribute("aria-pressed", on ? "true" : "false");
      }
      items = stock.filter((it) => it.cat === wasCat);
      buildGrid();
    }

    hereBay = storeRoom.bayFor(wasBay) || storeRoom.bays[0];
    gridEl.scrollTop = wasScroll;
    measureChrome();

    const again = wasPicked != null ? items.findIndex((it) => it.id === wasPicked) : -1;
    picked = -1;
    if (again >= 0) choose(again, false);
    else { clearFocus(); standBack(); }

    announce(`${b.name} updated. ${stock.length} pieces.`);
    return true;
  }

  function schedulePoll() {
    clearTimeout(pollTimer);
    /* Only with a shop open, and only while the tab is being looked at.
     *
     * On the street nothing on screen is fed by the catalogue, so polling
     * out there is a request every twenty seconds to change nothing — and
     * the freshness check on the way in already covers anything that
     * happened while the visitor was outside. */
    if (document.hidden || !active) return;
    pollTimer = setTimeout(async () => {
      await refresh();
      schedulePoll();
    }, POLL);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearTimeout(pollTimer); return; }
    // Straight past the edge cache: somebody coming back to this tab has
    // almost certainly just come from the one they were editing in.
    if (active) refresh({ bust: true });
    schedulePoll();
  });

  /* The hoardings outside want this too.
   *
   * Nothing fetched the catalogue until somebody walked into a shop, which
   * was right while the only thing reading it was the shelf. The boards over
   * the street advertise stock now, so the street itself needs it: one
   * request on load, shared with whichever shop is entered first, and a
   * failure leaves every board showing its house's logo, which is exactly
   * what they showed before this existed. */
  loadCatalogue()
    .then((c) => boards.setCatalogue(c))
    .catch(() => {});

  /** Loads a house's stock into the listing, the chips and the sections. */
  function fill(b) {
    stock = (catalogue && catalogue[b.slug]) ? catalogue[b.slug].slice() : [];
    cat = "all";
    items = stock.slice();

    // A house with nothing to hang used to open as a bare lit room, which
    // reads as broken whatever the cause. One empty case with a sign on it
    // at least says which kind of nothing this is.
    const secs = sectionsOf();
    storeRoom.layout(secs.length ? secs : [{
      key: "other",
      label: catalogueState === "failed" ? "Unavailable"
           : catalogueState === "loading" ? "Loading"
           : "No stock",
      items: [],
    }], b);

    hereBay = storeRoom.bays[0];
    buildCats();
    buildGrid();
  }

  async function enter(i, opts = {}) {
    if (busy || active || i < 0 || i >= monoliths.length) return;
    busy = true;
    const m = monoliths[i];
    const b = m.brand;
    cameFrom = document.activeElement !== document.body ? document.activeElement : null;
    if (!opts.quiet) urlEnter(b.slug);

    sound.click();

    // There is no wipe over any of this now — the walk in is one continuous
    // shot from the pavement to the stock — so the two things a wipe was
    // covering have to be dealt with instead of hidden.
    //
    // The first is the fetch. It is warmed at load and kept after the first
    // shop, so it is normally already in hand; when it is not the click gets
    // seven tenths of a second and then the room opens with the shelf saying
    // what it is waiting for. The cursor carries that seven tenths — it used
    // to be a button that had simply stopped responding.
    // If what we are holding is older than the edge would have served
    // anyway, ask again on the way in rather than opening on last hour's
    // stock. Fresh enough, and this costs nothing.
    const stale = Date.now() - catalogueAt > 30000;
    const catalogueReady = stale ? loadCatalogue({ fresh: true }).catch(() => null)
                                 : catalogueSettled();
    document.body.dataset.busy = "1";
    shopEl.setAttribute("aria-busy", "true");
    await Promise.race([catalogueReady, wait(700)]);
    delete document.body.dataset.busy;
    shopEl.removeAttribute("aria-busy");

    // The second is the layout. Building the shelf and measuring it costs a
    // couple of hundred milliseconds of main thread, and that has to land
    // inside the click, where a pause reads as the page responding, rather
    // than inside the move, where it would read as a stutter.
    house = i;
    const conf = storeRoom.dress(m);
    fill(b);
    measureChrome();

    const art = logoFor(b.slug);
    markEl.textContent = "";
    markEl.style.background = `linear-gradient(135deg, ${b.bg[0]}, ${b.bg[1]})`;
    if (art) {
      const im = document.createElement("img");
      im.src = art; im.alt = "";
      markEl.appendChild(im);
    } else {
      const sp = document.createElement("span");
      sp.style.color = b.ink;
      sp.textContent = b.name.slice(0, 2).toUpperCase();
      markEl.appendChild(sp);
    }
    nameEl.textContent = b.name;

    // Lit, dressed and standing behind its own doorway before the camera
    // has moved a metre — which is the whole point. The panel that closes
    // that doorway from the street is the one thing in the way, and it
    // comes out for the duration.
    storeRoom.group.visible = true;
    lightsOn(conf);
    doorBacks.hide(i);

    savedScroll = window.scrollY;
    lockScroll(true);
    picked = -1;

    // The back wall's section fills in while the doors are still opening,
    // since that is the one the walk in is pointed at. The side bays have
    // the length of the walk plus however long it takes somebody to turn
    // round, which is longer than a picture needs.
    storeRoom.preload((storeRoom.bays[0].items || []).slice(0, BAY_MAX));

    // And if the catalogue lost the race above, the room catches up — or
    // the shelf says the fetch failed, which `fill` now reads off the
    // catalogue's own state rather than inferring from an empty object.
    if (stock.length === 0) {
      catalogueReady.then(() => {
        if (house !== i) return;
        fill(b);
        measureChrome();
        if (active) standBack();
      });
    }

    await walkIn(i, opts.instant);

    // The camera is already inside and already pointed at the back wall;
    // all that is left is to let the room's own framing take it the last
    // metre, which `aim` does by easing towards it.
    standBack();
    active = true;
    seq = null;
    shopEl.dataset.on = "1";
    shopEl.setAttribute("aria-hidden", "false");
    schedulePoll();            // there is a wall to keep current now

    /* Focus was not merely un-moved before — it was destroyed.
     *
     * The thing you activate to get in here is the card's pill, which lives
     * in `#p-brands`; the frame loop then sets that panel to `data-on="0"`,
     * which is `visibility: hidden`, so the focused element stopped existing
     * mid-animation and focus fell back to `<body>` with nothing announced.
     * It is remembered on the way in and given back on the way out. */
    outsideInert(true);
    const outEl = document.getElementById("shop-out");
    if (outEl) outEl.focus({ preventScroll: true });
    announce(`Inside ${b.name}. ${stock.length} pieces.`);
    canvasEl.setAttribute("aria-label", `Inside the ${b.name} shop, seen in 3D`);

    busy = false;
  }

  async function leave(opts = {}) {
    if (busy || !active) return;
    busy = true;
    if (!opts.quiet) urlLeave();

    const i = house;

    /* The overlay goes first, and `active` with it.
     *
     * Dropping `active` here is what hands the camera to the sequence
     * branch in `aim`; `walkOut` sets `seq` synchronously in the same task,
     * so `controlling` never goes false in between and the scroll path
     * never gets a frame to snap the camera back with.
     */
    active = false;
    hover = null;
    clearFocus();
    shopEl.dataset.on = "0";
    shopEl.setAttribute("aria-hidden", "true");
    outsideInert(false);
    canvasEl.setAttribute("aria-label", "A street of fifteen shopfronts, seen in 3D");

    await walkOut(i);

    // Only now: the doors are shut, so putting the lit panel back behind
    // them and taking the room away is not something anybody can see.
    seq = null;
    doors.set(i, 0);
    doorBacks.show(i);
    storeRoom.group.visible = false;
    lightsOff();
    house = -1;

    lockScroll(false);
    scrollTo(0, savedScroll);
    /* Back where it came from — but not this instant.
     *
     * The element that was activated lives in a `.panel`, and the panels are
     * `visibility: hidden` for as long as the frame loop thinks we are
     * inside a shop. It does not think that any more, but it has not run
     * since; and `focus()` on something inside a hidden subtree is simply
     * refused, silently, which is how this landed on `<body>` the first
     * time. So it tries again for a few frames and gives up quietly.
     */
    const back = cameFrom;
    cameFrom = null;
    if (back && document.contains(back)) {
      let tries = 12;
      const give = () => {
        if (!back.isConnected || active) return;
        back.focus({ preventScroll: true });
        if (document.activeElement !== back && --tries > 0) requestAnimationFrame(give);
      };
      requestAnimationFrame(give);
    }
    readScroll();
    scrollEased = scrollTarget;
    busy = false;
    schedulePoll();            // which is to say: stop, there is no wall
  }

  document.getElementById("shop-out").addEventListener("click", leave);
  addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (picked >= 0) clearPick(); else leave();
  });

  /* Tab wraps inside the shop rather than walking out of it.
   *
   * `inert` on everything outside is what actually removes those stops; this
   * is the other half — without it, Tab off the last card lands on the
   * browser chrome and the next Tab comes back at the top of the document
   * rather than at the top of the shop.
   */
  addEventListener("keydown", (e) => {
    if (e.key !== "Tab" || !active) return;
    const stops = [...shopEl.querySelectorAll(
      'button, a[href], input, [tabindex]:not([tabindex="-1"])',
    )].filter((el) => el.offsetParent !== null && !el.disabled);
    if (!stops.length) return;
    const first = stops[0], last = stops[stops.length - 1];
    if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    } else if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    }
  });

  return {
    get active() { return active; },
    get busy() { return busy; },
    /** Which house is open, or -1. The URL router needs to know. */
    get house() { return house; },
    /** Asks the catalogue again now. `DD.store.refresh()` from the console. */
    refresh,
    /** True whenever the camera belongs to this — the walk in included. */
    get controlling() { return active || seq !== null; },

    /** After the room has been rebuilt under us. */
    reframe() {
      if (!active) return;
      hereBay = storeRoom.bayFor(cat) || storeRoom.bays[0];
      picked = -1;
      clearFocus();
      buildGrid();
      standBack();
    },
    enter,
    leave,
    enterBySlug(slug, opts) {
      enter(monoliths.findIndex((m) => m.brand.slug === slug), opts);
    },
    arts: () => storeRoom.arts,
    pickPanel(mesh) {
      const pn = storeRoom.panels.find((p) => p.art === mesh);
      if (!pn || !pn.product) return;
      sound.click();
      const i = items.indexOf(pn.product);
      // A piece can be on a wall and filtered out of the rail at the same
      // time — you are looking at the denim bay with the shirts chip on.
      // Clicking it clears the filter rather than doing nothing.
      if (i < 0) { setCat("all"); }
      choose(items.indexOf(pn.product), true);
    },

    /** The pointer, moving over the room. Returns true when it found one. */
    hoverPanel(mesh) {
      const pn = mesh && storeRoom.panels.find((p) => p.art === mesh);
      const next = pn && pn.product ? pn : null;
      if (next === hover) return !!next;
      // The selection wins over the pointer: a piece that is open stays
      // open when the mouse wanders off it.
      if (hover && hover !== focused) storeRoom.highlight(hover, false);
      hover = next;
      if (hover && hover !== focused) storeRoom.highlight(hover, true);
      return !!next;
    },
    /** Writes this frame's camera. Also holds the borrowed lamps in place,
     *  because the clock reassigns every street lamp every few minutes. */
    aim(dt, outPos, outLook) {
      storeRoom.settle(dt);
      if (stepSeq(dt, outPos, outLook)) { holdLights(); return; }
      const k = Math.min(1, dt * 3.6);
      curPos.lerp(tgtPos, k);
      curLook.lerp(tgtLook, k);
      outPos.copy(curPos);
      outLook.copy(curLook);
      indoor = 1;
      holdLights();
    },
  };
})();

// One door, one handle.
//
// The waypoints used to walk you in as well, and it was wrong: a marker
// floating over a shopfront reads as "take me there", not "take me inside",
// and being dropped into a room because you tapped a pin to look at it is a
// hijacking. Waypoints travel. The running order travels. Going in is the
// pill that says, in words, which shop you are about to be standing in.
card.link.addEventListener("click", (e) => {
  const i = Number(card.link.dataset.house);
  if (!Number.isFinite(i) || i < 0) return;
  e.preventDefault();
  storeMode.enter(i);
});

indexItems.forEach((el, i) => {
  // No `pointerEvents = "auto"` here any more. `.index` hid itself with
  // opacity alone, and forcing each child to stay hittable meant that when
  // it was "hidden" there were still fifteen invisible, clickable,
  // focusable targets stacked down the right-hand side of the screen,
  // swallowing clicks meant for the street behind them. The CSS handles
  // both now.
  el.addEventListener("click", () => {
    sound.click();
    travelTo(TRAVEL(monoliths[i].z + LEAD));
  });
});



/* And a link somebody was sent — or typed.
 *
 * No walk in: there is no street to walk from yet, and two and a third
 * seconds of camera in front of a page that was opened *at* a shop is a
 * wait, not an arrival. The street is put where that house is first, so
 * that leaving lands you outside it rather than back at the hero.
 */
function houseInHash() {
  const slug = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
  return slug ? monoliths.findIndex((m) => m.brand.slug === slug) : -1;
}

function openFromHash(placeStreet) {
  if (storeMode.busy) return;          // `settleRoute` will come back
  const i = houseInHash();

  if (i < 0) {
    if (storeMode.active) storeMode.leave({ quiet: true });
    return;
  }
  // Already in the right shop, or in the wrong one. Editing the address bar
  // from one house to another should move you, which means stepping out of
  // the first before stepping into the second.
  if (storeMode.active) {
    if (storeMode.house === i) return;
    storeMode.leave({ quiet: true }).then(() => settleRoute());
    return;
  }

  if (placeStreet) {
    const max = document.documentElement.scrollHeight - innerHeight;
    scrollTo(0, clamp(TRAVEL(monoliths[i].z + LEAD), 0, 1) * max);
    readScroll();
    scrollEased = scrollTarget;
  }
  // One frame, so the camera is on the house before the room takes over.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => storeMode.enter(i, { instant: true, quiet: true }));
  });
}

/**
 * Waits for whatever is in flight, then routes.
 *
 * Both events below can land in the middle of a walk-in or a walk-out, and
 * dropping the request when that happens is how a hash change to another
 * shop left the first one and never opened the second. The URL is a
 * destination; if we are busy we are not there yet, so it keeps until we
 * are. Capped, because a wedged transition should not spin forever.
 */
function settleRoute(frames = 240) {
  if (!storeMode.busy) { openFromHash(true); return; }
  if (frames > 0) requestAnimationFrame(() => settleRoute(frames - 1));
}

openFromHash(true);

/* Back, Forward, and a hand-typed fragment all come through here.
 *
 * Off the URL, deliberately, and not off `event.state`. The first version
 * read the state object and treated "no state" as "leave the shop" — and
 * then discovered that assigning `location.hash` fires `popstate` with a
 * null state *before* it fires `hashchange` in this engine. So changing the
 * fragment from one shop to another left the first shop on the popstate and
 * was then refused on the hashchange for being busy, which is a shop you
 * cannot get to by editing its own address. The URL is the only thing that
 * knows where you are meant to be; both events just mean "check it".
 */
/* The room follows the window.
 *
 * Debounced, and gated on the numbers actually having moved: dragging a
 * desktop window fires this continuously and almost none of those pixels
 * change anything. Rotating a phone changes all of it.
 */
{
  let t = 0;
  const check = () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (storeRoom.relayout() && storeMode) storeMode.reframe();
    }, 250);
  };
  addEventListener("resize", check);
  // Some browsers report the old size for a beat after the rotation.
  addEventListener("orientationchange", () => setTimeout(check, 320));
}

addEventListener("popstate", () => settleRoute());
addEventListener("hashchange", () => settleRoute());

// Surface a dead scene rather than a black rectangle.
canvasEl.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();
  running = false;
  document.getElementById("fallback").dataset.on = "1";
});
</script>
</body>
</html>
