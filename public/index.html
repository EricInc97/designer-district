<!-- ## 01  DOCUMENT HEAD -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Designer District</title>
<meta name="description" content="Premium streetwear. Fifteen districts, one address." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="https://designer-district.vercel.app/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" />

<style>
/* ## 02  STYLES — tokens
   Lifted verbatim from the storefront's globals.css: same names, same values.
   `paper` is always the ground, `ink` is always what sits on it. Nothing here
   is invented, so this page and the store cannot drift apart. */
:root {
  --paper: #ffffff;
  --paper-raised: #f7f6f3;
  --paper-sunken: #ebe9e4;
  --ink: #0b0b0b;
  --ink-dim: #56554f;
  --ink-faint: #7c7b74;
  --rule: #e5e3dd;
  --rule-strong: #c6c3bb;

  --shell: clamp(20px, 5vw, 56px);
  --bar: 64px;

  /* How many viewport-heights the whole journey runs for. Raise it to slow
     the camera down. Every waypoint is a fraction of the total, so nothing
     else has to change. */
  --pages: 13;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: calc(var(--pages) * 100svh);
  overflow-x: hidden;
}

/* The house voice, exactly as the store defines it. */
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.22em;
  font-size: 0.6875rem;
  font-weight: 500;
  color: var(--ink-dim);
}
.display {
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: 0.9;
  font-weight: 600;
}
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
::selection { background: var(--ink); color: var(--paper); }

/* Copy that floats over the scene instead of sitting on paper takes the
   store's own answer to exactly this problem: white type with a dark halo
   stacked three deep, so it holds over the bright dome as well as the sky. */
.on-scene { color: #ffffff; }
.on-scene .eyebrow { color: rgba(255,255,255,.88); }
.halo {
  text-shadow:
    0 1px 2px rgba(0,0,0,1),
    0 2px 8px rgba(0,0,0,.95),
    0 0 30px rgba(0,0,0,.85);
}

/* ## 03  STYLES — chrome and the scroll overlay */

/*
 * Sized to the LARGE viewport, deliberately.
 *
 * On a phone the address bar slides in and out as you scroll, and the
 * viewport changes height under you. three's `setSize` writes the height it
 * was given straight onto the canvas as an inline style, so the moment the
 * bar retracts — or the `resize` that follows arrives a frame late, which on
 * scroll-driven UI it always does — the canvas is shorter than the window
 * and the white page shows through underneath it. That was the bar along the
 * bottom.
 *
 * `100lvh` is the height with the browser UI retracted, so the canvas is
 * never shorter than what is on screen. When the bar is showing, a sliver of
 * the render is hidden below the fold instead, which is the right way round:
 * something covered rather than something missing. `setSize(w, h, false)`
 * further down stops three from overwriting this with pixels again.
 */
#stage {
  position: fixed;
  top: 0; left: 0;
  z-index: 0;
  display: block;
  width: 100%;
  height: 100vh;
  height: 100lvh;
  touch-action: pan-y;
}

/* The store's header, unchanged: paper ground, hairline rule, ink wordmark. */
#bar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 4;
  height: var(--bar);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 clamp(16px, 4vw, 32px);
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
/* The wordmark is 15:1, so a fixed height overruns a narrow bar and
   collides with the link beside it. Scaled to the viewport instead. */
#bar img { height: clamp(13px, 3.2vw, 20px); width: auto; display: block; }
#bar .side { display: flex; align-items: center; }
#bar .side:last-child { justify-content: flex-end; }
#bar a.ghost {
  font-size: 0.6875rem; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink-dim); text-decoration: none;
  transition: color .2s ease;
}
#bar a.ghost:hover { color: var(--ink); }
@media (max-width: 460px) { #bar a.ghost { display: none; } }

.layer { position: relative; z-index: 1; pointer-events: none; }

.panel {
  position: fixed;
  inset: var(--bar) 0 0 0;
  display: grid;
  padding: var(--shell);
  opacity: 0;
  visibility: hidden;
  transition: opacity .6s ease;
  will-change: opacity;
}
.panel[data-on="1"] { opacity: 1; visibility: visible; }
.panel a, .panel button { pointer-events: auto; }

/* The store's primary control: an ink pill, wide-tracked, uppercase. */
.pill {
  display: inline-flex; align-items: center; gap: .55rem;
  border-radius: 999px;
  background: var(--ink); color: var(--paper);
  padding: .8rem 1.6rem;
  font-size: .75rem; font-weight: 600;
  letter-spacing: .2em; text-transform: uppercase;
  text-decoration: none;
  transition: opacity .2s ease, transform .2s ease;
}
.pill:hover { opacity: .9; transform: translateY(-1px); }

/* Corner brackets, the same four L's the brand tiles wear. */
.bracket { position: relative; }
.bracket::before, .bracket::after,
.bracket > .br::before, .bracket > .br::after {
  content: ""; position: absolute; width: 14px; height: 14px;
  border: 0 solid var(--rule-strong); pointer-events: none;
}
.bracket::before { left: 10px;  top: 10px;    border-left-width: 1px;  border-top-width: 1px; }
.bracket::after  { right: 10px; top: 10px;    border-right-width: 1px; border-top-width: 1px; }
.bracket > .br::before { left: 10px;  bottom: 10px; border-left-width: 1px;  border-bottom-width: 1px; }
.bracket > .br::after  { right: 10px; bottom: 10px; border-right-width: 1px; border-bottom-width: 1px; }

/* --- hero: the lockup itself, unchanged from the storefront ------------- */
/* The bottom padding is what keeps the centred lockup and its line clear of
   the fixed "Scroll" cue, which they were landing on top of. */
#p-hero { place-items: center; text-align: center; padding-bottom: 4.5rem; }
/* The artwork ships on a transparent ground and sits on a clear glass halo —
   a backdrop blur with no tint, masked so it has no edge — exactly as it does
   on the store. The blur is what keeps white legible over the bright cells of
   the dome without hiding them. */
.lockup {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  /* Sized by height as well as width. It used to be width-only, so on a short
     window the square grew taller than the space it had, pushed the line of
     copy under it down the page, and landed it on top of the "Scroll" cue. */
  width: min(21rem, 78vw, 44svh);
}
@media (min-width: 640px) { .lockup { width: min(32rem, 62vw, 44svh); } }
.lockup .glass {
  position: absolute; inset: 0; border-radius: 999px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 42%, rgba(0,0,0,.55) 62%, transparent 78%);
  mask-image: radial-gradient(circle at 50% 50%, #000 42%, rgba(0,0,0,.55) 62%, transparent 78%);
}
.lockup img {
  position: relative;
  width: 76%;
  height: auto;
  filter:
    drop-shadow(0 0 1px rgba(0,0,0,.95))
    drop-shadow(0 1px 3px rgba(0,0,0,.95))
    drop-shadow(0 6px 26px rgba(0,0,0,.8));
}
.sub {
  margin: 1.5rem auto 0;
  max-width: 34ch;
  font-size: clamp(.9rem, 2vw, 1.05rem);
  font-weight: 500;
  line-height: 1.6;
}

.hint {
  position: fixed; left: 50%; bottom: calc(var(--shell) * .8);
  translate: -50% 0;
  font-size: .6875rem; font-weight: 500;
  letter-spacing: .22em; text-transform: uppercase;
  color: #fff; opacity: .8;
  transition: opacity .4s ease;
}
.hint::after {
  content: ""; display: block; width: 1px; height: 30px;
  margin: 10px auto 0; background: linear-gradient(currentColor, transparent);
  animation: drop 2.1s ease-in-out infinite;
}
@keyframes drop { 0%,100% { transform: scaleY(.35); transform-origin: top; opacity: .4 } 50% { transform: scaleY(1); opacity: 1 } }

h2.title { margin: .5rem 0 0; font-size: clamp(1.6rem, 4.6vw, 3.2rem); }

/* --- the promenade: a card on paper, the store's own surface ------------ */
#p-brands { align-content: end; }
.brandcard {
  pointer-events: auto;
  width: min(430px, 100%);
  background: var(--paper);
  border: 1px solid var(--rule);
  box-shadow: 0 30px 70px -34px rgba(0,0,0,.65);
  padding: 1.4rem 1.5rem 1.5rem;
}
.brandcard .swatch { height: 4px; width: 100%; margin-bottom: 1.1rem; }

/* The mark, on the house's ground — the tag that tells you whose shop this
   is before you have read a word of it. */
.maker {
  display: grid;
  place-items: center;
  height: 84px;
  margin-bottom: 1.1rem;
  padding: 0 1.2rem;
  border: 1px solid var(--rule);
  overflow: hidden;
}
.maker img { max-height: 54px; max-width: 100%; width: auto; height: auto; display: block; }
.maker span {
  font-size: 1.15rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  text-align: center; line-height: 1.1;
}
.brandcard h3 { margin: .5rem 0 0; font-size: clamp(1.6rem, 4.4vw, 2.2rem); }
.brandcard p.note { margin: .6rem 0 0; font-size: .85rem; line-height: 1.6; color: var(--ink-dim); }
.brandcard .pill { margin-top: 1.2rem; }

/* ---- waypoints ----------------------------------------------------------
   Markers that sit on the shopfronts themselves and travel with them. They
   are HTML rather than sprites so the artwork stays crisp at any distance and
   a tap target is a real button with a real focus ring. */
.pins { position: fixed; inset: 0; pointer-events: none; }

.pin {
  position: absolute;
  left: 0; top: 0;
  display: grid;
  place-items: center;
  /* A tag, not a badge.
     A circle letterboxes a wordmark — "GALLERY DEPT." had to shrink to its
     own height to fit across a 46px disc, and most of the houses read as a
     smudge. A wide rounded tag gives the artwork its own aspect and roughly
     three times the area, and it is a better tap target with it. */
  width: 104px; height: 66px;
  --pad-x: 12px; --pad-y: 9px;
  margin: 0; padding: var(--pad-y) var(--pad-x);
  border: 0;
  border-radius: 18px;
  background: var(--pin-bg, #fff);
  color: var(--pin-ink, #0b0b0b);
  box-shadow: 0 4px 18px rgba(0,0,0,.4), 0 0 0 2px rgba(255,255,255,.85);
  cursor: pointer;
  pointer-events: auto;
  will-change: transform, opacity;
  transition: box-shadow .2s ease;
}
.pin::after {                       /* the little tail, so it reads as a pin */
  content: "";
  position: absolute;
  bottom: -6px; left: 50%;
  width: 14px; height: 14px;
  translate: -50% 0;
  rotate: 45deg;
  background: inherit;
  box-shadow: 2px 2px 0 rgba(255,255,255,.85);
}
/* Absolutely placed, and `contain` rather than two max-percentages.
   `max-height: 100%` on a grid item never resolved — the row's height is
   indefinite while the grid is being sized, so the browser dropped it and
   applied the width constraint alone. Anything taller than it is wide then
   overflowed its own tag: Hellstar's mark is square and rendered 76 tall in
   a 61 tall marker, hanging out of the top and bottom of it. Pinning all
   four edges makes the box definite and `contain` does the fitting. */
.pin img {
  position: absolute;
  top: var(--pad-y); left: var(--pad-x);
  /* Sized, not inset. `width: auto` on an absolutely positioned *replaced*
     element means its intrinsic width — the offsets are simply ignored — so
     pinning all four edges rendered Hellstar's mark at its native 773px.
     A calc against the containing block is definite, and `contain` fits the
     bitmap inside whatever shape that box turns out to be. */
  width: calc(100% - var(--pad-x) * 2);
  height: calc(100% - var(--pad-y) * 2);
  object-fit: contain;
  object-position: center;
  display: block;
}
/* The houses with no artwork file wear their name in full, set to fit,
   rather than the first two letters of it. "SU" told you nothing. */
.pin b {
  font-weight: 800; letter-spacing: .03em; line-height: 1.05;
  text-align: center; text-transform: uppercase;
  white-space: pre-line;
  /* The fitting above is arithmetic on a canvas; this is the guard that
     makes a miss invisible rather than ragged. */
  max-width: 100%; max-height: 100%; overflow: hidden;
}
@media (max-width: 720px) {
  .pin { width: 92px; height: 58px; --pad-x: 10px; --pad-y: 8px; border-radius: 16px; }
}
.pin:hover, .pin:focus-visible {
  box-shadow: 0 8px 26px rgba(0,0,0,.5), 0 0 0 3px #fff;
}
.pin[data-live="1"] { box-shadow: 0 8px 26px rgba(0,0,0,.5), 0 0 0 3px var(--ink); }

/* The leader line, and the tack it lands on.
   A marker floating loose over the street reads as an overlay dropped on top
   of the picture. Tied down to the shopfront it labels, it reads as being
   *in* the scene — and once the marker can be lifted clear of the sign
   without losing what it points at, it can be lifted far enough to stop
   colliding with the sign artwork underneath it.

   The stem is one pixel wide and stretched with `scaleX`, so a frame costs a
   transform and nothing else. That is also why the dark edging runs top to
   bottom: a horizontal gradient stretches with the bar, a vertical one does
   not, so the hairline stays one pixel however long the line gets. */
.stem {
  position: absolute;
  left: 0; top: 0;
  width: 1px; height: 3px;
  transform-origin: 0 50%;
  background: linear-gradient(to bottom,
      rgba(0,0,0,.45) 0 1px,
      var(--pin-bg, #fff) 1px 2px,
      rgba(0,0,0,.45) 2px 3px);
  pointer-events: none;
  will-change: transform, opacity;
}
.tack {
  position: absolute;
  left: 0; top: 0;
  width: 10px; height: 10px;
  border-radius: 999px;
  background: var(--pin-bg, #fff);
  box-shadow: 0 0 0 2px rgba(0,0,0,.38), 0 2px 10px rgba(0,0,0,.5);
  pointer-events: none;
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: no-preference) {
  .pin { animation: pinIn .35s cubic-bezier(.2,1.3,.4,1) both; }
}
@keyframes pinIn { from { scale: .4; opacity: 0 } to { scale: 1; opacity: 1 } }

/* ---- the shop, from the inside ------------------------------------------
   Chrome for the interior mode. It sits over the room rather than covering
   it: a bar across the top, a rail of stock across the bottom, and a card
   that opens for one piece. The room stays visible between them, because the
   whole point is to be standing in it. */
#shop {
  position: fixed; inset: 0; z-index: 6;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity .32s ease, visibility 0s linear .32s;
  --shop-ink: #ffffff;
  --shop-bg: #101010;
}
#shop[data-on="1"] {
  opacity: 1; visibility: visible;
  transition: opacity .32s ease .12s, visibility 0s;
}

#shop .top {
  position: absolute; left: 0; right: 0; top: var(--bar);
  display: flex; align-items: center; gap: .85rem;
  /* The sound toggle lives in this corner and stays reachable inside a
     shop, so the way out is set in from the edge to clear it. */
  padding: .8rem calc(clamp(14px, 4vw, 30px) + 60px) .8rem clamp(14px, 4vw, 30px);
  /* Deep enough to hold white type over a Supreme-red or Off-White-white
     wall, both of which sit directly behind this bar. */
  background: linear-gradient(180deg, rgba(0,0,0,.8), rgba(0,0,0,.46) 62%, rgba(0,0,0,0));
  pointer-events: auto;
}
#shop .mark {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  border-radius: 10px; overflow: hidden;
  background: var(--shop-bg);
  box-shadow: 0 0 0 1px rgba(255,255,255,.25);
}
#shop .mark img { max-width: 78%; max-height: 78%; display: block; }
#shop .mark span { font-weight: 800; font-size: .72rem; letter-spacing: .04em; color: var(--shop-ink); }
#shop .who { min-width: 0; }
#shop .who h3 {
  margin: 0; font-size: clamp(1rem, 3.6vw, 1.35rem); font-weight: 600;
  letter-spacing: -0.02em; text-transform: uppercase; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#shop .out {
  margin-left: auto; flex: none;
  display: inline-flex; align-items: center; gap: .4rem;
  border: 1px solid rgba(255,255,255,.5); background: rgba(0,0,0,.35);
  color: #fff; border-radius: 999px;
  padding: .52rem .95rem; font: inherit; font-size: .6875rem; font-weight: 500;
  letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
#shop .out:hover { background: #fff; color: #0b0b0b; border-color: #fff; }
/* The way out said nothing but a cross, and on a phone the glyph did not
   even render — it came out as a stray "15" in the corner. It is a word
   now, shortened rather than dropped when the bar gets tight. */
#shop .out .arr { font-size: 13px; line-height: 1; }
#shop .out .lbl { line-height: 1; }



/* The shelf: a paper column against the room.
   Paper on purpose. The point of the change is that this reads as the
   storefront's own catalogue — a grid of cards you scroll down — and a
   dark glass panel reads as more HUD. It takes the right-hand third on a
   laptop and the bottom of the screen on a phone, and the camera is told
   where it ends so the stock on the wall is framed in what is left. */
#shop .shelf {
  position: absolute;
  right: 0; top: calc(var(--bar) + var(--topbar, 62px)); bottom: 0;
  width: min(360px, 34vw);
  display: flex; flex-direction: column;
  background: var(--paper);
  border-left: 1px solid var(--rule);
  pointer-events: auto;
}

#shop .cats {
  /* 0 0 auto, not the default 0 1 auto. The shelf is a flex column and the
     grid below is always taller than the space it has, so a shrinkable
     chip row was being crushed to half a line of type. */
  flex: 0 0 auto;
  display: flex; align-items: center; gap: .35rem; margin: 0;
  padding: .6rem .7rem;
  border-bottom: 1px solid var(--rule);
  overflow-x: auto; scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  background: var(--paper);
}
#shop .cats::-webkit-scrollbar { display: none; }
#shop .cat {
  flex: none; border: 1px solid var(--rule-strong);
  background: var(--paper); color: var(--ink-dim);
  border-radius: 999px; padding: .34rem .68rem;
  font: inherit; font-size: .625rem; font-weight: 500;
  letter-spacing: .14em; text-transform: uppercase;
  white-space: nowrap; cursor: pointer; line-height: 1.15;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
#shop .cat i { font-style: normal; opacity: .55; margin-left: .32rem; letter-spacing: 0; }
#shop .cat[data-live="1"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

#shop .grid {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: grid; grid-template-columns: 1fr 1fr;
  align-content: start;
}
#shop .card {
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  min-width: 0;
}
#shop .card:nth-child(2n) { border-right: 0; }
#shop .hit {
  display: block; width: 100%; border: 0; background: none;
  padding: .55rem .55rem .65rem; text-align: left; cursor: pointer;
  font: inherit; color: var(--ink);
}
#shop .hit .pic {
  display: block; aspect-ratio: 1; overflow: hidden;
  background: var(--paper-sunken);
}
#shop .hit img { width: 100%; height: 100%; object-fit: cover; display: block; }
#shop .hit b {
  display: block; margin-top: .45rem; font-size: .75rem; font-weight: 500;
  line-height: 1.3; max-height: 2.6em; overflow: hidden;
}
#shop .hit i { display: block; font-style: normal; font-size: .75rem; color: var(--ink-dim); }
#shop .card[data-gone="1"] .hit img { filter: grayscale(1) brightness(.78); }
#shop .card[data-live="1"] { background: var(--paper-raised); }
#shop .card[data-live="1"] .hit .pic { outline: 2px solid var(--ink); outline-offset: -2px; }

#shop .more { display: none; padding: 0 .55rem .7rem; }
#shop .card[data-live="1"] .more { display: block; }
#shop .more .sizes { display: flex; flex-wrap: wrap; gap: .25rem; }
#shop .more .sizes span {
  border: 1px solid var(--rule-strong); padding: .12rem .38rem; font-size: .625rem;
  letter-spacing: .08em;
}
#shop .more .stock {
  margin: .45rem 0 0; font-size: .625rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-faint);
}
#shop .more .pill {
  margin-top: .55rem; width: 100%; justify-content: center;
  padding: .5rem .6rem; font-size: .625rem;
}


@media (max-height: 720px) {
    /* A fixed height, not a ratio: the card is a third of the screen wide, so
     any ratio still gives a picture taller than the room left for it. */
        }

/* A phone is not a small laptop.
   The shelf goes to the bottom of the screen and takes a little under half
   of it, which leaves the room the part of the frame a phone is actually
   good at: the tall middle. */
@media (max-width: 720px) {

     out, leaves 128 for the house's name — and "Chrome Hearts" is the

  #shop .top {

     It pins the button to the padding edge whatever its width, so trimming

/* ---- sound: an invitation that folds into a control ------------------- */
.sound {
  /* Top right, under the header. Bottom left put it straight on top of the
     card's Shop button on a phone, where the card is full width and bottom
     aligned — the two controls were literally overlapping. Nothing else
     lives up here. */

  right: var(--shell);

/* Waiting to be used: the label is out and the ring pings. */
.sound[data-state="prompt"] .lbl { max-width: 12rem; opacity: 1; padding-left: 1.1rem; }
.sound[data-state="prompt"]::after {
  content: "";
  position: absolute;

.sound[data-state="on"] { background: var(--ink); color: var(--paper); }

/* The finale used to be a white card pasted over the view. It is projected

<script type="importmap">
{

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// ## 06  CONFIG — tuning, palette, brand data
// Everything adjustable lives here. The scene below reads it and never
// hard-codes a number you would plausibly want to change.

const SITE = "https://designer-district.vercel.app";

const QUALITY = (() => {
  const coarse = matchMedia("(pointer: coarse)").matches;
  const small  = Math.min(innerWidth, innerHeight) < 700;
  const still  = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const light  = coarse || small;
  return {
    light,
    still,
    dpr:       light ? 1.2  : 2,
    shadowMap: light ? 1024 : 2048,
    leaves:    light ? 36  : 110,
    motes:     light ? 140 : 520,

    /**
     * Whether glass is allowed to be real glass.
     *
     * This is the single most expensive thing in the scene on a phone and it
     * does not look like it. A MeshPhysicalMaterial with any transmission at
     * all makes three render the entire opaque scene a second time, into a
     * transmission buffer, every frame — and there were five such materials:
     * the dome's panes, every shopfront, the fountain, the end block and the
     * bridge. One is enough to pay for the pass; five just share it. Turning
     * transmission off and leaning on plain opacity costs a little realism
     * in the refractions and halves the frame.
     */
    transmission: !light,

    // The shell is the single heaviest object in the opening shot, and
    // alpha-tested geometry is what tiled mobile GPUs like least.
    domeSeg:   light ? [96, 64] : [176, 120],
    lampsDome: light ? 2 : 4,
    lampsStreet: light ? 2 : 4,
    spray:     light ? 130 : 420,
    // Palms are the most expensive thing in the scene: every frond is
    // alpha-tested, and every one of them is drawn a second time into the
    // shadow map. The street is lined with buildings now, so it does not need
    // a dense grove to feel full.
    palmsRow:  light ? 4   : 6,
    palmsRing: light ? 6   : 9,
    frondsPer: light ? 8   : 10,
    bloom:     !light,
    holeSeg:   light ? 16  : 26,   // radial segments on each dome rim
    texScale:  light ? 0.6 : 1,
  };
})();

const C = {
  sun:       new THREE.Vector3(-0.42, 0.62, 0.66).normalize(),
  zenith:    new THREE.Color("#0b4fbe"),
  horizon:   new THREE.Color("#a8d2ee"),
  underside: new THREE.Color("#9fb9c9"),
  fog:       new THREE.Color("#b7d6ea"),
  fogDensity: 0.0052,

  travertine: new THREE.Color("#e6d9bd"),
  poolDeep:   new THREE.Color("#0b5f80"),
  poolShallow:new THREE.Color("#35c2c9"),

  domeRadius: 6,
  // Measured off the reference rather than guessed. The real thing is close
  // to a full sphere with the bottom cut away, not a hemisphere: it bulges
  // out well past its own base and overhangs the plinth all the way round,
  // which is most of what makes it read as a sphere resting in water.
  domeSquash: 0.88,          // barely flattened
  domeCut:    0.80,          // × PI — 144 degrees of arc, well under the equator
  // Twenty-one openings, not forty-four. The real dome's cells are enormous
  // relative to the sphere — roughly a third of its diameter each — and at
  // forty-four the shell read as a golf ball instead.
  // Cell size taken off the reference: an opening is about a quarter of the
  // dome's width, which is an angular radius near 15 degrees. Twenty-one at
  // 17.5 degrees was too few and too large, and the webbing between them too
  // thin — the lips are the thickest part of the real shell.
  domeHoles:  27,
  holeAngle:  0.263,     // angular radius of one opening, radians
  rimTube:    0.30,      // thickness of the lip around it
  // Low. The reference is a broad circular step barely clear of the water
  // with the sphere overhanging it on every side, not a pedestal.
  plinthTop:  0.62,

  poolY:      -0.28,
  plazaY:     0,

  // Where the street runs. Monoliths alternate sides down this line.
  streetFrom: -34,
  streetStep: -9.2,
  // How far out from the centre line the slabs stand. A portrait phone sees a
  // much narrower horizontal wedge than a laptop does, and at 7.6 the first
  // house sat outside the frame for its whole approach — named on the card,
  // never actually on screen. The street closes up when the viewport is tall.
  streetX: innerWidth / innerHeight < 1 ? 4.9 : 7.6,
};

// Derived once: the dome's centre height so its cut edge lands on the plinth.
C.domeCenterY = C.plinthTop + Math.abs(Math.cos(C.domeCut * Math.PI)) * C.domeRadius * C.domeSquash;

// The fifteen houses, in the order they appear on the storefront, with the
// colourway each one already wears on its tile there.
// Where each house's artwork lives. Seven of the fifteen have no logo file —
// on the store they are set as wordmarks — and those simply keep their name in
// type, here as there. Brands whose ink is white take the cut drawn for dark
// grounds, the same rule the storefront tiles use.
const LOGO = {
  "bape":          "/brands/bape-on-dark.png",
  "chrome-hearts": "/brands/chrome-hearts.svg",
  "gallery-dept":  "/brands/gallery-dept.png",
  "ksubi":         "/brands/ksubi.png",
  "essentials":    "/brands/essentials.png",
  "rhude":         "/brands/rhude.png",
  "vale":          "/brands/vale-on-dark.png",
  "hellstar":      "/brands/hellstar-on-dark.png",
};
const logoFor = (slug) => (LOGO[slug] ? SITE + LOGO[slug] : null);

const BRANDS = [
  { slug:"bape",         name:"Bape",          live:7,  bg:["#7a8b5c","#5d6b45"], ink:"#ffffff", note:"Camo, since 1993." },
  { slug:"chrome-hearts",name:"Chrome Hearts", live:52, bg:["#eceef1","#b4b8c2"], ink:"#0a0a0a", note:"Sterling, leather, gothic type." },
  { slug:"supreme",      name:"Supreme",       live:19, bg:["#ce1f26","#a3161c"], ink:"#ffffff", note:"The box logo." },
  { slug:"amiri",        name:"Amiri",         live:16, bg:["#f1ebdf","#d5c9b2"], ink:"#12100c", note:"Los Angeles tailoring." },
  { slug:"balenciaga",   name:"Balenciaga",    live:10, bg:["#0a0a0a","#1b1b1b"], ink:"#ffffff", note:"Paris, exaggerated." },
  { slug:"gallery-dept", name:"Gallery Dept.", live:16, bg:["#dedbd4","#c8c4ba"], ink:"#101010", note:"Painted, distressed, one-off." },
  { slug:"godspeed",     name:"Godspeed",      live:27, bg:["#caa23c","#2a1d08"], ink:"#fbf3de", note:"Gilded graphics." },
  { slug:"purple-brand", name:"Purple Brand",  live:15, bg:["#4b2a7b","#331d55"], ink:"#ffffff", note:"Denim, loudly." },
  { slug:"off-white",    name:"Off-White",     live:7,  bg:["#f3f3f1","#dcdcd8"], ink:"#111111", note:"Quotation marks and diagonals." },
  { slug:"casablanca",   name:"Casablanca",    live:19, bg:["#cfe3d8","#e8c9a0"], ink:"#2b2018", note:"Riviera, on silk." },
  { slug:"ksubi",        name:"Ksubi",         live:5,  bg:["#cad7e6","#93a8c6"], ink:"#121820", note:"Australian denim." },
  { slug:"essentials",   name:"Essentials",    live:6,  bg:["#b4a89b","#9c9084"], ink:"#141210", note:"Fear of God, stripped back." },
  { slug:"rhude",        name:"Rhude",         live:13, bg:["#d8c9ab","#bda98a"], ink:"#2a2119", note:"Motorsport romance." },
  { slug:"vale",         name:"Vale",          live:12, bg:["#17203a","#0d1426"], ink:"#ffffff", note:"Collegiate navy." },
  { slug:"hellstar",     name:"Hellstar",      live:12, bg:["#e8552a","#3a0e0e"], ink:"#ffffff", note:"Scorched graphics." },

/**
 * A building type per house.
 *
 * Fifteen identical boxes in fifteen tints is a colour-swatch, not a street.
 * Each house now gets a genuinely different piece of architecture, and the
 * order is arranged so no two neighbours share a type — and, because the
 * terraces interleave, so that no two units on the *same* side share one
 * either. Every type is distinct at index i, i+1 and i+2.
 *
 *   fluted    close-spaced vertical fins over a recessed wall
 *   monolith  solid mass with one deep punched opening
 *   stacked   three volumes, each stepping out over the last
 *   screen    a perforated sheet hung clear of the facade
 *   folded    a pleated wall of angled panels
 *   curtain   full glazing with horizontal spandrel bands
 *   louvre    deep horizontal sun blades
 *   arcade    a run of tall arched openings
 *   portal    a heavy frame around a recessed glass box
 *   baguette  a comb of slender vertical rods
 */
const STYLE = {
  "bape":          "stacked",
  "chrome-hearts": "arcade",
  "supreme":       "portal",
  "amiri":         "fluted",
  "balenciaga":    "monolith",
  "gallery-dept":  "folded",
  "godspeed":      "baguette",
  "purple-brand":  "louvre",
  "off-white":     "screen",
  "casablanca":    "curtain",
  "ksubi":         "fluted",
  "essentials":    "monolith",
  "rhude":         "louvre",
  "vale":          "portal",
  "hellstar":      "folded",
};

/** How tall each type wants to be, before its own random variation. */
const STYLE_H = {
  fluted: 11.0, monolith: 12.6, stacked: 12.2, screen: 10.4, folded: 11.4,
  curtain: 11.8, louvre: 10.2, arcade: 10.8, portal: 12.0, baguette: 11.2,
};

/**
 * Where the street runs, and what stands around the plaza.
 *
 * Both live up here rather than next to the code that builds them because the
 * palms are planted before any of it exists and need to know where not to
 * stand. They were growing straight through the shopfronts.
 */
const STREET = {
  half:  innerWidth / innerHeight < 1 ? 8.4 : 11.0,   // kerb to centre line
  from:  -38,
  step:  -7.6,
  // Wider than the 15.2 per-side pitch on purpose, so neighbours overlap by
  // 40cm instead of leaving a hairline crack between every pair.
  width: 15.6,
  depth: 14,
};

/**
 * Blocks penning the plaza in.
 *
 * Without them the opening shot was a dome, two lumps of concrete and then
 * bare ground running to a hard horizon — the plaza was a stage set standing
 * in a field. The reference is nothing like that: it is a courtyard, closed
 * on every side, and you cannot see out of it at all.
 */
const PLAZA_BLOCKS = [
  { x0: -46, x1: -26, z0: -58, z1: -30, h: 15 },
  { x0: -44, x1: -26, z0: -28, z1:  -2, h: 12 },
  { x0: -46, x1: -27, z0:   0, z1:  24, h: 16 },
  { x0: -42, x1: -26, z0:  26, z1:  46, h: 11 },
  { x0:  26, x1:  46, z0: -58, z1: -30, h: 14 },
  { x0:  26, x1:  44, z0: -28, z1:  -2, h: 17 },
  { x0:  27, x1:  46, z0:   0, z1:  24, h: 12 },
  { x0:  26, x1:  42, z0:  26, z1:  46, h: 15 },
];

/** True where a building already stands, so nothing else is planted in one. */
function inBuilt(x, z) {
  const ax = Math.abs(x);
  // the two terraces, their fillers, and a little clearance
  if (ax > STREET.half - 1.4 && ax < STREET.half + STREET.depth + 1.4
      && z < -17 && z > -184) return true;
  // the block closing the far end
  if (z < -170 && z > -198 && ax < 31) return true;
  for (const b of PLAZA_BLOCKS) {
    if (x > b.x0 - 1.5 && x < b.x1 + 1.5 && z > b.z0 - 1.5 && z < b.z1 + 1.5) return true;
  }
  return false;
}

// Scroll choreography. Each panel owns a slice of the journey.
const BEATS = {
  // Shorter than it was. The route is a straight run now, so the same
  // fraction of it carries the camera much further: at 0.095 it is already
  // at the arch, and the lockup was still sitting over a close-up of the
  // shell. It clears at 0.070, about three metres short of the threshold.
  hero:   [0.000, 0.070],
  // Nothing between the hero and the street on purpose: that stretch is the
  // camera swinging around the dome, and a caption over it would only be
  // something to read instead of looking.
  // The street has to stay open until the last house is actually reachable.
  // Hellstar sits at p 0.882, and with the beat closing at 0.875 its own
  // waypoint landed you one notch past the end, card already gone.
  brands: [0.200, 0.900],
  end:    [0.925, 1.000],
};

// ## 07  UTILITIES — rng, easing, math

/** Deterministic PRNG, so the palm grove is the same grove on every load. */
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
const clamp  = (v, a, b) => Math.min(Math.max(v, a), b);
const lerp   = (a, b, t) => a + (b - a) * t;

// ## 08  TEXTURES — procedural canvas makers
// Nothing is fetched. Every surface in the scene is drawn here at boot, which
// keeps the page a single file and means there is no loading order to get
// wrong.

function canvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(2, Math.round(w * QUALITY.texScale));
  c.height = Math.max(2, Math.round(h * QUALITY.texScale));
  return c;
}

function asTexture(c, { srgb = true, repeat = null, aniso = 8 } = {}) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  t.anisotropy = aniso;
  return t;
}

/** Warm, veined travertine with the plaza's tile joints cut into it. */
function texTravertine() {
  const c = canvas(1024, 1024), x = c.getContext("2d"), S = c.width;
  x.fillStyle = "#ddcfb2"; x.fillRect(0, 0, S, S);

  // Mineral cloudiness.
  for (let i = 0; i < 2600; i++) {
    const r = 6 + Math.random() * 70;
    x.globalAlpha = 0.018 + Math.random() * 0.03;
    x.fillStyle = Math.random() > 0.45 ? "#fffaf0" : "#c8bda4";
    x.beginPath();
    x.ellipse(Math.random() * S, Math.random() * S, r, r * (0.4 + Math.random()), Math.random() * Math.PI, 0, 7);
    x.fill();
  }
  // Fine grain.
  x.globalAlpha = 1;
  const g = x.getImageData(0, 0, S, S), d = g.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 16;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(g, 0, 0);

  // Joints: four slabs across the tile, so the repeat reads as stonework.
  x.strokeStyle = "rgba(150,138,116,.55)";
  x.lineWidth = Math.max(1, S / 340);
  for (let i = 0; i <= 4; i++) {
    const p = (i / 4) * S;
    x.beginPath(); x.moveTo(p, 0); x.lineTo(p, S); x.stroke();
    x.beginPath(); x.moveTo(0, p); x.lineTo(S, p); x.stroke();
  }
  return c;
}

/** Palm bark: stacked leaf scars, vertical fibre, sun-bleached. */
function texBark() {
  const c = canvas(256, 1024), x = c.getContext("2d"), W = c.width, H = c.height;
  const base = x.createLinearGradient(0, 0, W, 0);
  base.addColorStop(0, "#8a7963"); base.addColorStop(0.38, "#c3b294");
  base.addColorStop(0.66, "#d6c6a6"); base.addColorStop(1, "#8d7c66");
  x.fillStyle = base; x.fillRect(0, 0, W, H);

  // Ring scars — the diamond pattern a palm leaves as fronds drop.
  const rings = 22;
  for (let i = 0; i < rings; i++) {
    const y = (i / rings) * H + (Math.random() - 0.5) * 3;
    const h = H / rings;
    // Scars are staggered and uneven; a clean stripe every N pixels reads as
    // a stack of coins rather than a tree.
    x.globalAlpha = 0.20 + Math.random() * 0.22;
    x.fillStyle = "rgba(96,80,58,1)";
    x.beginPath();
    x.moveTo(0, y + (Math.random() - 0.5) * 4);
    x.lineTo(W, y + (Math.random() - 0.5) * 4);
    x.lineTo(W, y + h * (0.16 + Math.random() * 0.12));
    x.lineTo(0, y + h * (0.16 + Math.random() * 0.12));
    x.closePath(); x.fill();
    x.globalAlpha = 0.14;
    x.fillStyle = "rgba(255,246,224,1)";
    x.fillRect(0, y + h * 0.3, W, h * 0.1);
  }
  // Vertical fibre.
  x.globalAlpha = 0.16;
  for (let i = 0; i < 220; i++) {
    x.strokeStyle = Math.random() > 0.5 ? "#4a3d2f" : "#d8c9a8";
    x.lineWidth = Math.random() * 1.8;
    const px = Math.random() * W;
    x.beginPath(); x.moveTo(px, 0); x.lineTo(px + (Math.random() - 0.5) * 10, H); x.stroke();
  }
  x.globalAlpha = 1;
  return c;
}

/**
 * One palm frond, drawn flat: a rachis along the middle with leaflets combed
 * off both edges. The canvas alpha is the leaf's silhouette, which is what
 * makes the dappled shadow underneath look like a palm rather than a blob.
 */
function texFrond() {
  const c = canvas(1024, 384), x = c.getContext("2d"), W = c.width, H = c.height, mid = H / 2;
  x.clearRect(0, 0, W, H);

  const leaflets = 74;
  for (let i = 0; i < leaflets; i++) {
    const t = i / (leaflets - 1);
    const px = 18 + t * (W - 40);
    // Leaflets are short at the base, longest at a third, tapering to the tip.
    const len = Math.sin(Math.pow(t, 0.55) * Math.PI) * (H * 0.46) * (1 - 0.25 * t) + 6;
    const sweep = 0.34 + t * 0.5;            // they comb further back along the spine
    const wob = (Math.random() - 0.5) * 7;

    for (const dir of [-1, 1]) {
      const tipX = px + len * sweep * 1.25;
      const tipY = mid + dir * len + wob;
      const g = x.createLinearGradient(px, mid, tipX, tipY);
      const shade = 0.82 + 0.18 * Math.random();
      g.addColorStop(0,   `rgb(${Math.round(84 * shade)},${Math.round(116 * shade)},${Math.round(44 * shade)})`);
      g.addColorStop(0.55,`rgb(${Math.round(124 * shade)},${Math.round(168 * shade)},${Math.round(58 * shade)})`);
      g.addColorStop(1,   `rgb(${Math.round(176 * shade)},${Math.round(206 * shade)},${Math.round(96 * shade)})`);
      x.fillStyle = g;
      x.beginPath();
      x.moveTo(px - 4, mid);
      x.quadraticCurveTo(px + len * 0.25, mid + dir * len * 0.55, tipX, tipY);
      x.quadraticCurveTo(px + len * 0.30, mid + dir * len * 0.42, px + 5, mid);
      x.closePath();
      x.fill();
    }
  }
  // The rachis itself.
  const r = x.createLinearGradient(0, mid - 5, 0, mid + 5);
  r.addColorStop(0, "#5c7a2c"); r.addColorStop(0.5, "#9ab84e"); r.addColorStop(1, "#4d6626");
  x.fillStyle = r;
  x.beginPath();
  x.moveTo(8, mid - 5); x.lineTo(W - 12, mid - 1.2);
  x.lineTo(W - 12, mid + 1.2); x.lineTo(8, mid + 5);
  x.closePath(); x.fill();
  return c;
}

/** A single detached leaflet, for the ones in the air. */
function texLeaf() {
  const c = canvas(128, 64), x = c.getContext("2d"), W = c.width, H = c.height;
  x.clearRect(0, 0, W, H);
  const g = x.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, "#6f9235"); g.addColorStop(0.6, "#a9c95c"); g.addColorStop(1, "#d6e39a");
  x.fillStyle = g;
  x.beginPath();
  x.moveTo(2, H / 2);
  x.quadraticCurveTo(W * 0.4, 1, W - 3, H / 2);
  x.quadraticCurveTo(W * 0.4, H - 1, 2, H / 2);
  x.closePath(); x.fill();
  x.strokeStyle = "rgba(60,84,24,.5)"; x.lineWidth = 1;
  x.beginPath(); x.moveTo(3, H / 2); x.lineTo(W - 4, H / 2); x.stroke();
  return c;
}

/** Soft round falloff — used for dust motes and the sun's bloom seed. */
function texGlow() {
  const c = canvas(128, 128), x = c.getContext("2d"), S = c.width;
  const g = x.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.35, "rgba(255,252,240,.5)");
  g.addColorStop(1, "rgba(255,250,235,0)");
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  return c;
}

/**
 * A storefront's sign band: the house colourway, its name, its count, and the
 * same corner brackets the tiles on the store wear.
 */
function texSign(brand) {
  const c = canvas(1024, 256), x = c.getContext("2d"), W = c.width, H = c.height;
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, brand.bg[0]); g.addColorStop(1, brand.bg[1]);
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  if (brand.slug === "off-white") {
    x.save(); x.translate(W / 2, H / 2); x.rotate(-Math.PI / 4); x.translate(-W, -H);
    x.fillStyle = "#111";
    for (let i = 0; i < 60; i++) if (i % 2 === 0) x.fillRect(0, i * (H / 10), W * 2, H / 20);
    x.restore();
    x.fillStyle = "rgba(243,243,241,.85)";
    x.fillRect(0, H * 0.24, W, H * 0.52);
  }

  x.fillStyle = brand.ink;
  x.textAlign = "center";
  x.textBaseline = "middle";

  const face = getComputedStyle(document.body).fontFamily;
  const label = brand.name.toUpperCase();

  // Name in type first, so the sign is legible from the moment it is built.
  // A house with real artwork paints over this once the file arrives; doing it
  // the other way round would leave blank boards for a second on a slow line.
  let size = Math.round(H * 0.42);
  do { x.font = `700 ${size}px ${face}`; size -= 2; }
  while (x.measureText(label).width > W * 0.7 && size > 16);
  x.fillText(label, W / 2, H * 0.5);


  const m = H * 0.12, L = H * 0.16;
  x.strokeStyle = brand.ink; x.globalAlpha = 0.45; x.lineWidth = Math.max(2, H * 0.016);
  for (const [cx, cy, dx, dy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
    x.beginPath();
    x.moveTo(cx, cy + dy * L); x.lineTo(cx, cy); x.lineTo(cx + dx * L, cy);
    x.stroke();
  }
  return c;
}

/**
 * Swaps a sign's typed name for the house's own artwork once it loads.
 *
 * Kept asynchronous and optional on purpose: the scene is built and running
 * before any of these arrive, and a house with no file, or a file that fails,
 * simply keeps the name it already has. The texture is only marked dirty on
 * success, so a broken load costs nothing but the request.
 */
function dressSign(canvasEl, texture, brand) {
  const src = logoFor(brand.slug);
  if (!src) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    const x = canvasEl.getContext("2d"), W = canvasEl.width, H = canvasEl.height;
    // Repaint the ground, then the artwork over it.
    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, brand.bg[0]); g.addColorStop(1, brand.bg[1]);
    x.fillStyle = g; x.fillRect(0, 0, W, H);

    const maxW = W * 0.66, maxH = H * 0.64;
    const k = Math.min(maxW / img.width, maxH / img.height);
    const w = img.width * k, h = img.height * k;
    x.drawImage(img, (W - w) / 2, H * 0.5 - h / 2, w, h);


    const m = H * 0.12, L = H * 0.16;
    x.strokeStyle = brand.ink; x.globalAlpha = 0.45; x.lineWidth = Math.max(2, H * 0.016);
    for (const [cx, cy, dx, dy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) {
      x.beginPath();
      x.moveTo(cx, cy + dy * L); x.lineTo(cx, cy); x.lineTo(cx + dx * L, cy);
      x.stroke();
    }
    texture.needsUpdate = true;
  };
  img.src = src;
}

/**
 * A perforated screen: the punched and woven metal that hangs in front of so
 * many facades in a district like this one. Two patterns, because one repeated
 * fifteen times is wallpaper.
 */
function texScreen(kind) {
  const c = canvas(512, 512), x = c.getContext("2d"), S = c.width;
  x.clearRect(0, 0, S, S);
  x.fillStyle = "#ffffff";
  x.fillRect(0, 0, S, S);
  x.globalCompositeOperation = "destination-out";

  if (kind === "dots") {
    const n = 11, step = S / n;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const off = (j % 2) * step * 0.5;
        x.beginPath();
        x.arc(i * step + step / 2 + off, j * step + step / 2, step * 0.34, 0, 7);
        x.fill();
      }
    }
  } else if (kind === "weave") {
    x.lineWidth = S * 0.055;
    x.lineCap = "butt";
    for (let i = -S; i < S * 2; i += S / 7) {
      x.beginPath(); x.moveTo(i, 0); x.lineTo(i + S, S); x.stroke();
      x.beginPath(); x.moveTo(i + S, 0); x.lineTo(i, S); x.stroke();
    }
  } else {   // fins: tall slots
    const n = 9, step = S / n;
    for (let i = 0; i < n; i++) x.fillRect(i * step + step * 0.28, 0, step * 0.44, S);
  }

  x.globalCompositeOperation = "source-over";
  return c;
}

/**
 * Architectural concrete, not stucco.
 *
 * The buildings were a warm cream washed toward each house's colour, which
 * read as painted render — closer to a seaside parade than to the poured
 * in-situ work the street is meant to be made of. Real fair-faced concrete is
 * a cool grey that drifts blue in shade and yellow in sun, and what sells it
 * is the evidence of how it was made: the horizontal seams where one lift of
 * formwork met the next, the grid of tie holes, fine aggregate speckle and
 * the streaks weather leaves down a facade.
 */
function texConcrete() {
  const c = canvas(768, 768), x = c.getContext("2d"), S = c.width;
  x.fillStyle = "#b9b7b0"; x.fillRect(0, 0, S, S);

  // Broad tonal drift, pour to pour.
  for (let i = 0; i < 700; i++) {
    x.globalAlpha = 0.018 + Math.random() * 0.03;
    x.fillStyle = Math.random() > 0.5 ? "#d5d3cc" : "#98968f";
    const r = 30 + Math.random() * 190;
    x.beginPath(); x.ellipse(Math.random() * S, Math.random() * S, r, r * 0.55, Math.random() * 3, 0, 7); x.fill();
  }

  // Board marks: the lift lines, every course.
  const lifts = 6;
  for (let i = 1; i < lifts; i++) {
    const y = (i / lifts) * S;
    x.globalAlpha = 0.3;
    x.fillStyle = "#8d8b84"; x.fillRect(0, y, S, 1.6);
    x.globalAlpha = 0.22;
    x.fillStyle = "#dedbd3"; x.fillRect(0, y + 1.6, S, 1.2);

    // Tie holes, plugged, two per lift.
    for (let k = 0; k < 6; k++) {
      const hx = (k + 0.5) * (S / 6) + (Math.random() - 0.5) * 12;
      const hy = y + S / lifts * 0.5;
      x.globalAlpha = 0.5;
      x.fillStyle = "#8a8880";
      x.beginPath(); x.arc(hx, hy, S * 0.006, 0, 7); x.fill();
      x.globalAlpha = 0.22;
      x.fillStyle = "#cfccc4";
      x.beginPath(); x.arc(hx - S * 0.002, hy - S * 0.002, S * 0.004, 0, 7); x.fill();
    }
  }

  // Weather streaks, top down.
  x.globalAlpha = 1;
  for (let i = 0; i < 90; i++) {
    const px = Math.random() * S;
    const g = x.createLinearGradient(0, 0, 0, S);
    g.addColorStop(0, "rgba(120,118,111,0.16)");
    g.addColorStop(0.5, "rgba(120,118,111,0.05)");
    g.addColorStop(1, "rgba(120,118,111,0)");
    x.fillStyle = g;
    x.fillRect(px, 0, 2 + Math.random() * 9, S);
  }

  // Aggregate.
  const img = x.getImageData(0, 0, S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 22;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  x.putImageData(img, 0, 0);
  return c;
}

/**
 * What you see through a shopfront: a warm lit room, rails and forms reduced
 * to soft blocks. It is always read behind tinted glass at a glancing angle,
 * so anything more literal is wasted.
 */
/**
 * The soft dark that collects where a floor meets a wall.
 *
 * Three point lights in an empty box give a room with no corners: every
 * surface is evenly lit and the floor and walls read as one folded sheet.
 * This is laid over the floor as a decal — clear in the middle, shaded at
 * the edges — and does more to seat the fixtures on the ground than another
 * light would. Greyscale, because `alphaMap` samples the green channel.
 */
function texRoomAO() {
  const c = canvas(256, 256), x = c.getContext("2d"), S = c.width;
  x.fillStyle = "#000"; x.fillRect(0, 0, S, S);
  const g = x.createRadialGradient(S / 2, S / 2, S * 0.10, S / 2, S / 2, S * 0.64);
  g.addColorStop(0, "#000");
  g.addColorStop(0.68, "#0d0d0d");
  g.addColorStop(1, "#8f8f8f");
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  return c;
}

function texInterior() {
  const c = canvas(512, 256), x = c.getContext("2d"), W = c.width, H = c.height;
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#fff6e4"); g.addColorStop(0.55, "#e8dcc6"); g.addColorStop(1, "#b9ac95");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // Rails and hanging stock.
  for (let i = 0; i < 26; i++) {
    const px = Math.random() * W, w = 6 + Math.random() * 16, h = H * (0.2 + Math.random() * 0.4);
    x.globalAlpha = 0.18 + Math.random() * 0.3;
    x.fillStyle = ["#6a6257", "#3c3831", "#8d7f6b", "#2b2925"][Math.floor(Math.random() * 4)];
    x.fillRect(px, H * 0.32, w, h);
  }
  // Ceiling spots.
  x.globalAlpha = 0.5;
  for (let i = 0; i < 7; i++) {
    const px = (i + 0.5) * (W / 7);
    const r = x.createRadialGradient(px, 0, 0, px, 0, H * 0.7);
    r.addColorStop(0, "rgba(255,246,222,.95)"); r.addColorStop(1, "rgba(255,246,222,0)");
    x.fillStyle = r; x.fillRect(px - H * 0.7, 0, H * 1.4, H);
  }
  x.globalAlpha = 1;
  return c;
}

// ## 09  BOOT — renderer, scene, camera

const canvasEl = document.getElementById("stage");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas: canvasEl,
    antialias: !QUALITY.light,
    powerPreference: "high-performance",
    stencil: false,
  });
} catch (err) {
  document.getElementById("fallback").dataset.on = "1";
  document.getElementById("boot").dataset.done = "1";
  throw err;
}

/**
 * The canvas box, which is not the window.
 *
 * Everything that turns a 3D point into a screen position — the projection
 * aspect, the waypoint markers, the pointer — has to measure against the
 * canvas, not `innerHeight`. They agreed while the canvas was sized in
 * pixels off the window; they stop agreeing the moment the canvas is sized
 * in `lvh` and the address bar is showing.
 */
let viewW = canvasEl.clientWidth || innerWidth;
let viewH = canvasEl.clientHeight || innerHeight;

renderer.setPixelRatio(Math.min(devicePixelRatio, QUALITY.dpr));
renderer.setSize(viewW, viewH, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(C.fog.getHex(), C.fogDensity);

const camera = new THREE.PerspectiveCamera(46, viewW / viewH, 0.25, 900);
camera.position.set(0, 3.2, 30);

// ## 10  SKY — gradient, sun, clouds, environment
// A shader on the inside of a very large sphere. The same function that paints
// it is duplicated in the water shader so the pool reflects a sky that
// genuinely matches the one overhead.

const SKY_GLSL = /* glsl */`
  float hash31(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123); }
  float vnoise(vec3 x){
    vec3 i = floor(x), f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash31(i + vec3(0,0,0)), hash31(i + vec3(1,0,0)), f.x),
          mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
      mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x),
          mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
  float fbm(vec3 p){
    float a = 0.5, s = 0.0;
    for (int i = 0; i < 5; i++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; }
    return s;
  }
  /** A sparse field of them, only in the cells the hash picks out. */
  float starField(vec3 d){
    vec3 p = d * 190.0;
    vec3 i = floor(p);
    float h = hash31(i);
    if (h < 0.9955) return 0.0;
    vec3 f = fract(p) - 0.5;
    return smoothstep(0.34, 0.0, length(f)) * (0.35 + fract(h * 91.7) * 0.65);
  }

  vec3 skyColor(vec3 d, vec3 sunDir, vec3 zenith, vec3 horizon, vec3 under, float t){
    d = normalize(d);
    float up = clamp(d.y, -1.0, 1.0);
    vec3 col = mix(horizon, zenith, pow(clamp(up, 0.0, 1.0), 0.34));
    col = mix(under, col, smoothstep(-0.20, 0.03, up));

    float sd = max(dot(d, sunDir), 0.0);
    col += vec3(1.0, 0.95, 0.84) * pow(sd, 1400.0) * 6.0;   // disc
    col += vec3(1.0, 0.88, 0.68) * pow(sd, 22.0) * 0.30;    // aureole
    col += vec3(1.0, 0.92, 0.80) * pow(sd, 3.0) * 0.06;     // wide haze

    if (up > 0.001) {
      // Project onto a plane so the clouds take on perspective near the horizon.
      vec3 cp = d / max(up, 0.075);
      cp.xz += vec3(t * 0.0045, 0.0, t * 0.0026).xz;
      float f = fbm(cp * 0.52);
      float cover = smoothstep(0.46, 0.82, f) * smoothstep(0.0, 0.16, up);
      // Lit tops, cool bases.
      vec3 cloud = mix(vec3(0.74, 0.80, 0.89), vec3(1.0, 0.99, 0.97), smoothstep(0.48, 0.95, f));
      cloud += vec3(1.0, 0.93, 0.8) * pow(max(dot(d, sunDir), 0.0), 8.0) * 0.25;
      col = mix(col, cloud, cover * 0.92);
    }
    return col;
  }

  /** The same sky, plus stars — only the dome draws these, not the water. */
  vec3 skyWithStars(vec3 d, vec3 sunDir, vec3 zenith, vec3 horizon, vec3 under, float t, float night){
    vec3 col = skyColor(d, sunDir, zenith, horizon, under, t);
    if (night > 0.01) {
      vec3 n = normalize(d);
      float up = smoothstep(-0.02, 0.22, n.y);
      col += vec3(0.85, 0.9, 1.0) * starField(n) * night * up;
    }
    return col;
  }
`;

const skyUniforms = {
  uSun:     { value: C.sun.clone() },
  uZenith:  { value: C.zenith.clone() },
  uHorizon: { value: C.horizon.clone() },
  uUnder:   { value: C.underside.clone() },
  uTime:    { value: 0 },
  uNight:   { value: 0 },
};

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: skyUniforms,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main(){
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vDir;
      uniform vec3 uSun, uZenith, uHorizon, uUnder;
      uniform float uTime, uNight;
      ${SKY_GLSL}
      void main(){
        gl_FragColor = vec4(skyWithStars(vDir, uSun, uZenith, uHorizon, uUnder, uTime, uNight), 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  })
);
sky.renderOrder = -1;
scene.add(sky);

// Light the physical materials off that same sky rather than a studio probe.
// Kept, not disposed: the environment is regenerated whenever the time of
// day moves, and a clone of the sky shares its material, so the probe
// re-renders with whatever colours the clock has just set.
const pmrem = new THREE.PMREMGenerator(renderer);
const skyProbe = new THREE.Scene();
skyProbe.add(sky.clone());
function refreshEnvironment() {
  const old = scene.environment;
  scene.environment = pmrem.fromScene(skyProbe).texture;
  if (old) old.dispose();
}
refreshEnvironment();
scene.environmentIntensity = 0.85;

// ## 11  LIGHTING
// One hard sun for the dappled palm shadows, one hemisphere fill so the
// shadowed faces pick up sky above and warm stone below.

const sun = new THREE.DirectionalLight(0xfff2da, 2.6);
sun.position.copy(C.sun).multiplyScalar(90);
sun.castShadow = true;
sun.shadow.mapSize.set(QUALITY.shadowMap, QUALITY.shadowMap);
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0009;
sun.shadow.normalBias = 0.035;
// The shadow camera follows the journey in the frame loop; this is its size.
const SHADOW_HALF = 46;
Object.assign(sun.shadow.camera, { left: -SHADOW_HALF, right: SHADOW_HALF, top: SHADOW_HALF, bottom: -SHADOW_HALF });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0xbdddf5, 0xc6b79a, 0.95);
scene.add(hemi);

// A cool bounce from the pool, so the dome's underside is not dead.
const bounce = new THREE.DirectionalLight(0x8fd8e8, 0.45);
bounce.position.set(4, -6, 10);
scene.add(bounce);

// ## 12  PLAZA — travertine ground and pool coping

const travertine = asTexture(texTravertine(), { repeat: [44, 44] });

// Sized off the reference: a shallow basin held close to the dome, with a
// broad flat kerb, not the lake it was. The dome overhangs its own plinth
// and the water reaches only a few metres past that.
const POOL = { w: 27, d: 22, lip: 2.4, y: C.poolY };

// The plaza is a slab with the pool cut out of it. It started as a plain
// plane, which paved straight over the water: the basin is 0.28 below the
// paving, so a solid plane simply hid it. ShapeGeometry with a hole is the
// fix, and it hands back UVs in world units, which is why the repeat here is
// a fraction rather than a count.
{
  const half = 260;
  const shape = new THREE.Shape()
    .moveTo(-half, -half).lineTo(half, -half).lineTo(half, half).lineTo(-half, half).lineTo(-half, -half);
  const hole = new THREE.Path()
    .moveTo(-POOL.w / 2, -POOL.d / 2).lineTo(-POOL.w / 2, POOL.d / 2)
    .lineTo(POOL.w / 2, POOL.d / 2).lineTo(POOL.w / 2, -POOL.d / 2).lineTo(-POOL.w / 2, -POOL.d / 2);
  shape.holes.push(hole);

  const paveTex = travertine.clone();
  paveTex.needsUpdate = true;
  paveTex.repeat.set(1 / 6, 1 / 6);      // one texture tile every 6 metres

  const plaza = new THREE.Mesh(
    new THREE.ShapeGeometry(shape),
    new THREE.MeshStandardMaterial({ map: paveTex, roughness: 0.93, metalness: 0 })
  );
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.y = C.plazaY;
  plaza.receiveShadow = true;
  scene.add(plaza);
}

// The pool's raised stone lip, built from four coping slabs rather than a ring
// so the corners read square, the way they do on the real plaza.
{
  const stone = new THREE.MeshStandardMaterial({ map: travertine.clone(), roughness: 0.85 });
  stone.map.repeat.set(6, 2);
  const lipH = Math.abs(C.plazaY - POOL.y) + 0.34;
  const coping = [];
  const hw = POOL.w / 2 + POOL.lip / 2, hd = POOL.d / 2 + POOL.lip / 2;
  for (const [w, d, px, pz] of [
    [POOL.w + POOL.lip * 2, POOL.lip, 0, -hd],
    [POOL.w + POOL.lip * 2, POOL.lip, 0,  hd],
    [POOL.lip, POOL.d + POOL.lip * 2, -hw, 0],
    [POOL.lip, POOL.d + POOL.lip * 2,  hw, 0],
  ]) {
    const g = new THREE.BoxGeometry(w, lipH, d);
    g.translate(px, C.plazaY - lipH / 2 + 0.16, pz);
    coping.push(g);
  }
  const lip = new THREE.Mesh(mergeGeometries(coping), stone);
  lip.castShadow = true; lip.receiveShadow = true;
  scene.add(lip);

  // The walk out to it.
  //
  // In the reference the basin is not a pond you look at from the edge — a
  // marble causeway runs out into it with the water divided either side, and
  // that is most of why the dome reads as something you can go and stand
  // under rather than an object on a plinth. Deck flush with the paving,
  // parapets low enough to see over.
  {
    const marble = new THREE.MeshStandardMaterial({
      color: 0xe9e4d8, roughness: 0.42, metalness: 0.02, envMapIntensity: 0.8,
    });
    const reach = POOL.d / 2 + POOL.lip;
    const inner = C.domeRadius * Math.sin(C.domeCut * Math.PI) * 1.05;
    const len = reach - inner + 1.2;
    const midZ = inner + len / 2 - 0.6;
    const parts = [];

    // Both sides, now that the shell has a door at each end. The walk goes
    // in under the dome and straight out the back, and the route into the
    // street is through it rather than around it.
    for (const sz of [1, -1]) {
      // Narrow. At 6.4 wide with a 10.5 landing the walk covered most of the
      // water in front of the dome, which is the one place its reflection
      // has to land — the pool was there and had nowhere to show anything.
      const deck = new THREE.BoxGeometry(4.2, 0.62, len);
      deck.translate(0, C.plazaY - 0.31 + 0.02, sz * midZ);
      parts.push(deck);

      // A landing where it meets the step, so you arrive somewhere.
      const landing = new THREE.BoxGeometry(6.6, 0.5, 2.6);
      landing.translate(0, C.plazaY - 0.25, sz * (inner + 1.1));
      parts.push(landing);

      for (const sx of [-1, 1]) {
        const wall = new THREE.BoxGeometry(0.46, 0.56, len);
        wall.translate(sx * 2.1, C.plazaY + 0.28, sz * midZ);
        parts.push(wall);
        const cap = new THREE.BoxGeometry(0.66, 0.11, len);
        cap.translate(sx * 2.1, C.plazaY + 0.6, sz * midZ);
        parts.push(cap);
      }

      // The threshold. The plinth stands 62cm above the deck — a real step
      // up, and correct, since the reference has the dome sitting clear of
      // the plaza floor. Two treads turn it into an approach instead of a
      // kerb to trip over on the way in.
      const rise = (C.plinthTop - 0.02) / 3;
      for (let k = 0; k < 2; k++) {
        const top = C.plazaY + 0.02 + (k + 1) * rise;
        const h = top + 0.9;
        const tread = new THREE.BoxGeometry(4.2 - k * 0.35, h, 0.62);
        tread.translate(0, top - h / 2, sz * (4.92 - k * 0.6));
        parts.push(tread);
      }
    }

    const walk = new THREE.Mesh(mergeGeometries(parts), marble);
    walk.castShadow = true; walk.receiveShadow = true;
    scene.add(walk);
  }

  // The broad step the basin sits on, raised a hand above the paving.
  {
    // A border, not a slab.
    //
    // This was one box spanning the whole basin plus a margin, sitting at
    // y 0.13 — which is above the waterline at -0.28. It was a lid. The pool
    // has been under it ever since, which is why the dome kept looking like
    // it stood on dry paving however much work went into the water.
    const inW = POOL.w + POOL.lip * 2, inD = POOL.d + POOL.lip * 2;
    const band = 3.5;
    const mat = new THREE.MeshStandardMaterial({ map: travertine.clone(), roughness: 0.86 });
    mat.map.repeat.set(8, 6);
    const slabs = [];
    for (const [w, d, cx, cz] of [
      [inW + band * 2, band, 0, -(inD / 2 + band / 2)],
      [inW + band * 2, band, 0,   inD / 2 + band / 2],
      [band, inD, -(inW / 2 + band / 2), 0],
      [band, inD,   inW / 2 + band / 2,  0],
    ]) {
      const g = new THREE.BoxGeometry(w, 0.26, d);
      g.translate(cx, C.plazaY + 0.13, cz);
      slabs.push(g);
    }
    const step = new THREE.Mesh(mergeGeometries(slabs), mat);
    step.receiveShadow = true;
    scene.add(step);
  }

  // Basin floor, so the water has something to be deep over.
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(POOL.w, POOL.d),
    new THREE.MeshStandardMaterial({ color: 0x9fd3d8, roughness: 0.6 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = POOL.y - 0.85;
  floor.receiveShadow = true;
  scene.add(floor);
}

// ## 13  WATER — reflecting pool
// Not a mirror pass: the surface reflects the sky *function*, evaluated on the
// reflected view vector. That costs one extra sky evaluation per pixel and
// stays exactly in step with the real sky, including its clouds and its sun.

const waterUniforms = {
  uTime:     { value: 0 },
  uSun:      { value: C.sun.clone() },
  uZenith:   { value: C.zenith.clone() },
  uHorizon:  { value: C.horizon.clone() },
  uUnder:    { value: C.underside.clone() },
  uDeep:     { value: C.poolDeep.clone() },
  uShallow:  { value: C.poolShallow.clone() },
  uCam:      { value: new THREE.Vector3() },
  uFogColor: { value: C.fog.clone() },
  uFogDensity: { value: C.fogDensity },
  uMirror:   { value: null },
  uMirrorMat:{ value: new THREE.Matrix4() },
};

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(POOL.w, POOL.d, 1, 1),
  new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    transparent: false,
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      varying vec4 vMirror;
      uniform mat4 uMirrorMat;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        vMirror = uMirrorMat * wp;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec3 vWorld;
      varying vec4 vMirror;
      uniform float uTime, uFogDensity;
      uniform vec3 uSun, uZenith, uHorizon, uUnder, uDeep, uShallow, uCam, uFogColor;
      uniform sampler2D uMirror;
      ${SKY_GLSL}

      // Two crossing wave trains plus a fine chop, sampled as a height field.
      float waves(vec2 p){
        float h = 0.0;
        h += sin(p.x * 0.85 + uTime * 0.85) * 0.055;
        h += sin(p.y * 0.62 - uTime * 0.67) * 0.045;
        h += sin((p.x + p.y) * 1.45 + uTime * 1.5) * 0.022;
        h += fbm(vec3(p * 1.25, uTime * 0.16)) * 0.075;
        return h;
      }
      vec3 waterNormal(vec2 p){
        float e = 0.16;
        float h  = waves(p);
        float hx = waves(p + vec2(e, 0.0));
        float hz = waves(p + vec2(0.0, e));
        return normalize(vec3(-(hx - h) / e, 1.0, -(hz - h) / e));
      }

      void main(){
        vec3 n = waterNormal(vWorld.xz);
        vec3 V = normalize(uCam - vWorld);

        float fres = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.4);
        fres = clamp(fres * 0.92 + 0.06, 0.0, 1.0);

        vec3 R = reflect(-V, n);
        R.y = abs(R.y);                       // never sample below the horizon
        vec3 refl = skyColor(R, uSun, uZenith, uHorizon, uUnder, uTime);

        // The dome itself, mirrored.
        //
        // Reflecting the sky function alone was the whole problem: the water
        // showed a convincing sky and nothing that was standing in it, so it
        // read as dark paving rather than as a pool. The basin is described
        // as being kept deliberately dark precisely so it works as a mirror,
        // and a mirror with nothing in it is just a dark floor.
        vec2 muv = vMirror.xy / max(vMirror.w, 0.0001);
        muv += n.xz * 0.055;                  // the ripple breaks it up
        vec4 mirror = texture2D(uMirror, muv);
        refl = mix(refl, mirror.rgb, clamp(mirror.a * 0.96, 0.0, 1.0));

        // Body colour deepens away from the lip. Kept dark on purpose.
        float edge = smoothstep(0.0, 6.0, min(
          min(${(POOL.w / 2).toFixed(2)} - abs(vWorld.x), ${(POOL.d / 2).toFixed(2)} - abs(vWorld.z)), 6.0));
        vec3 body = mix(uShallow, uDeep, edge) * 0.26;

        // Dark body, strong reflection. A flat 0.45 floor on the mix washed
        // the surface out to the same pale tone as the travertine around it,
        // so at a glance there was no pool there at all — just more paving.
        // Letting fresnel do the work gives a dark pool that lights up as
        // your eye travels across it, which is how one actually looks.
        vec3 col = mix(body, refl, clamp(fres * 0.82 + 0.16, 0.0, 1.0));

        // Sun glitter.
        vec3 H = normalize(uSun + V);
        col += vec3(1.0, 0.96, 0.88) * pow(max(dot(n, H), 0.0), 420.0) * 2.6;

        // Caustic shimmer read back off the wave field.
        float caus = pow(max(waves(vWorld.xz * 1.9) * 6.0 + 0.5, 0.0), 3.0);
        col += vec3(0.55, 0.92, 0.95) * caus * 0.05;

        // Match the scene's exponential-squared fog by hand.
        float dist = length(uCam - vWorld);
        float f = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
        col = mix(col, uFogColor, clamp(f, 0.0, 1.0));

        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  })
);
water.rotation.x = -Math.PI / 2;
water.position.y = POOL.y;
scene.add(water);

// ## 13B  MIRROR — the dome, upside down, in the pool
//
// A planar reflection, but only of the things worth reflecting.
//
// three's own Reflector renders the entire scene a second time, which is the
// cost that was just taken out of the transmission materials and is not
// worth paying again. Almost nothing here needs to appear in the water: the
// dome, its plinth and the fountain. Those go on their own layer, and the
// mirror camera is set to that layer alone — six or seven draw calls into a
// small target instead of a whole second scene.
//
// The camera maths is the standard planar reflection: mirror the eye through
// the water plane, mirror the point it is looking at, flip the up vector, and
// build a texture matrix so the water can look itself up in screen space.

const MIRROR_LAYER = 1;

const mirror = (() => {
  const size = QUALITY.light ? 256 : 512;
  const target = new THREE.WebGLRenderTarget(size, size, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    generateMipmaps: false,
  });
  const cam = new THREE.PerspectiveCamera();
  cam.layers.set(MIRROR_LAYER);

  const normal = new THREE.Vector3(0, 1, 0);
  const origin = new THREE.Vector3(0, POOL.y, 0);
  const view = new THREE.Vector3();
  const look = new THREE.Vector3();
  const rot = new THREE.Matrix4();
  const up = new THREE.Vector3();

  const texMat = new THREE.Matrix4();

  waterUniforms.uMirror.value = target.texture;

  return {
    render(renderer, scene, camera) {
      view.copy(camera.position).sub(origin);
      view.reflect(normal).negate().add(origin);

      rot.extractRotation(camera.matrixWorld);
      look.set(0, 0, -1).applyMatrix4(rot).add(camera.position).sub(origin);
      look.reflect(normal).negate().add(origin);

      up.set(0, 1, 0).applyMatrix4(rot).reflect(normal).negate();

      cam.position.copy(view);
      cam.up.copy(up);
      cam.lookAt(look);
      cam.near = camera.near;
      cam.far = camera.far;
      cam.fov = camera.fov;
      cam.aspect = camera.aspect;
      cam.updateProjectionMatrix();
      cam.updateMatrixWorld();

      texMat.set(0.5, 0, 0, 0.5,
                 0, 0.5, 0, 0.5,
                 0, 0, 0.5, 0.5,
                 0, 0, 0, 1);
      texMat.multiply(cam.projectionMatrix);
      texMat.multiply(cam.matrixWorldInverse);
      waterUniforms.uMirrorMat.value.copy(texMat);

      const prevTarget = renderer.getRenderTarget();
      const prevAlpha = renderer.getClearAlpha();
      renderer.setRenderTarget(target);
      renderer.setClearColor(0x000000, 0);
      renderer.clear(true, true, false);
      renderer.render(scene, cam);
      renderer.setRenderTarget(prevTarget);
      renderer.setClearAlpha(prevAlpha);
    },
  };
})();

// ## 14  DOME — the Fly's Eye
// A squashed sphere with circular openings punched through it. The holes are
// distributed by the Fibonacci lattice, which is what gives the real dome its
// even-but-not-gridded look, and each one is cut out of the shell with an
// alpha map, ringed with a torus lip and filled with a pane of tinted glass.

const domeGroup = new THREE.Group();
scene.add(domeGroup);

// Reached by the clock, so the shell can glow after dark.
let domeShellMat = null, domeRimMat = null;

/** Fibonacci points on the unit sphere, in the same frame SphereGeometry uses. */
function holeDirections(count, cutTheta) {
  const golden = Math.PI * (3 - Math.sqrt(5));
  const out = [];
  for (let i = 0; i < count * 2; i++) {
    const y = 1 - (i / (count * 2 - 1)) * 2;
    const theta = Math.acos(clamp(y, -1, 1));
    // Keep a whole rim's worth of shell between the last opening and the cut,
    // or the bottom row breaks open into the plinth.
    if (theta > cutTheta - HOLE_ANGLE * 1.25) continue;
    const phi = i * golden;
    const r = Math.sin(theta);
    out.push(new THREE.Vector3(-Math.cos(phi) * r, Math.cos(theta), Math.sin(phi) * r));
  }
  return out;
}

const CUT = C.domeCut * Math.PI;
const HOLE_ANGLE = C.holeAngle;
const HOLES = holeDirections(C.domeHoles, CUT);

/* ── the walk-through ──────────────────────────────────────────────────
 *
 * An arch cut clean through the shell, fore and aft, on the same line the
 * causeway runs. It is the difference between a sculpture you circle and a
 * pavilion you walk into, and the camera now takes the second reading: down
 * the walk, in under the shell, and out the far side into the street.
 *
 * Defined in metres above the plinth rather than in angles, because that is
 * how a door is actually judged — a person walks through 4.2 wide and 4
 * high whatever polar angle the shell happens to be at there. Everything
 * else converts into this frame: the alpha map that cuts the shell, and the
 * test that drops any lens ring standing in the opening.
 */
const DOOR = { w: 2.1, shoulder: 2.3, top: 4.0, feather: 0.16 };
const DOOR_AZ = [Math.PI / 2, Math.PI * 1.5];      // +z and -z

/** Half-width of the opening at a given height: straight, then an arch. */
function doorHalf(h) {
  if (h <= DOOR.shoulder) return DOOR.w;
  const t = (h - DOOR.shoulder) / (DOOR.top - DOOR.shoulder);
  return t >= 1 ? 0 : DOOR.w * Math.sqrt(1 - t * t);
}

/** Height above the plinth of the shell at a polar angle, in world units. */
const shellHeight = (theta) =>
  C.domeCenterY + C.domeSquash * C.domeRadius * Math.cos(theta) - C.plinthTop;

/**
 * How far inside a doorway a point on the shell lies, in metres.
 * Negative is outside, which is what lets the cut be feathered.
 */
function doorDepth(theta, phi) {
  const h = shellHeight(theta);
  if (h > DOOR.top || h < -0.6) return -9;
  const half = doorHalf(h);
  if (half <= 0) return -9;
  const r = C.domeRadius * Math.sin(theta);
  let best = -9;
  for (const az of DOOR_AZ) {
    let d = Math.abs(phi - az);
    if (d > Math.PI) d = Math.PI * 2 - d;
    const v = half - d * r;
    if (v > best) best = v;
  }
  return best;
}

/** True when a lens opening overlaps a doorway and should not be ringed. */
const holeMeetsDoor = (() => {
  const u = new THREE.Vector3(), v = new THREE.Vector3(), q = new THREE.Vector3();
  return (dir) => {
    u.set(0, 1, 0);
    if (Math.abs(dir.y) > 0.9) u.set(1, 0, 0);
    u.cross(dir).normalize();
    v.crossVectors(dir, u).normalize();
    const ca = Math.cos(HOLE_ANGLE), sa = Math.sin(HOLE_ANGLE);
    for (let i = -1; i < 16; i++) {
      if (i < 0) q.copy(dir);
      else {
        const a = (i / 16) * Math.PI * 2;
        q.copy(dir).multiplyScalar(ca)
          .addScaledVector(u, Math.cos(a) * sa)
          .addScaledVector(v, Math.sin(a) * sa)
          .normalize();
      }
      let ph = Math.atan2(q.z, -q.x);
      if (ph < 0) ph += Math.PI * 2;
      if (doorDepth(Math.acos(clamp(q.y, -1, 1)), ph) > 0) return true;
    }
    return false;
  };
})();

/**
 * The shell's alpha map, in the equirectangular frame SphereGeometry unwraps
 * to. Rasterised per hole inside its own bounding box rather than per pixel
 * against every hole — the whole-image version is 40× the work for the same
 * picture.
 */
function texDomeAlpha() {
  const W = Math.round(1600 * QUALITY.texScale), H = Math.round(800 * QUALITY.texScale);
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const img = ctx.getImageData(0, 0, W, H), d = img.data;

  const cosHole = Math.cos(HOLE_ANGLE);
  const cosSoft = Math.cos(HOLE_ANGLE * 1.06);   // one-pixel feather

  for (const dir of HOLES) {
    const thetaC = Math.acos(clamp(dir.y, -1, 1));
    // Bounding box in the texture. Azimuth widens as you approach the pole.
    const dTheta = HOLE_ANGLE * 1.15;
    const sinT = Math.max(Math.sin(thetaC), 1e-3);
    const dPhi = Math.min(Math.PI, (HOLE_ANGLE * 1.15) / sinT);

    const y0 = Math.max(0, Math.floor(((thetaC - dTheta) / CUT) * H));
    const y1 = Math.min(H - 1, Math.ceil(((thetaC + dTheta) / CUT) * H));
    let phiC = Math.atan2(dir.z, -dir.x);
    if (phiC < 0) phiC += Math.PI * 2;

    for (let y = y0; y <= y1; y++) {
      const theta = (y / H) * CUT;
      const st = Math.sin(theta), ct = Math.cos(theta);
      const xSpan = Math.ceil((dPhi / (Math.PI * 2)) * W);
      const xC = Math.round((phiC / (Math.PI * 2)) * W);

      for (let k = -xSpan; k <= xSpan; k++) {
        const xw = ((xC + k) % W + W) % W;            // wrap in azimuth
        const phi = (xw / W) * Math.PI * 2;
        const dot = (-Math.cos(phi) * st) * dir.x + ct * dir.y + (Math.sin(phi) * st) * dir.z;
        if (dot <= cosSoft) continue;
        const a = dot >= cosHole ? 0 : 1 - (dot - cosSoft) / (cosHole - cosSoft);
        const i = (y * W + xw) * 4;
        const v = Math.round(a * 255);
        if (v < d[i]) { d[i] = d[i + 1] = d[i + 2] = v; }
      }
    }
  }
  // The two doorways, cut after the lenses so they win wherever they meet.
  // Only the rows that can contain one are visited — the arch tops out four
  // metres above the plinth, which is a little over a third of the way up
  // the map.
  {
    const cosTop = clamp(
      (C.plinthTop + DOOR.top - C.domeCenterY) / (C.domeSquash * C.domeRadius), -1, 1);
    const yTop = Math.max(0, Math.floor((Math.acos(cosTop) / CUT) * H) - 2);
    for (let y = yTop; y < H; y++) {
      const theta = (y / H) * CUT;
      for (let x = 0; x < W; x++) {
        const dd = doorDepth(theta, (x / W) * Math.PI * 2);
        if (dd <= -DOOR.feather) continue;
        const a = dd >= 0 ? 0 : Math.round((-dd / DOOR.feather) * 255);
        const i = (y * W + x) * 4;
        if (a < d[i]) { d[i] = d[i + 1] = d[i + 2] = a; }
      }
    }
  }

  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

{
  const shellGeo = new THREE.SphereGeometry(
    C.domeRadius, QUALITY.domeSeg[0], QUALITY.domeSeg[1], 0, Math.PI * 2, 0, CUT);
  const shell = new THREE.Mesh(
    shellGeo,
    new THREE.MeshPhysicalMaterial({
      color: 0xf4f7f6,
      roughness: 0.22,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.12,
      iridescence: 0.85,
      iridescenceIOR: 1.32,
      iridescenceThicknessRange: [120, 760],
      alphaMap: texDomeAlpha(),
      emissive: 0xbfe4ee,
      emissiveIntensity: 0,
      transparent: true,
      alphaTest: 0.45,
      side: THREE.DoubleSide,
      envMapIntensity: 1.15,
    })
  );
  shell.castShadow = true;
  shell.receiveShadow = true;
  domeShellMat = shell.material;
  domeGroup.add(shell);

  // Rims and panes, merged into one mesh each.
  const rimGeos = [], paneGeos = [];
  const up = new THREE.Vector3(0, 0, 1);
  const q = new THREE.Quaternion();
  const m = new THREE.Matrix4();

  for (const dir of HOLES) {
    // A lens that overlaps a doorway loses its lip and its glass. What is
    // left is an open circle running into the arch, which is how the cut
    // stays part of the pattern instead of looking sawn out of it.
    if (holeMeetsDoor(dir)) continue;

    const ringR = C.domeRadius * Math.sin(HOLE_ANGLE);
    const depth = C.domeRadius * Math.cos(HOLE_ANGLE);
    q.setFromUnitVectors(up, dir);

    const rim = new THREE.TorusGeometry(ringR, C.rimTube, 8, QUALITY.holeSeg);
    m.compose(dir.clone().multiplyScalar(depth), q, new THREE.Vector3(1, 1, 1));
    rim.applyMatrix4(m);
    rimGeos.push(rim);

    const pane = new THREE.CircleGeometry(ringR * 0.985, QUALITY.holeSeg);
    m.compose(dir.clone().multiplyScalar(depth * 0.995), q, new THREE.Vector3(1, 1, 1));
    pane.applyMatrix4(m);
    paneGeos.push(pane);
  }

  const rims = new THREE.Mesh(
    mergeGeometries(rimGeos),
    new THREE.MeshPhysicalMaterial({
