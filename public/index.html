    // A press here is unambiguous consent, so it both starts a blocked
    // context and mutes a running one.
    if (sound.blocked || !sound.on) { sound.enable(); switchHint(); }
    else sound.toggle();
    setTimeout(paint, 60);
  });

  sound.boot().then((playing) => { if (!playing) arm(); paint(); });

  // Coming back to the tab is another chance: a browser that refused on a
  // cold load will often allow it once the page has been foregrounded.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && sound.blocked) { sound.enable(); arm(); setTimeout(paint, 60); }
  });

  addEventListener("keydown", (e) => {
    if (e.key === "m" || e.key === "M") { sound.toggle(); setTimeout(paint, 60); }
  });
}

// A handle for tuning from the console: DD.C holds every constant the scene
// was built from, DD.scene the graph itself.
window.DD = { THREE, scene, camera, renderer, composer, C, BRANDS, PATH, LOOK,
              wind: windUniforms, sky: skyUniforms, water: waterUniforms, sound,
              setHour: applyTimeOfDay, get hour() { return currentHour; },
              goTo: (v) => scrollTo(0, v * (document.documentElement.scrollHeight - innerHeight)),
              // Place and render the scene at a scroll position without the
              // rAF loop; works in a backgrounded tab, where goTo does not.
              step: (v) => { scrollEased = v; step(0.016, clock.elapsedTime, v); },
              get store() { return storeMode; } };


// ## 26  TIME OF DAY — the scene follows the visitor's clock
//
// Opening this at eleven at night and getting a blazing noon is the single
// thing that most gives away a rendered scene as a rendered scene. So the
// plaza runs on the visitor's own clock: the sun rises and sets where and
// when it should, and everything that depends on it follows.
//
// Not just the sun's direction, and that is the point. Changing only the
// light angle gives you a daylit scene with long shadows, which reads as
// late afternoon whatever the hour. What actually makes night look like
// night is the whole chain moving together — sky gradient, fog colour and
// density, ambient fill, exposure, the environment probe the glass and
// concrete reflect, the shopfronts coming on from the inside, the signs
// lighting up, and stars appearing once the sun is properly down.
//
// The table below is keyframes on the hour hand. Everything between them is
// interpolated, so the transition through dawn and dusk is continuous
// rather than a set of four presets.

const TIMELINE = [
  // h    elev  sunCol    sunI  hemiSky   hemiGnd   hemiI  zenith    horizon   under     fog       fogD    exp   inner sign bloom night
  { h: 0.0,  el: -32, sc: 0x9fb4e8, si: 0.16, hs: 0x3a5a94, hg: 0x4a3a28, hi: 1.25,
    zen: 0x030714, hor: 0x0d1930, und: 0x060b16, fog: 0x0e1a2f, fd: 0.0098, ex: 1.45, inn: 3.6, sg: 0.95, bl: 0.46, ni: 1.0 },
  { h: 4.6,  el: -14, sc: 0xa8b6e0, si: 0.22, hs: 0x3f5f96, hg: 0x4a3c2c, hi: 1.20,
    zen: 0x061027, hor: 0x1d2a49, und: 0x0c1220, fog: 0x18253c, fd: 0.0092, ex: 1.40, inn: 3.4, sg: 0.88, bl: 0.46, ni: 0.92 },
  { h: 6.2,  el: 2,   sc: 0xff9358, si: 1.05, hs: 0x5b6a96, hg: 0x35302f, hi: 0.62,
    zen: 0x123059, hor: 0xd08a63, und: 0x3a3238, fog: 0x8e7a73, fd: 0.0078, ex: 1.12, inn: 1.5, sg: 0.45, bl: 0.50, ni: 0.35 },
  { h: 8.0,  el: 24,  sc: 0xffd6a8, si: 2.10, hs: 0x9dc2e6, hg: 0xa79a82, hi: 0.82,
    zen: 0x1a5cb4, hor: 0xcfdcea, und: 0x9fb0be, fog: 0xc2d2e2, fd: 0.0060, ex: 1.02, inn: 0.75, sg: 0.10, bl: 0.48, ni: 0.0 },
  { h: 12.0, el: 66,  sc: 0xfff2da, si: 2.70, hs: 0xbdddf5, hg: 0xc6b79a, hi: 0.98,
    zen: 0x0b4fbe, hor: 0xa8d2ee, und: 0x9fb9c9, fog: 0xb7d6ea, fd: 0.0052, ex: 0.98, inn: 0.50, sg: 0.0, bl: 0.42, ni: 0.0 },
  { h: 16.0, el: 30,  sc: 0xffe0b4, si: 2.25, hs: 0xb2d2ee, hg: 0xc4b195, hi: 0.88,
    zen: 0x1050b2, hor: 0xbcd6ec, und: 0x9db2c2, fog: 0xbdd2e4, fd: 0.0056, ex: 1.00, inn: 0.62, sg: 0.05, bl: 0.46, ni: 0.0 },
  { h: 18.6, el: 5,   sc: 0xff8446, si: 1.25, hs: 0x6b6a94, hg: 0x3d3430, hi: 0.66,
    zen: 0x17356b, hor: 0xe08a52, und: 0x46383a, fog: 0xa07863, fd: 0.0074, ex: 1.10, inn: 1.4, sg: 0.40, bl: 0.50, ni: 0.28 },
  { h: 19.8, el: -7,  sc: 0xc06a7a, si: 0.45, hs: 0x50609a, hg: 0x4e3e2e, hi: 1.00,
    zen: 0x0a1736, hor: 0x5e3f57, und: 0x1e1c2a, fog: 0x3c3350, fd: 0.0086, ex: 1.32, inn: 3.0, sg: 0.72, bl: 0.48, ni: 0.72 },
  { h: 21.5, el: -22, sc: 0x9fb4e8, si: 0.17, hs: 0x3c5c95, hg: 0x4a3a2a, hi: 1.22,
    zen: 0x040917, hor: 0x101d36, und: 0x080d1a, fog: 0x111d33, fd: 0.0095, ex: 1.43, inn: 3.5, sg: 0.92, bl: 0.46, ni: 0.96 },
  { h: 24.0, el: -32, sc: 0x9fb4e8, si: 0.16, hs: 0x3a5a94, hg: 0x4a3a28, hi: 1.25,
    zen: 0x030714, hor: 0x0d1930, und: 0x060b16, fog: 0x0e1a2f, fd: 0.0098, ex: 1.45, inn: 3.6, sg: 0.95, bl: 0.46, ni: 1.0 },
];

// Declared above applyTimeOfDay, which writes to it and is called during
// module evaluation — a `let` below the call is in its temporal dead zone
// and throws. Third time this shape of bug has appeared in this file.
let currentHour = 12;

const _cA = new THREE.Color(), _cB = new THREE.Color();
const mixCol = (out, a, b, t) => out.copy(_cA.setHex(a)).lerp(_cB.setHex(b), t);
const mixNum = (a, b, t) => a + (b - a) * t;

/**
 * Places the scene at a given hour, 0 to 24.
 *
 * The azimuth runs east to west across the day so the shadows sweep the
 * right way round, and the elevation comes from the table rather than a
 * trigonometric model — a model would be accurate for a latitude we have
 * not been told, and what matters here is that it looks like the hour, not
 * that it is astronomically correct for Miami.
 */
function applyTimeOfDay(hour) {
  const h = ((hour % 24) + 24) % 24;
  let i = 0;
  while (i < TIMELINE.length - 2 && TIMELINE[i + 1].h <= h) i++;
  const a = TIMELINE[i], b = TIMELINE[i + 1];
  const t = clamp((h - a.h) / (b.h - a.h), 0, 1);
  const k = t * t * (3 - 2 * t);                    // ease, so dawn is not linear

  const el = mixNum(a.el, b.el, k) * Math.PI / 180;
  // Sunrise in the east, sunset in the west, tracking across the south.
  const az = ((h - 6) / 12) * Math.PI + Math.PI * 0.08;
  C.sun.set(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el)).normalize();

  mixCol(C.zenith, a.zen, b.zen, k);
  mixCol(C.horizon, a.hor, b.hor, k);
  mixCol(C.underside, a.und, b.und, k);
  mixCol(C.fog, a.fog, b.fog, k);
  C.fogDensity = mixNum(a.fd, b.fd, k);
  const night = mixNum(a.ni, b.ni, k);
  // The ambience runs on the same number the lighting does.
  sound.setNight(night);

  // --- sky and water read the same numbers -------------------------------
  skyUniforms.uSun.value.copy(C.sun);
  skyUniforms.uZenith.value.copy(C.zenith);
  skyUniforms.uHorizon.value.copy(C.horizon);
  skyUniforms.uUnder.value.copy(C.underside);
  skyUniforms.uNight.value = night;

  waterUniforms.uSun.value.copy(C.sun);
  waterUniforms.uZenith.value.copy(C.zenith);
  waterUniforms.uHorizon.value.copy(C.horizon);
  waterUniforms.uUnder.value.copy(C.underside);
  waterUniforms.uFogColor.value.copy(C.fog);
  waterUniforms.uFogDensity.value = C.fogDensity;
  // The pool goes black and reflective after dark rather than staying a
  // lit turquoise, which is what water actually does at night.
  waterUniforms.uDeep.value.copy(C.poolDeep).multiplyScalar(mixNum(1, 0.16, night));
  waterUniforms.uShallow.value.copy(C.poolShallow).multiplyScalar(mixNum(1, 0.22, night));

  // --- lights -------------------------------------------------------------
  sun.color.copy(mixCol(_cA.clone(), a.sc, b.sc, k));
  sun.intensity = mixNum(a.si, b.si, k);
  hemi.color.copy(mixCol(_cA.clone(), a.hs, b.hs, k));
  hemi.groundColor.copy(mixCol(_cA.clone(), a.hg, b.hg, k));
  hemi.intensity = mixNum(a.hi, b.hi, k);
  bounce.intensity = mixNum(0.45, 0.10, night);

  scene.fog.color.copy(C.fog);
  scene.fog.density = C.fogDensity;
  renderer.toneMappingExposure = mixNum(a.ex, b.ex, k);
  scene.environmentIntensity = mixNum(0.85, 0.35, night);

  // --- the street turns its own lights on ---------------------------------
  if (interiorMat) interiorMat.emissiveIntensity = mixNum(a.inn, b.inn, k);
  const signGlow = mixNum(a.sg, b.sg, k);
  for (const m of signMats) m.emissiveIntensity = signGlow;

  // The dome's own lighting. Uplighters come up as the sun goes down, and
  // the shell takes a faint emissive with them so it reads as lit from
  // within rather than merely illuminated.
  for (const l of fountain.lights) l.intensity = mixNum(0, 14, night);
  for (const l of streetLamps) l.intensity = mixNum(0, 16, night);
  // Well down from where this started. The strips were blowing out into
  // solid white bars — an emissive of 1.9 with bloom on top is far past what
  // a light fitting should read as, and it swamped the shopfronts they were
  // supposed to be lighting.
  if (canopyStripMat) canopyStripMat.emissiveIntensity = mixNum(0, 0.75, night);
  if (lampHeadMat) lampHeadMat.emissiveIntensity = mixNum(0, 1.5, night);
  if (endBandMat) endBandMat.emissiveIntensity = mixNum(0, 1.3, night);
  // Tinted glass swallows a lit interior. After dark it opens up, which is
  // also what a real shopfront does once the inside is brighter than the out.
  if (glassMat) {
    glassMat.opacity = mixNum(0.85, 0.42, night);
    if (QUALITY.transmission) glassMat.transmission = mixNum(0.55, 0.9, night);
  }
  if (domeShellMat) domeShellMat.emissiveIntensity = mixNum(0, 0.34, night);
  if (domeRimMat) domeRimMat.emissiveIntensity = mixNum(0, 0.26, night);

  if (bloomPass) bloomPass.strength = mixNum(a.bl, b.bl, k);

  // The probe has to be re-rendered or every reflective surface keeps the
  // sky it was built under.
  refreshEnvironment();

  currentHour = h;
}


/** The visitor's own local hour, fractional. */
const localHour = () => {
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60;
};

applyTimeOfDay(localHour());
// Re-read every few minutes, so a tab left open through dusk follows it.
setInterval(() => applyTimeOfDay(localHour()), 4 * 60 * 1000);


// ## 27  STORE INTERIORS — step inside a house
//
// Clicking a house stops being a link off the page and becomes a door. The
// camera cuts to a room behind that shopfront, the house's own stock is on
// the walls, and the listing along the bottom is the same catalogue the
// storefront serves — fetched from /api/storefront, which exists for this.
//
// One room, re-dressed.
//
// Fifteen interiors standing permanently in the scene would be fifteen times
// the geometry to carry down a street you can only ever be inside one of.
// There is a single room instead, moved onto whichever monolith you walked
// into and given that building's own transform — so it lands inside the
// footprint, facing the street, with no arithmetic about which kerb it is on.
//
// What changes per house is real, though, not a tint. Five kinds of room —
// gallery, vault, atelier, bodega, works — each with its own fixtures, and
// each house's own colours on the walls, floor, trim and light. A Chrome
// Hearts vitrine room and a Supreme gridwall room are not the same box in
// two colours.

// Deeper than the shop it sits behind, and that is fine: it is a closed
// box, nothing outside it is ever in frame, and the depth is what lets the
// camera stand far enough back to see the whole wall. Capped at 11.6 all the
// same — one more metre and the back wall would push through the block that
// closes the plaza on that side, and *that* would be in frame.
const ROOM = { w: 14.4, d: 11.6, h: 5.6, front: -2.8 };
const ROOM_BACK = ROOM.front - ROOM.d;

// A phone sees a 34-degree wedge where a laptop sees 67. The same wall of
// stock cannot serve both: four across is two and a half across in portrait,
// cropped at both jambs. Portrait gets a squarer grid of fewer, larger
// pieces, which is also what a phone wants to look at.
const ROOM_PORTRAIT = innerWidth / innerHeight < 1;

/**
 * A room per house.
 *
 * `kind` picks the fixtures. The colours are the house's own, carried over
 * from its tile on the storefront and from the shopfront outside, so walking
 * in does not change the subject.
 */
const INTERIOR = {
  "bape":          { kind: "bodega",  wall: "#6b7a50", wall2: "#2b2f22", floor: "#cfcbc0", trim: "#b9be8f", lamp: "#fff1d2" },
  "chrome-hearts": { kind: "vault",   wall: "#16171c", wall2: "#23252d", floor: "#0e0f12", trim: "#cbced6", lamp: "#e8f0ff" },
  "supreme":       { kind: "bodega",  wall: "#ce1f26", wall2: "#8f1218", floor: "#e6e4df", trim: "#ffffff", lamp: "#ffffff" },
  "amiri":         { kind: "gallery", wall: "#f1ebdf", wall2: "#ded3bd", floor: "#c8b99e", trim: "#8a7a5e", lamp: "#fff0d6" },
  "balenciaga":    { kind: "vault",   wall: "#0d0d0d", wall2: "#1c1c1c", floor: "#151515", trim: "#7a7a7a", lamp: "#eaf0f6" },
  "gallery-dept":  { kind: "works",   wall: "#dedbd4", wall2: "#c8c4ba", floor: "#b7b3aa", trim: "#1a1a1a", lamp: "#fff6e6" },
  "godspeed":      { kind: "works",   wall: "#2a1d08", wall2: "#3c2b11", floor: "#1d1509", trim: "#caa23c", lamp: "#ffdb96" },
  "purple-brand":  { kind: "works",   wall: "#4b2a7b", wall2: "#331d55", floor: "#2a2438", trim: "#b8a0e4", lamp: "#e4d6ff" },
  "off-white":     { kind: "gallery", wall: "#f3f3f1", wall2: "#e2e2de", floor: "#d5d5d1", trim: "#111111", lamp: "#ffffff" },
  "casablanca":    { kind: "atelier", wall: "#cfe3d8", wall2: "#e8c9a0", floor: "#cbb691", trim: "#2b2018", lamp: "#ffeccb" },
  "ksubi":         { kind: "works",   wall: "#cad7e6", wall2: "#93a8c6", floor: "#b2bcc9", trim: "#121820", lamp: "#eaf3ff" },
  "essentials":    { kind: "atelier", wall: "#b4a89b", wall2: "#9c9084", floor: "#a2968a", trim: "#5f564e", lamp: "#ffeed6" },
  "rhude":         { kind: "atelier", wall: "#d8c9ab", wall2: "#bda98a", floor: "#94826a", trim: "#2a2119", lamp: "#ffe7ba" },
  "vale":          { kind: "vault",   wall: "#17203a", wall2: "#0d1426", floor: "#101726", trim: "#c9a86a", lamp: "#ffe3b0" },
  "hellstar":      { kind: "bodega",  wall: "#3a0e0e", wall2: "#7d1f10", floor: "#2a1a16", trim: "#e8552a", lamp: "#ffb27a" },
};

const storeRoom = (() => {
  const group = new THREE.Group();
  group.visible = false;

  // One material per role, recoloured on the way in. Sharing them is what
  // keeps re-dressing the room a dozen assignments rather than a rebuild.
  // Concrete under the paint. A flat colour reads as a rendering of a
  // floor; the same colour multiplied through a poured-slab map reads as a
  // floor, and it costs one texture shared by all fifteen shops.
  const floorMap = asTexture(texConcrete(), { repeat: [3, 2] });
  const matFloor = new THREE.MeshStandardMaterial({
    color: 0xcccccc, roughness: 0.34, metalness: 0.04,
    map: floorMap, envMapIntensity: 0.55,
  });
  const matWall  = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.93 });
  const matWall2 = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, roughness: 0.88 });
  const matCeil  = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.96 });
  const matTrim  = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.34, metalness: 0.62 });
  const matGlow  = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.4, roughness: 0.7 });
  const matCase  = new THREE.MeshPhysicalMaterial({
    color: 0xdfeaf0, roughness: 0.06, metalness: 0, transparent: true,
    opacity: 0.26, side: THREE.DoubleSide, envMapIntensity: 1.5,
  });

  const box = (w, h, d, x, y, z) => {
    const g = new THREE.BoxGeometry(w, h, d);
    g.translate(x, y, z);
    return g;
  };
  const tube = (r, h, x, y, z, axis) => {
    const g = new THREE.CylinderGeometry(r, r, h, 8);
    if (axis === "x") g.rotateZ(Math.PI / 2);
    if (axis === "z") g.rotateX(Math.PI / 2);
    g.translate(x, y, z);
    return g;
  };
  const add = (geos, mat, shadow) => {
    const m = new THREE.Mesh(mergeGeometries(geos), mat);
    if (shadow) { m.castShadow = true; m.receiveShadow = true; }
    return m;
  };

  // ── the shell ──────────────────────────────────────────────────────────
  const midZ = ROOM.front - ROOM.d / 2;
  // Top face at 0.06, not 0. The plaza slab outside runs at exactly 0 and
  // two surfaces at the same depth is a shimmer waiting to happen.
  group.add(add([box(ROOM.w, 0.3, ROOM.d, 0, -0.09, midZ)], matFloor, true));
  group.add(add([box(ROOM.w, 0.24, ROOM.d, 0, ROOM.h + 0.12, midZ)], matCeil, false));
  group.add(add([box(ROOM.w, ROOM.h, 0.24, 0, ROOM.h / 2, ROOM_BACK - 0.12)], matWall2, true));
  group.add(add([
    box(0.24, ROOM.h, ROOM.d, -(ROOM.w / 2 + 0.12), ROOM.h / 2, midZ),
    box(0.24, ROOM.h, ROOM.d,  (ROOM.w / 2 + 0.12), ROOM.h / 2, midZ),
    box(ROOM.w, ROOM.h, 0.24, 0, ROOM.h / 2, ROOM.front + 0.12),
  ], matWall, true));

  // Skirting and a cove. Two lines of trim around the room, which is the
  // cheapest thing that stops walls and floor reading as one folded sheet.
  {
    const trim = [];
    for (const sx of [-1, 1]) {
      trim.push(box(0.1, 0.22, ROOM.d, sx * (ROOM.w / 2 - 0.05), 0.17, midZ));
      trim.push(box(0.09, 0.1, ROOM.d, sx * (ROOM.w / 2 - 0.045), ROOM.h - 0.14, midZ));
    }
    trim.push(box(ROOM.w, 0.22, 0.1, 0, 0.17, ROOM_BACK + 0.05));
    trim.push(box(ROOM.w, 0.1, 0.09, 0, ROOM.h - 0.14, ROOM_BACK + 0.045));
    group.add(add(trim, matTrim, false));
  }

  // The corner shade, laid on the floor.
  {
    const ao = new THREE.Mesh(
      new THREE.PlaneGeometry(ROOM.w, ROOM.d),
      new THREE.MeshBasicMaterial({
        color: 0x000000, transparent: true, opacity: 0.85,
        alphaMap: asTexture(texRoomAO(), { srgb: false }),
        depthWrite: false,
      })
    );
    ao.rotation.x = -Math.PI / 2;
    ao.position.set(0, 0.07, midZ);
    ao.renderOrder = 1;
    group.add(ao);
  }

  // ── fixtures, one set per kind, only one shown at a time ───────────────
  const fixtures = {};
  const kit = (name, build) => {
    const g = new THREE.Group();
    g.visible = false;
    build(g);
    group.add(g);
    fixtures[name] = g;
  };

  // A white cube: plinths down the middle, a bench, a lighting track.
  kit("gallery", (g) => {
    const stone = [], glow = [], steel = [];
    for (let i = 0; i < 3; i++) {
      stone.push(box(1.15, 0.95, 1.15, (i % 2 ? 1 : -1) * 2.9, 0.475, -5.6 - i * 2.6));
    }
    stone.push(box(4.4, 0.4, 0.95, 0, 0.42, ROOM.front - 1.9));
    steel.push(box(0.1, 0.42, 0.1, -1.9, 0.21, ROOM.front - 1.9));
    steel.push(box(0.1, 0.42, 0.1,  1.9, 0.21, ROOM.front - 1.9));
    for (const sx of [-1, 1]) {
      steel.push(box(0.09, 0.09, ROOM.d - 1.6, sx * 3.6, ROOM.h - 0.34, midZ));
      for (let i = 0; i < 4; i++) {
        const z = ROOM.front - 1.8 - i * 2.2;
        steel.push(tube(0.11, 0.3, sx * 3.6, ROOM.h - 0.56, z, "y"));
        glow.push(box(0.17, 0.05, 0.17, sx * 3.6, ROOM.h - 0.71, z));
      }
    }
    g.add(add(stone, matWall, true), add(steel, matTrim, true), add(glow, matGlow, false));
  });

  // Dark, metal, glass: vitrines on the floor and a fluted feature wall.
  kit("vault", (g) => {
    const metal = [], glass = [], glow = [];
    for (const sx of [-1, 1]) {
      metal.push(box(2.9, 0.82, 1.15, sx * 3.7, 0.41, -6.4));
      metal.push(box(3.0, 0.07, 1.25, sx * 3.7, 0.86, -6.4));
      glass.push(box(2.9, 0.85, 1.15, sx * 3.7, 1.32, -6.4));
      glow.push(box(2.5, 0.04, 0.9, sx * 3.7, 1.72, -6.4));
    }
    for (let i = 0; i < 17; i++) {
      const x = -ROOM.w / 2 + 0.8 + i * ((ROOM.w - 1.6) / 16);
      metal.push(box(0.16, ROOM.h - 0.5, 0.16, x, (ROOM.h - 0.5) / 2, ROOM_BACK + 0.2));
    }
    glow.push(box(ROOM.w - 1.2, 0.05, 0.16, 0, 0.16, ROOM_BACK + 0.45));
    g.add(add(metal, matTrim, true), add(glass, matCase, false), add(glow, matGlow, false));
  });

  // Warm timber, a rug and freestanding rails.
  kit("atelier", (g) => {
    const wood = [], steel = [], glow = [];
    for (let i = 0; i < 16; i++) {
      wood.push(box(ROOM.w - 1.0, 0.13, 0.12, 0, 0.55 + i * ((ROOM.h - 1.2) / 15), ROOM_BACK + 0.2));
    }
    wood.push(box(ROOM.w * 0.56, 0.05, 4.4, 0, 0.04, midZ + 0.6));
    for (const sx of [-1, 1]) {
      const x = sx * 3.9;
      steel.push(tube(0.045, 2.05, x - 1.6, 1.02, -8.4, "y"));
      steel.push(tube(0.045, 2.05, x + 1.6, 1.02, -8.4, "y"));
      steel.push(tube(0.035, 3.2, x, 2.0, -8.4, "x"));
      for (let k = 0; k < 7; k++) {
        wood.push(box(0.5, 1.1, 0.13, x - 1.35 + k * 0.45, 1.35, -8.4));
      }
    }
    glow.push(box(ROOM.w - 2.4, 0.07, 0.3, 0, ROOM.h - 0.34, ROOM.front - 1.3));
    glow.push(box(ROOM.w - 2.4, 0.07, 0.3, 0, ROOM.h - 0.34, ROOM_BACK + 1.3));
    g.add(add(wood, matTrim, true), add(steel, matTrim, true), add(glow, matGlow, false));
  });

  // Colour-block walls, gridwall panels, a counter and strip light.
  kit("bodega", (g) => {
    const bars = [], glow = [], body = [];
    for (const sx of [-1, 1]) {
      for (let i = 0; i < 9; i++) {
        bars.push(box(0.1, 3.0, 0.07, sx * (ROOM.w / 2 - 0.16), 2.0, ROOM.front - 1.4 - i * 0.92));
      }
      for (let k = 0; k < 5; k++) {
        bars.push(box(0.07, 0.07, ROOM.d - 2.4, sx * (ROOM.w / 2 - 0.16), 0.9 + k * 0.55, midZ));
      }
    }
    // The counter used to stand at the door, three metres to one side of
    // where the camera comes in — which is to say off the edge of the
    // frame, leaving these three houses with a bare floor. It stands
    // further in, and a run of display tables goes down the middle, so
    // there is a shop between you and the wall rather than an empty bay.
    body.push(box(3.2, 1.0, 0.85, 4.1, 0.5, ROOM_BACK + 2.4));
    body.push(box(3.4, 0.09, 1.0, 4.1, 1.05, ROOM_BACK + 2.4));
    for (let i = 0; i < 2; i++) {
      const z = -6.6 - i * 2.9;
      body.push(box(2.3, 0.62, 1.25, -2.4 + i * 4.8, 0.31, z));
      bars.push(box(2.45, 0.07, 1.4, -2.4 + i * 4.8, 0.66, z));
      // Folded stock on top, in two stacks.
      for (const sx of [-0.55, 0.55]) {
        body.push(box(0.85, 0.26, 0.7, -2.4 + i * 4.8 + sx, 0.82, z));
      }
    }
    for (let i = 0; i < 3; i++) {
      glow.push(box(0.34, 0.09, ROOM.d - 2.0, -4.2 + i * 4.2, ROOM.h - 0.3, midZ));
    }
    g.add(add(bars, matTrim, true), add(body, matWall2, true), add(glow, matGlow, false));
  });

  // Raw: scaffold rails, painted floor markings, clamp lamps.
  kit("works", (g) => {
    const pipe = [], paint = [], glow = [];
    for (const sx of [-1, 1]) {
      const x = sx * 4.3;
      pipe.push(tube(0.06, ROOM.h, x, ROOM.h / 2, -5.6, "y"));
      pipe.push(tube(0.06, ROOM.h, x, ROOM.h / 2, -10.6, "y"));
      pipe.push(tube(0.055, 5.0, x, 2.25, -8.1, "z"));
      pipe.push(tube(0.055, 5.0, x, 3.7, -8.1, "z"));
      for (let k = 0; k < 6; k++) {
        paint.push(box(0.46, 1.05, 0.12, x - sx * 0.3, 1.62, -6.2 - k * 0.8));
      }
      pipe.push(tube(0.05, 0.5, x, 4.5, -7.2, "y"));
      glow.push(box(0.3, 0.16, 0.3, x, 4.2, -7.2));
    }
    for (let i = 0; i < 4; i++) {
      paint.push(box(ROOM.w - 2.2, 0.02, 0.16, 0, 0.02, -4.6 - i * 2.4));
    }
    g.add(add(pipe, matTrim, true), add(paint, matWall2, true), add(glow, matGlow, false));
  });

  // ── the brand's mark, on the back wall ─────────────────────────────────
  // Not through `canvas()`.
  //
  // That helper multiplies every texture by the quality budget's texScale,
  // which on a phone is 0.6 — so the one piece of artwork rendered at three
  // metres across was being drawn into a 614-pixel canvas and then blown up.
  // It is a single texture for the whole street; it can afford to be sharp.
  const markCanvas = document.createElement("canvas");
  markCanvas.width = 1536; markCanvas.height = 384;
  const markTex = new THREE.CanvasTexture(markCanvas);
  markTex.colorSpace = THREE.SRGBColorSpace;
  markTex.anisotropy = 8;

  /**
   * Paints the house's sign onto the back wall.
   *
   * There is one canvas and fifteen shops, and the artwork arrives over the
   * network — so walking from one shop into another had the first house's
   * logo landing on the second house's wall a moment later, on top of the
   * name already painted there. Two marks, overlapping.
   *
   * A generation counter settles it: a load that finishes after the visitor
   * has moved on is dropped rather than drawn. The typed name goes down
   * first so the wall is never blank while the file is in flight, which is
   * the same order the shopfronts outside use.
   */
  let markGen = 0;
  function paintMark(b) {
    const gen = ++markGen;
    const x = markCanvas.getContext("2d");
    const W = markCanvas.width, H = markCanvas.height;

    const ground = () => {
      const g = x.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, b.bg[0]); g.addColorStop(1, b.bg[1]);
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    };

    x.clearRect(0, 0, W, H);
    x.drawImage(texSign(b), 0, 0, W, H);
    markTex.needsUpdate = true;

    const src = logoFor(b.slug);
    if (!src) return;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      if (gen !== markGen) return;        // another shop is open now
      ground();
      const k = Math.min(W * 0.62 / img.width, H * 0.66 / img.height);
      const w = img.width * k, h = img.height * k;
      x.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      markTex.needsUpdate = true;
    };
    img.src = src;
  }
  const markMesh = new THREE.Mesh(
    // Narrower in portrait, where the room is seen through a 34-degree
    // wedge and a five-metre sign runs off both jambs.
    new THREE.PlaneGeometry(ROOM_PORTRAIT ? 3.9 : 5.2, ROOM_PORTRAIT ? 0.66 : 0.82),
    new THREE.MeshStandardMaterial({ map: markTex, roughness: 0.6 })
  );
  // Clear above the top row, and low enough to stay under the page header.
  // It sat across the stock, and every shop opened on its own name half
  // hidden behind a T-shirt.
  markMesh.position.set(0, 4.52, ROOM_BACK + 0.40);
  group.add(markMesh);

  // ── the stock on the walls ─────────────────────────────────────────────
  //
  // Twelve at a time: eight across the back wall where you are looking, two
  // on each return. The rail along the bottom of the screen carries the rest
  // and swaps these as it scrolls, so the room is always showing the part of
  // the listing being read.
  const PANEL = ROOM_PORTRAIT ? { w: 1.86, h: 1.76 } : { w: 1.9, h: 1.8 };
  // The shelf takes a third of a landscape window, so the wall no longer
  // has the width for four across unless the window is genuinely wide.
  const COLS = ROOM_PORTRAIT ? [-2.05, 2.05]
             : innerWidth >= 1240 ? [-3.5, 0, 3.5]
             : [-2.4, 2.4];
  // Both rows dropped 0.13, which buys the sign above them a clean band
  // between the top frames and the ceiling.
  const ROWS = [3.15, 1.25];
  const SLOTS = [];
  // Standing proud of the wall by 0.4, not flush with it.
  //
  // Every wall treatment here has depth — the vault's fluting reaches 0.28
  // off the plaster, the atelier's battens 0.26 — and a picture hung flush
  // is a picture behind them. Casablanca opened with its entire stock filed
  // away between timber slats. Hung forward they read as hung, and it fixes
  // all five rooms without special-casing any of them.
  const OFF = 0.40;
  for (const y of ROWS) {
    for (const x of COLS) SLOTS.push({ x, y, z: ROOM_BACK + OFF, ry: 0 });
  }
  for (const sx of [-1, 1]) {
    for (const z of [-7.0, -10.6]) {
      SLOTS.push({ x: sx * (ROOM.w / 2 - 0.42), y: 2.5, z, ry: sx > 0 ? -Math.PI / 2 : Math.PI / 2 });
    }
  }

  // How wide the back wall's grid actually is, so the camera can be placed
  // to hold all of it rather than at a distance that happened to look right
  // on one screen.
  const GRID_HALF = Math.abs(COLS[0]) + PANEL.w / 2;

  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin("anonymous");

  /**
   * Pictures, kept.
   *
   * The wall showed five grey rectangles at a time while the listing was
   * being scrolled, and that was the flicker: every page turn disposed all
   * twelve textures and re-fetched them, including the ones it was about to
   * put straight back. Scrolling a fifty-two piece house turned the whole
   * shop on and off.
   *
   * Textures are held by product id and reused, and the panel keeps the
   * picture it is showing until the next one has decoded — so a page turn
   * is a swap, never a gap. The cap is there because fifteen houses at two
   * hundred and thirty-six pieces is more than a phone should hold.
   */
  const texCache = new Map();
  const CACHE_MAX = QUALITY.light ? 48 : 96;

  function texFor(it, cb) {
    const hit = texCache.get(it.id);
    if (hit) { cb(hit); return; }
    loader.load(it.image, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      cover(tex, tex.image.width, tex.image.height);
      if (texCache.size >= CACHE_MAX) {
        const oldest = texCache.keys().next().value;
        texCache.get(oldest).dispose();
        texCache.delete(oldest);
      }
      texCache.set(it.id, tex);
      cb(tex);
    }, undefined, () => cb(null));
  }

  const panels = SLOTS.map((slot) => {
    const g = new THREE.Group();
    g.position.set(slot.x, slot.y, slot.z);
    g.rotation.y = slot.ry;

    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(PANEL.w + 0.22, PANEL.h + 0.22, 0.1), matTrim);
    frame.position.z = -0.05;
    frame.castShadow = true;
    g.add(frame);

    // Lit mostly by itself.
    //
    // A photograph of a garment hanging in a room lit by a warm gold lamp
    // comes out warm and gold, and every shop looked like it had a filter
    // over it. Feeding the same picture into the emissive channel makes the
    // panel a lightbox: the colours are the garment's own, with just enough
    // of the room's light left on it to keep it in the room.
    const mat = new THREE.MeshStandardMaterial({
      color: 0x5e5e5e, roughness: 0.9, metalness: 0,
      emissive: 0xffffff, emissiveIntensity: 0.82,
    });
    const art = new THREE.Mesh(new THREE.PlaneGeometry(PANEL.w, PANEL.h), mat);
    art.position.z = 0.012;
    g.add(art);

    group.add(g);
    return { group: g, art, mat, tex: null, product: null, slot };
  });

  /** Fits a loaded image into a panel the way `object-fit: cover` would. */
  function cover(tex, iw, ih) {
    const ia = iw / ih, pa = PANEL.w / PANEL.h;
    if (ia > pa) { tex.repeat.set(pa / ia, 1); tex.offset.set((1 - pa / ia) / 2, 0); }
    else { tex.repeat.set(1, ia / pa); tex.offset.set(0, (1 - ia / pa) / 2); }
  }

  return {
    group, panels, fixtures, PANEL, GRID_HALF,
    mark: markMesh,
    markTop: () => markMesh.position.y + markMesh.geometry.parameters.height / 2,
    arts: panels.map((pn) => pn.art),

    /** Puts the room behind a monolith and paints it in that house's colours. */
    dress(m) {
      const b = m.brand;
      const conf = INTERIOR[b.slug] || INTERIOR["off-white"];

      group.position.copy(m.group.position);
      group.rotation.copy(m.group.rotation);
      group.updateMatrixWorld(true);

      matWall.color.set(conf.wall);
      matWall2.color.set(conf.wall2);
      matFloor.color.set(conf.floor);
      matCeil.color.set(conf.wall).lerp(new THREE.Color(0xffffff), 0.55);
      matTrim.color.set(conf.trim);
      matGlow.color.set(conf.lamp).lerp(new THREE.Color(0xffffff), 0.5);
      matGlow.emissive.copy(matGlow.color);

      for (const k in fixtures) fixtures[k].visible = (k === conf.kind);

      paintMark(b);
      return conf;
    },

    /** Hangs one page of the listing on the walls. */
    hang(items) {
      panels.forEach((pn, i) => {
        const it = items[i];
        pn.product = it || null;
        pn.group.visible = !!it;
        if (!it) return;
        texFor(it, (tex) => {
          if (pn.product !== it) return;   // the page moved on mid-flight
          if (!tex) {
            pn.mat.map = pn.mat.emissiveMap = null;
            pn.mat.color.set(0x8f8f8f);
            pn.mat.emissiveIntensity = 0;
          } else {
            pn.mat.map = tex;
            pn.mat.emissiveMap = tex;
            pn.mat.color.set(0x5e5e5e);
            pn.mat.emissiveIntensity = 0.82;
          }
          pn.mat.needsUpdate = true;
        });
      });
    },

    /** Resolves once a page's pictures are in hand, or gives up trying. */
    preload(items) {
      return Promise.all(items.filter(Boolean).map(
        (it) => new Promise((res) => texFor(it, () => res()))));
    },
  };
})();
scene.add(storeRoom.group);


// ── the mode ────────────────────────────────────────────────────────────
//
// Entering is a cut, not a walk. The shopfront is glazing, piers and a
// canopy; flying a camera through it looks like a camera going through a
// wall, and holding the visitor on a three-second approach to a shop they
// have already chosen is worse. A brand-coloured wipe covers 300ms, the
// room is dressed and the camera put in it behind that, and it reads as
// stepping in. It also gives three.js somewhere to hide the shader
// recompile the room's lights would otherwise stutter on.

storeMode = (() => {
  const shopEl   = document.getElementById("shop");
  const wipeEl   = document.getElementById("wipe");
  const markEl   = document.getElementById("shop-mark");
  const nameEl   = document.getElementById("shop-name");
  const gridEl   = document.getElementById("shop-grid");
  const shelfEl  = document.getElementById("shop-shelf");

  const money = new Intl.NumberFormat("en-US", {
    style: "currency", currency: "USD", minimumFractionDigits: 2,
  });

  const PAGE = storeRoom.panels.length;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const catsEl = document.getElementById("shop-cats");
  const topEl = document.querySelector("#shop .top");

  // Canonical running order, so every shop's filters read the same way
  // round whatever it happens to stock. A house only shows the ones it has.
  const CAT_ORDER = ["shirts", "hoodies", "outerwear", "bottoms", "denim",
                     "accessories", "other"];

  let active = false, busy = false;
  // `stock` is everything the house has; `items` is what the chips are
  // currently showing, and is what the rail, the wall and the picker all
  // read. Filtering is a view, never a refetch.
  let stock = [], items = [], cat = "all";
  let page = -1, picked = -1, house = -1;
  let savedScroll = 0;
  let cards = [];

  // ── the catalogue ─────────────────────────────────────────────────────
  //
  // One request for the whole street, kept for the session. Fifteen shops
  // browsed in one visit is fifteen round trips otherwise, and the payload
  // is small precisely so it can be fetched whole.
  let catalogue = null, catalogueP = null;
  function loadCatalogue() {
    if (catalogueP) return catalogueP;
    catalogueP = fetch("/api/storefront", { headers: { accept: "application/json" } })
      .then((r) => (r.ok ? r.json() : { brands: {} }))
      .then((j) => (catalogue = j.brands || {}))
      .catch(() => (catalogue = {}));
    return catalogueP;
  }
  // Warm it once the street is up, so the first door opens on a hit.
  setTimeout(loadCatalogue, 2500);

  // ── camera ────────────────────────────────────────────────────────────
  const WHITE = new THREE.Color(0xffffff);
  const curPos = new THREE.Vector3(), curLook = new THREE.Vector3();
  const tgtPos = new THREE.Vector3(), tgtLook = new THREE.Vector3();
  const v3 = new THREE.Vector3(), q4 = new THREE.Quaternion();

  /**
   * The part of the screen the room actually gets.
   *
   * The chrome is not a strip along one edge any more: the header runs
   * across the top and the shelf takes the right-hand third, or the bottom
   * half on a phone. Everything about framing — how far back to stand, how
   * far to shift, where to aim — comes out of this rectangle, measured off
   * the real elements rather than assumed, so it keeps working when the
   * category chips add a row or the viewport turns.
   */
  function safeRect() {
    const t = (topEl ? topEl.getBoundingClientRect().bottom : 120) / innerHeight;
    const r = shelfEl.getBoundingClientRect();
    const side = innerWidth > 720;
    return {
      left: 0,
      right: side ? clamp(r.left / innerWidth, 0.35, 1) : 1,
      top: clamp(t, 0, 0.4),
      bottom: side ? 1 : clamp(r.top / innerHeight, 0.35, 1),
    };
  }

  /** Where you stand when you walk in: the whole wall, framed in what is left. */
  function standBack() {
    const sr = safeRect();
    const availW = Math.max(0.3, sr.right - sr.left);
    const cx = (sr.left + sr.right) / 2;
    const cy = (sr.top + sr.bottom) / 2;

    const vHalf = camera.fov * Math.PI / 360;
    const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
    const want = (storeRoom.GRID_HALF + 0.45) / (Math.tan(hHalf) * availW);
    const dist = clamp(want, 5.2, ROOM.d - 1.5);

    const visibleW = 2 * dist * Math.tan(hHalf);
    const visibleH = 2 * dist * Math.tan(vHalf);
    // Slide sideways rather than swing: moving the camera and what it is
    // looking at by the same amount keeps the wall square on, and puts its
    // middle in the middle of the gap the shelf leaves.
    const slide = visibleW * (0.5 - cx);
    const camY = 2.0;
    const lookY = 2.2 - visibleH * (0.5 - cy);

    v3.set(slide, camY, ROOM_BACK + dist).applyMatrix4(storeRoom.group.matrixWorld);
    tgtPos.copy(v3);
    v3.set(slide, lookY, ROOM_BACK).applyMatrix4(storeRoom.group.matrixWorld);
    tgtLook.copy(v3);

    // The house's sign only earns its place if it clears the header. On a
    // short window the wall is not tall enough for two rows of stock and a
    // metre of signage, and the stock wins — the bar at the top is already
    // carrying the name in type.
    const rel = Math.atan((storeRoom.markTop() - camY) / dist)
              - Math.atan((lookY - camY) / dist);
    const markF = 0.5 - 0.5 * Math.tan(rel) / Math.tan(vHalf);
    storeRoom.mark.visible = markF > sr.top + 0.008;
  }

  /** Step up to one piece, square on and close enough to read the label. */
  function standAt(pn) {
    pn.art.getWorldPosition(tgtLook);
    pn.group.getWorldQuaternion(q4);

    // How close is a question about the lens again, not a number. Three
    // metres off a two-metre panel is a comfortable look on a laptop and a
    // garment filling the entire screen on a phone, where the horizontal
    // field is half as wide.
    const hHalf = Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
    // Against the gap the shelf leaves, not the whole window: a piece framed
    // for a full-width screen fills the third of it that is still the room.
    const sr0 = safeRect();
    const availW0 = Math.max(0.3, sr0.right - sr0.left);
    const availH0 = Math.max(0.3, sr0.bottom - sr0.top);
    const fit = Math.min(Math.tan(hHalf) * availW0,
                         Math.tan(camera.fov * Math.PI / 360) * availH0 * 1.25);
    const back = clamp((storeRoom.PANEL.w / 2 + 0.5) / fit, 2.9, 8.5);

    v3.set(0, 0, 1).applyQuaternion(q4);
    tgtPos.copy(tgtLook).addScaledVector(v3, back);

    // Then slid so the piece lands in the middle of the gap the shelf
    // leaves, by the same arithmetic the wide shot uses.
    const sr = safeRect();
    const vHalf = camera.fov * Math.PI / 360;
    const hHalf2 = Math.atan(Math.tan(vHalf) * camera.aspect);
    const slide = 2 * back * Math.tan(hHalf2) * (0.5 - (sr.left + sr.right) / 2);
    const lift = 2 * back * Math.tan(vHalf) * (0.5 - (sr.top + sr.bottom) / 2);

    v3.set(1, 0, 0).applyQuaternion(q4);
    tgtPos.addScaledVector(v3, slide);
    tgtLook.addScaledVector(v3, slide);
    tgtPos.y = Math.max(1.4, tgtLook.y - 0.25);
    tgtLook.y -= lift;
  }

  // ── light ─────────────────────────────────────────────────────────────
  //
  // Borrowed, not added. Three point lights appearing in the scene changes
  // the light count every material is compiled against, and every material
  // in the street would be rebuilt on the way in and again on the way out.
  // The street lamps are already counted, already there, and cannot be seen
  // from inside a shop — so they come indoors and go back afterwards.
  const borrowed = [];
  // Candela, and a small room. The first pass at this used 36, 22, 22 —
  // numbers carried over from street lamps twenty metres up — and every
  // interior opened blown to white with the stock invisible in it. Four
  // metres from a wall, single figures is a shop.
  const LAMPS = [
    [0, ROOM.h - 0.8, ROOM.front - 4.6, 7.5],
    [-4.7, 3.2, ROOM_BACK + 2.4, 4.5],
    [4.7, 3.2, ROOM_BACK + 2.4, 4.5],
  ];

  function lightsOn(conf) {
    for (let i = 0; i < LAMPS.length && i < streetLamps.length; i++) {
      const l = streetLamps[i];
      borrowed.push({
        l, power: LAMPS[i][3],
        pos: l.position.clone(), col: l.color.clone(),
        intensity: l.intensity, distance: l.distance, decay: l.decay,
      });
      v3.set(LAMPS[i][0], LAMPS[i][1], LAMPS[i][2]).applyMatrix4(storeRoom.group.matrixWorld);
      l.position.copy(v3);
      // Halfway to white. A saturated bulb plus saturated walls is a room
      // seen through a gel, which is what the tint was.
      l.color.set(conf.lamp).lerp(WHITE, 0.45);
      l.distance = 22;
      l.decay = 1.7;
      l.intensity = LAMPS[i][3];
    }
  }

  function lightsOff() {
    for (const b of borrowed) {
      b.l.position.copy(b.pos);
      b.l.color.copy(b.col);
      b.l.intensity = b.intensity;
      b.l.distance = b.distance;
      b.l.decay = b.decay;
    }
    borrowed.length = 0;
  }

  // ── the listing ───────────────────────────────────────────────────────
  function setPage(n) {
    const last = Math.max(0, Math.ceil(items.length / PAGE) - 1);
    n = clamp(n, 0, last);
    if (n === page) return;
    page = n;
    storeRoom.hang(items.slice(n * PAGE, n * PAGE + PAGE));
  }

  function buildCats() {
    const counts = new Map();
    for (const it of stock) counts.set(it.cat, (counts.get(it.cat) || 0) + 1);
    const present = CAT_ORDER.filter((c) => counts.has(c));

    catsEl.textContent = "";
    // One category is not a filter, it is a label — and a row of chips that
    // cannot change anything is just something else covering the room.
    catsEl.style.display = present.length > 1 ? "flex" : "none";
    if (present.length < 2) return;

    const chip = (key, label, n) => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "cat";
      el.dataset.key = key;
      el.dataset.live = key === cat ? "1" : "0";
      el.setAttribute("aria-pressed", key === cat ? "true" : "false");
      el.textContent = label;
      const num = document.createElement("i");
      num.textContent = String(n);
      el.appendChild(num);
      el.addEventListener("click", () => setCat(key));
      catsEl.appendChild(el);
    };

    chip("all", "All", stock.length);
    for (const c of present) {
      chip(c, stock.find((it) => it.cat === c).catName, counts.get(c));
    }
  }

  /** Keeps the shelf clear of the shop bar, whose height varies with type. */
  function measureChrome() {
    requestAnimationFrame(() => {
      const h = topEl ? topEl.getBoundingClientRect().height : 62;
      shopEl.style.setProperty("--topbar", `${Math.round(h)}px`);
      if (picked < 0) standBack();
    });
  }
  addEventListener("resize", () => { if (active) measureChrome(); });

  function setCat(key) {
    if (key === cat) return;
    cat = key;
    for (const el of catsEl.children) {
      const on = el.dataset.key === key;
      el.dataset.live = on ? "1" : "0";
      el.setAttribute("aria-pressed", on ? "true" : "false");
    }
    sound.click();
    applyFilter();
  }

  /** Re-cuts the listing, re-hangs the wall and lets go of the selection. */
  function applyFilter() {
    items = cat === "all" ? stock.slice() : stock.filter((it) => it.cat === cat);
    page = -1;
    setPage(0);
    buildGrid();
    picked = -1;
    standBack();
    gridEl.scrollTop = 0;
  }

  /**
   * The catalogue.
   *
   * Two columns of cards scrolled vertically, hairline-ruled, which is how
   * the storefront lists a house — a horizontal filmstrip made you drag
   * sideways through fifty-two pieces to find one. Tapping a card opens its
   * sizes and its way through to the product page inside the card itself,
   * so there is no second floating panel over the room.
   */
  function buildGrid() {
    gridEl.textContent = "";
    cards = items.map((it, i) => {
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.gone = it.stock > 0 ? "0" : "1";
      card.dataset.live = "0";

      const hit = document.createElement("button");
      hit.type = "button";
      hit.className = "hit";
      hit.setAttribute("aria-label", `${it.name}, ${money.format(it.price)}`);

      const pic = document.createElement("span");
      pic.className = "pic";
      const img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = "";
      img.src = it.image;
      pic.appendChild(img);

      const nm = document.createElement("b");
      nm.textContent = it.name;
      const pr = document.createElement("i");
      pr.textContent = money.format(it.price);
      hit.append(pic, nm, pr);
      hit.addEventListener("click", () => choose(i, false));

      const more = document.createElement("div");
      more.className = "more";
      const sizes = document.createElement("div");
      sizes.className = "sizes";
      for (const sz of it.sizes || []) {
        const el = document.createElement("span");
        el.textContent = sz;
        sizes.appendChild(el);
      }
      const stockLine = document.createElement("p");
      stockLine.className = "stock";
      stockLine.textContent = it.stock > 0 ? `${it.stock} in stock` : "Sold out";
      const link = document.createElement("a");
      link.className = "pill";
      link.href = `${SITE}/products/${it.id}`;
      link.textContent = "View on the store";
      more.append(sizes, stockLine, link);

      card.append(hit, more);
      gridEl.appendChild(card);
      return card;
    });
    gridEl.scrollTop = 0;
  }

  /** Selects one piece: the card opens, the camera steps up to it. */
  function choose(i, scrollTo) {
    if (i < 0 || i >= items.length) return;
    const again = picked === i;
    picked = again ? -1 : i;

    cards.forEach((c, k) => { c.dataset.live = k === picked ? "1" : "0"; });
    if (picked < 0) { standBack(); return; }

    if (scrollTo && cards[picked]) {
      cards[picked].scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    setPage(Math.floor(picked / PAGE));
    const pn = storeRoom.panels[picked - page * PAGE];
    if (pn && pn.product) standAt(pn);
  }

  function clearPick() {
    picked = -1;
    cards.forEach((c) => { c.dataset.live = "0"; });
    standBack();
  }

  // Scrolling the listing walks the walls along with it, so the room is
  // always showing the run of stock being read rather than a fixed dozen.
  let gridTick = 0;
  gridEl.addEventListener("scroll", () => {
    if (!active || gridTick) return;
    gridTick = requestAnimationFrame(() => {
      gridTick = 0;
      if (!cards.length) return;
      // Which card is in the middle of the shelf's viewport. Two columns,
      // so the row under the midpoint is the pair at that index.
      const mid = gridEl.scrollTop + gridEl.clientHeight / 2;
      let idx = 0, best = Infinity;
      for (let k = 0; k < cards.length; k++) {
        const c = cards[k];
        const d = Math.abs(c.offsetTop + c.offsetHeight / 2 - mid);
        if (d < best) { best = d; idx = k; }
      }
      // A deadband of one item either side of the page already hanging,
      // so a thumb resting on a boundary does not turn the wall over and
      // back with every pixel of scroll.
      if (idx >= page * PAGE - 1 && idx <= page * PAGE + PAGE) return;
      setPage(Math.floor(idx / PAGE));
    });
  }, { passive: true });

  // ── doors ─────────────────────────────────────────────────────────────
  function lockScroll(on) {
    document.documentElement.style.overflow = on ? "hidden" : "";
    document.body.style.overflow = on ? "hidden" : "";
  }

  async function enter(i) {
    if (busy || active || i < 0 || i >= monoliths.length) return;
    busy = true;
    const m = monoliths[i];
    const b = m.brand;

    sound.click();
    await loadCatalogue();

    wipeEl.style.background = b.bg[0];
    wipeEl.dataset.on = "1";
    await wait(330);

    house = i;
    const conf = storeRoom.dress(m);
    stock = (catalogue && catalogue[b.slug]) ? catalogue[b.slug].slice() : [];
    cat = "all";
    items = stock.slice();
    page = -1;
    setPage(0);
    if (items.length === 0) storeRoom.hang([]);
    buildCats();
    buildGrid();
    measureChrome();

    const art = logoFor(b.slug);
    markEl.textContent = "";
    markEl.style.background = `linear-gradient(135deg, ${b.bg[0]}, ${b.bg[1]})`;
    if (art) {
      const im = document.createElement("img");
      im.src = art; im.alt = "";
      markEl.appendChild(im);
    } else {
      const sp = document.createElement("span");
      sp.style.color = b.ink;
      sp.textContent = b.name.slice(0, 2).toUpperCase();
      markEl.appendChild(sp);
    }
    nameEl.textContent = b.name;
    storeRoom.group.visible = true;
    lightsOn(conf);
    standBack();
    curPos.copy(tgtPos);
    curLook.copy(tgtLook);

    savedScroll = window.scrollY;
    lockScroll(true);
    picked = -1;
    shopEl.dataset.on = "1";
    shopEl.setAttribute("aria-hidden", "false");
    active = true;

    // Hold the wipe until the first wall of stock has actually decoded.
    // Lifting on a timer meant every shop opened on twelve grey rectangles
    // that filled in one by one, which reads as the page struggling. The
    // race is there because a slow picture must not trap anyone behind a
    // coloured screen.
    await Promise.race([
      storeRoom.preload(items.slice(0, PAGE)),
      wait(1100),
    ]);
    await wait(120);
    wipeEl.dataset.on = "0";
    busy = false;
  }

  async function leave() {
    if (busy || !active) return;
    busy = true;
    wipeEl.dataset.on = "1";
    await wait(330);

    active = false;
    shopEl.dataset.on = "0";
    shopEl.setAttribute("aria-hidden", "true");
    storeRoom.group.visible = false;
    lightsOff();
    house = -1;

    lockScroll(false);
    scrollTo(0, savedScroll);
    readScroll();
    scrollEased = scrollTarget;

    await wait(120);
    wipeEl.dataset.on = "0";
    busy = false;
  }

  document.getElementById("shop-out").addEventListener("click", leave);
  addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (picked >= 0) clearPick(); else leave();
  });

  return {
    get active() { return active; },
    get busy() { return busy; },
    enter,
    leave,
    enterBySlug(slug) {
      enter(monoliths.findIndex((m) => m.brand.slug === slug));
    },
    arts: () => storeRoom.arts,
    pickPanel(mesh) {
      const k = storeRoom.panels.findIndex((pn) => pn.art === mesh);
      if (k < 0 || !storeRoom.panels[k].product) return;
      sound.click();
      choose(page * PAGE + k, true);
    },
    /** Writes this frame's camera. Also holds the borrowed lamps in place,
     *  because the clock reassigns every street lamp every few minutes. */
    aim(dt, outPos, outLook) {
      const k = Math.min(1, dt * 3.6);
      curPos.lerp(tgtPos, k);
      curLook.lerp(tgtLook, k);
      outPos.copy(curPos);
      outLook.copy(curLook);
      for (const b of borrowed) b.l.intensity = b.power;
    },
  };
})();

// One door, one handle.
//
// The waypoints used to walk you in as well, and it was wrong: a marker
// floating over a shopfront reads as "take me there", not "take me inside",
// and being dropped into a room because you tapped a pin to look at it is a
// hijacking. Waypoints travel. The running order travels. Going in is the
// pill that says, in words, which shop you are about to be standing in.
card.link.addEventListener("click", (e) => {
  const i = Number(card.link.dataset.house);
  if (!Number.isFinite(i) || i < 0) return;
  e.preventDefault();
  storeMode.enter(i);
});

indexItems.forEach((el, i) => {
  el.style.cursor = "pointer";
  el.style.pointerEvents = "auto";
  el.addEventListener("click", () => {
    sound.click();
    travelTo(TRAVEL(monoliths[i].z + LEAD));
  });
});

// Surface a dead scene rather than a black rectangle.
canvasEl.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();
  running = false;
  document.getElementById("fallback").dataset.on = "1";
});
</script>
</body>
</html>
