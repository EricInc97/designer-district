scene.environmentIntensity = 0.85;

// ## 11  LIGHTING
// One hard sun for the dappled palm shadows, one hemisphere fill so the
// shadowed faces pick up sky above and warm stone below.

const sun = new THREE.DirectionalLight(0xfff2da, 2.6);
sun.position.copy(C.sun).multiplyScalar(90);
sun.castShadow = true;
sun.shadow.mapSize.set(QUALITY.shadowMap, QUALITY.shadowMap);
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0009;
sun.shadow.normalBias = 0.035;
// The shadow camera follows the journey in the frame loop; this is its size.
const SHADOW_HALF = 46;
Object.assign(sun.shadow.camera, { left: -SHADOW_HALF, right: SHADOW_HALF, top: SHADOW_HALF, bottom: -SHADOW_HALF });
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0xbdddf5, 0xc6b79a, 0.95);
scene.add(hemi);

// A cool bounce from the pool, so the dome's underside is not dead.
const bounce = new THREE.DirectionalLight(0x8fd8e8, 0.45);
bounce.position.set(4, -6, 10);
scene.add(bounce);

// ## 12  PLAZA — travertine ground and pool coping

const travertine = asTexture(texTravertine(), { repeat: [44, 44] });

// Sized off the reference: a shallow basin held close to the dome, with a
// broad flat kerb, not the lake it was. The dome overhangs its own plinth
// and the water reaches only a few metres past that.
const POOL = { w: 27, d: 22, lip: 2.4, y: C.poolY };

// The plaza is a slab with the pool cut out of it. It started as a plain
// plane, which paved straight over the water: the basin is 0.28 below the
// paving, so a solid plane simply hid it. ShapeGeometry with a hole is the
// fix, and it hands back UVs in world units, which is why the repeat here is
// a fraction rather than a count.
{
  const half = 260;
  const shape = new THREE.Shape()
    .moveTo(-half, -half).lineTo(half, -half).lineTo(half, half).lineTo(-half, half).lineTo(-half, -half);
  const hole = new THREE.Path()
    .moveTo(-POOL.w / 2, -POOL.d / 2).lineTo(-POOL.w / 2, POOL.d / 2)
    .lineTo(POOL.w / 2, POOL.d / 2).lineTo(POOL.w / 2, -POOL.d / 2).lineTo(-POOL.w / 2, -POOL.d / 2);
  shape.holes.push(hole);

  const paveTex = travertine.clone();
  paveTex.needsUpdate = true;
  paveTex.repeat.set(1 / 6, 1 / 6);      // one texture tile every 6 metres

  const plaza = new THREE.Mesh(
    new THREE.ShapeGeometry(shape),
    new THREE.MeshStandardMaterial({ map: paveTex, roughness: 0.93, metalness: 0 })
  );
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.y = C.plazaY;
  plaza.receiveShadow = true;
  scene.add(plaza);
}

// The pool's raised stone lip, built from four coping slabs rather than a ring
// so the corners read square, the way they do on the real plaza.
{
  const stone = new THREE.MeshStandardMaterial({ map: travertine.clone(), roughness: 0.85 });
  stone.map.repeat.set(6, 2);
  const lipH = Math.abs(C.plazaY - POOL.y) + 0.34;
  const coping = [];
  const hw = POOL.w / 2 + POOL.lip / 2, hd = POOL.d / 2 + POOL.lip / 2;
  for (const [w, d, px, pz] of [
    [POOL.w + POOL.lip * 2, POOL.lip, 0, -hd],
    [POOL.w + POOL.lip * 2, POOL.lip, 0,  hd],
    [POOL.lip, POOL.d + POOL.lip * 2, -hw, 0],
    [POOL.lip, POOL.d + POOL.lip * 2,  hw, 0],
  ]) {
    const g = new THREE.BoxGeometry(w, lipH, d);
    g.translate(px, C.plazaY - lipH / 2 + 0.16, pz);
    coping.push(g);
  }
  const lip = new THREE.Mesh(mergeGeometries(coping), stone);
  lip.castShadow = true; lip.receiveShadow = true;
  scene.add(lip);

  // The walk out to it.
  //
  // In the reference the basin is not a pond you look at from the edge — a
  // marble causeway runs out into it with the water divided either side, and
  // that is most of why the dome reads as something you can go and stand
  // under rather than an object on a plinth. Deck flush with the paving,
  // parapets low enough to see over.
  {
    const marble = new THREE.MeshStandardMaterial({
      color: 0xe9e4d8, roughness: 0.42, metalness: 0.02, envMapIntensity: 0.8,
    });
    const reach = POOL.d / 2 + POOL.lip;
    const inner = C.domeRadius * Math.sin(C.domeCut * Math.PI) * 1.05;
    const len = reach - inner + 1.2;
    const midZ = inner + len / 2 - 0.6;
    const parts = [];

    // Both sides, now that the shell has a door at each end. The walk goes
    // in under the dome and straight out the back, and the route into the
    // street is through it rather than around it.
    for (const sz of [1, -1]) {
      // Narrow. At 6.4 wide with a 10.5 landing the walk covered most of the
      // water in front of the dome, which is the one place its reflection
      // has to land — the pool was there and had nowhere to show anything.
      const deck = new THREE.BoxGeometry(4.2, 0.62, len);
      deck.translate(0, C.plazaY - 0.31 + 0.02, sz * midZ);
      parts.push(deck);

      // A landing where it meets the step, so you arrive somewhere.
      const landing = new THREE.BoxGeometry(6.6, 0.5, 2.6);
      landing.translate(0, C.plazaY - 0.25, sz * (inner + 1.1));
      parts.push(landing);

      for (const sx of [-1, 1]) {
        const wall = new THREE.BoxGeometry(0.46, 0.56, len);
        wall.translate(sx * 2.1, C.plazaY + 0.28, sz * midZ);
        parts.push(wall);
        const cap = new THREE.BoxGeometry(0.66, 0.11, len);
        cap.translate(sx * 2.1, C.plazaY + 0.6, sz * midZ);
        parts.push(cap);
      }

      // The threshold. The plinth stands 62cm above the deck — a real step
      // up, and correct, since the reference has the dome sitting clear of
      // the plaza floor. Two treads turn it into an approach instead of a
      // kerb to trip over on the way in.
      const rise = (C.plinthTop - 0.02) / 3;
      for (let k = 0; k < 2; k++) {
        const top = C.plazaY + 0.02 + (k + 1) * rise;
        const h = top + 0.9;
        const tread = new THREE.BoxGeometry(4.2 - k * 0.35, h, 0.62);
        tread.translate(0, top - h / 2, sz * (4.92 - k * 0.6));
        parts.push(tread);
      }
    }

    const walk = new THREE.Mesh(mergeGeometries(parts), marble);
    walk.castShadow = true; walk.receiveShadow = true;
    scene.add(walk);
  }

  // The broad step the basin sits on, raised a hand above the paving.
  {
    // A border, not a slab.
    //
    // This was one box spanning the whole basin plus a margin, sitting at
    // y 0.13 — which is above the waterline at -0.28. It was a lid. The pool
    // has been under it ever since, which is why the dome kept looking like
    // it stood on dry paving however much work went into the water.
    const inW = POOL.w + POOL.lip * 2, inD = POOL.d + POOL.lip * 2;
    const band = 3.5;
    const mat = new THREE.MeshStandardMaterial({ map: travertine.clone(), roughness: 0.86 });
    mat.map.repeat.set(8, 6);
    const slabs = [];
    for (const [w, d, cx, cz] of [
      [inW + band * 2, band, 0, -(inD / 2 + band / 2)],
      [inW + band * 2, band, 0,   inD / 2 + band / 2],
      [band, inD, -(inW / 2 + band / 2), 0],
      [band, inD,   inW / 2 + band / 2,  0],
    ]) {
      const g = new THREE.BoxGeometry(w, 0.26, d);
      g.translate(cx, C.plazaY + 0.13, cz);
      slabs.push(g);
    }
    const step = new THREE.Mesh(mergeGeometries(slabs), mat);
    step.receiveShadow = true;
    scene.add(step);
  }

  // Basin floor, so the water has something to be deep over.
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(POOL.w, POOL.d),
    new THREE.MeshStandardMaterial({ color: 0x9fd3d8, roughness: 0.6 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = POOL.y - 0.85;
  floor.receiveShadow = true;
  scene.add(floor);
}

// ## 13  WATER — reflecting pool
// Not a mirror pass: the surface reflects the sky *function*, evaluated on the
// reflected view vector. That costs one extra sky evaluation per pixel and
// stays exactly in step with the real sky, including its clouds and its sun.

const waterUniforms = {
  uTime:     { value: 0 },
  uSun:      { value: C.sun.clone() },
  uZenith:   { value: C.zenith.clone() },
  uHorizon:  { value: C.horizon.clone() },
  uUnder:    { value: C.underside.clone() },
  uDeep:     { value: C.poolDeep.clone() },
  uShallow:  { value: C.poolShallow.clone() },
  uCam:      { value: new THREE.Vector3() },
  uFogColor: { value: C.fog.clone() },
  uFogDensity: { value: C.fogDensity },
  uMirror:   { value: null },
  uMirrorMat:{ value: new THREE.Matrix4() },
};

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(POOL.w, POOL.d, 1, 1),
  new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    transparent: false,
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      varying vec4 vMirror;
      uniform mat4 uMirrorMat;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        vMirror = uMirrorMat * wp;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec3 vWorld;
      varying vec4 vMirror;
      uniform float uTime, uFogDensity;
      uniform vec3 uSun, uZenith, uHorizon, uUnder, uDeep, uShallow, uCam, uFogColor;
      uniform sampler2D uMirror;
      ${SKY_GLSL}

      // Two crossing wave trains plus a fine chop, sampled as a height field.
      float waves(vec2 p){
        float h = 0.0;
        h += sin(p.x * 0.85 + uTime * 0.85) * 0.055;
        h += sin(p.y * 0.62 - uTime * 0.67) * 0.045;
        h += sin((p.x + p.y) * 1.45 + uTime * 1.5) * 0.022;
        h += fbm(vec3(p * 1.25, uTime * 0.16)) * 0.075;
        return h;
      }
      vec3 waterNormal(vec2 p){
        float e = 0.16;
        float h  = waves(p);
        float hx = waves(p + vec2(e, 0.0));
        float hz = waves(p + vec2(0.0, e));
        return normalize(vec3(-(hx - h) / e, 1.0, -(hz - h) / e));
      }

      void main(){
        vec3 n = waterNormal(vWorld.xz);
        vec3 V = normalize(uCam - vWorld);

        float fres = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.4);
        fres = clamp(fres * 0.92 + 0.06, 0.0, 1.0);

        vec3 R = reflect(-V, n);
        R.y = abs(R.y);                       // never sample below the horizon
        vec3 refl = skyColor(R, uSun, uZenith, uHorizon, uUnder, uTime);

        // The dome itself, mirrored.
        //
        // Reflecting the sky function alone was the whole problem: the water
        // showed a convincing sky and nothing that was standing in it, so it
        // read as dark paving rather than as a pool. The basin is described
        // as being kept deliberately dark precisely so it works as a mirror,
        // and a mirror with nothing in it is just a dark floor.
        vec2 muv = vMirror.xy / max(vMirror.w, 0.0001);
        muv += n.xz * 0.055;                  // the ripple breaks it up
        vec4 mirror = texture2D(uMirror, muv);
        refl = mix(refl, mirror.rgb, clamp(mirror.a * 0.96, 0.0, 1.0));

        // Body colour deepens away from the lip. Kept dark on purpose.
        float edge = smoothstep(0.0, 6.0, min(
          min(${(POOL.w / 2).toFixed(2)} - abs(vWorld.x), ${(POOL.d / 2).toFixed(2)} - abs(vWorld.z)), 6.0));
        vec3 body = mix(uShallow, uDeep, edge) * 0.26;

        // Dark body, strong reflection. A flat 0.45 floor on the mix washed
        // the surface out to the same pale tone as the travertine around it,
        // so at a glance there was no pool there at all — just more paving.
        // Letting fresnel do the work gives a dark pool that lights up as
        // your eye travels across it, which is how one actually looks.
        vec3 col = mix(body, refl, clamp(fres * 0.82 + 0.16, 0.0, 1.0));

        // Sun glitter.
        vec3 H = normalize(uSun + V);
        col += vec3(1.0, 0.96, 0.88) * pow(max(dot(n, H), 0.0), 420.0) * 2.6;

        // Caustic shimmer read back off the wave field.
        float caus = pow(max(waves(vWorld.xz * 1.9) * 6.0 + 0.5, 0.0), 3.0);
        col += vec3(0.55, 0.92, 0.95) * caus * 0.05;

        // Match the scene's exponential-squared fog by hand.
        float dist = length(uCam - vWorld);
        float f = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
        col = mix(col, uFogColor, clamp(f, 0.0, 1.0));

        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  })
);
water.rotation.x = -Math.PI / 2;
water.position.y = POOL.y;
scene.add(water);

// ## 13B  MIRROR — the dome, upside down, in the pool
//
// A planar reflection, but only of the things worth reflecting.
//
// three's own Reflector renders the entire scene a second time, which is the
// cost that was just taken out of the transmission materials and is not
// worth paying again. Almost nothing here needs to appear in the water: the
// dome, its plinth and the fountain. Those go on their own layer, and the
// mirror camera is set to that layer alone — six or seven draw calls into a
// small target instead of a whole second scene.
//
// The camera maths is the standard planar reflection: mirror the eye through
// the water plane, mirror the point it is looking at, flip the up vector, and
// build a texture matrix so the water can look itself up in screen space.

const MIRROR_LAYER = 1;

const mirror = (() => {
  const size = QUALITY.light ? 256 : 512;
  const target = new THREE.WebGLRenderTarget(size, size, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat,
    generateMipmaps: false,
  });
  const cam = new THREE.PerspectiveCamera();
  cam.layers.set(MIRROR_LAYER);

  const normal = new THREE.Vector3(0, 1, 0);
  const origin = new THREE.Vector3(0, POOL.y, 0);
  const view = new THREE.Vector3();
  const look = new THREE.Vector3();
  const rot = new THREE.Matrix4();
  const up = new THREE.Vector3();

  const texMat = new THREE.Matrix4();

  waterUniforms.uMirror.value = target.texture;

  return {
    render(renderer, scene, camera) {
      view.copy(camera.position).sub(origin);
      view.reflect(normal).negate().add(origin);

      rot.extractRotation(camera.matrixWorld);
      look.set(0, 0, -1).applyMatrix4(rot).add(camera.position).sub(origin);
      look.reflect(normal).negate().add(origin);

      up.set(0, 1, 0).applyMatrix4(rot).reflect(normal).negate();

      cam.position.copy(view);
      cam.up.copy(up);
      cam.lookAt(look);
      cam.near = camera.near;
      cam.far = camera.far;
      cam.fov = camera.fov;
      cam.aspect = camera.aspect;
      cam.updateProjectionMatrix();
      cam.updateMatrixWorld();

      texMat.set(0.5, 0, 0, 0.5,
                 0, 0.5, 0, 0.5,
                 0, 0, 0.5, 0.5,
                 0, 0, 0, 1);
      texMat.multiply(cam.projectionMatrix);
      texMat.multiply(cam.matrixWorldInverse);
      waterUniforms.uMirrorMat.value.copy(texMat);

      const prevTarget = renderer.getRenderTarget();
      const prevAlpha = renderer.getClearAlpha();
      renderer.setRenderTarget(target);
      renderer.setClearColor(0x000000, 0);
      renderer.clear(true, true, false);
      renderer.render(scene, cam);
      renderer.setRenderTarget(prevTarget);
      renderer.setClearAlpha(prevAlpha);
    },
  };
})();

// ## 14  DOME — the Fly's Eye
// A squashed sphere with circular openings punched through it. The holes are
// distributed by the Fibonacci lattice, which is what gives the real dome its
// even-but-not-gridded look, and each one is cut out of the shell with an
// alpha map, ringed with a torus lip and filled with a pane of tinted glass.

const domeGroup = new THREE.Group();
scene.add(domeGroup);

// Reached by the clock, so the shell can glow after dark.
let domeShellMat = null, domeRimMat = null;

/** Fibonacci points on the unit sphere, in the same frame SphereGeometry uses. */
function holeDirections(count, cutTheta) {
  const golden = Math.PI * (3 - Math.sqrt(5));
  const out = [];
  for (let i = 0; i < count * 2; i++) {
    const y = 1 - (i / (count * 2 - 1)) * 2;
    const theta = Math.acos(clamp(y, -1, 1));
    // Keep a whole rim's worth of shell between the last opening and the cut,
    // or the bottom row breaks open into the plinth.
    if (theta > cutTheta - HOLE_ANGLE * 1.25) continue;
    const phi = i * golden;
    const r = Math.sin(theta);
    out.push(new THREE.Vector3(-Math.cos(phi) * r, Math.cos(theta), Math.sin(phi) * r));
  }
  return out;
}

const CUT = C.domeCut * Math.PI;
const HOLE_ANGLE = C.holeAngle;
const HOLES = holeDirections(C.domeHoles, CUT);

/* ── the walk-through ──────────────────────────────────────────────────
 *
 * An arch cut clean through the shell, fore and aft, on the same line the
 * causeway runs. It is the difference between a sculpture you circle and a
 * pavilion you walk into, and the camera now takes the second reading: down
 * the walk, in under the shell, and out the far side into the street.
 *
 * Defined in metres above the plinth rather than in angles, because that is
 * how a door is actually judged — a person walks through 4.2 wide and 4
 * high whatever polar angle the shell happens to be at there. Everything
 * else converts into this frame: the alpha map that cuts the shell, and the
 * test that drops any lens ring standing in the opening.
 */
const DOOR = { w: 2.1, shoulder: 2.3, top: 4.0, feather: 0.16 };
const DOOR_AZ = [Math.PI / 2, Math.PI * 1.5];      // +z and -z

/** Half-width of the opening at a given height: straight, then an arch. */
function doorHalf(h) {
  if (h <= DOOR.shoulder) return DOOR.w;
  const t = (h - DOOR.shoulder) / (DOOR.top - DOOR.shoulder);
  return t >= 1 ? 0 : DOOR.w * Math.sqrt(1 - t * t);
}

/** Height above the plinth of the shell at a polar angle, in world units. */
const shellHeight = (theta) =>
  C.domeCenterY + C.domeSquash * C.domeRadius * Math.cos(theta) - C.plinthTop;

/**
 * How far inside a doorway a point on the shell lies, in metres.
 * Negative is outside, which is what lets the cut be feathered.
 */
function doorDepth(theta, phi) {
  const h = shellHeight(theta);
  if (h > DOOR.top || h < -0.6) return -9;
  const half = doorHalf(h);
  if (half <= 0) return -9;
  const r = C.domeRadius * Math.sin(theta);
  let best = -9;
  for (const az of DOOR_AZ) {
    let d = Math.abs(phi - az);
    if (d > Math.PI) d = Math.PI * 2 - d;
    const v = half - d * r;
    if (v > best) best = v;
  }
  return best;
}

/** True when a lens opening overlaps a doorway and should not be ringed. */
const holeMeetsDoor = (() => {
  const u = new THREE.Vector3(), v = new THREE.Vector3(), q = new THREE.Vector3();
  return (dir) => {
    u.set(0, 1, 0);
    if (Math.abs(dir.y) > 0.9) u.set(1, 0, 0);
    u.cross(dir).normalize();
    v.crossVectors(dir, u).normalize();
    const ca = Math.cos(HOLE_ANGLE), sa = Math.sin(HOLE_ANGLE);
    for (let i = -1; i < 16; i++) {
      if (i < 0) q.copy(dir);
      else {
        const a = (i / 16) * Math.PI * 2;
        q.copy(dir).multiplyScalar(ca)
          .addScaledVector(u, Math.cos(a) * sa)
          .addScaledVector(v, Math.sin(a) * sa)
          .normalize();
      }
      let ph = Math.atan2(q.z, -q.x);
      if (ph < 0) ph += Math.PI * 2;
      if (doorDepth(Math.acos(clamp(q.y, -1, 1)), ph) > 0) return true;
    }
    return false;
  };
})();

/**
 * The shell's alpha map, in the equirectangular frame SphereGeometry unwraps
 * to. Rasterised per hole inside its own bounding box rather than per pixel
 * against every hole — the whole-image version is 40× the work for the same
 * picture.
 */
function texDomeAlpha() {
  const W = Math.round(1600 * QUALITY.texScale), H = Math.round(800 * QUALITY.texScale);
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const img = ctx.getImageData(0, 0, W, H), d = img.data;

  const cosHole = Math.cos(HOLE_ANGLE);
  const cosSoft = Math.cos(HOLE_ANGLE * 1.06);   // one-pixel feather

  for (const dir of HOLES) {
    const thetaC = Math.acos(clamp(dir.y, -1, 1));
    // Bounding box in the texture. Azimuth widens as you approach the pole.
    const dTheta = HOLE_ANGLE * 1.15;
    const sinT = Math.max(Math.sin(thetaC), 1e-3);
    const dPhi = Math.min(Math.PI, (HOLE_ANGLE * 1.15) / sinT);

    const y0 = Math.max(0, Math.floor(((thetaC - dTheta) / CUT) * H));
    const y1 = Math.min(H - 1, Math.ceil(((thetaC + dTheta) / CUT) * H));
    let phiC = Math.atan2(dir.z, -dir.x);
    if (phiC < 0) phiC += Math.PI * 2;

    for (let y = y0; y <= y1; y++) {
      const theta = (y / H) * CUT;
      const st = Math.sin(theta), ct = Math.cos(theta);
      const xSpan = Math.ceil((dPhi / (Math.PI * 2)) * W);
      const xC = Math.round((phiC / (Math.PI * 2)) * W);

      for (let k = -xSpan; k <= xSpan; k++) {
        const xw = ((xC + k) % W + W) % W;            // wrap in azimuth
        const phi = (xw / W) * Math.PI * 2;
        const dot = (-Math.cos(phi) * st) * dir.x + ct * dir.y + (Math.sin(phi) * st) * dir.z;
        if (dot <= cosSoft) continue;
        const a = dot >= cosHole ? 0 : 1 - (dot - cosSoft) / (cosHole - cosSoft);
        const i = (y * W + xw) * 4;
        const v = Math.round(a * 255);
        if (v < d[i]) { d[i] = d[i + 1] = d[i + 2] = v; }
      }
    }
  }
  // The two doorways, cut after the lenses so they win wherever they meet.
  // Only the rows that can contain one are visited — the arch tops out four
  // metres above the plinth, which is a little over a third of the way up
  // the map.
  {
    const cosTop = clamp(
      (C.plinthTop + DOOR.top - C.domeCenterY) / (C.domeSquash * C.domeRadius), -1, 1);
    const yTop = Math.max(0, Math.floor((Math.acos(cosTop) / CUT) * H) - 2);
    for (let y = yTop; y < H; y++) {
      const theta = (y / H) * CUT;
      for (let x = 0; x < W; x++) {
        const dd = doorDepth(theta, (x / W) * Math.PI * 2);
        if (dd <= -DOOR.feather) continue;
        const a = dd >= 0 ? 0 : Math.round((-dd / DOOR.feather) * 255);
        const i = (y * W + x) * 4;
        if (a < d[i]) { d[i] = d[i + 1] = d[i + 2] = a; }
      }
    }
  }

  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

{
  const shellGeo = new THREE.SphereGeometry(
    C.domeRadius, QUALITY.domeSeg[0], QUALITY.domeSeg[1], 0, Math.PI * 2, 0, CUT);
  const shell = new THREE.Mesh(
    shellGeo,
    new THREE.MeshPhysicalMaterial({
      color: 0xf4f7f6,
      roughness: 0.22,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.12,
      iridescence: 0.85,
      iridescenceIOR: 1.32,
      iridescenceThicknessRange: [120, 760],
      alphaMap: texDomeAlpha(),
      emissive: 0xbfe4ee,
      emissiveIntensity: 0,
      transparent: true,
      alphaTest: 0.45,
      side: THREE.DoubleSide,
      envMapIntensity: 1.15,
    })
  );
  shell.castShadow = true;
  shell.receiveShadow = true;
  domeShellMat = shell.material;
  domeGroup.add(shell);

  // Rims and panes, merged into one mesh each.
  const rimGeos = [], paneGeos = [];
  const up = new THREE.Vector3(0, 0, 1);
  const q = new THREE.Quaternion();
  const m = new THREE.Matrix4();

  for (const dir of HOLES) {
    // A lens that overlaps a doorway loses its lip and its glass. What is
    // left is an open circle running into the arch, which is how the cut
    // stays part of the pattern instead of looking sawn out of it.
    if (holeMeetsDoor(dir)) continue;

    const ringR = C.domeRadius * Math.sin(HOLE_ANGLE);
    const depth = C.domeRadius * Math.cos(HOLE_ANGLE);
    q.setFromUnitVectors(up, dir);

    const rim = new THREE.TorusGeometry(ringR, C.rimTube, 8, QUALITY.holeSeg);
    m.compose(dir.clone().multiplyScalar(depth), q, new THREE.Vector3(1, 1, 1));
    rim.applyMatrix4(m);
    rimGeos.push(rim);

    const pane = new THREE.CircleGeometry(ringR * 0.985, QUALITY.holeSeg);
    m.compose(dir.clone().multiplyScalar(depth * 0.995), q, new THREE.Vector3(1, 1, 1));
    pane.applyMatrix4(m);
    paneGeos.push(pane);
  }

  const rims = new THREE.Mesh(
    mergeGeometries(rimGeos),
    new THREE.MeshPhysicalMaterial({
      color: 0xfdfefe, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 1.1,
      emissive: 0xdff2f7, emissiveIntensity: 0,
    })
  );
  rims.castShadow = true;
  domeRimMat = rims.material;
  domeGroup.add(rims);

  const panes = new THREE.Mesh(
    mergeGeometries(paneGeos),
    new THREE.MeshPhysicalMaterial({
      color: 0xa9dfe6,
      roughness: 0.04,
      metalness: 0,
      transmission: QUALITY.transmission ? 0.95 : 0,
      thickness: 0.35,
      ior: 1.42,
      iridescence: 0.7,
      iridescenceIOR: 1.25,
      transparent: true,
      opacity: QUALITY.transmission ? 0.6 : 0.42,
      side: THREE.DoubleSide,
      envMapIntensity: 1.4,
    })
  );
  domeGroup.add(panes);

  domeGroup.scale.set(1, C.domeSquash, 1);
  domeGroup.position.y = C.domeCenterY;
  domeGroup.traverse((o) => o.layers.enable(MIRROR_LAYER));

  // The plinth it stands on, rising out of the water.
  const plinth = new THREE.Mesh(
    new THREE.CylinderGeometry(
      C.domeRadius * Math.sin(CUT) * 1.18,
      C.domeRadius * Math.sin(CUT) * 1.24,
      C.plinthTop - POOL.y + 0.7, 56),
    new THREE.MeshStandardMaterial({ color: 0xf1ece0, roughness: 0.75 })
  );
  plinth.position.y = (C.plinthTop + POOL.y - 0.7) / 2;
  plinth.castShadow = true; plinth.receiveShadow = true;
  plinth.layers.enable(MIRROR_LAYER);
  scene.add(plinth);
}

// ## 14B  FOUNTAIN — jets around the dome, and the lights on it
//
// The reference is a fountain, not a still pool: a ring of low jets inside
// the basin throwing water up around the base of the dome. Two pieces make
// it read — the columns themselves, which are cones scaled on their own
// sine so no two are at the same height at the same moment, and the spray,
// which is a point cloud falling back under gravity and respawning at the
// nozzle it came from.
//
// The lights are the other half of the brief, and they only matter after
// dark. Uplighters sit in the basin around the plinth throwing warm light up
// into the shell; the clock turns them on as the sun goes down and off again
// at dawn, and the dome itself picks up a faint emissive at the same time so
// it glows rather than merely being lit. Their count comes off the quality
// budget: point lights are per-fragment work on every material in the scene,
// which is the one kind of cost a phone really feels.

const fountain = (() => {
  const ring = C.domeRadius * Math.sin(C.domeCut * Math.PI) * 1.32;
  const nozzleY = POOL.y + 0.05;

  // Azimuths, less the ones standing in a walkway.
  //
  // The causeways run out along the z axis fore and aft, so a nozzle near
  // that line is a nozzle underneath the marble — firing a column of water
  // up through the deck the visitor is about to walk down. Those are
  // dropped rather than nudged aside: a ring of jets that breaks where the
  // path crosses it is what an actual basin looks like.
  const AZ = [];
  {
    const n = QUALITY.light ? 10 : 16;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      if (Math.abs(Math.cos(a) * ring) < 2.9) continue;
      AZ.push(a);
    }
  }
  const JETS = AZ.length;

  const water = new THREE.MeshPhysicalMaterial({
    color: 0xcfeaf2,
    roughness: 0.08,
    metalness: 0,
    transmission: QUALITY.transmission ? 0.85 : 0,
    thickness: 0.4,
    ior: 1.33,
    transparent: true,
    opacity: QUALITY.transmission ? 0.55 : 0.38,
    side: THREE.DoubleSide,
    envMapIntensity: 1.4,
  });

  // One cone, instanced. Scaled on Y each frame; the geometry is built with
  // its foot at the origin so scaling grows it upward out of the water.
  const cone = new THREE.ConeGeometry(0.14, 1, 7, 1, true);
  cone.translate(0, 0.5, 0);
  const jets = new THREE.InstancedMesh(cone, water, JETS);
  jets.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  jets.frustumCulled = false;
  jets.layers.enable(MIRROR_LAYER);
  scene.add(jets);

  // Nozzle surrounds, so each jet comes out of something.
  {
    const rims = [];
    for (let i = 0; i < JETS; i++) {
      const a = AZ[i];
      const g = new THREE.CylinderGeometry(0.26, 0.3, 0.16, 8);
      g.translate(Math.cos(a) * ring, nozzleY + 0.02, Math.sin(a) * ring);
      rims.push(g);
    }
    const m = new THREE.Mesh(
      mergeGeometries(rims),
      new THREE.MeshStandardMaterial({ color: 0xb9b6ae, roughness: 0.5, metalness: 0.4 })
    );
    scene.add(m);
  }

  // Spray: a cloud that falls under gravity and goes back to its nozzle.
  const N = QUALITY.spray;
  const pos = new Float32Array(N * 3);
  const vel = new Float32Array(N * 3);
  const life = new Float32Array(N);
  const sr = rng(70707);
  const respawn = (i, stagger) => {
    const a = AZ[i % JETS];
    pos[i * 3] = Math.cos(a) * ring + (sr() - 0.5) * 0.1;
    pos[i * 3 + 1] = nozzleY;
    pos[i * 3 + 2] = Math.sin(a) * ring + (sr() - 0.5) * 0.1;
    vel[i * 3] = (sr() - 0.5) * 0.55;
    vel[i * 3 + 1] = 3.1 + sr() * 1.5;
    vel[i * 3 + 2] = (sr() - 0.5) * 0.55;
    life[i] = stagger ? sr() * 1.1 : 0;
  };
  for (let i = 0; i < N; i++) respawn(i, true);

  const sprayGeo = new THREE.BufferGeometry();
  sprayGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const spray = new THREE.Points(sprayGeo, new THREE.PointsMaterial({
    map: asTexture(texGlow(), { srgb: false }),
    size: 0.17,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    opacity: 0.5,
    sizeAttenuation: true,
  }));
  spray.frustumCulled = false;
  spray.layers.enable(MIRROR_LAYER);
  scene.add(spray);

  // Uplighters in the basin, and their fittings.
  const lights = [];
  const LAMPS = QUALITY.lampsDome;
  for (let i = 0; i < LAMPS; i++) {
    const a = (i / LAMPS) * Math.PI * 2 + 0.4;
    const r = ring * 0.82;
    const l = new THREE.PointLight(0xffd9a0, 0, 26, 1.7);
    l.position.set(Math.cos(a) * r, POOL.y + 0.25, Math.sin(a) * r);
    scene.add(l);
    lights.push(l);
  }

  const dummy = new THREE.Object3D();

  return {
    lights,
    update(dt, t) {
      for (let i = 0; i < JETS; i++) {
        const a = AZ[i];
        const h = 1.5 + Math.sin(t * 1.35 + i * 1.7) * 0.5 + Math.sin(t * 2.9 + i) * 0.22;
        dummy.position.set(Math.cos(a) * ring, nozzleY, Math.sin(a) * ring);
        dummy.scale.set(1, h, 1);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        jets.setMatrixAt(i, dummy.matrix);
      }
      jets.instanceMatrix.needsUpdate = true;

      for (let i = 0; i < N; i++) {
        if (life[i] > 0) { life[i] -= dt; continue; }
        const k = i * 3;
        vel[k + 1] -= 7.6 * dt;
        pos[k] += vel[k] * dt;
        pos[k + 1] += vel[k + 1] * dt;
        pos[k + 2] += vel[k + 2] * dt;
        if (pos[k + 1] < nozzleY) respawn(i, false);
      }
      sprayGeo.attributes.position.needsUpdate = true;
    },
  };
})();

// ## 15  PALMS — trunks, fronds, wind
// Every palm in the scene ends up in exactly two draw calls: one merged trunk
// mesh and one merged frond mesh, both already in world space. The sway that
// would normally come from moving objects around is baked into the vertex
// shader instead, driven by two attributes stamped on at build time —
// `aSway`, how freely this vertex moves, and `aPhase`, which palm it belongs
// to, so no two trees breathe together.

const windUniforms = {
  uTime: { value: 0 },
  uWind: { value: QUALITY.still ? 0 : 1 },
  /* Separate from uWind on purpose.
   *
   * A coastal palm does not stand up straight and wave about a vertical
   * axis; it is combed downwind and *stays* combed, and the sway happens
   * around that lean. Every photograph of one looks like this. Because it
   * is shape rather than movement it has to survive a reduced-motion
   * preference, which is exactly what uWind does not — so it cannot ride
   * on the same uniform. */
  uBend: { value: 1 },
};

const WIND_PARS = /* glsl */`
  uniform float uTime;
  uniform float uWind;
  uniform float uBend;
  attribute float aSway;
  attribute float aPhase;
`;

// Applied to `transformed`, which for these meshes is already world space.
const WIND_BODY = /* glsl */`
  float _sw = aSway;
  float _ph = aPhase;
  float _g = sin(uTime * 0.85 + _ph) * 0.62
           + sin(uTime * 1.73 + _ph * 1.7) * 0.26
           + sin(uTime * 3.10 + _ph * 2.3) * 0.11;
  float _amp = _sw * _sw * uWind;
  transformed.x += _g * _amp * 0.95;
  transformed.z += cos(uTime * 0.74 + _ph * 1.31) * _amp * 0.62;
  transformed.y -= abs(_g) * _amp * 0.30;
  // The lean itself. Same falloff as the sway, so it is the frond tips that
  // travel and the trunk barely moves at all.
  float _b = _sw * _sw * uBend;
  transformed.x += _b * 0.42;
  transformed.y -= _b * 0.16;
`;

function applyWind(material) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = windUniforms.uTime;
    shader.uniforms.uWind = windUniforms.uWind;
    shader.uniforms.uBend = windUniforms.uBend;
    shader.vertexShader = shader.vertexShader
      .replace("#include <common>", `#include <common>\n${WIND_PARS}`)
      .replace("#include <begin_vertex>", `#include <begin_vertex>\n${WIND_BODY}`);
  };
  material.customProgramCacheKey = () => "wind";
  return material;
}

/** A tapered tube swept along a curve — the trunk. */
function trunkGeometry(curve, segs, radial, r0, r1) {
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], nor = [], uv = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const p = curve.getPointAt(t);
    const N = frames.normals[i], B = frames.binormals[i];
    // Palms bulge slightly at the foot and again under the crown.
    const r = lerp(r0, r1, t) * (1 + 0.20 * Math.exp(-t * 9) + 0.06 * Math.exp(-Math.pow(t - 0.92, 2) * 120));
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const nx = Math.cos(a), ny = Math.sin(a);
      const n = new THREE.Vector3().addScaledVector(N, nx).addScaledVector(B, ny);
      pos.push(p.x + n.x * r, p.y + n.y * r, p.z + n.z * r);
      nor.push(n.x, n.y, n.z);
      uv.push(j / radial, t * 1.35);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

/**
 * One frond: a three-column strip following an arc that rises then droops,
 * folded down the middle like the real thing so it catches light on one half
 * and shades the other.
 */
const FROND_COLS = [-1, -0.55, 0, 0.55, 1];

function frondGeometry(len, halfWidth, segs) {
  const pos = [], uv = [], idx = [];
  const N = FROND_COLS.length;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    /* The spine.
     *
     * It was a straight run out in x with a parabola in y. A real frond
     * does not leave the crown and travel in a straight line: it goes out
     * and up, rolls over its shoulder, and the last third falls away
     * steeply while the tip pulls back toward the trunk. The cubic on x is
     * that pull-back; the steeper parabola on y is the fall.
     */
    const x = len * (t - 0.10 * t * t * t);
    const y = len * (0.55 * t - 1.22 * t * t);
    const w = halfWidth * Math.sin(Math.pow(t, 0.6) * Math.PI) * (1 - 0.30 * t) + 0.02;
    /* Five columns rather than three.
     *
     * The three-column version was a crease: a flat half, a hard fold down
     * the middle, and another flat half, which catches light in two
     * unbroken slabs. A frond is closer to a shallow trough, so the fold
     * goes as the square of the distance out from the rachis and the
     * cross-section comes out curved. The reason for folding at all is
     * unchanged and still the important one — a flat frond seen edge-on
     * against the sky is two pixels of dotted alpha and reads as a scratch
     * on the render, so there always has to be some of it turned toward
     * you.
     */
    for (let c = 0; c < N; c++) {
      const k = FROND_COLS[c];
      pos.push(x, y - w * 0.58 * k * k, k * w);
      uv.push(t, (k + 1) / 2);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let c = 0; c < N - 1; c++) {
      const a = i * N + c, b = a + N;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** Stamps a constant attribute across a geometry so it survives the merge. */
function stamp(geo, name, value) {
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n);
  arr.fill(value);
  geo.setAttribute(name, new THREE.BufferAttribute(arr, 1));
  return geo;
}
/** Per-vertex sway, from a function of the vertex's own height. */
function stampSway(geo, fn) {
  const p = geo.attributes.position;
  const arr = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) arr[i] = fn(p.getX(i), p.getY(i), p.getZ(i));
  geo.setAttribute("aSway", new THREE.BufferAttribute(arr, 1));
  return geo;
}

/* Hoisted out of the palm block on purpose: the planting in the street tubs
 * is made of the same leaf at a tenth of the size, and building the canvas
 * twice to get two identical textures would be a megabyte of GPU memory
 * spent on a copy. */
const frondTex = asTexture(texFrond());

const crowns = [];   // world positions of every crown, for the leaf spawner
{
  const rand = rng(20260919);
  const trunkGeos = [], frondGeos = [];

  function addPalm(x, z, scale, phase, opt = {}) {
    // The dice are rolled either way, so that overriding a palm's height or
    // lean does not shift every palm planted after it onto a different draw
    // from the seeded stream.
    const rh = 7.6 + rand() * 3.4;
    const rlx = (rand() - 0.5) * 2.4 * scale;
    const rlz = (rand() - 0.5) * 2.4 * scale;

    const h = (opt.height ?? rh) * scale;
    const leanX = opt.leanX ?? rlx;
    const leanZ = opt.leanZ ?? rlz;
    // Crown size separated from trunk height: the pair in the logo are tall
    // and slender, and scaling one palm up whole gives a lollipop.
    const crown = (opt.crown ?? 1) * scale;

    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(leanX * 0.18, h * 0.3, leanZ * 0.18),
      new THREE.Vector3(leanX * 0.6, h * 0.65, leanZ * 0.6),
      new THREE.Vector3(leanX, h, leanZ),
    ]);

    const tg = trunkGeometry(curve, 26, 12, 0.30 * scale, 0.19 * scale);
    stampSway(tg, (vx, vy) => Math.pow(clamp(vy / h, 0, 1), 1.7) * 0.42);
    stamp(tg, "aPhase", phase);
    tg.translate(x, 0, z);
    trunkGeos.push(tg);

    const top = curve.getPointAt(1);
    const crownWorld = new THREE.Vector3(x + top.x, top.y, z + top.z);
    crowns.push(crownWorld);

    const n = QUALITY.frondsPer + Math.floor(rand() * 3);
    for (let i = 0; i < n; i++) {
      // A crown can be aimed. Left to chance it is a sphere of fronds, which
      // is fine for a palm in a row and no use at all for the two that have
      // to arch over the dome: on a portrait phone the frame is barely 34
      // degrees wide, the trunks stand outside it, and whether anything
      // reached in over the dome came down to where the dice put frond zero.
      // With `azTo` the crown is rotated so one frond points where it is
      // wanted, and that frond is the long one, thrown a little flatter so it
      // reaches rather than climbs.
      const az = (i / n) * Math.PI * 2 + rand() * 0.42 + (opt.azTo ?? 0);
      /* A crown is not a wheel of equal spokes.
       *
       * This drew from -0.30 to +0.25, a band so narrow that every frond
       * left the trunk at more or less the same angle and the crown came
       * out as a disc. A real one has a few young fronds standing up near
       * the spear, most sitting out around the horizontal, and the oldest
       * hanging most of the way down before they drop. The exponent skews
       * the draw toward the bottom of a much wider range, which is what
       * gives the silhouette its shoulders. */
      const rp = 0.46 - 1.30 * Math.pow(rand(), 0.72);
      const rl = 5.4 + rand() * 2.4;
      const aimed = opt.azTo !== undefined && i === 0;
      const pitch = aimed ? -0.24 : rp;
      // The aimed frond takes a fixed length rather than the dice, so the
      // pair either side of the dome reach in by the same amount. Chance
      // there reads as one palm having more of a crown than its twin.
      const len = aimed ? 7.6 * crown : rl * crown;
      const fg = frondGeometry(len, 1.14 * crown, 12);

      // Sway is the trunk's contribution at the top plus the frond's own whip.
      stampSway(fg, (vx) => 0.42 + Math.pow(clamp(vx / len, 0, 1), 1.7) * 0.95);
      stamp(fg, "aPhase", phase + i * 0.29);

      // Roll, about the frond's own spine. Left to chance it barely matters,
      // but the aimed frond is the one arching over the dome against open
      // sky, and edge-on it is a two-pixel dotted line that reads as a
      // scratch on the render rather than a leaf. Rolled a radian it shows
      // its face to anyone standing where the opening shot stands.
      const rr = rand() * 0.5 - 0.25;
      const m = new THREE.Matrix4()
        .makeTranslation(crownWorld.x, crownWorld.y, crownWorld.z)
        .multiply(new THREE.Matrix4().makeRotationY(az))
        .multiply(new THREE.Matrix4().makeRotationZ(pitch))
        .multiply(new THREE.Matrix4().makeRotationX(aimed ? 1.05 : rr));
      fg.applyMatrix4(m);
      frondGeos.push(fg);
    }

    /* The spear.
     *
     * The youngest leaf, still rolled up and standing almost straight out
     * of the middle of the crown. It is one narrow blade and it costs
     * nothing, and it is the single cheapest thing that settles the
     * question of whether you are looking at a palm or at a large fern.
     */
    {
      const sl = (3.1 + rand() * 1.1) * crown;
      const sg = frondGeometry(sl, 0.30 * crown, 8);
      stampSway(sg, (vx) => 0.42 + Math.pow(clamp(vx / sl, 0, 1), 1.7) * 0.55);
      stamp(sg, "aPhase", phase + 1.7);
      sg.applyMatrix4(new THREE.Matrix4()
        .makeTranslation(crownWorld.x, crownWorld.y, crownWorld.z)
        .multiply(new THREE.Matrix4().makeRotationY(rand() * Math.PI * 2))
        .multiply(new THREE.Matrix4().makeRotationZ(1.16))
        .multiply(new THREE.Matrix4().makeRotationX(rand() * 0.6)));
      frondGeos.push(sg);
    }
  }

  /**
   * Plants a palm, unless a building is already standing there.
   *
   * The ring was laid out on a radius with no idea the plaza had been built
   * up around it, so trunks came up through shopfront glazing and fronds hung
   * inside first floors. Each candidate is nudged outward a few times before
   * being abandoned, which keeps the ring looking like a ring rather than
   * leaving gaps wherever a building happens to be.
   */
  function plant(x, z, scale, phase, opt = {}) {
    // The trunk is not what collides. A frond runs about 7.8 units at full
    // scale and radiates in every direction, so a palm whose base clears a
    // wall by a metre still has half its crown inside the first floor —
    // which is exactly what was happening along the kerb. Test the crown's
    // reach, not the trunk.
    //
    // 0.82 of it, though. `inBuilt` already carries 1.4 units of clearance
    // around every wall, and testing the full reach against a padded
    // footprint means the crown may not even enter the padding — two
    // margins stacked on each other. That is not a nicety: it rejected
    // every palm down the paseo, all twelve of them, and the street has
    // been bare ever since. The frond tip is allowed into the clearance;
    // it is not allowed into the building.
    const reach = 7.8 * scale * (opt.crown ?? 1) * 0.82;
    for (const [dx, dz] of [[0, 0], [reach, 0], [-reach, 0], [0, reach], [0, -reach]]) {
      if (inBuilt(x + dx, z + dz)) return false;
    }
    addPalm(x, z, scale, phase, opt);
    return true;
  }

  // A ring around the plaza, then two files down the promenade.
  const ring = QUALITY.palmsRing;
  for (let i = 0; i < ring; i++) {
    const a = (i / ring) * Math.PI * 2 + 0.3;
    for (let attempt = 0; attempt < 4; attempt++) {
      const r = 21 + attempt * 2.6 + rand() * 4;
      const rx = Math.cos(a) * r, rz = Math.sin(a) * r * 0.8;
      const rs = 0.9 + rand() * 0.35, rp = rand() * 9;

      // Nothing in the opening camera's lap.
      //
      // The ring is an ellipse squashed to 0.8 in z, which runs it straight
      // through where the camera stands at the top of the page — one palm
      // was landing about three metres behind the lens, and the fronds it
      // hung forward over the shot were the pale hairy streaks across the
      // sky. They never looked like a palm because the crown they belonged
      // to was off the top of the frame; they looked like a scratch. A
      // rejected slot pushes outward on the next attempt and is otherwise
      // dropped, which is the right answer here: the dome's own palms
      // already fill that arc.
      if (Math.hypot(rx, rz - 20) < 16) continue;
      if (plant(rx, rz, rs, rp)) break;
    }
  }
  // Down the alley, just inside the kerb on both sides. They used to stand
  // at ±15, which is now inside the buildings.
  // Down the middle of the paseo rather than tight to the kerb, and smaller.
  // At the kerb there is no scale at which a palm both looks like a palm and
  // keeps its fronds out of the shopfront: the alley is only 22 wide and a
  // full-size crown is 15 across.
  // Tall and narrow, not small. Scaling a palm down whole to fit an alley
  // gives a shrub on a stick; what fits a 17-unit street is the profile the
  // street actually has — a high slender trunk carrying a compact crown,
  // clear above the canopies and well inside the shopfronts.
  for (let i = 0; i < QUALITY.palmsRow * 2; i++) {
    const z = -40 - i * 7.6 - rand() * 2.2;
    const sideX = (i % 2 === 0 ? -1 : 1) * (STREET.half * 0.38);
    plant(sideX, z, 1, rand() * 9, {
      height: 8.4 + (i % 3) * 0.8,
      crown: 0.55,
    });
  }

  // ── the palms around the dome ─────────────────────────────────────────
  //
  // The logo is a sphere with a palm either side of it, and until now the
  // scene had the sphere and no palms — the ring was laid out at a radius of
  // 21 to 31, which is past the basin and behind whatever else is standing
  // there, so the one shot that has to match the mark was the one shot with
  // nothing in it.
  //
  // These are placed rather than scattered. All eight stand on the travertine
  // border around the basin, never in the water: the side slabs run x 15.9 to
  // 19.4, the end slabs z 13.4 to 16.9, and every position below is inside
  // one of them. The near pair is close enough to the opening camera to sweep
  // past as it swings out, which is most of the parallax in that move.
  //
  // The framing pair is the important one. From the hero camera the dome
  // subtends about 26 degrees, so a trunk at x 16.5 sits just outside a
  // laptop's frame and well outside a portrait phone's — but its inward
  // fronds reach back to x 8.5, which lands inside both. What you get is the
  // silhouette from the mark: the dome, and a frond arching over it from
  // either side.
  const DOME_PALMS = [
    // x      z      height crown  lean (− is in over the water) / toward cam
    { x: 16.5, z: -12.5, h: 15.6, c: 1.06, out: -1.6, fwd:  0.5, aim: true },
    // Not aimed. This pair stands level with the opening camera and ten
    // metres off it, so a frond thrown at the dome is thrown across the
    // lens — at that range it fills the top third of the frame and, end-on,
    // reads as a hair on the sensor rather than as a leaf. It earns its
    // place on the sweep out of the plaza, where it is what the camera
    // passes.
    { x: 14.0, z:  15.0, h: 12.8, c: 0.94, out: -1.2, fwd:  1.0, aim: false },
    // Both pulled in off the kerb and leant back over the water: at 18.8
    // with an outward lean the crown reached x 29 and put frond tips inside
    // the block that closes the plaza on that side.
    { x: 17.6, z:   1.5, h: 13.9, c: 1.00, out: -1.0, fwd:  0.2, aim: true },
    { x: 17.0, z:  -7.5, h: 14.5, c: 0.97, out: -1.0, fwd:  0.4, aim: true },
  ];

  const domePalms = DOME_PALMS.slice(0, QUALITY.light ? 2 : 4);
  const planters = [];
  for (const d of domePalms) {
    for (const side of [-1, 1]) {
      addPalm(d.x * side, d.z, 1, (d.x + d.z) * 0.11 + (side > 0 ? 0 : 3.1), {
        height: d.h,
        crown: d.c,
        leanX: d.out * side,
        // Frond zero points at the dome. Geometry: a frond is built along
        // +x and rotated about Y, so pi aims it back toward −x — which is
        // inward for the palm standing on the +x side, and 0 for its mirror.
        azTo: d.aim ? (side > 0 ? Math.PI : 0) : undefined,
        leanZ: d.fwd,
      });

      // A kerbed bed at the foot, because a trunk coming straight up through
      // a stone slab reads as a prop stuck into the floor.
      const kerb = new THREE.CylinderGeometry(1.42, 1.5, 0.44, 14);
      kerb.translate(d.x * side, 0.22, d.z);
      const soil = new THREE.CylinderGeometry(1.18, 1.18, 0.5, 14);
      soil.translate(d.x * side, 0.25, d.z);
      planters.push(kerb, soil);
    }
  }

  {
    // Two materials, so the beds are one draw call each rather than sixteen.
    const kerbGeos = planters.filter((_, i) => i % 2 === 0);
    const soilGeos = planters.filter((_, i) => i % 2 === 1);
    const kerbMesh = new THREE.Mesh(
      mergeGeometries(kerbGeos),
      new THREE.MeshStandardMaterial({ color: 0xe6e0d2, roughness: 0.82 })
    );
    kerbMesh.castShadow = true; kerbMesh.receiveShadow = true;
    scene.add(kerbMesh);

    const soilMesh = new THREE.Mesh(
      mergeGeometries(soilGeos),
      new THREE.MeshStandardMaterial({ color: 0x3a3228, roughness: 1 })
    );
    soilMesh.receiveShadow = true;
    scene.add(soilMesh);
  }

  const barkTex = asTexture(texBark(), { repeat: [1, 1] });
  const trunkMat = applyWind(new THREE.MeshStandardMaterial({
    map: barkTex, bumpMap: barkTex, bumpScale: 0.08, roughness: 0.94, metalness: 0,
  }));
  const trunks = new THREE.Mesh(mergeGeometries(trunkGeos), trunkMat);
  trunks.castShadow = true; trunks.receiveShadow = true;
  // A reflecting pool with only the dome in it is half a reflecting pool.
  trunks.layers.enable(MIRROR_LAYER);
  scene.add(trunks);

  // No alphaMap. Three reads alphaMap's GREEN channel, not a canvas's alpha
  // channel, so pairing it with this texture multiplied the cut-out by how
  // green each pixel happened to be — every leaflet except the brightest
  // slivers fell under alphaTest and vanished. `map` on an RGBA canvas already
  // carries the silhouette in its own alpha, which is what alphaTest wants.
  const frondMat = applyWind(new THREE.MeshStandardMaterial({
    map: frondTex,
    // Low, on purpose. Leaflets are one or two texels wide, and once the
    // texture minifies the mip average drops them under any honest
    // threshold — a distant crown erodes to a few stray hairs. Cutting at
    // 0.26 keeps the leaf and costs only a slightly softer silhouette.
    alphaTest: 0.26,
    transparent: false,
    side: THREE.DoubleSide,
    roughness: 0.72,
    metalness: 0,
    color: 0xffffff,
  }));
  const fronds = new THREE.Mesh(mergeGeometries(frondGeos), frondMat);
  fronds.castShadow = true;
  fronds.receiveShadow = true;
  fronds.layers.enable(MIRROR_LAYER);
  scene.add(fronds);

  // Shadows are rendered with a different material, so the sway has to be
  // injected there too — otherwise the dappling on the plaza stays perfectly
  // still while the fronds above it move, which reads as badly as it sounds.
  const depthMat = new THREE.MeshDepthMaterial({
    depthPacking: THREE.RGBADepthPacking,
    map: frondTex,
    alphaTest: 0.35,
  });
  applyWind(depthMat);
  fronds.customDepthMaterial = depthMat;

  const trunkDepth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  applyWind(trunkDepth);
  trunks.customDepthMaterial = trunkDepth;
}

// ## 16  LEAVES — falling leaflets
// One InstancedMesh. Each leaflet keeps its own fall speed, drift and tumble,
// spawns at a crown and is recycled back to one when it lands.

const leaves = (() => {
  if (QUALITY.still) return null;
  const N = QUALITY.leaves;
  const geo = new THREE.PlaneGeometry(0.42, 0.14);
  const mat = new THREE.MeshStandardMaterial({
    map: asTexture(texLeaf()),
    alphaTest: 0.4,
    side: THREE.DoubleSide,
    roughness: 0.8,
    metalness: 0,
  });
  const mesh = new THREE.InstancedMesh(geo, mat, N);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const rand = rng(77123);
  const state = [];
  for (let i = 0; i < N; i++) {
    state.push({
      p: new THREE.Vector3(),
      fall: 0.55 + rand() * 0.65,
      drift: new THREE.Vector2((rand() - 0.5) * 0.9, (rand() - 0.5) * 0.9),
      swing: 1.1 + rand() * 2.4,
      phase: rand() * Math.PI * 2,
      spin: new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(),
      spinRate: (rand() - 0.5) * 2.6,
      angle: rand() * Math.PI * 2,
      scale: 0.7 + rand() * 0.8,
    });
  }

  function respawn(s, firstRun) {
    const c = crowns[Math.floor(rand() * crowns.length)] || new THREE.Vector3(0, 12, 0);
    s.p.set(
      c.x + (rand() - 0.5) * 6,
      firstRun ? rand() * c.y : c.y - rand() * 1.4,
      c.z + (rand() - 0.5) * 6
    );
    s.phase = rand() * Math.PI * 2;
  }
  state.forEach((s) => respawn(s, true));

  const dummy = new THREE.Object3D();
  const q = new THREE.Quaternion();

  return {
    mesh,
    update(dt, t) {
      for (let i = 0; i < N; i++) {
        const s = state[i];
        s.p.y -= s.fall * dt;
        s.p.x += (s.drift.x + Math.sin(t * s.swing + s.phase) * 0.55) * dt;
        s.p.z += (s.drift.y + Math.cos(t * s.swing * 0.8 + s.phase) * 0.45) * dt;
        s.angle += s.spinRate * dt;
        if (s.p.y < C.plazaY + 0.05) respawn(s, false);

        dummy.position.copy(s.p);
        q.setFromAxisAngle(s.spin, s.angle);
        dummy.quaternion.copy(q);
        // Nothing gets to slap the camera in the face.
        //
        // A leaflet is 42cm long, which is a speck at twenty metres and a
        // quarter of the screen at one. They spawn at crowns and drift, and
        // now that palms stand around the basin there are crowns within a
        // dozen metres of the opening shot — so one would occasionally sail
        // up to the lens and read as a green tarpaulin thrown over the dome.
        // Fading them out over the last couple of metres costs nothing and
        // is invisible: at that range the leaf is leaving frame anyway.
        const near = clamp((s.p.distanceTo(camera.position) - 1.2) / 2.2, 0, 1);
        dummy.scale.setScalar(s.scale * near);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
    },
  };
})();

// ## 17  MOTES — airborne dust in the sun
// Cheap atmosphere: additive points drifting upward through the shaft of light
// the sun is coming down. They sell the heat more than anything else here.

const motes = (() => {
  const N = QUALITY.motes;
  const pos = new Float32Array(N * 3);
  const seed = new Float32Array(N);
  const rand = rng(4242);
  for (let i = 0; i < N; i++) {
    pos[i * 3]     = (rand() - 0.5) * 120;
    pos[i * 3 + 1] = rand() * 26;
    pos[i * 3 + 2] = (rand() - 0.5) * 230 - 60;
    seed[i] = rand() * 100;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));

  const m = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 },
      uMap: { value: asTexture(texGlow(), { srgb: false }) },
      uSize: { value: QUALITY.light ? 34 : 46 },
    },
    vertexShader: /* glsl */`
      attribute float aSeed;
      uniform float uTime, uSize;
      varying float vA;
      void main(){
        vec3 p = position;
        p.y = mod(p.y + uTime * (0.18 + fract(aSeed) * 0.3), 26.0);
        p.x += sin(uTime * 0.4 + aSeed) * 1.6;
        p.z += cos(uTime * 0.33 + aSeed * 1.7) * 1.6;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uSize / max(-mv.z, 1.0);
        // Fade in at the bottom, out at the top, and with distance.
        vA = smoothstep(0.0, 4.0, p.y) * (1.0 - smoothstep(16.0, 26.0, p.y))
           * (1.0 - smoothstep(40.0, 150.0, -mv.z));
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D uMap;
      varying float vA;
      void main(){
        float a = texture2D(uMap, gl_PointCoord).r * vA * 0.5;
        if (a < 0.005) discard;
        gl_FragColor = vec4(vec3(1.0, 0.96, 0.86), a);
      }`,
  });

  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  return m;
})();

// ## 18  JOURNEY — a street of storefronts
// The houses used to be free-standing slabs on an empty plaza, which read as
// objects scattered on a plain rather than anywhere you could be. They are
// buildings now: two facing terraces with a walkable alley between them, each
// unit a shell with a glazed shopfront, a lit interior behind the glass, a
// recessed doorway, a canopy in the house's colour and a sign over it.
//
// Buildings alternate sides and step down the street at half a unit's width
// each, so the two terraces interleave and neither side has a gap opposite a
// gap. Index order therefore runs straight down the street, which is what the
// card's picker relies on.
//
// Every house is a different piece of architecture — see STYLE up in the
// config for which, and why the order is arranged the way it is.
//
// Draw calls are kept down by merging on material rather than on building:
// every concrete wall on the street is one mesh, every brand-coloured
// element another, then glass, metalwork, lit interiors and each perforated
// screen pattern. Only the signs stay separate, because each is its own
// texture.

const monoliths = [];   // kept under the old name: sections 19 and 21 read it

// Materials the time of day has to reach into. Collected as they are built,
// because they are created inside the street block and the clock runs long
// after it.
let interiorMat = null, canopyStripMat = null, lampHeadMat = null, glassMat = null;
let endBandMat = null;
const signMats = [];
const streetLamps = [];

{
  const concrete = [], accent = [], glass = [], metal = [], interiors = [], kerbs = [];
  const screenBins = { dots: [], weave: [], fins: [] };

  /** Tags a geometry with a flat colour so it can be merged and still differ. */
  function paint(geo, hex) {
    const c = hex.isColor ? hex : new THREE.Color(hex);
    const n = geo.attributes.position.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
    geo.setAttribute("color", new THREE.BufferAttribute(arr, 3));
    return geo;
  }

  const BASE_GREY = new THREE.Color(0xbdbbb4);
  const rand = rng(90210);

  BRANDS.forEach((brand, i) => {
    const z = STREET.from + i * STREET.step;
    const side = i % 2 === 0 ? -1 : 1;          // -1 = left terrace
    const x = side * STREET.half;

    // Local space: +Z faces the street, X runs along it, Y is up.
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.rotation.y = side === -1 ? Math.PI / 2 : -Math.PI / 2;
    g.updateMatrixWorld(true);
    scene.add(g);

    const style = STYLE[brand.slug] || "fluted";
    const H = STYLE_H[style] + rand() * 1.8;
    const W = STREET.width;
    const D = STREET.depth;
    const SHOP = 6.4;                            // top of the ground floor

    // Concrete drifts pour to pour, and picks up the faintest cast of the
    // house — a few per cent, no more. The brand belongs on the metalwork and
    // the glass, not soaked through the structure.
    const grey = BASE_GREY.clone()
      .lerp(new THREE.Color(brand.bg[0]), 0.09)
      .offsetHSL(0, 0, (rand() - 0.5) * 0.045);
    const tone = brand.bg[0];
    const tone2 = brand.bg[1];

    /**
     * Into world space, and indexed on the way.
     *
     * mergeGeometries refuses a batch where some geometries carry an index
     * and others do not, and ExtrudeGeometry — which is how the arcade's
     * arched openings are cut — is the one primitive here that comes back
     * non-indexed. One arcade was enough to fail the merge for every
     * concrete wall on the street and take the whole scene down with it.
     * A trivial 0..n-1 index costs nothing and makes it mergeable.
     */
    const toW = (geo) => {
      geo.applyMatrix4(g.matrixWorld);
      if (!geo.index) {
        const n = geo.attributes.position.count;
        const arr = n > 65535 ? new Uint32Array(n) : new Uint16Array(n);
        for (let k = 0; k < n; k++) arr[k] = k;
        geo.setIndex(new THREE.BufferAttribute(arr, 1));
      }
      return geo;
    };
    const con = (geo, c) => concrete.push(paint(toW(geo), c || grey));
    const acc = (geo, c) => accent.push(paint(toW(geo), c || tone));
    const gls = (geo) => glass.push(toW(geo));
    const met = (geo, c) => metal.push(paint(toW(geo), c || 0x4a4d50));
    const room = (geo) => interiors.push(toW(geo));
    const scr = (geo, kind) => screenBins[kind].push(toW(geo));

    // ── ground floor, common to every house ──────────────────────────────
    {
      const plinth = new THREE.BoxGeometry(W, 0.34, D);
      plinth.translate(0, 0.17, -D / 2);
      con(plinth);

      // The ground floor had no wall at all — two floating panes of glass, a
      // door, and open air everywhere else. From the street you looked
      // straight between them and out of the world, which is what made the
      // upper storeys read as slabs hovering over nothing. It gets a real
      // shell: piers at each end, a sill course under the glazing, and a back
      // wall so there is a shop behind the window rather than a hole.
      for (const dir of [-1, 1]) {
        const pier = new THREE.BoxGeometry(1.1, 6.4, 1.4);
        pier.translate(dir * (W / 2 - 0.55), 3.2, -0.2);
        con(pier);
      }
      // Two runs, not one: the sill used to cross the doorway as well, and
      // a half-metre kerb through the middle of a door is a thing a door
      // cannot swing over.
      const sillW = (W - 4.0) / 2;
      for (const dir of [-1, 1]) {
        const sill = new THREE.BoxGeometry(sillW, 0.5, 1.4);
        sill.translate(dir * (2.0 + sillW / 2), 0.25, -0.2);
        con(sill);
      }
      // The back wall stops at the doorway and picks up again on the far
      // side, with a header over it. It used to run straight across, which
      // was invisible while the door was a slab of concrete and is a
      // problem the moment somebody can walk through one: the room behind
      // it is the shop, and the shop has to be on the other side of the
      // opening rather than sealed off behind it.
      {
        const rearW = (W - 3.0) / 2;
        for (const dir of [-1, 1]) {
          const rear = new THREE.BoxGeometry(rearW, 6.4, 0.6);
          rear.translate(dir * (1.5 + rearW / 2), 3.2, -2.3);
          con(rear);
        }
        const rearTop = new THREE.BoxGeometry(3.0, 6.4 - 4.3, 0.6);
        rearTop.translate(0, (6.4 + 4.3) / 2, -2.3);
        con(rearTop);
      }

      // The reveal was a solid block of concrete 4m wide and 1.8m deep,
      // sitting exactly where the door goes — so every house had a grey
      // panel between its windows and no way in at all. Nobody noticed
      // while there was nothing to walk through. It is a frame now: two
      // jambs and a lintel around a real 3.0 × 4.3 hole, with the shop
      // showing at the back of it and, in section 18B, a pair of leaves.
      const doorW = 3.0, revW = doorW + 1.0, revH = 4.8, revD = 1.8;
      const jambW = (revW - doorW) / 2;
      for (const dir of [-1, 1]) {
        const jamb = new THREE.BoxGeometry(jambW, revH, revD);
        jamb.translate(dir * (doorW / 2 + jambW / 2), revH / 2, -revD / 2);
        con(jamb);
      }
      const lintel = new THREE.BoxGeometry(revW, revH - 4.3, revD);
      lintel.translate(0, (revH + 4.3) / 2, -revD / 2);
      con(lintel);

      // The lit panel that used to close the back of the doorway is now an
      // instance in section 18B, because exactly one of them has to be
      // removable and a merged one is not.

      const paneW = (W - 2.0 - doorW - 1.0) / 2;
      for (const dir of [-1, 1]) {
        const px = dir * (doorW / 2 + 0.5 + paneW / 2);

        const pane = new THREE.PlaneGeometry(paneW, 5.3);
        pane.translate(px, 3.05, 0.1);
        gls(pane);

        const inner = new THREE.PlaneGeometry(paneW, 5.3);
        inner.translate(px, 3.05, -1.2);
        room(inner);

        for (const t of [-0.5, 0, 0.5]) {
          const mull = new THREE.BoxGeometry(0.11, 5.3, 0.26);
          mull.translate(px + t * paneW, 3.05, 0.14);
          met(mull);
        }
      }

      // Head beam over the shopfront.
      const head = new THREE.BoxGeometry(W, 0.9, 0.8);
      head.translate(0, 5.95, 0.2);
      con(head);

      const kerb = new THREE.BoxGeometry(W, 0.22, 1.1);
      kerb.translate(0, 0.11, 1.4);
      kerbs.push(toW(kerb));
    }

    // ── the upper mass: one of ten ───────────────────────────────────────
    const uh = H - SHOP;                         // height available above
    const uy = SHOP + uh / 2;                    // its centre

    const back = (depth = 0.2, inset = 0) => {
      const w = new THREE.BoxGeometry(W - inset * 2, uh, depth);
      w.translate(0, uy, -depth / 2);
      return w;
    };
    const flanks = () => {                       // side walls, always present
      for (const px of [-W / 2 + 0.3, W / 2 - 0.3]) {
        const f = new THREE.BoxGeometry(0.6, uh, D);
        f.translate(px, uy, -D / 2);
        con(f);
      }
      const rear = new THREE.BoxGeometry(W, uh, 0.6);
      rear.translate(0, uy, -D + 0.3);
      con(rear);
      const roof = new THREE.BoxGeometry(W, 0.45, D);
      roof.translate(0, H - 0.22, -D / 2);
      con(roof);
    };
    const parapet = (c) => {
      const cap = new THREE.BoxGeometry(W + 0.5, 0.5, D + 0.4);
      cap.translate(0, H + 0.2, -D / 2);
      con(cap, c);
    };

    flanks();

    if (style === "fluted") {
      con(back(0.5));
      const n = 17, pitch = (W - 1.2) / (n - 1);
      for (let k = 0; k < n; k++) {
        const fin = new THREE.BoxGeometry(0.26, uh - 0.3, 0.62);
        fin.translate(-W / 2 + 0.6 + k * pitch, uy, 0.28);
        con(fin, grey.clone().offsetHSL(0, 0, 0.05));
      }
      const reveal = new THREE.BoxGeometry(W - 1.0, 0.3, 0.7);
      reveal.translate(0, SHOP + 0.2, 0.3);
      acc(reveal);
      parapet();

    } else if (style === "monolith") {
      // A frame of four slabs, so the opening is a real hole in the mass.
      const ow = W * 0.46, oh = uh * 0.46;
      const sidew = (W - ow) / 2;
      for (const dir of [-1, 1]) {
        const bl = new THREE.BoxGeometry(sidew, uh, 1.3);
        bl.translate(dir * (ow + sidew) / 2, uy, -0.65);
        con(bl);
      }
      const above = new THREE.BoxGeometry(ow, (uh - oh) / 2, 1.3);
      above.translate(0, uy + oh / 2 + (uh - oh) / 4, -0.65);
      con(above);
      const below = new THREE.BoxGeometry(ow, (uh - oh) / 2, 1.3);
      below.translate(0, uy - oh / 2 - (uh - oh) / 4, -0.65);
      con(below);

      const deep = new THREE.PlaneGeometry(ow, oh);
      deep.translate(0, uy, -1.25);
      gls(deep);
      const lit = new THREE.PlaneGeometry(ow, oh);
      lit.translate(0, uy, -1.45);
      room(lit);
      parapet();

    } else if (style === "stacked") {
      const tiers = 3, th = uh / tiers;
      for (let k = 0; k < tiers; k++) {
        const w = W - k * 1.4;
        // Each tier steps further out, but never past the sign board at the
        // front of the canopy. At 0.2 + k * 0.9 the top tier reached z 3.1
        // and simply buried the name of the shop underneath it.
        const out = 0.1 + k * 0.35;
        const box = new THREE.BoxGeometry(w, th - 0.18, 2.2 + out);
        box.translate((k % 2 ? 1 : -1) * 0.5, SHOP + th * (k + 0.5), out / 2);
        con(box);
        const lip = new THREE.BoxGeometry(w + 0.3, 0.22, 2.4 + out);
        lip.translate((k % 2 ? 1 : -1) * 0.5, SHOP + th * (k + 1) - 0.1, out / 2);
        acc(lip, k % 2 ? tone2 : tone);
        const strip = new THREE.PlaneGeometry(w - 1.6, th * 0.44);
        strip.translate((k % 2 ? 1 : -1) * 0.5, SHOP + th * (k + 0.45), out + 1.11);
        gls(strip);
      }

    } else if (style === "screen") {
      con(back(0.4));
      const wall = new THREE.PlaneGeometry(W - 1.4, uh - 0.6);
      wall.translate(0, uy, 0.02);
      acc(wall);
      const panel = new THREE.PlaneGeometry(W - 0.6, uh - 0.2);
      panel.translate(0, uy, 0.75);
      scr(panel, "weave");
      for (const px of [-W / 2 + 0.45, W / 2 - 0.45]) {   // the hangers
        const rail = new THREE.BoxGeometry(0.2, uh, 1.0);
        rail.translate(px, uy, 0.4);
        met(rail, 0x6d7073);
      }
      parapet();

    } else if (style === "folded") {
      const n = 10, pitch = W / n;
      for (let k = 0; k < n; k++) {
        const pl = new THREE.BoxGeometry(pitch * 1.12, uh, 0.34);
        pl.rotateY((k % 2 ? 1 : -1) * 0.38);
        pl.translate(-W / 2 + pitch * (k + 0.5), uy, 0.35);
        con(pl, grey.clone().offsetHSL(0, 0, k % 2 ? 0.055 : -0.035));
      }
      const sill = new THREE.BoxGeometry(W, 0.34, 0.9);
      sill.translate(0, SHOP + 0.17, 0.4);
      acc(sill);
      parapet();

    } else if (style === "curtain") {
      const bays = 3, bw = (W - 1.2) / bays;
      for (let k = 0; k < bays; k++) {
        const px = -W / 2 + 0.6 + bw * (k + 0.5);
        const pane = new THREE.PlaneGeometry(bw - 0.12, uh - 1.0);
        pane.translate(px, uy, 0.16);
        gls(pane);
        const lit = new THREE.PlaneGeometry(bw - 0.12, uh - 1.0);
        lit.translate(px, uy, -0.5);
        room(lit);
        const mull = new THREE.BoxGeometry(0.14, uh, 0.3);
        mull.translate(px + bw / 2, uy, 0.2);
        met(mull, 0x585b5e);
      }
      const floors = Math.max(2, Math.round(uh / 3.2));
      for (let k = 1; k < floors; k++) {
        const spandrel = new THREE.BoxGeometry(W - 1.0, 0.55, 0.42);
        spandrel.translate(0, SHOP + (uh / floors) * k, 0.24);
        acc(spandrel, k % 2 ? tone : tone2);
      }
      parapet();

    } else if (style === "louvre") {
      con(back(0.5));
      const blades = Math.max(4, Math.round(uh / 1.15));
      for (let k = 0; k < blades; k++) {
        const bl = new THREE.BoxGeometry(W - 0.8, 0.17, 1.25);
        bl.rotateX(-0.22);
        bl.translate(0, SHOP + 0.7 + k * ((uh - 1.0) / (blades - 1)), 0.62);
        con(bl, grey.clone().offsetHSL(0, 0, 0.06));
      }
      for (const px of [-W / 2 + 0.5, W / 2 - 0.5]) {
        const post = new THREE.BoxGeometry(0.3, uh, 1.5);
        post.translate(px, uy, 0.6);
        acc(post);
      }
      parapet();

    } else if (style === "arcade") {
      // A real wall with arched holes cut out of it, extruded.
      const sh = new THREE.Shape();
      sh.moveTo(-W / 2, 0); sh.lineTo(W / 2, 0);
      sh.lineTo(W / 2, uh); sh.lineTo(-W / 2, uh); sh.closePath();

      const n = 4, pitch = W / n, r = pitch * 0.33, springs = uh * 0.46;
      for (let k = 0; k < n; k++) {
        const cx = -W / 2 + pitch * (k + 0.5);
        const hole = new THREE.Path();
        hole.moveTo(cx - r, uh * 0.14);
        hole.lineTo(cx - r, springs);
        hole.absarc(cx, springs, r, Math.PI, 0, true);
        hole.lineTo(cx + r, uh * 0.14);
        hole.closePath();
        sh.holes.push(hole);

        // Glazed right up into the head of the arch, not just to the
        // springline.
        const top = springs + r, bot = uh * 0.14;
        const pane = new THREE.PlaneGeometry(r * 2, top - bot);
        pane.translate(cx, SHOP + (bot + top) / 2, -0.35);
        gls(pane);
      }
      const wall = new THREE.ExtrudeGeometry(sh, { depth: 0.8, bevelEnabled: false });
      wall.translate(0, SHOP, -0.4);
      con(wall);

      const band = new THREE.BoxGeometry(W, 0.4, 1.0);
      band.translate(0, SHOP + uh - 0.2, 0.2);
      acc(band);
      parapet();

    } else if (style === "portal") {
      const t = 1.15;                            // how heavy the frame is
      for (const dir of [-1, 1]) {
        const leg = new THREE.BoxGeometry(t, uh, 1.6);
        leg.translate(dir * (W / 2 - t / 2), uy, 0.3);
        acc(leg);
      }
      const lintel = new THREE.BoxGeometry(W, t, 1.6);
      lintel.translate(0, SHOP + uh - t / 2, 0.3);
      acc(lintel);
      const sill = new THREE.BoxGeometry(W, t * 0.7, 1.6);
      sill.translate(0, SHOP + t * 0.35, 0.3);
      acc(sill);

      const inner = new THREE.PlaneGeometry(W - t * 2.4, uh - t * 2.1);
      inner.translate(0, uy, -0.55);
      gls(inner);
      const lit = new THREE.PlaneGeometry(W - t * 2.4, uh - t * 2.1);
      lit.translate(0, uy, -0.95);
      room(lit);

    } else {   // baguette
      con(back(0.6));
      const dark = new THREE.PlaneGeometry(W - 1.2, uh - 0.4);
      dark.translate(0, uy, 0.02);
      room(dark);
      const n = 26, pitch = (W - 1.0) / (n - 1);
      for (let k = 0; k < n; k++) {
        const rod = new THREE.CylinderGeometry(0.11, 0.11, uh - 0.4, 6);
        rod.translate(-W / 2 + 0.5 + k * pitch, uy, 0.5);
        acc(rod, k % 3 === 0 ? tone2 : tone);
      }
      const rail = new THREE.BoxGeometry(W, 0.24, 0.9);
      rail.translate(0, SHOP + 0.2, 0.45);
      met(rail, 0x55585b);
      parapet();
    }

    // ── canopy and sign, common again ────────────────────────────────────
    //
    // The sign used to sit at z 0.55, flat on the facade at first-floor
    // height — which put it *behind* whatever the house's architecture did
    // above the shopfront. Anything that projected covered it, and the
    // stacked tiers covered it completely: Bape's name was built, textured
    // and permanently hidden behind its own building.
    //
    // It is a fascia sign now, on the front edge of the canopy, ahead of
    // every style's reach. That is also simply where shop signs go.
    const canopy = new THREE.BoxGeometry(W - 1.2, 0.28, 2.4);
    canopy.translate(0, 5.25, 1.1);
    acc(canopy, tone);

    const board = new THREE.BoxGeometry(W - 1.2, 2.3, 0.26);
    board.translate(0, 6.4, 2.22);
    acc(board, tone2);

    for (const dir of [-1, 1]) {                 // brackets back to the wall
      const stay = new THREE.BoxGeometry(0.16, 0.16, 2.3);
      stay.translate(dir * (W / 2 - 1.4), 6.9, 1.1);
      met(stay, 0x55585b);
    }

    const signCanvas = texSign(brand);
    const signTex = asTexture(signCanvas);
    dressSign(signCanvas, signTex, brand);
    const sign = new THREE.Mesh(
      // 4:1, to match the sign texture exactly.
      new THREE.PlaneGeometry(8.0, 2.0),
      // Matte. At roughness 0.5 with the sky in the environment map these
      // caught a broad specular sheen straight off it and read as polished
      // mirrors with a brand printed on them rather than as painted boards.
      new THREE.MeshStandardMaterial({
        map: signTex,
        roughness: 0.92,
        metalness: 0,
        envMapIntensity: 0.12,
        // Lit from within after dark; the clock sets how much.
        emissiveMap: signTex,
        emissive: 0xffffff,
        emissiveIntensity: 0,
      })
    );
    signMats.push(sign.material);
    sign.position.set(0, 6.4, 2.37);
    sign.castShadow = true;
    sign.userData.brand = brand;
    g.add(sign);

    monoliths.push({ brand, group: g, face: sign, z, x, height: H });
  });

  // ── filler blocks, so the street has two solid walls ──────────────────
  //
  // The terraces interleave, which means each one starts and stops half a
  // unit's pitch away from the other. On the ground that showed as a hole:
  // walking in from the plaza, the left side had Bape and the right side had
  // nothing at all for seven metres — you could see straight out of the
  // street at the very moment you entered it. The far end had the same
  // problem in reverse, plus a long run of open ground before the terminus.
  //
  // These are anonymous: concrete, glazed, no canopy, no sign, and
  // deliberately not added to `monoliths`, so they are neither waypoints nor
  // anything the card can land on.
  {
    const rf = rng(19770);
    const FILL = [
      [-30.4,  1],    // head of the right terrace, the hole you walk into
      [-26.0, -1],    // and the left mouth, which the terrace starts 6m short of
      [-152.0, 1],    // and its tail
      [-167.2, 1],
      [-159.6, -1],   // tail of the left terrace
      [-174.8, -1],   // and on to the terminus, which it laps into harmlessly
    ];

    for (const [fz, fside] of FILL) {
      const fg = new THREE.Group();
      fg.position.set(fside * STREET.half, 0, fz);
      fg.rotation.y = fside === -1 ? Math.PI / 2 : -Math.PI / 2;
      fg.updateMatrixWorld(true);
      scene.add(fg);

      const W = STREET.width, D = STREET.depth;
      const H = 9.0 + rf() * 3.4;
      const grey = BASE_GREY.clone().offsetHSL(0, 0, (rf() - 0.5) * 0.05);

      const toF = (geo) => {
        geo.applyMatrix4(fg.matrixWorld);
        if (!geo.index) {
          const n = geo.attributes.position.count;
          const arr = n > 65535 ? new Uint32Array(n) : new Uint16Array(n);
          for (let k = 0; k < n; k++) arr[k] = k;
          geo.setIndex(new THREE.BufferAttribute(arr, 1));
        }
        return geo;
      };
      const cf = (geo, c) => concrete.push(paint(toF(geo), c || grey));

      const body = new THREE.BoxGeometry(W, H, D);
      body.translate(0, H / 2, -D / 2);
      cf(body);

      const cap = new THREE.BoxGeometry(W + 0.5, 0.5, D + 0.4);
      cap.translate(0, H + 0.2, -D / 2);
      cf(cap);

      // A plain run of glazing, so it is a building rather than a wall.
      const bays = 4, bw = (W - 1.6) / bays;
      for (let k = 0; k < bays; k++) {
        const px = -W / 2 + 0.8 + bw * (k + 0.5);
        const pane = new THREE.PlaneGeometry(bw - 0.35, 4.6);
        pane.translate(px, 2.9, 0.1);
        glass.push(toF(pane));
        const lit = new THREE.PlaneGeometry(bw - 0.35, 4.6);
        lit.translate(px, 2.9, -1.0);
        interiors.push(toF(lit));
        const mull = new THREE.BoxGeometry(0.12, 4.6, 0.24);
        mull.translate(px + bw / 2, 2.9, 0.15);
        metal.push(paint(toF(mull), 0x4a4d50));
      }

      // Upper floors get punched windows, on a plain grid.
      const rows = Math.max(1, Math.floor((H - 7.0) / 2.6));
      for (let r0 = 0; r0 < rows; r0++) {
        for (let k = 0; k < 4; k++) {
          const px = -W / 2 + 1.9 + k * ((W - 3.8) / 3);
          const win = new THREE.PlaneGeometry(1.9, 1.5);
          win.translate(px, 7.4 + r0 * 2.6, 0.08);
          glass.push(toF(win));
        }
      }

      const kerb = new THREE.BoxGeometry(W, 0.22, 1.1);
      kerb.translate(0, 0.11, 1.4);
      kerbs.push(toF(kerb));
    }
  }

  // ── the courtyard wall ────────────────────────────────────────────────
