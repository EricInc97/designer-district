// ## 13  WATER — reflecting pool
// Not a mirror pass: the surface reflects the sky *function*, evaluated on the
// reflected view vector. That costs one extra sky evaluation per pixel and
// stays exactly in step with the real sky, including its clouds and its sun.

const waterUniforms = {
  uTime:     { value: 0 },
  uSun:      { value: C.sun.clone() },
  uZenith:   { value: C.zenith.clone() },
  uHorizon:  { value: C.horizon.clone() },
  uUnder:    { value: C.underside.clone() },
  uDeep:     { value: C.poolDeep.clone() },
  uShallow:  { value: C.poolShallow.clone() },
  uCam:      { value: new THREE.Vector3() },
  uFogColor: { value: C.fog.clone() },
  uFogDensity: { value: C.fogDensity },
};

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(POOL.w, POOL.d, 1, 1),
  new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    transparent: false,
    vertexShader: /* glsl */`
      varying vec3 vWorld;
      void main(){
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorld = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec3 vWorld;
      uniform float uTime, uFogDensity;
      uniform vec3 uSun, uZenith, uHorizon, uUnder, uDeep, uShallow, uCam, uFogColor;
      ${SKY_GLSL}

      // Two crossing wave trains plus a fine chop, sampled as a height field.
      float waves(vec2 p){
        float h = 0.0;
        h += sin(p.x * 0.85 + uTime * 0.85) * 0.055;
        h += sin(p.y * 0.62 - uTime * 0.67) * 0.045;
        h += sin((p.x + p.y) * 1.45 + uTime * 1.5) * 0.022;
        h += fbm(vec3(p * 1.25, uTime * 0.16)) * 0.075;
        return h;
      }
      vec3 waterNormal(vec2 p){
        float e = 0.16;
        float h  = waves(p);
        float hx = waves(p + vec2(e, 0.0));
        float hz = waves(p + vec2(0.0, e));
        return normalize(vec3(-(hx - h) / e, 1.0, -(hz - h) / e));
      }

      void main(){
        vec3 n = waterNormal(vWorld.xz);
        vec3 V = normalize(uCam - vWorld);

        float fres = pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.4);
        fres = clamp(fres * 0.92 + 0.06, 0.0, 1.0);

        vec3 R = reflect(-V, n);
        R.y = abs(R.y);                       // never sample below the horizon
        vec3 refl = skyColor(R, uSun, uZenith, uHorizon, uUnder, uTime);

        // Body colour deepens away from the lip.
        float edge = smoothstep(0.0, 9.0, min(
          min(${(POOL.w / 2).toFixed(2)} - abs(vWorld.x), ${(POOL.d / 2).toFixed(2)} - abs(vWorld.z)), 9.0));
        vec3 body = mix(uShallow, uDeep, edge);

        vec3 col = mix(body, refl, fres);

        // Sun glitter.
        vec3 H = normalize(uSun + V);
        col += vec3(1.0, 0.96, 0.88) * pow(max(dot(n, H), 0.0), 420.0) * 2.6;

        // Caustic shimmer read back off the wave field.
        float caus = pow(max(waves(vWorld.xz * 1.9) * 6.0 + 0.5, 0.0), 3.0);
        col += vec3(0.55, 0.92, 0.95) * caus * 0.05;

        // Match the scene's exponential-squared fog by hand.
        float dist = length(uCam - vWorld);
        float f = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
        col = mix(col, uFogColor, clamp(f, 0.0, 1.0));

        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  })
);
water.rotation.x = -Math.PI / 2;
water.position.y = POOL.y;
scene.add(water);

// ## 14  DOME — the Fly's Eye
// A squashed sphere with circular openings punched through it. The holes are
// distributed by the Fibonacci lattice, which is what gives the real dome its
// even-but-not-gridded look, and each one is cut out of the shell with an
// alpha map, ringed with a torus lip and filled with a pane of tinted glass.

const domeGroup = new THREE.Group();
scene.add(domeGroup);

/** Fibonacci points on the unit sphere, in the same frame SphereGeometry uses. */
function holeDirections(count, cutTheta) {
  const golden = Math.PI * (3 - Math.sqrt(5));
  const out = [];
  for (let i = 0; i < count * 2; i++) {
    const y = 1 - (i / (count * 2 - 1)) * 2;
    const theta = Math.acos(clamp(y, -1, 1));
    // Keep a whole rim's worth of shell between the last opening and the cut,
    // or the bottom row breaks open into the plinth.
    if (theta > cutTheta - HOLE_ANGLE * 1.25) continue;
    const phi = i * golden;
    const r = Math.sin(theta);
    out.push(new THREE.Vector3(-Math.cos(phi) * r, Math.cos(theta), Math.sin(phi) * r));
  }
  return out;
}

const CUT = C.domeCut * Math.PI;
const HOLE_ANGLE = C.holeAngle;
const HOLES = holeDirections(C.domeHoles, CUT);

/**
 * The shell's alpha map, in the equirectangular frame SphereGeometry unwraps
 * to. Rasterised per hole inside its own bounding box rather than per pixel
 * against every hole — the whole-image version is 40× the work for the same
 * picture.
 */
function texDomeAlpha() {
  const W = Math.round(1600 * QUALITY.texScale), H = Math.round(800 * QUALITY.texScale);
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const img = ctx.getImageData(0, 0, W, H), d = img.data;

  const cosHole = Math.cos(HOLE_ANGLE);
  const cosSoft = Math.cos(HOLE_ANGLE * 1.06);   // one-pixel feather

  for (const dir of HOLES) {
    const thetaC = Math.acos(clamp(dir.y, -1, 1));
    // Bounding box in the texture. Azimuth widens as you approach the pole.
    const dTheta = HOLE_ANGLE * 1.15;
    const sinT = Math.max(Math.sin(thetaC), 1e-3);
    const dPhi = Math.min(Math.PI, (HOLE_ANGLE * 1.15) / sinT);

    const y0 = Math.max(0, Math.floor(((thetaC - dTheta) / CUT) * H));
    const y1 = Math.min(H - 1, Math.ceil(((thetaC + dTheta) / CUT) * H));
    let phiC = Math.atan2(dir.z, -dir.x);
    if (phiC < 0) phiC += Math.PI * 2;

    for (let y = y0; y <= y1; y++) {
      const theta = (y / H) * CUT;
      const st = Math.sin(theta), ct = Math.cos(theta);
      const xSpan = Math.ceil((dPhi / (Math.PI * 2)) * W);
      const xC = Math.round((phiC / (Math.PI * 2)) * W);

      for (let k = -xSpan; k <= xSpan; k++) {
        const xw = ((xC + k) % W + W) % W;            // wrap in azimuth
        const phi = (xw / W) * Math.PI * 2;
        const dot = (-Math.cos(phi) * st) * dir.x + ct * dir.y + (Math.sin(phi) * st) * dir.z;
        if (dot <= cosSoft) continue;
        const a = dot >= cosHole ? 0 : 1 - (dot - cosSoft) / (cosHole - cosSoft);
        const i = (y * W + xw) * 4;
        const v = Math.round(a * 255);
        if (v < d[i]) { d[i] = d[i + 1] = d[i + 2] = v; }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

{
  const shellGeo = new THREE.SphereGeometry(C.domeRadius, 200, 140, 0, Math.PI * 2, 0, CUT);
  const shell = new THREE.Mesh(
    shellGeo,
    new THREE.MeshPhysicalMaterial({
      color: 0xf4f7f6,
      roughness: 0.22,
      metalness: 0.0,
      clearcoat: 1.0,
      clearcoatRoughness: 0.12,
      iridescence: 0.85,
      iridescenceIOR: 1.32,
      iridescenceThicknessRange: [120, 760],
      alphaMap: texDomeAlpha(),
      transparent: true,
      alphaTest: 0.45,
      side: THREE.DoubleSide,
      envMapIntensity: 1.15,
    })
  );
  shell.castShadow = true;
  shell.receiveShadow = true;
  domeGroup.add(shell);

  // Rims and panes, merged into one mesh each.
  const rimGeos = [], paneGeos = [];
  const up = new THREE.Vector3(0, 0, 1);
  const q = new THREE.Quaternion();
  const m = new THREE.Matrix4();

  for (const dir of HOLES) {
    const ringR = C.domeRadius * Math.sin(HOLE_ANGLE);
    const depth = C.domeRadius * Math.cos(HOLE_ANGLE);
    q.setFromUnitVectors(up, dir);

    const rim = new THREE.TorusGeometry(ringR, C.rimTube, 8, QUALITY.holeSeg);
    m.compose(dir.clone().multiplyScalar(depth), q, new THREE.Vector3(1, 1, 1));
    rim.applyMatrix4(m);
    rimGeos.push(rim);

    const pane = new THREE.CircleGeometry(ringR * 0.985, QUALITY.holeSeg);
    m.compose(dir.clone().multiplyScalar(depth * 0.995), q, new THREE.Vector3(1, 1, 1));
    pane.applyMatrix4(m);
    paneGeos.push(pane);
  }

  const rims = new THREE.Mesh(
    mergeGeometries(rimGeos),
    new THREE.MeshPhysicalMaterial({
      color: 0xfdfefe, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 1.1,
    })
  );
  rims.castShadow = true;
  domeGroup.add(rims);

  const panes = new THREE.Mesh(
    mergeGeometries(paneGeos),
    new THREE.MeshPhysicalMaterial({
      color: 0xa9dfe6,
      roughness: 0.04,
      metalness: 0,
      transmission: 0.95,
      thickness: 0.35,
      ior: 1.42,
      iridescence: 0.7,
      iridescenceIOR: 1.25,
      transparent: true,
      opacity: 0.6,
      side: THREE.DoubleSide,
      envMapIntensity: 1.4,
    })
  );
  domeGroup.add(panes);

  domeGroup.scale.set(1, C.domeSquash, 1);
  domeGroup.position.y = C.domeCenterY;

  // The plinth it stands on, rising out of the water.
  const plinth = new THREE.Mesh(
    new THREE.CylinderGeometry(C.domeRadius * Math.sin(CUT) * 1.06, C.domeRadius * Math.sin(CUT) * 1.14, C.plinthTop - POOL.y + 0.55, 64),
    new THREE.MeshStandardMaterial({ color: 0xf1ece0, roughness: 0.75 })
  );
  plinth.position.y = (C.plinthTop + POOL.y - 0.55) / 2;
  plinth.castShadow = true; plinth.receiveShadow = true;
  scene.add(plinth);
}

// ## 15  PALMS — trunks, fronds, wind
// Every palm in the scene ends up in exactly two draw calls: one merged trunk
// mesh and one merged frond mesh, both already in world space. The sway that
// would normally come from moving objects around is baked into the vertex
// shader instead, driven by two attributes stamped on at build time —
// `aSway`, how freely this vertex moves, and `aPhase`, which palm it belongs
// to, so no two trees breathe together.

const windUniforms = {
  uTime: { value: 0 },
  uWind: { value: QUALITY.still ? 0 : 1 },
};

const WIND_PARS = /* glsl */`
  uniform float uTime;
  uniform float uWind;
  attribute float aSway;
  attribute float aPhase;
`;

// Applied to `transformed`, which for these meshes is already world space.
const WIND_BODY = /* glsl */`
  float _sw = aSway;
  float _ph = aPhase;
  float _g = sin(uTime * 0.85 + _ph) * 0.62
           + sin(uTime * 1.73 + _ph * 1.7) * 0.26
           + sin(uTime * 3.10 + _ph * 2.3) * 0.11;
  float _amp = _sw * _sw * uWind;
  transformed.x += _g * _amp * 0.95;
  transformed.z += cos(uTime * 0.74 + _ph * 1.31) * _amp * 0.62;
  transformed.y -= abs(_g) * _amp * 0.30;
`;

function applyWind(material) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = windUniforms.uTime;
    shader.uniforms.uWind = windUniforms.uWind;
    shader.vertexShader = shader.vertexShader
      .replace("#include <common>", `#include <common>\n${WIND_PARS}`)
      .replace("#include <begin_vertex>", `#include <begin_vertex>\n${WIND_BODY}`);
  };
  material.customProgramCacheKey = () => "wind";
  return material;
}

/** A tapered tube swept along a curve — the trunk. */
function trunkGeometry(curve, segs, radial, r0, r1) {
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], nor = [], uv = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const p = curve.getPointAt(t);
    const N = frames.normals[i], B = frames.binormals[i];
    // Palms bulge slightly at the foot and again under the crown.
    const r = lerp(r0, r1, t) * (1 + 0.20 * Math.exp(-t * 9) + 0.06 * Math.exp(-Math.pow(t - 0.92, 2) * 120));
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const nx = Math.cos(a), ny = Math.sin(a);
      const n = new THREE.Vector3().addScaledVector(N, nx).addScaledVector(B, ny);
      pos.push(p.x + n.x * r, p.y + n.y * r, p.z + n.z * r);
      nor.push(n.x, n.y, n.z);
      uv.push(j / radial, t * 1.35);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

/**
 * One frond: a three-column strip following an arc that rises then droops,
 * folded down the middle like the real thing so it catches light on one half
 * and shades the other.
 */
function frondGeometry(len, halfWidth, segs) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const x = len * t;
    const y = len * (0.48 * t - 0.92 * t * t);        // up, then over, then down
    const w = halfWidth * Math.sin(Math.pow(t, 0.6) * Math.PI) * (1 - 0.3 * t) + 0.02;
    const fold = w * 0.34;                            // the V of the rachis
    pos.push(x, y - fold, -w); uv.push(t, 0);
    pos.push(x, y,         0); uv.push(t, 0.5);
    pos.push(x, y - fold,  w); uv.push(t, 1);
  }
  for (let i = 0; i < segs; i++) {
    for (let c = 0; c < 2; c++) {
      const a = i * 3 + c, b = a + 3;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** Stamps a constant attribute across a geometry so it survives the merge. */
function stamp(geo, name, value) {
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n);
  arr.fill(value);
  geo.setAttribute(name, new THREE.BufferAttribute(arr, 1));
  return geo;
}
/** Per-vertex sway, from a function of the vertex's own height. */
function stampSway(geo, fn) {
  const p = geo.attributes.position;
  const arr = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) arr[i] = fn(p.getX(i), p.getY(i), p.getZ(i));
  geo.setAttribute("aSway", new THREE.BufferAttribute(arr, 1));
  return geo;
}

const crowns = [];   // world positions of every crown, for the leaf spawner
{
  const rand = rng(20260919);
  const trunkGeos = [], frondGeos = [];

  function addPalm(x, z, scale, phase) {
    const h = (7.6 + rand() * 3.4) * scale;
    const leanX = (rand() - 0.5) * 2.4 * scale;
    const leanZ = (rand() - 0.5) * 2.4 * scale;

    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(leanX * 0.18, h * 0.3, leanZ * 0.18),
      new THREE.Vector3(leanX * 0.6, h * 0.65, leanZ * 0.6),
      new THREE.Vector3(leanX, h, leanZ),
    ]);

    const tg = trunkGeometry(curve, 26, 9, 0.30 * scale, 0.20 * scale);
    stampSway(tg, (vx, vy) => Math.pow(clamp(vy / h, 0, 1), 1.7) * 0.42);
    stamp(tg, "aPhase", phase);
    tg.translate(x, 0, z);
    trunkGeos.push(tg);

    const top = curve.getPointAt(1);
    const crownWorld = new THREE.Vector3(x + top.x, top.y, z + top.z);
    crowns.push(crownWorld);

    const n = QUALITY.frondsPer + Math.floor(rand() * 3);
    for (let i = 0; i < n; i++) {
      const az = (i / n) * Math.PI * 2 + rand() * 0.42;
      const pitch = -0.30 + rand() * 0.55;                  // some reach up, some hang
      const len = (5.4 + rand() * 2.4) * scale;
      const fg = frondGeometry(len, 0.95 * scale, 12);

      // Sway is the trunk's contribution at the top plus the frond's own whip.
      stampSway(fg, (vx) => 0.42 + Math.pow(clamp(vx / len, 0, 1), 1.7) * 0.95);
      stamp(fg, "aPhase", phase + i * 0.29);

      const m = new THREE.Matrix4()
        .makeTranslation(crownWorld.x, crownWorld.y, crownWorld.z)
        .multiply(new THREE.Matrix4().makeRotationY(az))
        .multiply(new THREE.Matrix4().makeRotationZ(pitch))
        .multiply(new THREE.Matrix4().makeRotationX(rand() * 0.5 - 0.25));
      fg.applyMatrix4(m);
      frondGeos.push(fg);
    }
  }

  /**
   * Plants a palm, unless a building is already standing there.
   *
   * The ring was laid out on a radius with no idea the plaza had been built
   * up around it, so trunks came up through shopfront glazing and fronds hung
   * inside first floors. Each candidate is nudged outward a few times before
   * being abandoned, which keeps the ring looking like a ring rather than
   * leaving gaps wherever a building happens to be.
   */
  function plant(x, z, scale, phase) {
    // The trunk is not what collides. A frond runs about 7.8 units at full
    // scale and radiates in every direction, so a palm whose base clears a
    // wall by a metre still has half its crown inside the first floor —
    // which is exactly what was happening along the kerb. Test the crown's
    // reach, not the trunk.
    const reach = 7.8 * scale;
    for (const [dx, dz] of [[0, 0], [reach, 0], [-reach, 0], [0, reach], [0, -reach]]) {
      if (inBuilt(x + dx, z + dz)) return false;
    }
    addPalm(x, z, scale, phase);
    return true;
  }

  // A ring around the plaza, then two files down the promenade.
  const ring = QUALITY.palmsRing;
  for (let i = 0; i < ring; i++) {
    const a = (i / ring) * Math.PI * 2 + 0.3;
    for (let attempt = 0; attempt < 4; attempt++) {
      const r = 21 + attempt * 2.6 + rand() * 4;
      if (plant(Math.cos(a) * r, Math.sin(a) * r * 0.8, 0.9 + rand() * 0.35, rand() * 9)) break;
    }
  }
  // Down the alley, just inside the kerb on both sides. They used to stand
  // at ±15, which is now inside the buildings.
  // Down the middle of the paseo rather than tight to the kerb, and smaller.
  // At the kerb there is no scale at which a palm both looks like a palm and
  // keeps its fronds out of the shopfront: the alley is only 22 wide and a
  // full-size crown is 15 across.
  for (let i = 0; i < QUALITY.palmsRow * 2; i++) {
    const z = -40 - i * 7.6 - rand() * 2.2;
    const sideX = (i % 2 === 0 ? -1 : 1) * (STREET.half * 0.42);
    plant(sideX, z, 0.58 + rand() * 0.14, rand() * 9);
  }

  const barkTex = asTexture(texBark(), { repeat: [1, 1] });
  const trunkMat = applyWind(new THREE.MeshStandardMaterial({
    map: barkTex, bumpMap: barkTex, bumpScale: 0.08, roughness: 0.94, metalness: 0,
  }));
  const trunks = new THREE.Mesh(mergeGeometries(trunkGeos), trunkMat);
  trunks.castShadow = true; trunks.receiveShadow = true;
  scene.add(trunks);

  const frondTex = asTexture(texFrond());
  // No alphaMap. Three reads alphaMap's GREEN channel, not a canvas's alpha
  // channel, so pairing it with this texture multiplied the cut-out by how
  // green each pixel happened to be — every leaflet except the brightest
  // slivers fell under alphaTest and vanished. `map` on an RGBA canvas already
  // carries the silhouette in its own alpha, which is what alphaTest wants.
  const frondMat = applyWind(new THREE.MeshStandardMaterial({
    map: frondTex,
    alphaTest: 0.35,
    transparent: false,
    side: THREE.DoubleSide,
    roughness: 0.72,
    metalness: 0,
    color: 0xffffff,
  }));
  const fronds = new THREE.Mesh(mergeGeometries(frondGeos), frondMat);
  fronds.castShadow = true;
  fronds.receiveShadow = true;
  scene.add(fronds);

  // Shadows are rendered with a different material, so the sway has to be
  // injected there too — otherwise the dappling on the plaza stays perfectly
  // still while the fronds above it move, which reads as badly as it sounds.
  const depthMat = new THREE.MeshDepthMaterial({
    depthPacking: THREE.RGBADepthPacking,
    map: frondTex,
    alphaTest: 0.35,
  });
  applyWind(depthMat);
  fronds.customDepthMaterial = depthMat;

  const trunkDepth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
  applyWind(trunkDepth);
  trunks.customDepthMaterial = trunkDepth;
}

// ## 16  LEAVES — falling leaflets
// One InstancedMesh. Each leaflet keeps its own fall speed, drift and tumble,
// spawns at a crown and is recycled back to one when it lands.

const leaves = (() => {
  if (QUALITY.still) return null;
  const N = QUALITY.leaves;
  const geo = new THREE.PlaneGeometry(0.42, 0.14);
  const mat = new THREE.MeshStandardMaterial({
    map: asTexture(texLeaf()),
    alphaTest: 0.4,
    side: THREE.DoubleSide,
    roughness: 0.8,
    metalness: 0,
  });
  const mesh = new THREE.InstancedMesh(geo, mat, N);
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const rand = rng(77123);
  const state = [];
  for (let i = 0; i < N; i++) {
    state.push({
      p: new THREE.Vector3(),
      fall: 0.55 + rand() * 0.65,
      drift: new THREE.Vector2((rand() - 0.5) * 0.9, (rand() - 0.5) * 0.9),
      swing: 1.1 + rand() * 2.4,
      phase: rand() * Math.PI * 2,
      spin: new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(),
      spinRate: (rand() - 0.5) * 2.6,
      angle: rand() * Math.PI * 2,
      scale: 0.7 + rand() * 0.8,
    });
  }

  function respawn(s, firstRun) {
    const c = crowns[Math.floor(rand() * crowns.length)] || new THREE.Vector3(0, 12, 0);
    s.p.set(
      c.x + (rand() - 0.5) * 6,
      firstRun ? rand() * c.y : c.y - rand() * 1.4,
      c.z + (rand() - 0.5) * 6
    );
    s.phase = rand() * Math.PI * 2;
  }
  state.forEach((s) => respawn(s, true));

  const dummy = new THREE.Object3D();
  const q = new THREE.Quaternion();

  return {
    mesh,
    update(dt, t) {
      for (let i = 0; i < N; i++) {
        const s = state[i];
        s.p.y -= s.fall * dt;
        s.p.x += (s.drift.x + Math.sin(t * s.swing + s.phase) * 0.55) * dt;
        s.p.z += (s.drift.y + Math.cos(t * s.swing * 0.8 + s.phase) * 0.45) * dt;
        s.angle += s.spinRate * dt;
        if (s.p.y < C.plazaY + 0.05) respawn(s, false);

        dummy.position.copy(s.p);
        q.setFromAxisAngle(s.spin, s.angle);
        dummy.quaternion.copy(q);
        dummy.scale.setScalar(s.scale);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
    },
  };
})();

// ## 17  MOTES — airborne dust in the sun
// Cheap atmosphere: additive points drifting upward through the shaft of light
// the sun is coming down. They sell the heat more than anything else here.

const motes = (() => {
  const N = QUALITY.motes;
  const pos = new Float32Array(N * 3);
  const seed = new Float32Array(N);
  const rand = rng(4242);
  for (let i = 0; i < N; i++) {
    pos[i * 3]     = (rand() - 0.5) * 120;
    pos[i * 3 + 1] = rand() * 26;
    pos[i * 3 + 2] = (rand() - 0.5) * 230 - 60;
    seed[i] = rand() * 100;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));

  const m = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 },
      uMap: { value: asTexture(texGlow(), { srgb: false }) },
      uSize: { value: QUALITY.light ? 34 : 46 },
    },
    vertexShader: /* glsl */`
      attribute float aSeed;
      uniform float uTime, uSize;
      varying float vA;
      void main(){
        vec3 p = position;
        p.y = mod(p.y + uTime * (0.18 + fract(aSeed) * 0.3), 26.0);
        p.x += sin(uTime * 0.4 + aSeed) * 1.6;
        p.z += cos(uTime * 0.33 + aSeed * 1.7) * 1.6;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uSize / max(-mv.z, 1.0);
        // Fade in at the bottom, out at the top, and with distance.
        vA = smoothstep(0.0, 4.0, p.y) * (1.0 - smoothstep(16.0, 26.0, p.y))
           * (1.0 - smoothstep(40.0, 150.0, -mv.z));
      }`,
    fragmentShader: /* glsl */`
      uniform sampler2D uMap;
      varying float vA;
      void main(){
        float a = texture2D(uMap, gl_PointCoord).r * vA * 0.5;
        if (a < 0.005) discard;
        gl_FragColor = vec4(vec3(1.0, 0.96, 0.86), a);
      }`,
  });

  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  return m;
})();

// ## 18  JOURNEY — a street of storefronts
// The houses used to be free-standing slabs on an empty plaza, which read as
// objects scattered on a plain rather than anywhere you could be. They are
// buildings now: two facing terraces with a walkable alley between them, each
// unit a shell with a glazed shopfront, a lit interior behind the glass, a
// recessed doorway, a canopy in the house's colour and a sign over it.
//
// Buildings alternate sides and step down the street at half a unit's width
// each, so the two terraces interleave and neither side has a gap opposite a
// gap. Index order therefore runs straight down the street, which is what the
// card's picker relies on.
//
// Every house is a different piece of architecture — see STYLE up in the
// config for which, and why the order is arranged the way it is.
//
// Draw calls are kept down by merging on material rather than on building:
// every concrete wall on the street is one mesh, every brand-coloured
// element another, then glass, metalwork, lit interiors and each perforated
// screen pattern. Only the signs stay separate, because each is its own
// texture.

const monoliths = [];   // kept under the old name: sections 19 and 21 read it

{
  const concrete = [], accent = [], glass = [], metal = [], interiors = [], kerbs = [];
  const screenBins = { dots: [], weave: [], fins: [] };

  /** Tags a geometry with a flat colour so it can be merged and still differ. */
  function paint(geo, hex) {
    const c = hex.isColor ? hex : new THREE.Color(hex);
    const n = geo.attributes.position.count;
    const arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
    geo.setAttribute("color", new THREE.BufferAttribute(arr, 3));
    return geo;
  }

  const BASE_GREY = new THREE.Color(0xbdbbb4);
  const rand = rng(90210);

  BRANDS.forEach((brand, i) => {
    const z = STREET.from + i * STREET.step;
    const side = i % 2 === 0 ? -1 : 1;          // -1 = left terrace
    const x = side * STREET.half;

    // Local space: +Z faces the street, X runs along it, Y is up.
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.rotation.y = side === -1 ? Math.PI / 2 : -Math.PI / 2;
    g.updateMatrixWorld(true);
    scene.add(g);

    const style = STYLE[brand.slug] || "fluted";
    const H = STYLE_H[style] + rand() * 1.8;
    const W = STREET.width;
    const D = STREET.depth;
    const SHOP = 6.4;                            // top of the ground floor

    // Concrete drifts pour to pour, and picks up the faintest cast of the
    // house — a few per cent, no more. The brand belongs on the metalwork and
    // the glass, not soaked through the structure.
    const grey = BASE_GREY.clone()
      .lerp(new THREE.Color(brand.bg[0]), 0.09)
      .offsetHSL(0, 0, (rand() - 0.5) * 0.045);
    const tone = brand.bg[0];
    const tone2 = brand.bg[1];

    /**
     * Into world space, and indexed on the way.
     *
     * mergeGeometries refuses a batch where some geometries carry an index
     * and others do not, and ExtrudeGeometry — which is how the arcade's
     * arched openings are cut — is the one primitive here that comes back
     * non-indexed. One arcade was enough to fail the merge for every
     * concrete wall on the street and take the whole scene down with it.
     * A trivial 0..n-1 index costs nothing and makes it mergeable.
     */
    const toW = (geo) => {
      geo.applyMatrix4(g.matrixWorld);
      if (!geo.index) {
        const n = geo.attributes.position.count;
        const arr = n > 65535 ? new Uint32Array(n) : new Uint16Array(n);
        for (let k = 0; k < n; k++) arr[k] = k;
        geo.setIndex(new THREE.BufferAttribute(arr, 1));
      }
      return geo;
    };
    const con = (geo, c) => concrete.push(paint(toW(geo), c || grey));
    const acc = (geo, c) => accent.push(paint(toW(geo), c || tone));
    const gls = (geo) => glass.push(toW(geo));
    const met = (geo, c) => metal.push(paint(toW(geo), c || 0x4a4d50));
    const room = (geo) => interiors.push(toW(geo));
    const scr = (geo, kind) => screenBins[kind].push(toW(geo));

    // ── ground floor, common to every house ──────────────────────────────
    {
      const plinth = new THREE.BoxGeometry(W, 0.34, D);
      plinth.translate(0, 0.17, -D / 2);
      con(plinth);

      // The ground floor had no wall at all — two floating panes of glass, a
      // door, and open air everywhere else. From the street you looked
      // straight between them and out of the world, which is what made the
      // upper storeys read as slabs hovering over nothing. It gets a real
      // shell: piers at each end, a sill course under the glazing, and a back
      // wall so there is a shop behind the window rather than a hole.
      for (const dir of [-1, 1]) {
        const pier = new THREE.BoxGeometry(1.1, 6.4, 1.4);
        pier.translate(dir * (W / 2 - 0.55), 3.2, -0.2);
        con(pier);
      }
      const sill = new THREE.BoxGeometry(W, 0.5, 1.4);
      sill.translate(0, 0.25, -0.2);
      con(sill);
      const rear = new THREE.BoxGeometry(W, 6.4, 0.6);
      rear.translate(0, 3.2, -2.3);
      con(rear);

      const doorW = 3.0;
      const reveal = new THREE.BoxGeometry(doorW + 1.0, 4.8, 1.8);
      reveal.translate(0, 2.4, -0.9);
      con(reveal);

      const doorway = new THREE.BoxGeometry(doorW, 4.3, 0.12);
      doorway.translate(0, 2.15, -1.6);
      room(doorway);

      const paneW = (W - 2.0 - doorW - 1.0) / 2;
      for (const dir of [-1, 1]) {
        const px = dir * (doorW / 2 + 0.5 + paneW / 2);

        const pane = new THREE.PlaneGeometry(paneW, 5.3);
        pane.translate(px, 3.05, 0.1);
        gls(pane);

        const inner = new THREE.PlaneGeometry(paneW, 5.3);
        inner.translate(px, 3.05, -1.2);
        room(inner);

        for (const t of [-0.5, 0, 0.5]) {
          const mull = new THREE.BoxGeometry(0.11, 5.3, 0.26);
          mull.translate(px + t * paneW, 3.05, 0.14);
          met(mull);
        }
      }

      // Head beam over the shopfront.
      const head = new THREE.BoxGeometry(W, 0.9, 0.8);
      head.translate(0, 5.95, 0.2);
      con(head);

      const kerb = new THREE.BoxGeometry(W, 0.22, 1.1);
      kerb.translate(0, 0.11, 1.4);
      kerbs.push(toW(kerb));
    }

    // ── the upper mass: one of ten ───────────────────────────────────────
    const uh = H - SHOP;                         // height available above
    const uy = SHOP + uh / 2;                    // its centre

    const back = (depth = 0.2, inset = 0) => {
      const w = new THREE.BoxGeometry(W - inset * 2, uh, depth);
      w.translate(0, uy, -depth / 2);
      return w;
    };
    const flanks = () => {                       // side walls, always present
      for (const px of [-W / 2 + 0.3, W / 2 - 0.3]) {
        const f = new THREE.BoxGeometry(0.6, uh, D);
        f.translate(px, uy, -D / 2);
        con(f);
      }
      const rear = new THREE.BoxGeometry(W, uh, 0.6);
      rear.translate(0, uy, -D + 0.3);
      con(rear);
      const roof = new THREE.BoxGeometry(W, 0.45, D);
      roof.translate(0, H - 0.22, -D / 2);
      con(roof);
    };
    const parapet = (c) => {
      const cap = new THREE.BoxGeometry(W + 0.5, 0.5, D + 0.4);
      cap.translate(0, H + 0.2, -D / 2);
      con(cap, c);
    };

    flanks();

    if (style === "fluted") {
      con(back(0.5));
      const n = 17, pitch = (W - 1.2) / (n - 1);
      for (let k = 0; k < n; k++) {
        const fin = new THREE.BoxGeometry(0.26, uh - 0.3, 0.62);
        fin.translate(-W / 2 + 0.6 + k * pitch, uy, 0.28);
        con(fin, grey.clone().offsetHSL(0, 0, 0.05));
      }
      const reveal = new THREE.BoxGeometry(W - 1.0, 0.3, 0.7);
      reveal.translate(0, SHOP + 0.2, 0.3);
      acc(reveal);
      parapet();

    } else if (style === "monolith") {
      // A frame of four slabs, so the opening is a real hole in the mass.
      const ow = W * 0.46, oh = uh * 0.46;
      const sidew = (W - ow) / 2;
      for (const dir of [-1, 1]) {
        const bl = new THREE.BoxGeometry(sidew, uh, 1.3);
        bl.translate(dir * (ow + sidew) / 2, uy, -0.65);
        con(bl);
      }
      const above = new THREE.BoxGeometry(ow, (uh - oh) / 2, 1.3);
      above.translate(0, uy + oh / 2 + (uh - oh) / 4, -0.65);
      con(above);
      const below = new THREE.BoxGeometry(ow, (uh - oh) / 2, 1.3);
      below.translate(0, uy - oh / 2 - (uh - oh) / 4, -0.65);
      con(below);

      const deep = new THREE.PlaneGeometry(ow, oh);
      deep.translate(0, uy, -1.25);
      gls(deep);
      const lit = new THREE.PlaneGeometry(ow, oh);
      lit.translate(0, uy, -1.45);
      room(lit);
      parapet();

    } else if (style === "stacked") {
      const tiers = 3, th = uh / tiers;
      for (let k = 0; k < tiers; k++) {
        const w = W - k * 1.4;
        // Each tier steps further out, but never past the sign board at the
        // front of the canopy. At 0.2 + k * 0.9 the top tier reached z 3.1
        // and simply buried the name of the shop underneath it.
        const out = 0.1 + k * 0.35;
        const box = new THREE.BoxGeometry(w, th - 0.18, 2.2 + out);
        box.translate((k % 2 ? 1 : -1) * 0.5, SHOP + th * (k + 0.5), out / 2);
        con(box);
        const lip = new THREE.BoxGeometry(w + 0.3, 0.22, 2.4 + out);
        lip.translate((k % 2 ? 1 : -1) * 0.5, SHOP + th * (k + 1) - 0.1, out / 2);
        acc(lip, k % 2 ? tone2 : tone);
        const strip = new THREE.PlaneGeometry(w - 1.6, th * 0.44);
        strip.translate((k % 2 ? 1 : -1) * 0.5, SHOP + th * (k + 0.45), out + 1.11);
        gls(strip);
      }

    } else if (style === "screen") {
      con(back(0.4));
      const wall = new THREE.PlaneGeometry(W - 1.4, uh - 0.6);
      wall.translate(0, uy, 0.02);
      acc(wall);
      const panel = new THREE.PlaneGeometry(W - 0.6, uh - 0.2);
      panel.translate(0, uy, 0.75);
      scr(panel, "weave");
      for (const px of [-W / 2 + 0.45, W / 2 - 0.45]) {   // the hangers
        const rail = new THREE.BoxGeometry(0.2, uh, 1.0);
        rail.translate(px, uy, 0.4);
        met(rail, 0x6d7073);
      }
      parapet();

    } else if (style === "folded") {
      const n = 10, pitch = W / n;
      for (let k = 0; k < n; k++) {
        const pl = new THREE.BoxGeometry(pitch * 1.12, uh, 0.34);
        pl.rotateY((k % 2 ? 1 : -1) * 0.38);
        pl.translate(-W / 2 + pitch * (k + 0.5), uy, 0.35);
        con(pl, grey.clone().offsetHSL(0, 0, k % 2 ? 0.055 : -0.035));
      }
      const sill = new THREE.BoxGeometry(W, 0.34, 0.9);
      sill.translate(0, SHOP + 0.17, 0.4);
      acc(sill);
      parapet();

    } else if (style === "curtain") {
      const bays = 3, bw = (W - 1.2) / bays;
      for (let k = 0; k < bays; k++) {
        const px = -W / 2 + 0.6 + bw * (k + 0.5);
        const pane = new THREE.PlaneGeometry(bw - 0.12, uh - 1.0);
        pane.translate(px, uy, 0.16);
        gls(pane);
        const lit = new THREE.PlaneGeometry(bw - 0.12, uh - 1.0);
        lit.translate(px, uy, -0.5);
        room(lit);
        const mull = new THREE.BoxGeometry(0.14, uh, 0.3);
        mull.translate(px + bw / 2, uy, 0.2);
        met(mull, 0x585b5e);
      }
      const floors = Math.max(2, Math.round(uh / 3.2));
      for (let k = 1; k < floors; k++) {
        const spandrel = new THREE.BoxGeometry(W - 1.0, 0.55, 0.42);
        spandrel.translate(0, SHOP + (uh / floors) * k, 0.24);
        acc(spandrel, k % 2 ? tone : tone2);
      }
      parapet();

    } else if (style === "louvre") {
      con(back(0.5));
      const blades = Math.max(4, Math.round(uh / 1.15));
      for (let k = 0; k < blades; k++) {
        const bl = new THREE.BoxGeometry(W - 0.8, 0.17, 1.25);
        bl.rotateX(-0.22);
        bl.translate(0, SHOP + 0.7 + k * ((uh - 1.0) / (blades - 1)), 0.62);
        con(bl, grey.clone().offsetHSL(0, 0, 0.06));
      }
      for (const px of [-W / 2 + 0.5, W / 2 - 0.5]) {
        const post = new THREE.BoxGeometry(0.3, uh, 1.5);
        post.translate(px, uy, 0.6);
        acc(post);
      }
      parapet();

    } else if (style === "arcade") {
      // A real wall with arched holes cut out of it, extruded.
      const sh = new THREE.Shape();
      sh.moveTo(-W / 2, 0); sh.lineTo(W / 2, 0);
      sh.lineTo(W / 2, uh); sh.lineTo(-W / 2, uh); sh.closePath();

      const n = 4, pitch = W / n, r = pitch * 0.33, springs = uh * 0.46;
      for (let k = 0; k < n; k++) {
        const cx = -W / 2 + pitch * (k + 0.5);
        const hole = new THREE.Path();
        hole.moveTo(cx - r, uh * 0.14);
        hole.lineTo(cx - r, springs);
        hole.absarc(cx, springs, r, Math.PI, 0, true);
        hole.lineTo(cx + r, uh * 0.14);
        hole.closePath();
        sh.holes.push(hole);

        // Glazed right up into the head of the arch, not just to the
        // springline.
        const top = springs + r, bot = uh * 0.14;
        const pane = new THREE.PlaneGeometry(r * 2, top - bot);
        pane.translate(cx, SHOP + (bot + top) / 2, -0.35);
        gls(pane);
      }
      const wall = new THREE.ExtrudeGeometry(sh, { depth: 0.8, bevelEnabled: false });
      wall.translate(0, SHOP, -0.4);
      con(wall);

      const band = new THREE.BoxGeometry(W, 0.4, 1.0);
      band.translate(0, SHOP + uh - 0.2, 0.2);
      acc(band);
      parapet();

    } else if (style === "portal") {
      const t = 1.15;                            // how heavy the frame is
      for (const dir of [-1, 1]) {
        const leg = new THREE.BoxGeometry(t, uh, 1.6);
        leg.translate(dir * (W / 2 - t / 2), uy, 0.3);
        acc(leg);
      }
      const lintel = new THREE.BoxGeometry(W, t, 1.6);
      lintel.translate(0, SHOP + uh - t / 2, 0.3);
      acc(lintel);
      const sill = new THREE.BoxGeometry(W, t * 0.7, 1.6);
      sill.translate(0, SHOP + t * 0.35, 0.3);
      acc(sill);

      const inner = new THREE.PlaneGeometry(W - t * 2.4, uh - t * 2.1);
      inner.translate(0, uy, -0.55);
      gls(inner);
      const lit = new THREE.PlaneGeometry(W - t * 2.4, uh - t * 2.1);
      lit.translate(0, uy, -0.95);
      room(lit);

    } else {   // baguette
      con(back(0.6));
      const dark = new THREE.PlaneGeometry(W - 1.2, uh - 0.4);
      dark.translate(0, uy, 0.02);
      room(dark);
      const n = 26, pitch = (W - 1.0) / (n - 1);
      for (let k = 0; k < n; k++) {
        const rod = new THREE.CylinderGeometry(0.11, 0.11, uh - 0.4, 6);
        rod.translate(-W / 2 + 0.5 + k * pitch, uy, 0.5);
        acc(rod, k % 3 === 0 ? tone2 : tone);
      }
      const rail = new THREE.BoxGeometry(W, 0.24, 0.9);
      rail.translate(0, SHOP + 0.2, 0.45);
      met(rail, 0x55585b);
      parapet();
    }

    // ── canopy and sign, common again ────────────────────────────────────
    //
    // The sign used to sit at z 0.55, flat on the facade at first-floor
    // height — which put it *behind* whatever the house's architecture did
    // above the shopfront. Anything that projected covered it, and the
    // stacked tiers covered it completely: Bape's name was built, textured
    // and permanently hidden behind its own building.
    //
    // It is a fascia sign now, on the front edge of the canopy, ahead of
    // every style's reach. That is also simply where shop signs go.
    const canopy = new THREE.BoxGeometry(W - 1.2, 0.28, 2.4);
    canopy.translate(0, 5.25, 1.1);
    acc(canopy, tone);

    const board = new THREE.BoxGeometry(W - 1.2, 2.3, 0.26);
    board.translate(0, 6.4, 2.22);
    acc(board, tone2);

    for (const dir of [-1, 1]) {                 // brackets back to the wall
      const stay = new THREE.BoxGeometry(0.16, 0.16, 2.3);
      stay.translate(dir * (W / 2 - 1.4), 6.9, 1.1);
      met(stay, 0x55585b);
    }

    const signCanvas = texSign(brand);
    const signTex = asTexture(signCanvas);
    dressSign(signCanvas, signTex, brand);
    const sign = new THREE.Mesh(
      // 4:1, to match the sign texture exactly.
      new THREE.PlaneGeometry(8.0, 2.0),
      // Matte. At roughness 0.5 with the sky in the environment map these
      // caught a broad specular sheen straight off it and read as polished
      // mirrors with a brand printed on them rather than as painted boards.
      new THREE.MeshStandardMaterial({
        map: signTex,
        roughness: 0.92,
        metalness: 0,
        envMapIntensity: 0.12,
      })
    );
    sign.position.set(0, 6.4, 2.37);
    sign.castShadow = true;
    sign.userData.brand = brand;
    g.add(sign);

    monoliths.push({ brand, group: g, face: sign, z, x, height: H });
  });

  // ── filler blocks, so the street has two solid walls ──────────────────
  //
  // The terraces interleave, which means each one starts and stops half a
  // unit's pitch away from the other. On the ground that showed as a hole:
  // walking in from the plaza, the left side had Bape and the right side had
  // nothing at all for seven metres — you could see straight out of the
  // street at the very moment you entered it. The far end had the same
  // problem in reverse, plus a long run of open ground before the terminus.
  //
  // These are anonymous: concrete, glazed, no canopy, no sign, and
  // deliberately not added to `monoliths`, so they are neither waypoints nor
  // anything the card can land on.
  {
    const rf = rng(19770);
    const FILL = [
      [-30.4,  1],    // head of the right terrace, the hole you walk into
      [-26.0, -1],    // and the left mouth, which the terrace starts 6m short of
      [-152.0, 1],    // and its tail
      [-167.2, 1],
      [-159.6, -1],   // tail of the left terrace
      [-174.8, -1],   // and on to the terminus, which it laps into harmlessly
    ];

    for (const [fz, fside] of FILL) {
      const fg = new THREE.Group();
      fg.position.set(fside * STREET.half, 0, fz);
      fg.rotation.y = fside === -1 ? Math.PI / 2 : -Math.PI / 2;
      fg.updateMatrixWorld(true);
      scene.add(fg);

      const W = STREET.width, D = STREET.depth;
      const H = 9.0 + rf() * 3.4;
      const grey = BASE_GREY.clone().offsetHSL(0, 0, (rf() - 0.5) * 0.05);

      const toF = (geo) => {
        geo.applyMatrix4(fg.matrixWorld);
        if (!geo.index) {
          const n = geo.attributes.position.count;
          const arr = n > 65535 ? new Uint32Array(n) : new Uint16Array(n);
          for (let k = 0; k < n; k++) arr[k] = k;
          geo.setIndex(new THREE.BufferAttribute(arr, 1));
        }
        return geo;
      };
      const cf = (geo, c) => concrete.push(paint(toF(geo), c || grey));

      const body = new THREE.BoxGeometry(W, H, D);
      body.translate(0, H / 2, -D / 2);
      cf(body);

      const cap = new THREE.BoxGeometry(W + 0.5, 0.5, D + 0.4);
      cap.translate(0, H + 0.2, -D / 2);
      cf(cap);

      // A plain run of glazing, so it is a building rather than a wall.
      const bays = 4, bw = (W - 1.6) / bays;
      for (let k = 0; k < bays; k++) {
        const px = -W / 2 + 0.8 + bw * (k + 0.5);
        const pane = new THREE.PlaneGeometry(bw - 0.35, 4.6);
        pane.translate(px, 2.9, 0.1);
        glass.push(toF(pane));
        const lit = new THREE.PlaneGeometry(bw - 0.35, 4.6);
        lit.translate(px, 2.9, -1.0);
        interiors.push(toF(lit));
        const mull = new THREE.BoxGeometry(0.12, 4.6, 0.24);
        mull.translate(px + bw / 2, 2.9, 0.15);
        metal.push(paint(toF(mull), 0x4a4d50));
      }

      // Upper floors get punched windows, on a plain grid.
      const rows = Math.max(1, Math.floor((H - 7.0) / 2.6));
      for (let r0 = 0; r0 < rows; r0++) {
        for (let k = 0; k < 4; k++) {
          const px = -W / 2 + 1.9 + k * ((W - 3.8) / 3);
          const win = new THREE.PlaneGeometry(1.9, 1.5);
          win.translate(px, 7.4 + r0 * 2.6, 0.08);
          glass.push(toF(win));
        }
      }

      const kerb = new THREE.BoxGeometry(W, 0.22, 1.1);
      kerb.translate(0, 0.11, 1.4);
      kerbs.push(toF(kerb));
    }
  }

  // ── the courtyard wall ────────────────────────────────────────────────
  // Plain masses, read only as a backdrop and never approached, so they are
  // massing and glazing and nothing else.
  {
    const rp = rng(4242);
    for (const b of PLAZA_BLOCKS) {
      const w = b.x1 - b.x0, d = b.z1 - b.z0;
      const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
      const grey = BASE_GREY.clone().offsetHSL(0, 0, (rp() - 0.5) * 0.06);

      const body = new THREE.BoxGeometry(w, b.h, d);
      body.translate(cx, b.h / 2, cz);
      concrete.push(paint(body, grey));

      const cap = new THREE.BoxGeometry(w + 0.6, 0.6, d + 0.6);
      cap.translate(cx, b.h + 0.25, cz);
      concrete.push(paint(cap, grey));

      // Glazing on the face that looks at the plaza.
      const facing = cx < 0 ? 1 : -1;
      const fx = (cx < 0 ? b.x1 : b.x0) + facing * 0.06;
      const floors = Math.max(2, Math.floor(b.h / 3.4));
      for (let f = 0; f < floors; f++) {
        const strip = new THREE.PlaneGeometry(d - 3, 1.9);
        strip.rotateY(facing * Math.PI / 2);
        strip.translate(fx, 2.6 + f * 3.4, cz);
        glass.push(strip);
      }
    }
  }

  const concreteTex = asTexture(texConcrete(), { repeat: [1, 1] });

  const shellMesh = new THREE.Mesh(
    mergeGeometries(concrete),
    // One draw call for every wall on the street. The map carries the board
    // marks and aggregate; the vertex colour carries each pour's own tone.
    new THREE.MeshStandardMaterial({
      map: concreteTex, vertexColors: true, roughness: 0.94, metalness: 0,
      envMapIntensity: 0.7,
    })
  );
  shellMesh.castShadow = true; shellMesh.receiveShadow = true;
  scene.add(shellMesh);

  const accentMesh = new THREE.Mesh(
    mergeGeometries(accent),
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.72, metalness: 0.04 })
  );
  accentMesh.castShadow = true; accentMesh.receiveShadow = true;
  scene.add(accentMesh);

  const metalMesh2 = new THREE.Mesh(
    mergeGeometries(metal),
    new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.34, metalness: 0.75 })
  );
  metalMesh2.castShadow = true;
  scene.add(metalMesh2);

  for (const kind of Object.keys(screenBins)) {
    const geos = screenBins[kind];
    if (!geos.length) continue;
    const m = new THREE.Mesh(
      mergeGeometries(geos),
      new THREE.MeshStandardMaterial({
        map: asTexture(texScreen(kind)), alphaTest: 0.5, side: THREE.DoubleSide,
        color: 0xd8d5cd, roughness: 0.5, metalness: 0.25, envMapIntensity: 0.9,
      })
    );
    m.castShadow = true;
    scene.add(m);
  }

  const interiorMesh = new THREE.Mesh(
    mergeGeometries(interiors),
    new THREE.MeshStandardMaterial({
      map: asTexture(texInterior()),
      emissiveMap: asTexture(texInterior()),
      emissive: 0xffe9c4,
      emissiveIntensity: 0.55,
      roughness: 0.9,
      side: THREE.DoubleSide,
    })
  );
  scene.add(interiorMesh);

  const glassMesh = new THREE.Mesh(
    mergeGeometries(glass),
    new THREE.MeshPhysicalMaterial({
      color: 0x22323a,
      roughness: 0.05,
      metalness: 0.1,
      transmission: 0.55,
      thickness: 0.2,
      ior: 1.5,
      transparent: true,
      opacity: 0.85,
      envMapIntensity: 1.6,
      side: THREE.DoubleSide,
    })
  );
  scene.add(glassMesh);

  const kerbMesh = new THREE.Mesh(
    mergeGeometries(kerbs),
    new THREE.MeshStandardMaterial({ color: 0xded3bd, roughness: 0.9 })
  );
  kerbMesh.receiveShadow = true;
  scene.add(kerbMesh);

  // --- the far end -------------------------------------------------------
  // A street has to stop somewhere. Without this the two terraces ran to a
  // vanishing point on bare horizon, which undid the enclosure the buildings
  // were there to create in the first place: you could see straight out of
  // the world at the one spot the eye is drawn to. A block across the end
  // closes it, and a taller one so the skyline steps up rather than simply
  // ending.
  {
    // Set well back from the last shopfront. At -12 the camera's final rise
    // ended up inside this block and the last second of the journey was a
    // clipping plane sawing through a wall.
    const endZ = STREET.from + BRANDS.length * STREET.step - 26;
    const caps = [], capGlass = [], bayDots = [], bayWeave = [];

    const block = new THREE.BoxGeometry(56, 17, 16);
    block.translate(0, 8.5, endZ - 8);
    caps.push(block);

    const brow = new THREE.BoxGeometry(57, 0.7, 17);
    brow.translate(0, 17.2, endZ - 8);
    caps.push(brow);

    // --- five bays, five different hands ---------------------------------
    // The block you look at down the whole length of the street was a blank
    // wall. It is now the one deliberate landmark: five bays that plainly did
    // not agree with each other, which is exactly how the car park this
    // borrows from was commissioned — five architects, none shown the others'
    // work. Punched screen, a jam of metal, a woven lattice, coloured fins,
    // and a stack of offset slabs.
    const jam = [], finGeo = [], slabGeo = [];
    const rb = rng(8081);
    const bayW = 56 / 5;

    for (let b = 0; b < 5; b++) {
      const bx = -28 + bayW * (b + 0.5);

      if (b === 0 || b === 2) {
        const panel = new THREE.PlaneGeometry(bayW - 0.5, 15.4);
        panel.translate(bx, 8.6, endZ + 0.45);
        (b === 0 ? bayDots : bayWeave).push(panel);

      } else if (b === 1) {
        // The jam: bodies caught mid-air, gold and silver.
        for (let k = 0; k < 11; k++) {
          const box = new THREE.BoxGeometry(3.4, 1.15, 1.5);
          box.rotateZ((rb() - 0.5) * 1.5);
          box.rotateY((rb() - 0.5) * 0.8);
          box.translate(bx + (rb() - 0.5) * (bayW - 4), 2.2 + k * 1.32, endZ + 0.9 + rb() * 0.8);
          const c = new THREE.Color(rb() > 0.5 ? 0xd8b25e : 0xc9ccd2);
          const n = box.attributes.position.count;
          const arr = new Float32Array(n * 3);
          for (let v = 0; v < n; v++) { arr[v*3]=c.r; arr[v*3+1]=c.g; arr[v*3+2]=c.b; }
          box.setAttribute("color", new THREE.BufferAttribute(arr, 3));
          jam.push(box);
        }

      } else if (b === 3) {
        // Coloured fins, picked off the houses on this street.
        for (let k = 0; k < 9; k++) {
          const fin = new THREE.BoxGeometry(0.34, 15.2, 1.25);
          fin.translate(bx - bayW / 2 + 0.8 + k * ((bayW - 1.6) / 8), 8.6, endZ + 0.85);
          const c = new THREE.Color(BRANDS[(k * 3 + 2) % BRANDS.length].bg[0]);
          const n = fin.attributes.position.count;
          const arr = new Float32Array(n * 3);
          for (let v = 0; v < n; v++) { arr[v*3]=c.r; arr[v*3+1]=c.g; arr[v*3+2]=c.b; }
          fin.setAttribute("color", new THREE.BufferAttribute(arr, 3));
          finGeo.push(fin);
        }

      } else {
        // Barricades: heavy slabs, each shoved a little off the last.
        for (let k = 0; k < 7; k++) {
          const sl = new THREE.BoxGeometry(bayW - 1.2, 1.5, 1.1);
          sl.translate(bx + (rb() - 0.5) * 2.2, 2.0 + k * 2.15, endZ + 0.7);
          slabGeo.push(sl);
        }
      }
    }

    if (jam.length) {
      const m = new THREE.Mesh(mergeGeometries(jam),
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.28, metalness: 0.85, envMapIntensity: 1.3 }));
      m.castShadow = true; scene.add(m);
    }
    if (finGeo.length) {
      const m = new THREE.Mesh(mergeGeometries(finGeo),
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.5 }));
      m.castShadow = true; scene.add(m);
    }
    if (slabGeo.length) {
      const m = new THREE.Mesh(mergeGeometries(slabGeo),
        new THREE.MeshStandardMaterial({ color: 0xe6ddc9, roughness: 0.9 }));
      m.castShadow = true; m.receiveShadow = true; scene.add(m);
    }

    // A glazed ground floor, so it belongs to the same street.
    for (let k = -2; k <= 2; k++) {
      const pane = new THREE.PlaneGeometry(8.4, 6.2);
      pane.translate(k * 9.4, 3.4, endZ + 0.05);
      capGlass.push(pane);

      const mull = new THREE.BoxGeometry(0.16, 6.2, 0.25);
      mull.translate(k * 9.4 + 4.7, 3.4, endZ + 0.1);
      caps.push(mull);
    }

    const endMesh = new THREE.Mesh(
      mergeGeometries(caps),
      new THREE.MeshStandardMaterial({ map: concreteTex, color: 0xdedbd3, roughness: 0.9 })
    );
    endMesh.castShadow = true; endMesh.receiveShadow = true;
    scene.add(endMesh);

    for (const [geos, kind] of [[bayDots, "dots"], [bayWeave, "weave"]]) {
      if (!geos.length) continue;
      const m = new THREE.Mesh(
        mergeGeometries(geos),
        new THREE.MeshStandardMaterial({
          map: asTexture(texScreen(kind)),
          alphaTest: 0.5, side: THREE.DoubleSide,
          color: 0xfffdf6, roughness: 0.5, metalness: 0.2, envMapIntensity: 1.0,
        })
      );
      m.castShadow = true;
      scene.add(m);
    }

    const endGlass = new THREE.Mesh(
      mergeGeometries(capGlass),
      new THREE.MeshPhysicalMaterial({
        color: 0x223038, roughness: 0.06, metalness: 0.1,
        transmission: 0.5, thickness: 0.2, ior: 1.5,
        transparent: true, opacity: 0.86, envMapIntensity: 1.6,
        side: THREE.DoubleSide,
      })
    );
    scene.add(endGlass);
  }

  // --- a bridge over the street -----------------------------------------
  // Upper-level links between blocks are everywhere in a district like this,
  // and one crossing overhead does more for the sense of being *inside*
  // somewhere than another twenty metres of shopfront would.
  {
    const bz = STREET.from + 6.5 * STREET.step;
    const deck = [], rails = [];

    const slab = new THREE.BoxGeometry(STREET.half * 2 + 2, 0.55, 4.2);
    slab.translate(0, 9.2, bz);
    deck.push(slab);

    const soffit = new THREE.BoxGeometry(STREET.half * 2 + 2, 0.3, 3.0);
    soffit.translate(0, 8.9, bz);
    deck.push(soffit);

    for (const dz of [-2.1, 2.1]) {
      const g = new THREE.PlaneGeometry(STREET.half * 2 + 2, 1.9);
      g.rotateY(dz > 0 ? 0 : Math.PI);
      g.translate(0, 10.45, bz + dz);
      rails.push(g);
    }

    const deckMesh = new THREE.Mesh(
      mergeGeometries(deck),
      new THREE.MeshStandardMaterial({ color: 0xf1e9d9, roughness: 0.85 })
    );
    deckMesh.castShadow = true; deckMesh.receiveShadow = true;
    scene.add(deckMesh);

    const railMesh = new THREE.Mesh(
      mergeGeometries(rails),
      new THREE.MeshPhysicalMaterial({
        color: 0x2a3a42, roughness: 0.05, metalness: 0.1,
        transmission: 0.6, thickness: 0.15, ior: 1.5,
        transparent: true, opacity: 0.8, side: THREE.DoubleSide, envMapIntensity: 1.5,
      })
    );
    scene.add(railMesh);
  }

  // --- somewhere to sit outside ------------------------------------------
  // Parasols and cafe tables spilling onto the paving. Colour at head height,
  // and the clearest signal that the street is used rather than modelled.
  {
    const posts = [], tops = [], tables = [];
    const ru = rng(60607);
    for (let i = 0; i < 6; i++) {
      const z = STREET.from - 10 - i * 19 - ru() * 6;
      const sx = (i % 2 === 0 ? -1 : 1) * (STREET.half - 3.4);

      const pole = new THREE.CylinderGeometry(0.07, 0.07, 2.7, 6);
      pole.translate(sx, 1.35, z);
      posts.push(pole);

      const shade = new THREE.ConeGeometry(2.25, 0.85, 8, 1, true);
      shade.translate(sx, 3.0, z);
      const c = new THREE.Color(BRANDS[(i * 4 + 1) % BRANDS.length].bg[0]);
      const n = shade.attributes.position.count;
      const arr = new Float32Array(n * 3);
      for (let v = 0; v < n; v++) { arr[v*3]=c.r; arr[v*3+1]=c.g; arr[v*3+2]=c.b; }
      shade.setAttribute("color", new THREE.BufferAttribute(arr, 3));
      tops.push(shade);

      const top = new THREE.CylinderGeometry(0.62, 0.62, 0.08, 12);
      top.translate(sx, 0.74, z);
      tables.push(top);
      const stem = new THREE.CylinderGeometry(0.06, 0.09, 0.74, 6);
      stem.translate(sx, 0.37, z);
      tables.push(stem);

      for (const a of [0.7, 2.6, 4.2]) {
        const seat = new THREE.CylinderGeometry(0.28, 0.28, 0.07, 8);
        seat.translate(sx + Math.cos(a) * 1.15, 0.46, z + Math.sin(a) * 1.15);
        tables.push(seat);
        const leg = new THREE.CylinderGeometry(0.05, 0.05, 0.46, 5);
        leg.translate(sx + Math.cos(a) * 1.15, 0.23, z + Math.sin(a) * 1.15);
        tables.push(leg);
      }
    }

    const shadeMesh = new THREE.Mesh(
      mergeGeometries(tops),
      new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, side: THREE.DoubleSide })
    );
    shadeMesh.castShadow = true;
    scene.add(shadeMesh);

    const metalMesh = new THREE.Mesh(
      mergeGeometries(posts.concat(tables)),
      new THREE.MeshStandardMaterial({ color: 0x3c3f42, roughness: 0.42, metalness: 0.5 })
    );
    metalMesh.castShadow = true;
    scene.add(metalMesh);
  }

  // --- street furniture --------------------------------------------------
  // Planters and benches down the kerb line. Cheap, merged, and the thing
  // that stops the alley floor reading as an empty corridor: they give the
  // eye something at knee height between the shopfronts and the palms.
  {
    const stone = [], green = [];
    const r = rng(5150);
    const kerbX = STREET.half - 2.0;

    // One per unit, alternating kerbs, so they read as part of the street
    // rather than scattered along it.
    for (let i = 0; i < BRANDS.length + 2; i++) {
      const z = STREET.from - 2 - i * 7.6 - r() * 1.6;
      const sx = (i % 2 === 0 ? -1 : 1) * (kerbX + (r() - 0.5) * 0.6);

      const tub = new THREE.BoxGeometry(1.7, 0.92, 1.7);
      tub.translate(sx, 0.46, z);
      stone.push(tub);

      const lip = new THREE.BoxGeometry(1.95, 0.16, 1.95);
      lip.translate(sx, 0.95, z);
      stone.push(lip);

      // Planting, not three grey-green balls.
      //
      // A shrub reads as a shrub because of its silhouette, so the mass is
      // built from more, smaller, irregular lumps — each one a low-poly
      // sphere pushed out of round — and then broken by a fan of blades,
      // which is what actually says "tropical" at a glance. Two greens, so
      // the clump has light and shade in it rather than one flat tone.
      const clump = 5 + Math.floor(r() * 3);
      for (let k = 0; k < clump; k++) {
        const b = new THREE.SphereGeometry(0.3 + r() * 0.26, 6, 5);
        const pos = b.attributes.position;
        for (let v = 0; v < pos.count; v++) {
          const f = 0.82 + r() * 0.36;                    // knock it out of round
          pos.setXYZ(v, pos.getX(v) * f, pos.getY(v) * f * 0.8, pos.getZ(v) * f);
        }
        b.computeVertexNormals();
        b.translate(sx + (r() - 0.5) * 1.15, 1.25 + r() * 0.55, z + (r() - 0.5) * 1.15);
        green.push(b);
      }

      // Blades fanning out of the middle.
      const fan = 7 + Math.floor(r() * 4);
      for (let k = 0; k < fan; k++) {
        const a = (k / fan) * Math.PI * 2 + r() * 0.5;
        const len = 0.9 + r() * 0.8;
        const blade = new THREE.CylinderGeometry(0.012, 0.075, len, 3);
        blade.translate(0, len / 2, 0);
        blade.rotateZ(Math.cos(a) * (0.5 + r() * 0.45));
        blade.rotateX(Math.sin(a) * (0.5 + r() * 0.45));
        blade.translate(sx + (r() - 0.5) * 0.5, 1.15, z + (r() - 0.5) * 0.5);
        green.push(blade);
      }

      // A bench every third planter.
      if (i % 3 === 1) {
        const seat = new THREE.BoxGeometry(0.62, 0.16, 3.1);
        seat.translate(sx - Math.sign(sx) * 1.6, 0.52, z + 3.6);
        stone.push(seat);
        for (const t of [-1.2, 1.2]) {
          const leg = new THREE.BoxGeometry(0.5, 0.44, 0.24);
          leg.translate(sx - Math.sign(sx) * 1.6, 0.22, z + 3.6 + t);
          stone.push(leg);
        }
      }
    }

    const stoneMesh = new THREE.Mesh(
      mergeGeometries(stone),
      new THREE.MeshStandardMaterial({ color: 0xe4dac4, roughness: 0.88 })
    );
    stoneMesh.castShadow = true; stoneMesh.receiveShadow = true;
    scene.add(stoneMesh);

    const greenMesh = new THREE.Mesh(
      mergeGeometries(green),
      new THREE.MeshStandardMaterial({ color: 0x55893a, roughness: 0.96, flatShading: true })
    );
    greenMesh.castShadow = true; greenMesh.receiveShadow = true;
    scene.add(greenMesh);

    // Bougainvillea. Three or four hot clusters down a bleached street do
    // more for the colour of the place than raising the saturation on
    // everything would, and the tropics plant the stuff everywhere.
    const petals = [];
    for (let i = 0; i < green.length; i += 3) {
      if (r() > 0.55) continue;
      const src = green[i].attributes.position;
      const bx = src.getX(0), by = src.getY(0), bz = src.getZ(0);
      const hue = [0xd6356f, 0xe8604a, 0xc23a86, 0xef8f3c][Math.floor(r() * 4)];
      for (let k = 0; k < 5; k++) {
        const b = new THREE.SphereGeometry(0.17 + r() * 0.1, 6, 4);
        b.translate(bx + (r() - 0.5) * 1.5, by + (r() - 0.5) * 0.9, bz + (r() - 0.5) * 1.5);
        const c = new THREE.Color(hue);
        const n = b.attributes.position.count;
        const arr = new Float32Array(n * 3);
        for (let v = 0; v < n; v++) { arr[v * 3] = c.r; arr[v * 3 + 1] = c.g; arr[v * 3 + 2] = c.b; }
        b.setAttribute("color", new THREE.BufferAttribute(arr, 3));
        petals.push(b);
      }
    }
    if (petals.length) {
      const bloomMesh = new THREE.Mesh(
        mergeGeometries(petals),
        new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 })
      );
      bloomMesh.castShadow = true;
      scene.add(bloomMesh);
    }
  }
}

// ## 19  CAMERA — the scroll path
// Two curves: one the camera rides, one it looks at. Keeping them separate is
// what lets it hold the dome in frame while swinging around it, then turn and
// walk away down the street without a snap.

const PATH = new THREE.CatmullRomCurve3([
  // Opens close in on the dome, the way the reference frames it, rather than
  // from across an empty apron.
  new THREE.Vector3(0, 3.0, 21),
  new THREE.Vector3(0.6, 3.3, 18),
  new THREE.Vector3(9, 4.4, 16),
  new THREE.Vector3(13, 5.4, 2),
  new THREE.Vector3(9.5, 4.2, -12),
  new THREE.Vector3(2.5, 3.1, -24),
  new THREE.Vector3(0, 2.9, -42),
  new THREE.Vector3(0, 2.9, -68),
  new THREE.Vector3(0, 2.9, -96),
  new THREE.Vector3(0, 3.1, -124),
  new THREE.Vector3(0, 4.4, -150),
  // Stops in the open ground between the last shopfront and the block that
  // closes the street, rather than travelling on through it.
  new THREE.Vector3(0, 6.5, -162),
], false, "catmullrom", 0.4);

const LOOK = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 5.4, 0),
  new THREE.Vector3(0, 5.4, 0),
  new THREE.Vector3(0, 5.2, 0),
  new THREE.Vector3(0, 4.8, 0),
  new THREE.Vector3(0, 4.0, -8),
  new THREE.Vector3(0, 3.2, -34),
  new THREE.Vector3(0, 3.0, -56),
  new THREE.Vector3(0, 3.0, -84),
  new THREE.Vector3(0, 3.0, -112),
  new THREE.Vector3(0, 3.0, -140),
  new THREE.Vector3(0, 3.4, -172),
  new THREE.Vector3(0, 3.6, -184),
], false, "catmullrom", 0.4);

let scrollTarget = 0;    // 0..1, straight off the scrollbar
let scrollEased = 0;     // what the camera actually follows
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };

function readScroll() {
  const max = document.documentElement.scrollHeight - innerHeight;
  scrollTarget = max > 0 ? clamp(scrollY / max, 0, 1) : 0;
}
addEventListener("scroll", readScroll, { passive: true });

addEventListener("pointermove", (e) => {
  pointer.tx = (e.clientX / innerWidth) * 2 - 1;
  pointer.ty = (e.clientY / innerHeight) * 2 - 1;
}, { passive: true });

// ## 20  POST — bloom
// Only the sun, its glitter on the water and the dome's hot rim should blow
// out, so the threshold sits high and the strength low.

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
let bloomPass = null;
if (QUALITY.bloom) {
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.42, 0.72, 0.86);
  composer.addPass(bloomPass);
}
composer.addPass(new OutputPass());

// ## 21  PICKING — click a brand
// The overlay is pointer-transparent, so clicks land here. A tap on a monolith
// opens that house.

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const faces = monoliths.map((m) => m.face);

function pick(e) {
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(faces, false)[0];
  if (hit) location.href = `${SITE}/brands/${hit.object.userData.brand.slug}`;
}
canvasEl.addEventListener("click", pick);

canvasEl.addEventListener("pointermove", (e) => {
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  canvasEl.style.cursor = ray.intersectObjects(faces, false).length ? "pointer" : "";
}, { passive: true });

// ---- overlay wiring -------------------------------------------------------

const panels = {
  hero:  document.getElementById("p-hero"),
  brands:document.getElementById("p-brands"),
  end:   document.getElementById("p-end"),
};
const card = {
  swatch:  document.getElementById("card-swatch"),
  maker:   document.getElementById("card-maker"),
  eyebrow: document.getElementById("card-eyebrow"),
  name:    document.getElementById("card-name"),
  note:    document.getElementById("card-note"),
  link:    document.getElementById("card-link"),
};
const indexEl = document.getElementById("index");
const pinsEl = document.getElementById("pins");
const hintEl = document.getElementById("hint");
document.getElementById("enter").href = SITE;

BRANDS.forEach((b) => {
  const el = document.createElement("b");
  el.textContent = b.name;
  indexEl.appendChild(el);
});
const indexItems = [...indexEl.children];

/**
 * Which house the card names.
 *
 * This projected every plaque into clip space and picked the nearest one
 * inside the frame. That was the right tool when the houses were free-standing
 * slabs scattered down an open plaza and most of them were off to the side.
 * They are a continuous terrace on a regular pitch now, and position along the
 * street simply *is* what you are looking at, so the answer is arithmetic.
 *
 * The projection version also never settled at the far end. Vale and Hellstar
 * stand on opposite kerbs a few metres apart, and as the camera lifted away at
 * the end of the street both slid in and out of frame, flipping the card
 * between them — forwards and backwards. Two goes at tuning the thresholds
 * moved the flip without removing it; the measure was just too twitchy for the
 * job. This cannot oscillate, because it is monotonic in camera z by
 * construction.
 *
 * LEAD is what keeps the card naming the shop you are walking toward rather
 * than the one already level with your shoulder.
 */
const LEAD = 6;
function readableBrand() {
  const zAhead = camera.position.z - LEAD;               // forward is -z
  const i = Math.round((zAhead - STREET.from) / STREET.step);
  return clamp(i, 0, BRANDS.length - 1);
}

/**
 * A marker per house, pinned to its shopfront and clickable to travel there.
 *
 * The lookup below is what makes "travel there" possible at all. The camera
 * rides a Catmull-Rom curve, so there is no closed form for "which scroll
 * position puts me outside shop seven" — the curve is sampled once at build
 * time into a z-to-progress table, and a click binary-searches it. Sampling
 * beats solving here: the curve is fixed, 400 samples cost nothing, and the
 * answer only has to be good to about a metre.
 */
const TRAVEL = (() => {
  const N = 400, zs = new Float32Array(N + 1), v = new THREE.Vector3();
  for (let i = 0; i <= N; i++) { PATH.getPointAt(i / N, v); zs[i] = v.z; }
  return (targetZ) => {
    // z falls monotonically along the street, so a plain scan is enough and
    // is immune to the wobble at the ends where the path turns.
    let best = 0, bestD = Infinity;
    for (let i = 0; i <= N; i++) {
      const d = Math.abs(zs[i] - targetZ);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best / N;
  };
})();

const pins = monoliths.map((m, i) => {
  const b = m.brand;
  const el = document.createElement("button");
  el.type = "button";
  el.className = "pin";
  el.style.setProperty("--pin-bg", b.bg[0]);
  el.style.setProperty("--pin-ink", b.ink);
  el.setAttribute("aria-label", `Go to ${b.name}`);
  const art = logoFor(b.slug);
  el.innerHTML = art ? `<img src="${art}" alt="" />` : `<b>${b.name.slice(0, 2).toUpperCase()}</b>`;
  el.addEventListener("click", () => {
    // Stop in front of the shop, not level with it: LEAD is the same offset
    // the card uses to decide which house you are looking at.
    travelTo(TRAVEL(m.z + LEAD));
  });
  pinsEl.appendChild(el);
  return { el, m, shown: false };
});

/**
 * Scrolls to a point on the journey in a fixed length of time.
 *
 * Not `behavior: "smooth"`. The document is thirteen screens tall, and the
 * native easing is distance-proportional — a jump from the first house to the
 * last would crawl for several seconds and read as a hang. A waypoint should
 * feel like a waypoint, so this takes the same 700ms whether the shop is next
 * door or at the far end.
 *
 * Any real scroll input cancels it, so grabbing the wheel mid-flight hands
 * control straight back instead of fighting.
 */
let travelling = 0;
function travelTo(target) {
  const max = document.documentElement.scrollHeight - innerHeight;
  const from = window.scrollY;
  const to = clamp(target, 0, 1) * max;
  if (QUALITY.still || Math.abs(to - from) < 2) { scrollTo(0, to); return; }

  const id = ++travelling;
  const t0 = performance.now();
  const DUR = 700;
  let last = from;

  const tick = (now) => {
    if (id !== travelling) return;
    // If the page moved for any reason other than this tween, the visitor did
    // it — stand down.
    if (Math.abs(window.scrollY - last) > 2) return;
    const k = Math.min((now - t0) / DUR, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    last = from + (to - from) * e;
    scrollTo(0, last);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

const pinPos = new THREE.Vector3();

/** Places every marker over its shopfront, and hides the ones out of frame. */
function placePins(active, visible) {
  for (let i = 0; i < pins.length; i++) {
    const { el, m } = pins[i];
    if (!visible) { if (pins[i].shown) { el.style.display = "none"; pins[i].shown = false; } continue; }

    m.face.getWorldPosition(pinPos);
    pinPos.y += 3.4;                              // float above the sign
    const dist = pinPos.distanceTo(camera.position);
    pinPos.project(camera);

    const onScreen = pinPos.z > -1 && pinPos.z < 1
      && Math.abs(pinPos.x) < 1.15 && Math.abs(pinPos.y) < 1.15
      && dist < 78;

    if (!onScreen) {
      if (pins[i].shown) { el.style.display = "none"; pins[i].shown = false; }
      continue;
    }

    const x = (pinPos.x * 0.5 + 0.5) * innerWidth;
    const y = (-pinPos.y * 0.5 + 0.5) * innerHeight;
    // Near markers are full size, far ones shrink away rather than crowding.
    const k = clamp(1.15 - dist / 90, 0.42, 1);
    el.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0) translate(-50%, -100%) scale(${k.toFixed(2)})`;
    el.style.opacity = clamp(1.35 - dist / 70, 0.25, 1).toFixed(2);
    el.dataset.live = i === active ? "1" : "0";
    if (!pins[i].shown) { el.style.display = "grid"; pins[i].shown = true; }
  }
}
pins.forEach((p) => { p.el.style.display = "none"; });

let shownBrand = -1;
function showBrand(i) {
  if (i === shownBrand) return;
  shownBrand = i;
  const b = BRANDS[i];
  card.swatch.style.background = `linear-gradient(90deg, ${b.bg[0]}, ${b.bg[1]})`;

  // The tag: artwork where we have it, the name in type where we do not.
  card.maker.style.background = `linear-gradient(135deg, ${b.bg[0]}, ${b.bg[1]})`;
  card.maker.style.color = b.ink;
  const art = logoFor(b.slug);
  card.maker.innerHTML = art
    ? `<img src="${art}" alt="${b.name}" />`
    : `<span>${b.name}</span>`;
  card.eyebrow.textContent = `District ${String(i + 1).padStart(2, "0")} of ${BRANDS.length}`;
  card.name.textContent = b.name;
  card.note.textContent = b.note;
  card.link.href = `${SITE}/brands/${b.slug}`;
  card.link.textContent = `Shop ${b.name}`;
  indexItems.forEach((el, k) => { el.dataset.live = k === i ? "1" : "0"; });
}

// ## 22  FRAME LOOP

const clock = new THREE.Clock();
let running = true;
const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
const shadowFocus = new THREE.Vector3();

/**
 * One frame's worth of work, for a given elapsed time and scroll position.
 *
 * Split out of the rAF loop so it can be driven directly — `DD.step(0.4)`
 * from the console places the whole scene at 40% of the journey and renders
 * it. That is the only way to inspect anything when the tab is not painting,
 * since requestAnimationFrame does not run in a backgrounded tab and the
 * scene simply freezes wherever it was.
 */
function step(dt, t, p) {
  // --- camera -------------------------------------------------------------
  PATH.getPointAt(p, camPos);
  LOOK.getPointAt(p, camLook);

  if (!QUALITY.still) {
    pointer.x += (pointer.tx - pointer.x) * Math.min(1, dt * 2.2);
    pointer.y += (pointer.ty - pointer.y) * Math.min(1, dt * 2.2);
    camPos.x += pointer.x * 1.15;
    camPos.y += -pointer.y * 0.55 + Math.sin(t * 0.42) * 0.09;   // a slow breath
  }

  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // --- shadow frustum follows the camera ---------------------------------
  shadowFocus.lerpVectors(camPos, camLook, 0.35);
  sun.position.copy(C.sun).multiplyScalar(90).add(shadowFocus);
  sun.target.position.copy(shadowFocus);
  sun.target.updateMatrixWorld();

  // --- animation ----------------------------------------------------------
  windUniforms.uTime.value = t;
  skyUniforms.uTime.value = t;
  waterUniforms.uTime.value = t;
  waterUniforms.uCam.value.copy(camera.position);
  motes.uniforms.uTime.value = t;
  if (leaves) leaves.update(dt, t);

  // --- overlay ------------------------------------------------------------
  // A plain range test. This was a feathered curve once, and at the very top
  // of the page it evaluated to exactly 0.5 — so the hero panel failed its own
  // "> 0.5" check and the first thing a visitor saw was a wordless scene.
  const within = ([a, b]) => (p >= a && p <= b ? "1" : "0");
  panels.hero.dataset.on  = within(BEATS.hero);
  panels.end.dataset.on   = within(BEATS.end);

  const inStreet = p >= BEATS.brands[0] && p <= BEATS.brands[1];
  panels.brands.dataset.on = inStreet ? "1" : "0";
  indexEl.dataset.on = inStreet ? "1" : "0";
  hintEl.style.opacity = p < 0.02 ? "0.75" : "0";

  if (inStreet) showBrand(readableBrand());
  placePins(shownBrand, inStreet);

  composer.render();
}

function frame() {
  if (!running) return;
  requestAnimationFrame(frame);

  const dt = Math.min(clock.getDelta(), 0.05);
  // Scroll easing: the camera always trails the scrollbar slightly, which is
  // what makes it feel like a dolly rather than a scrubbed video.
  scrollEased += (scrollTarget - scrollEased) * Math.min(1, dt * 3.4);
  step(dt, clock.elapsedTime, clamp(scrollEased, 0, 1));
}

// ## 23  RESIZE + VISIBILITY

/**
 * Vertical FOV is the wrong thing to hold fixed.
 *
 * Three derives the horizontal field from the vertical one and the aspect, so
 * a fixed 46 degrees gives a laptop a wide view and a portrait phone a letter
 * slot — the dome shrinks and the slabs either side of the street fall out of
 * frame entirely. This holds the *horizontal* field instead, widening the
 * vertical one as the viewport narrows, and clamps it well short of the
 * fisheye the raw maths asks for at phone aspect ratios.
 */
const BASE_FOV = 46, BASE_ASPECT = 1.6;
const H_HALF = Math.atan(Math.tan((BASE_FOV / 2) * Math.PI / 180) * BASE_ASPECT);

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.fov = clamp(
    2 * Math.atan(Math.tan(H_HALF) / camera.aspect) * 180 / Math.PI,
    BASE_FOV, 68
  );
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, QUALITY.dpr));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  if (bloomPass) bloomPass.setSize(w, h);
  readScroll();
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 250));

// Stop burning a GPU on a tab nobody is looking at.
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    running = false;
  } else if (!running) {
    running = true;
    clock.getDelta();       // drop the gap so nothing jumps
    frame();
  }
});

// ## 24  STARTUP

readScroll();
scrollEased = scrollTarget;
resize();

// One warm-up render so the first visible frame is not a stutter while every
// shader in the scene compiles at once.
renderer.compile(scene, camera);
composer.render();

requestAnimationFrame(() => {
  document.getElementById("boot").dataset.done = "1";
  frame();
});

// A handle for tuning from the console: DD.C holds every constant the scene
// was built from, DD.scene the graph itself.
window.DD = { THREE, scene, camera, renderer, composer, C, BRANDS, PATH, LOOK,
              wind: windUniforms, sky: skyUniforms, water: waterUniforms,
              goTo: (v) => scrollTo(0, v * (document.documentElement.scrollHeight - innerHeight)),
              // Place and render the scene at a scroll position without the
              // rAF loop; works in a backgrounded tab, where goTo does not.
              step: (v) => { scrollEased = v; step(0.016, clock.elapsedTime, v); } };

// Surface a dead scene rather than a black rectangle.
canvasEl.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();
  running = false;
  document.getElementById("fallback").dataset.on = "1";
});
</script>
</body>
</html>
